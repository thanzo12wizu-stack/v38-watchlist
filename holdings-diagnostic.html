<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V38 Holdings Diagnostic</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:900px;margin:0 auto;padding:20px;color:#222;background:#fafafa}h1{font-size:22px;margin:0 0 8px}.mut{color:#666;font-size:13px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:14px;margin-top:14px}.ok{color:#0a6b32}.bad{color:#b42318}.warn{color:#8a5a00}pre{white-space:pre-wrap;word-break:break-word;background:#f3f3f3;padding:12px;border-radius:8px;font-size:12px;line-height:1.45;max-height:55vh;overflow:auto}button{font:inherit;padding:8px 12px;border:1px solid #bbb;border-radius:8px;background:#fff}code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
</style>
</head>
<body>
<h1>保有データ読み込み診断 v3</h1>
<div class="mut">読み取り専用です。localStorage の追加・変更・削除は行いません。現行 command-center.html のロード処理と依存関数の定義順だけを確認します。</div>
<div id="summary" class="card">診断中…</div>
<div id="current" class="card"></div>
<div id="previous" class="card"></div>
<div id="deps" class="card"><b>実物 _hldNormalize 依存関数診断</b><div id="depStatus" class="mut">command-center.html を読み取り中…</div><pre id="depText"></pre></div>
<div id="source" class="card"><b>現行ローダーコード確認</b><div id="sourceStatus" class="mut">command-center.html を読み取り中…</div><pre id="sourceText"></pre></div>
<div class="card"><button id="copy">診断結果をコピー</button><pre id="report"></pre></div>
<script>
(function(){
'use strict';
var HLD_SCHEMA=4;
function n(v){if(v===null||v===undefined||v==='')return null;var x=Number(v);return isFinite(x)?x:null;}
function hash(s){var h=2166136261;s=String(s||'');for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h+=(h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24);}return (h>>>0).toString(36);}
function sig(h){return [String(h.t||'').toUpperCase(),h.strat||'',h.dt||'',h.entryAvg||h.avgPx||h.px||'',h.filledSharesTotal||h.sh||'',h.closeDate||'',JSON.stringify(h.exits||[])].join('|');}
function isLev(t){t=String(t||'').trim().toUpperCase();return t==='TQQQ'||t==='SOXL';}
function riskTotal(h,stop){var av=n(h.entryAvg||h.avgPx||h.px),q=n(h.filledSharesTotal||h.sh);return av!=null&&q>0&&stop!=null?Math.max(0,av-stop)*q:null;}
function partialExited(h){return (h.exits||[]).filter(function(x){return x.type==='partial';}).reduce(function(s,x){return s+(n(x.shares)||0);},0);}
function tpRemaining(h){var total=n(h.filledSharesTotal)||0,frac=n(h.tpFraction)||33;if(!(total>0))return 0;var target=total*frac/100;return Math.max(0,target-partialExited(h));}
function normalizeLikeCurrent(src){
  if(!src||typeof src!=='object'||!src.t)return null;var h=Object.assign({},src);
  h.t=String(h.t).toUpperCase();if(isLev(h.t))h.strat='lev';else if(h.strat!=='core'&&h.strat!=='swing')h.strat='swing';if(h.status!=='closed')h.status='open';
  if(!Array.isArray(h.exits))h.exits=[];h.exits=h.exits.map(function(x){return Object.assign({},x);});if(!h.leg2)h.leg2='none';
  if(!Array.isArray(h.fills)){
    h.fills=[];
    if(n(h.px1)>0&&n(h.sh1)>0)h.fills.push({leg:1,date:h.dt||'',price:+h.px1,shares:+h.sh1});
    if(h.leg2==='filled'&&n(h.px2)>0&&n(h.sh2)>0)h.fills.push({leg:2,date:h.leg2Date||h.dt||'',price:+h.px2,shares:+h.sh2});
    if(!h.fills.length&&n(h.avgPx||h.px)>0&&n(h.sh)>0)h.fills.push({leg:1,date:h.dt||'',price:+(h.avgPx||h.px),shares:+h.sh});
  }
  var fillSh=h.fills.reduce(function(s,f){return s+(n(f.shares)||0);},0),fillCost=h.fills.reduce(function(s,f){var p=n(f.price),q=n(f.shares);return s+((p!=null&&q>0)?p*q:0);},0);
  h.filledSharesTotal=(n(h.filledSharesTotal)>0)?+h.filledSharesTotal:(fillSh>0?fillSh:(n(h.sh)||0));
  var ect=n(h.entryCostTotal);h.entryCostTotal=(ect!=null&&ect>=0)?ect:(fillCost>0?fillCost:((n(h.entryAvg||h.avgPx||h.px)||0)*h.filledSharesTotal));
  h.entryAvg=h.filledSharesTotal>0?h.entryCostTotal/h.filledSharesTotal:n(h.entryAvg||h.avgPx||h.px);
  var exited=h.exits.reduce(function(s,x){return s+(n(x.shares)||0);},0);
  if(h.remainingShares==null)h.remainingShares=h.status==='closed'?0:Math.max(0,h.filledSharesTotal-exited);else h.remainingShares=Math.max(0,+h.remainingShares||0);
  if(h.remainingCost==null){var rc=h.entryCostTotal;h.exits.forEach(function(x){var q=n(x.shares)||0,cb=n(x.costBasis);rc-=q*(cb!=null?cb:(h.entryAvg||0));});h.remainingCost=Math.max(0,rc);}else h.remainingCost=Math.max(0,+h.remainingCost||0);
  if(h.status==='closed'){h.remainingShares=0;h.remainingCost=0;}
  h.avgPx=h.remainingShares>0?h.remainingCost/h.remainingShares:h.entryAvg;h.px=h.entryAvg;h.sh=h.filledSharesTotal;
  if(h.initialRiskTotal==null)h.initialRiskTotal=riskTotal(h,n(h.initialStop));
  if(!h.tradeId)h.tradeId='legacy-'+hash(sig(h));h.schemaVersion=HLD_SCHEMA;
  h.filled=!!(h.filled||h.filledSharesTotal>0);h.partialDone=tpRemaining(h)===0&&h.exits.some(function(x){return x.type==='partial';});
  return h;
}
function inspect(key){
  var out={key:key,present:false,length:0,parseOk:false,arrayOk:false,count:null,recordErrors:[],invalidRecords:[],tickers:[]};
  var raw;
  try{raw=localStorage.getItem(key);}catch(e){out.storageError=String(e&&e.message||e);return out;}
  if(raw==null){return out;}out.present=true;out.length=raw.length;
  var a;try{a=JSON.parse(raw);out.parseOk=true;}catch(e){out.parseError=String(e&&e.message||e);return out;}
  out.arrayOk=Array.isArray(a);if(!out.arrayOk){out.topType=Object.prototype.toString.call(a);return out;}
  out.count=a.length;
  a.forEach(function(r,i){
    var tk=(r&&typeof r==='object'&&r.t!=null)?String(r.t).toUpperCase():'(tickerなし)';out.tickers.push(tk);
    if(!r||typeof r!=='object'||!r.t)out.invalidRecords.push({index:i,ticker:tk,reason:'object/ticker 不足'});
    try{normalizeLikeCurrent(r);}catch(e){
      var extra='';
      if(r&&Array.isArray(r.fills)){
        var bad=[];r.fills.forEach(function(f,j){if(f===null||f===undefined)bad.push(j);});if(bad.length)extra=' fills の null/undefined index='+bad.join(',');
      }
      out.recordErrors.push({index:i,ticker:tk,error:String(e&&e.message||e)+extra});
    }
  });
  return out;
}
function text(x){
  var l=[];l.push('key: '+x.key);l.push('存在: '+(x.present?'YES':'NO')+(x.present?' / 文字数 '+x.length:''));
  if(x.storageError){l.push('localStorage access ERROR: '+x.storageError);return l.join('\n');}
  if(!x.present)return l.join('\n');
  l.push('JSON.parse: '+(x.parseOk?'OK':'ERROR'));
  if(x.parseError){l.push('parse error: '+x.parseError);return l.join('\n');}
  l.push('top-level array: '+(x.arrayOk?'YES':'NO'));
  if(!x.arrayOk){l.push('type: '+x.topType);return l.join('\n');}
  l.push('records: '+x.count);
  l.push('current normalizer errors: '+x.recordErrors.length);
  x.recordErrors.forEach(function(e){l.push('  - #'+e.index+' '+e.ticker+': '+e.error);});
  if(x.invalidRecords.length){l.push('invalid records: '+x.invalidRecords.length);x.invalidRecords.forEach(function(e){l.push('  - #'+e.index+' '+e.ticker+': '+e.reason);});}
  l.push('tickers: '+x.tickers.join(', '));
  return l.join('\n');
}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function collectSource(src){
  var parts=[],seen={};
  ['function hldLoad','hldLoad=function','hldLoad = function','function _hldNormalize','_isLevTicker','v38_holdings_prev','v38_holdings'].forEach(function(term){
    var i=src.indexOf(term);if(i<0)return;var a=Math.max(0,i-1800),b=Math.min(src.length,i+6500),key=a+':'+b;if(seen[key])return;seen[key]=1;parts.push('===== '+term+' @ '+i+' =====\n'+src.slice(a,b));
  });
  return parts.join('\n\n');
}
function extractFunction(src,name){
  var start=src.indexOf('function '+name+'(');if(start<0)return null;
  var open=src.indexOf('{',start);if(open<0)return null;
  var depth=0,quote=null,escp=false,line=false,block=false;
  for(var i=open;i<src.length;i++){
    var c=src[i],d=src[i+1];
    if(line){if(c==='\n')line=false;continue;}
    if(block){if(c==='*'&&d==='/'){block=false;i++;}continue;}
    if(quote){if(escp){escp=false;continue;}if(c==='\\'){escp=true;continue;}if(c===quote)quote=null;continue;}
    if(c==='/'&&d==='/'){line=true;i++;continue;}if(c==='/'&&d==='*'){block=true;i++;continue;}
    if(c==='"'||c==="'"||c==='`'){quote=c;continue;}
    if(c==='{')depth++;else if(c==='}'){depth--;if(depth===0)return {start:start,end:i+1,text:src.slice(start,i+1)};}
  }
  return null;
}
function indexes(src,needle){var out=[],p=0;while((p=src.indexOf(needle,p))>=0){out.push(p);p+=needle.length;}return out;}
function ctx(src,pos,r){r=r||120;return src.slice(Math.max(0,pos-r),Math.min(src.length,pos+r)).replace(/\s+/g,' ');}
function definitionInfo(src,name){
  var pats=[
    {kind:'function declaration (hoisted)',needle:'function '+name+'('},
    {kind:'var function',needle:'var '+name+'=function'},
    {kind:'var function',needle:'var '+name+' = function'},
    {kind:'let function',needle:'let '+name+'=function'},
    {kind:'const function',needle:'const '+name+'='},
    {kind:'assignment',needle:name+'=function'},
    {kind:'window assignment',needle:'window.'+name+'='}
  ];
  var best=null;
  pats.forEach(function(p){var i=src.indexOf(p.needle);if(i>=0&&(!best||i<best.pos))best={kind:p.kind,pos:i,needle:p.needle};});
  return best;
}
function dependencyAnalysis(src){
  var fn=extractFunction(src,'_hldNormalize'),lines=[];
  lines.push('command-center.html bytes: '+src.length);
  if(!fn){lines.push('ERROR: function _hldNormalize を抽出できません');return lines.join('\n');}
  lines.push('_hldNormalize: '+fn.start+'..'+fn.end);
  var names={},re=/\b(_(?:hld[A-Za-z0-9_]*|isLevTicker))\s*\(/g,m;
  while((m=re.exec(fn.text))){if(m[1]!=='_hldNormalize')names[m[1]]=1;}
  var deps=Object.keys(names).sort();
  lines.push('依存関数: '+deps.join(', '));
  var missing=[];
  deps.forEach(function(name){
    var def=definitionInfo(src,name),uses=indexes(src,name+'(');
    if(!def){missing.push(name);lines.push('[MISSING] '+name+' : 定義を検出できない / call occurrences='+uses.length);return;}
    var tag=def.kind.indexOf('function declaration')===0?'OK/HOISTED':'CHECK ORDER';
    lines.push('['+tag+'] '+name+' : '+def.kind+' @ '+def.pos+' / occurrences='+uses.length);
    lines.push('  def: '+ctx(src,def.pos,95));
  });
  lines.push('');
  var lev=definitionInfo(src,'_isLevTicker'),levUses=indexes(src,'_isLevTicker(');
  lines.push('重点確認 _isLevTicker: '+(lev?(lev.kind+' @ '+lev.pos):'MISSING'));
  levUses.slice(0,8).forEach(function(p,i){lines.push('  occurrence '+(i+1)+' @ '+p+': '+ctx(src,p,130));});
  lines.push('');
  var hl=indexes(src,'hldLoad(');
  lines.push('hldLoad( occurrences: '+hl.length);
  hl.slice(0,18).forEach(function(p,i){lines.push('  '+(i+1)+' @ '+p+': '+ctx(src,p,125));});
  lines.push('');
  if(missing.length)lines.push('STATIC VERDICT: 依存関数未定義候補 = '+missing.join(', '));
  else if(lev&&lev.kind.indexOf('function declaration')===0)lines.push('STATIC VERDICT: _isLevTicker は function declaration なので、単純な「定義位置が後だから未定義」説は否定。次は実行時例外そのものを捕捉すべき。');
  else if(lev)lines.push('STATIC VERDICT: _isLevTicker は hoist されない形式。初回 hldLoad 実行タイミングとの順序確認が必要。');
  else lines.push('STATIC VERDICT: _isLevTicker 定義なし。最有力原因。');
  return lines.join('\n');
}
var cur=inspect('v38_holdings'),prev=inspect('v38_holdings_prev');
var cause='';
if(cur.storageError)cause='localStorage 自体へのアクセス失敗';
else if(!cur.present)cause='現行キー v38_holdings が存在しない';
else if(!cur.parseOk)cause='現行 v38_holdings の JSON が破損';
else if(!cur.arrayOk)cause='現行 v38_holdings のトップレベルが配列ではない';
else if(cur.recordErrors.length)cause='現行配列内の保有レコード正規化で例外';
else cause='現行データ本体と簡易正規化は正常。実物 _hldNormalize の依存関数と実行順を確認中';
var cls=(cur.present&&cur.parseOk&&cur.arrayOk&&!cur.recordErrors.length)?'ok':'bad';
document.getElementById('summary').innerHTML='<b class="'+cls+'">判定: '+esc(cause)+'</b>';
document.getElementById('current').innerHTML='<b>現行 v38_holdings</b><pre>'+esc(text(cur))+'</pre>';
document.getElementById('previous').innerHTML='<b>直前バックアップ v38_holdings_prev</b><pre>'+esc(text(prev))+'</pre>';
var loaderTrace='(取得中)',depTrace='(取得中)';
function rebuildReport(){
  var report='V38 Holdings Diagnostic v3\n判定: '+cause+'\n\n'+text(cur)+'\n\n'+text(prev)+'\n\n実物 _hldNormalize 依存関数診断\n'+depTrace+'\n\n現行 command-center loader trace\n'+loaderTrace;
  document.getElementById('report').textContent=report;
  document.getElementById('copy').onclick=function(){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(report).then(function(){document.getElementById('copy').textContent='コピーしました';});}else window.prompt('診断結果をコピー',report);};
}
rebuildReport();
fetch('./command-center.html?holdings_diag_v3='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();}).then(function(src){
  depTrace=dependencyAnalysis(src);
  loaderTrace=collectSource(src);
  if(!loaderTrace)loaderTrace='hldLoad/_hldNormalize/v38_holdings の該当コードを検出できませんでした。HTML bytes='+src.length;
  document.getElementById('depStatus').textContent='取得OK / 実物 _hldNormalize の依存関数を静的解析しました。';
  document.getElementById('depText').textContent=depTrace;
  document.getElementById('sourceStatus').textContent='取得OK / command-center.html '+src.length+'文字。';
  document.getElementById('sourceText').textContent=loaderTrace;
  rebuildReport();
}).catch(function(e){
  depTrace=loaderTrace='SOURCE FETCH ERROR: '+String(e&&e.message||e);
  document.getElementById('depStatus').textContent=depTrace;
  document.getElementById('depText').textContent=depTrace;
  document.getElementById('sourceStatus').textContent=loaderTrace;
  document.getElementById('sourceText').textContent=loaderTrace;
  rebuildReport();
});
})();
</script>
</body>
</html>
