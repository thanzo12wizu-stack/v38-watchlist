<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>V38 Holdings Runtime Diagnostic</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:900px;margin:0 auto;padding:20px;color:#222;background:#fafafa}h1{font-size:22px;margin:0 0 8px}.mut{color:#666;font-size:13px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:14px;margin-top:14px}.ok{color:#0a6b32}.bad{color:#b42318}.warn{color:#8a5a00}pre{white-space:pre-wrap;word-break:break-word;background:#f3f3f3;padding:12px;border-radius:8px;font-size:12px;line-height:1.45;max-height:60vh;overflow:auto}button{font:inherit;padding:8px 12px;border:1px solid #bbb;border-radius:8px;background:#fff}iframe{position:absolute;width:1px;height:1px;left:-9999px;top:-9999px;border:0}
</style>
</head>
<body>
<h1>保有データ実行時診断 v5</h1>
<div class="mut">読み取り専用。最新 command-center.html を同一オリジンの隔離iframeで起動し、hldLoad() の実際の例外だけ取得します。localStorage は変更しません。</div>
<div id="summary" class="card"><b class="warn">診断中…</b></div>
<div class="card"><b>実行時イベント</b><pre id="events">準備中…</pre></div>
<div class="card"><button id="copy">診断結果をコピー</button><pre id="report"></pre></div>
<iframe id="runner" aria-hidden="true"></iframe>
<script>
(function(){
'use strict';
var events=[],done=false,raw='',tickers=[];
try{raw=localStorage.getItem('v38_holdings')||'';var a=JSON.parse(raw||'[]');if(Array.isArray(a))tickers=a.map(function(x){return x&&x.t?String(x.t).toUpperCase():'?';});}catch(e){events.push('DIAG storage parse ERROR: '+e.name+': '+e.message);}
function add(s){events.push(s);render();}
function render(){
 var verdict='診断中…',cls='warn';
 var err=events.find(function(x){return x.indexOf('HLD CURRENT ERROR')===0;});
 var berr=events.find(function(x){return x.indexOf('HLD BACKUP ERROR')===0;});
 var ok=events.find(function(x){return x.indexOf('HLD CURRENT OK')===0;});
 if(err){verdict='現行 hldLoad() の実例外を捕捉';cls='bad';}
 else if(berr){verdict='現行経路後、バックアップ経路でも例外を捕捉';cls='bad';}
 else if(ok){verdict='隔離実行では現行 hldLoad() が正常';cls='ok';}
 else if(done){verdict='hldLoad() 実行イベントを捕捉できず';cls='bad';}
 document.getElementById('summary').innerHTML='<b class="'+cls+'">判定: '+verdict+'</b>';
 document.getElementById('events').textContent=events.length?events.join('\n\n'):'イベント待機中…';
 var rpt='V38 Holdings Runtime Diagnostic v5\n判定: '+verdict+'\nlocalStorage bytes: '+raw.length+'\ntickers: '+tickers.join(', ')+'\n\n'+events.join('\n\n');
 document.getElementById('report').textContent=rpt;
 document.getElementById('copy').onclick=function(){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(rpt).then(function(){document.getElementById('copy').textContent='コピーしました';});else window.prompt('診断結果をコピー',rpt);};
}
window.addEventListener('message',function(ev){if(ev.origin!==location.origin||!ev.data||ev.data.__v38diag!==1)return;var d=ev.data;
 if(d.kind==='current-error')add('HLD CURRENT ERROR\nname: '+d.name+'\nmessage: '+d.message+'\nstack: '+(d.stack||'(none)'));
 else if(d.kind==='backup-error')add('HLD BACKUP ERROR\nname: '+d.name+'\nmessage: '+d.message+'\nstack: '+(d.stack||'(none)'));
 else if(d.kind==='current-ok')add('HLD CURRENT OK count='+d.count+' tickers='+(d.tickers||[]).join(', '));
 else if(d.kind==='window-error')add('WINDOW ERROR\nmessage: '+d.message+'\nsource: '+d.source+'\nline: '+d.line+':'+d.col+'\nerror: '+d.error);
 else if(d.kind==='alert')add('ALERT: '+d.message);
});
render();
fetch('./command-center.html?v38_runtime_diag='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();}).then(function(src){
 var s=src.indexOf('function hldLoad()');var e=src.indexOf('function hldSave(',s);if(s<0||e<0)throw new Error('hldLoad block not found');
 var block=src.slice(s,e);
 var oldReturn="return a.map(_hldNormalize).filter(function(x){return x;});";
 if(block.indexOf(oldReturn)<0)throw new Error('current return pattern not found');
 block=block.replace(oldReturn,"var __v38o=a.map(_hldNormalize).filter(function(x){return x;}); try{parent.postMessage({__v38diag:1,kind:'current-ok',count:__v38o.length,tickers:__v38o.map(function(x){return x&&x.t||'?';})},location.origin);}catch(__v38p){} return __v38o;");
 var c1=block.indexOf('catch(e){');if(c1<0)throw new Error('current catch not found');
 block=block.slice(0,c1)+"catch(e){try{parent.postMessage({__v38diag:1,kind:'current-error',name:String(e&&e.name||''),message:String(e&&e.message||e),stack:String(e&&e.stack||'')},location.origin);}catch(__v38p){}"+block.slice(c1+'catch(e){'.length);
 var c2=block.indexOf('catch(e2){}');if(c2>=0)block=block.slice(0,c2)+"catch(e2){try{parent.postMessage({__v38diag:1,kind:'backup-error',name:String(e2&&e2.name||''),message:String(e2&&e2.message||e2),stack:String(e2&&e2.stack||'')},location.origin);}catch(__v38p){}}"+block.slice(c2+'catch(e2){}'.length);
 var patched=src.slice(0,s)+block+src.slice(e);
 var head=patched.indexOf('<head>');if(head>=0){head+=6;var pre="<script>(function(){var __a=window.alert;window.alert=function(m){try{parent.postMessage({__v38diag:1,kind:'alert',message:String(m)},location.origin);}catch(e){};};window.addEventListener('error',function(e){try{parent.postMessage({__v38diag:1,kind:'window-error',message:String(e.message||''),source:String(e.filename||''),line:e.lineno||0,col:e.colno||0,error:String(e.error&&e.error.stack||e.error||'')},location.origin);}catch(x){}});})();<\/script>";patched=patched.slice(0,head)+pre+patched.slice(head);}
 add('instrumented command-center bytes: '+patched.length+' / hldLoad runtime start');
 document.getElementById('runner').srcdoc=patched;
 setTimeout(function(){done=true;render();},7000);
}).catch(function(e){done=true;add('DIAGNOSTIC SETUP ERROR\n'+e.name+': '+e.message+'\n'+(e.stack||''));render();});
})();
</script>
</body>
</html>
