<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ad8021"><title>Command Center</title></head><body style="margin:0;background:#f2f1ee;color:#1c1b19;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif"><div id="boot" style="max-width:680px;margin:0 auto;padding:22px 16px;font-size:13px;color:#575242">Command Center を読み込み中…</div><script>
(async()=>{
  const boot=document.getElementById('boot');
  try{
    const r=await fetch('command-center.html?unified_base=1',{cache:'no-store'});
    if(!r.ok) throw new Error('Command Center '+r.status);
    let html=await r.text();
    const stamp=Date.now();
    const addon=`<script src="command-center-unified.js?v=${stamp}"><\/script>`;
    if(/<\/body>\s*<\/html>\s*$/i.test(html)) html=html.replace(/<\/body>\s*<\/html>\s*$/i,addon+'</body></html>');
    else html+=addon;
    document.open();document.write(html);document.close();
  }catch(e){
    boot.textContent='統合版の読み込みに失敗しました。';
    const p=document.createElement('div');p.style.marginTop='8px';p.textContent=String(e&&e.message||e);boot.appendChild(p);
  }
})();
</script></body></html>
