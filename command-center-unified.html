<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<title>V38 Unified Command Center</title>
<style>
:root{
  --bg:#0b0f17;--panel:#101722;--panel2:#16243e;--line:rgba(255,255,255,.08);
  --text:#e6edf3;--muted:#7d8da1;--good:#16a34a;--warn:#ca8a04;--bad:#dc2626;
  --blue:#9ecbff;--chip:#16243e;--bar:rgba(9,17,29,.96)
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
body{overflow:hidden}
.shell{height:100svh;display:flex;flex-direction:column;background:var(--bg)}
.topbar{flex:0 0 auto;border-bottom:1px solid var(--line);background:var(--bar);backdrop-filter:blur(12px)}
.head{max-width:1480px;margin:auto;padding:max(10px,env(safe-area-inset-top)) 14px 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
.brandline{min-width:0}.eyebrow{font-size:10px;letter-spacing:.13em;font-weight:850;color:var(--blue)}
h1{font-size:20px;line-height:1.15;margin:3px 0 0;letter-spacing:-.025em}.sub{margin-top:4px;color:var(--muted);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.source{font-size:10px;color:var(--muted);white-space:nowrap;text-align:right}.source b{color:#c9d8eb}
.tabs-wrap{max-width:1480px;margin:auto;padding:0 14px}.tabs{display:flex;gap:7px;overflow:auto;padding:7px 0 9px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;border:1px solid var(--line);background:#0d1928;color:var(--muted);padding:8px 12px;border-radius:999px;font-weight:800;font-size:12px;cursor:pointer}
.tab.on{background:#20334e;color:#fff;border-color:#45648c;box-shadow:0 0 0 1px rgba(158,203,255,.06) inset}
.context{display:flex;align-items:center;gap:8px;max-width:1480px;margin:auto;padding:0 14px 8px;min-height:28px}
.context-copy{font-size:10.5px;color:#9fb0c4;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.context-copy b{color:#dce8f7}
.context-actions{margin-left:auto;display:flex;gap:6px}.ghost{border:1px solid var(--line);background:#101e30;color:#bfd0e3;border-radius:8px;padding:5px 8px;font-size:10px;font-weight:750;cursor:pointer;text-decoration:none;white-space:nowrap}
.subtabs{display:none;gap:5px}.subtabs.on{display:flex}.subtab{border:1px solid var(--line);background:#0d1928;color:var(--muted);padding:5px 8px;border-radius:8px;font-size:10px;font-weight:800;cursor:pointer}.subtab.on{background:#20334e;color:#fff;border-color:#45648c}
.stage-wrap{position:relative;flex:1 1 auto;min-height:0;background:var(--bg)}
#stage{display:block;width:100%;height:100%;border:0;background:var(--bg)}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--muted);font-size:12px;z-index:2}.loading.hide{display:none}
.error{position:absolute;left:14px;right:14px;top:14px;padding:12px 14px;border:1px solid rgba(220,38,38,.35);background:#251317;border-radius:12px;color:#f4b8b8;font-size:12px;z-index:3;display:none}
@media(max-width:700px){.head{align-items:flex-start}.source{display:none}h1{font-size:18px}.sub{max-width:82vw}.context-copy{display:none}.context{padding-bottom:7px}.context-actions{margin-left:0;width:100%;justify-content:space-between}.subtabs.on{flex:1}.ghost{margin-left:auto}}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="head">
      <div class="brandline">
        <div class="eyebrow">V38 COMMAND CENTER</div>
        <h1>Unified Command Center</h1>
        <div class="sub">Command Centerの見た目を軸に、V38運用判断とRotationをタブで統合</div>
      </div>
      <div class="source">表示元 <b id="sourceLabel">V38</b></div>
    </div>
    <div class="tabs-wrap">
      <nav class="tabs" aria-label="統合ナビゲーション">
        <button class="tab on" data-route="today">今日</button>
        <button class="tab" data-route="market">市場</button>
        <button class="tab" data-route="rotation">資金循環</button>
        <button class="tab" data-route="stocks">銘柄</button>
        <button class="tab" data-route="tqqq">TQQQ</button>
        <button class="tab" data-route="manage">RSI / 保有</button>
        <button class="tab" data-route="detail">詳細</button>
      </nav>
    </div>
    <div class="context">
      <div class="subtabs" id="manageSubtabs">
        <button class="subtab on" data-v38-tab="resetwatch">RSI Reset</button>
        <button class="subtab" data-v38-tab="positions">保有株</button>
      </div>
      <div class="context-copy" id="contextCopy"><b>今日の判断</b>を最初に確認。正式V38 liveを表示します。</div>
      <div class="context-actions">
        <button class="ghost" id="reloadBtn" type="button">再読込</button>
        <a class="ghost" id="openOriginal" href="command-center-v38.html" target="_blank" rel="noopener">元画面 ↗</a>
      </div>
    </div>
  </div>
  <div class="stage-wrap">
    <div class="loading" id="loading">読み込み中…</div>
    <div class="error" id="error"></div>
    <iframe id="stage" title="V38 統合ビュー"></iframe>
  </div>
</div>
<script>
'use strict';
const frame=document.getElementById('stage');
const loading=document.getElementById('loading');
const errorBox=document.getElementById('error');
const sourceLabel=document.getElementById('sourceLabel');
const contextCopy=document.getElementById('contextCopy');
const original=document.getElementById('openOriginal');
const manageSubtabs=document.getElementById('manageSubtabs');
let currentRoute='today';
let manageInner='resetwatch';

const routes={
  today:{src:'command-center-v38.html',kind:'v38',inner:'today',label:'V38 live',copy:'<b>今日の判断</b>を最初に確認。正式V38 liveを表示します。'},
  market:{src:'command-center.html',kind:'legacy',label:'Command Center',copy:'<b>市場全体</b>は既存Command Centerを正本のまま表示します。'},
  rotation:{src:'rotation/',kind:'rotation',label:'Rotation',copy:'<b>どこが強いか</b>を見る観測レイヤー。売買ルールには混ぜません。'},
  stocks:{src:'command-center-v38.html',kind:'v38',inner:'ranking',label:'V38 ranking',copy:'<b>何を買うか</b>は正式V38候補ランキングを表示します。'},
  tqqq:{src:'command-center-v38.html',kind:'v38',inner:'today',focus:'tqqq',label:'V38 TQQQ',copy:'<b>TQQQ</b>の通常枠・Panic判定をV38正本から表示します。'},
  manage:{src:'command-center-v38.html',kind:'v38',inner:'resetwatch',label:'V38 sleeve',copy:'<b>RSI Reset / 保有管理</b>を切り替えて確認します。'},
  detail:{src:'command-center.html',kind:'legacy',focus:'detail',label:'Command Center detail',copy:'<b>詳細指標</b>は既存Command Center内のOptions / VWAP / EPS付近へ移動します。'}
};

function setError(message=''){
  errorBox.textContent=message;
  errorBox.style.display=message?'block':'none';
}
function injectStyle(doc,id,css){
  let style=doc.getElementById(id);
  if(!style){style=doc.createElement('style');style.id=id;doc.head.appendChild(style)}
  style.textContent=css;
}
function activateV38(doc,tabName,focus){
  injectStyle(doc,'unified-bridge-style',`
    html,body{background:#0b0f17!important}
    body{margin:0!important}
    .wrap{max-width:1480px!important;padding:12px 14px 44px!important}
    .top,.tabs{display:none!important}
    .card{box-shadow:none!important}
  `);
  const button=doc.querySelector(`.tabs button[data-tab="${tabName}"]`);
  if(button) button.click();
  if(focus==='tqqq'){
    injectStyle(doc,'unified-tqqq-focus',`
      #today > *{display:none!important}
      #today > .card:has(#tqqqPlain),
      #today > .card:has(#underlyingTarget),
      #today > .card:has(#tqqqDecision){display:block!important}
    `);
    const target=doc.getElementById('tqqqPlain')||doc.getElementById('underlyingTarget')||doc.getElementById('tqqqDecision');
    if(target) setTimeout(()=>target.closest('.card')?.scrollIntoView({block:'start'}),40);
  }else{
    const old=doc.getElementById('unified-tqqq-focus');if(old)old.remove();
    try{doc.defaultView.scrollTo(0,0)}catch(_){ }
  }
}
function activateRotation(doc){
  injectStyle(doc,'unified-bridge-style',`
    :root{--bg:#0b0f17!important;--panel:#101722!important;--panel2:#16243e!important;--line:rgba(255,255,255,.08)!important;--line2:rgba(255,255,255,.06)!important;--text:#e6edf3!important;--muted:#7d8da1!important;--accent:#9ecbff!important;--blue:#9ecbff!important;--green:#16a34a!important;--amber:#ca8a04!important;--red:#dc2626!important}
    html,body{background:#0b0f17!important}
    .wrap{max-width:1480px!important;padding:12px 14px 44px!important}
    header{display:none!important}
    .card{border-radius:15px!important;box-shadow:none!important}
  `);
  try{doc.defaultView.scrollTo(0,0)}catch(_){ }
}
function activateLegacy(doc,focus){
  // Command Centerはデザイン正本。CSSや判定ロジックは変更しない。
  try{doc.defaultView.scrollTo(0,0)}catch(_){ }
  if(focus==='detail'){
    const candidates=[...doc.querySelectorAll('h1,h2,h3,h4,summary,.title,.section-title,.card-title')];
    const target=candidates.find(el=>/オプション|options|vwap|eps|決算/i.test((el.textContent||'').trim()));
    if(target) setTimeout(()=>target.scrollIntoView({block:'start'}),60);
  }
}
function configureFrame(){
  const route=routes[currentRoute];
  try{
    const doc=frame.contentDocument;
    if(!doc||!doc.documentElement) throw new Error('frame document unavailable');
    if(route.kind==='v38') activateV38(doc,currentRoute==='manage'?manageInner:route.inner,route.focus);
    else if(route.kind==='rotation') activateRotation(doc);
    else activateLegacy(doc,route.focus);
    setError('');
  }catch(err){
    setError('統合表示の調整だけ適用できませんでした。元画面自体はそのまま表示しています。');
  }finally{
    loading.classList.add('hide');
  }
}
function renderRoute(routeName,{force=false}={}){
  currentRoute=routeName;
  const route=routes[routeName];
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.route===routeName));
  manageSubtabs.classList.toggle('on',routeName==='manage');
  sourceLabel.textContent=route.label;
  contextCopy.innerHTML=route.copy;
  original.href=route.src;
  loading.classList.remove('hide');
  setError('');
  const next=new URL(route.src,location.href).href;
  if(force||frame.src!==next) frame.src=route.src;
  else configureFrame();
  history.replaceState(null,'',`#${routeName}`);
}

document.querySelector('.tabs').addEventListener('click',e=>{
  const b=e.target.closest('.tab');if(!b)return;renderRoute(b.dataset.route);
});
manageSubtabs.addEventListener('click',e=>{
  const b=e.target.closest('.subtab');if(!b)return;
  manageInner=b.dataset.v38Tab;
  manageSubtabs.querySelectorAll('.subtab').forEach(x=>x.classList.toggle('on',x===b));
  if(currentRoute==='manage'){
    loading.classList.remove('hide');
    try{activateV38(frame.contentDocument,manageInner);setError('')}catch(_){setError('RSI / 保有の切替を適用できませんでした。')}
    loading.classList.add('hide');
  }
});
document.getElementById('reloadBtn').addEventListener('click',()=>renderRoute(currentRoute,{force:true}));
frame.addEventListener('load',configureFrame);
const initial=(location.hash||'').slice(1);
renderRoute(routes[initial]?initial:'today',{force:true});
</script>
</body>
</html>
