name: Finalize dashboard patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-dashboard-patch.yml'
      - 'scripts/finalize_dashboard_patch.py'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply final DR universe patch using existing sanitation
        shell: bash
        run: |
          set +e
          python scripts/finalize_dashboard_patch.py > final_patch_diagnostic.txt 2>&1
          rc=$?
          echo "patch_rc=$rc" >> final_patch_diagnostic.txt
          if [[ $rc -eq 0 ]]; then
            python -m py_compile build_dashboard.py >> final_patch_diagnostic.txt 2>&1
            pyrc=$?
            echo "pycompile_rc=$pyrc" >> final_patch_diagnostic.txt
            git diff --check >> final_patch_diagnostic.txt 2>&1
            drc=$?
            echo "diffcheck_rc=$drc" >> final_patch_diagnostic.txt
          else
            pyrc=99
            drc=99
          fi
          cat final_patch_diagnostic.txt
          if [[ $rc -eq 0 && $pyrc -eq 0 && $drc -eq 0 ]]; then
            touch /tmp/final_patch_ok
          fi
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -f /tmp/final_patch_ok ]]; then
            git add build_dashboard.py .github/workflows/dashboard.yml
            git rm -f --ignore-unmatch \
              scripts/finalize_dashboard_patch.py \
              .github/workflows/finalize-dashboard-patch.yml \
              .github/workflows/tv-symbol-probe.yml \
              scripts/probe_tv_symbols.py \
              tv_symbol_probe.json \
              final_patch_diagnostic.txt
            git commit -m "Finalize DR universe, VWAP near, and stale-run guard"
          else
            git add final_patch_diagnostic.txt
            git commit -m "Capture final patch diagnostic"
          fi
          git push origin HEAD:main
      - name: Trigger production dashboard
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -f /tmp/final_patch_ok ]]; then
            gh workflow run dashboard.yml --ref main
            echo "Production dashboard workflow dispatched"
          else
            echo "Final patch failed; production dashboard not dispatched"
          fi
