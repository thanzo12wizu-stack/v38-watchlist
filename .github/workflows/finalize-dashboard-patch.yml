name: Finalize dashboard patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-dashboard-patch.yml'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply patch
        run: |
          set -euo pipefail
          python scripts/finalize_dashboard_patch.py
          python -m py_compile build_dashboard.py
          git diff --check
      - name: Commit source patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build_dashboard.py .github/workflows/dashboard.yml
          git commit -m "Include DR listings and finalize dashboard guards" || exit 0
          git push origin HEAD:main
