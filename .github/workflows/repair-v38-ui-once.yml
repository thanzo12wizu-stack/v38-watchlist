name: Repair V38 UI once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-v38-ui-once.yml

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Repair malformed rotationLabel and harden public gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          html = Path('command-center-v38.html')
          text = html.read_text(encoding='utf-8')
          bad = "function rotationLabel(x){return'Rotation: 正式順位には未使用'} / ${jp}`}"
          good = "function rotationLabel(x){return'Rotation: 正式順位には未使用'}"
          if text.count(bad) != 1:
              raise SystemExit(f'expected exactly one malformed rotationLabel, found {text.count(bad)}')
          html.write_text(text.replace(bad, good), encoding='utf-8')

          workflow = Path('.github/workflows/publish-public-site.yml')
          w = workflow.read_text(encoding='utf-8')
          marker = '      - name: Public export and atomic-gate tests\n'
          gate = '''      - name: Validate V38 inline JavaScript syntax\n        shell: bash\n        run: |\n          python - <<'PY2'\n          from pathlib import Path\n          import re\n          text = Path('command-center-v38.html').read_text(encoding='utf-8')\n          scripts = re.findall(r'<script>(.*?)</script>', text, flags=re.S)\n          if len(scripts) != 1:\n              raise SystemExit(f'expected exactly one inline script, found {len(scripts)}')\n          Path('/tmp/command-center-v38-inline.js').write_text(scripts[0], encoding='utf-8')\n          PY2\n          node --check /tmp/command-center-v38-inline.js\n\n'''
          if 'Validate V38 inline JavaScript syntax' not in w:
              if marker not in w:
                  raise SystemExit('publish workflow insertion marker not found')
              workflow.write_text(w.replace(marker, gate + marker, 1), encoding='utf-8')
          PY

      - name: Verify repaired inline JavaScript parses
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('command-center-v38.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', text, flags=re.S)
          assert len(scripts) == 1, len(scripts)
          Path('/tmp/command-center-v38-inline.js').write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/command-center-v38-inline.js
          grep -F "rotation/data/rotation-theme56.json" command-center-v38.html
          ! grep -F ' / ${jp}`}' command-center-v38.html

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add command-center-v38.html .github/workflows/publish-public-site.yml
          git commit -m "Fix V38 dashboard JavaScript parse failure"
          git push origin HEAD:main

      - name: Dispatch public publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-public-site.yml --ref main
