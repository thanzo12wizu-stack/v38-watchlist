# Research-only audit. Does not modify main, Pages, Dashboard, or live rules.
name: Early Radar Reranker Research

on:
  push:
    branches:
      - research/sector-stock-leadership-20260826
    paths:
      - leadership/research/audit_early_radar_reranker.py
      - .github/workflows/early-radar-reranker-research.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy yfinance
      - name: Syntax check
        run: |
          python -m py_compile leadership/research/audit_early_radar_reranker.py
      - name: Run early Radar reranker audit
        env:
          PYTHONPATH: .:leadership/research
        run: |
          python leadership/research/audit_early_radar_reranker.py \
            --root . \
            --output leadership/research/early_radar_reranker \
            --analysis-start 2016-01-04 \
            --analysis-end 2025-12-31 \
            --max-tickers 6000 \
            --batch-size 75
      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: early-radar-reranker
          path: leadership/research/early_radar_reranker/
          retention-days: 14
