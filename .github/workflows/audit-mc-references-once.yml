name: One-off audit MC references

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-mc-references-once.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Audit MC fetch and display dependencies
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          lines=Path('build_dashboard.py').read_text(encoding='utf-8',errors='replace').splitlines()
          # Explicit blocks needed to finalize the MC replacement spec.
          for a,b in [(1540,1605),(3650,3925),(18186,18224),(20720,20825),(21150,21182)]:
              print(f'\n=== {a}-{b} ===')
              for n in range(a,b+1):
                  print(f'{n}: {lines[n-1]}')
          print('\n=== FETCH-RELATED HITS ===')
          for i,line in enumerate(lines,1):
              low=line.lower()
              if any(k in low for k in ('yf.download','period=','start=','macro_tickers','mc_market_tickers','_mc_frame_from_macro')):
                  print(f'{i}: {line}')
          PY
