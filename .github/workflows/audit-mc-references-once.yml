name: One-off audit MC references

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-mc-references-once.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check pandas numpy yfinance
      - name: Compare old and new MC auxiliary sensitivity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import numpy as np, pandas as pd, yfinance as yf
          broad=["SPY","QQQ","DIA","IWM","MDY","RSP","VTI","QQQE"]
          sectors=["XLK","XLY","VOX","XLF","XLI","XLE","XLB","XLV","XLP","XLU","XLRE"]
          industry=["SOXX","SMH","XSD","IGV","SKYY","CIBR","HACK","FDN","XBI","IBB","PPH","IHI","IHF","KRE","KBE","XRT","ITB","XHB","IYT","JETS","ITA","XAR","ROBO","XME","COPX","PICK","GDX","SIL","LIT","XOP","OIH","URA","TAN","ICLN","VNQ","MOO","PHO","PAVE"]
          tickers=list(dict.fromkeys(broad+sectors+industry)); assert len(tickers)==57
          d=yf.download(tickers,start='2009-01-01',end='2026-08-25',auto_adjust=True,progress=False,threads=True)
          c=d['Close'].copy(); c.index=pd.to_datetime(c.index).tz_localize(None); c=c.reindex(columns=tickers)
          def part(mask): return mask.mean(axis=1,skipna=True)*100.0
          ma10=c.rolling(10).mean(); ma20=c.rolling(20).mean(); ma50=c.rolling(50).mean(); ma200=c.rolling(200).mean()
          p={}
          for n,h in [('ret5',5),('ret21',21),('ret63',63),('ret252',252)]: p[n]=part((c/c.shift(h)-1>0).where(c.shift(h).notna()&c.notna()))
          p['above10']=part((c>ma10).where(ma10.notna()&c.notna())); p['above20']=part((c>ma20).where(ma20.notna()&c.notna())); p['above50']=part((c>ma50).where(ma50.notna()&c.notna())); p['above200']=part((c>ma200).where(ma200.notna()&c.notna()))
          p['ma20_gt_50']=part((ma20>ma50).where(ma20.notna()&ma50.notna())); p['ma50_gt_200']=part((ma50>ma200).where(ma50.notna()&ma200.notna()))
          hi252=c.rolling(252,min_periods=200).max(); dd=c/hi252-1
          p['dd_score']=((dd+0.30)/0.25*100).clip(0,100).mean(axis=1,skipna=True); p['within10']=part((dd>=-0.10).where(dd.notna()))
          keys=('ret5','ret21','ret63','ret252','above10','above20','above50','above200','ma20_gt_50','ma50_gt_200','dd_score','within10')
          raw0=pd.concat([p[k] for k in keys],axis=1).mean(axis=1,skipna=True)
          raw=raw0.ewm(span=2,adjust=False).mean()
          W=252*15; base=raw.shift(1); mu=base.rolling(W,min_periods=W).mean(); sd=base.rolling(W,min_periods=W).std(ddof=0); z=(raw-mu)/sd.replace(0,np.nan); temp=100/(1+np.exp(-np.log(3.0)*z))
          valid=temp.notna()
          def slope_state(s,thr):
              ma=s.rolling(10).mean(); d=ma-ma.shift(2)
              return pd.Series(np.where(d>thr,'UP',np.where(d<-thr,'DOWN','FLAT')),index=s.index)
          def drop_state(s,a,b,c):
              dr=s.rolling(20).max()-s
              return pd.Series(np.where(dr<a,'NORMAL',np.where(dr<b,'CAUTION',np.where(dr<c,'SLOW','DEEP'))),index=s.index)
          print('=== SLOPE_FREQ_SAME_THRESHOLD_0.4 ===')
          for name,s in [('RAW',raw),('TEMP',temp)]:
              st=slope_state(s,0.4)[valid if name=='TEMP' else raw.notna()]
              print(name,st.value_counts(normalize=True).mul(100).round(1).to_dict())
          print('=== SLOPE_FREQ_TEMP_THRESHOLDS ===')
          for th in [0.4,0.5,0.6,0.75,1.0,1.25]:
              st=slope_state(temp,th)[valid]
              print(th,st.value_counts(normalize=True).mul(100).round(1).to_dict())
          print('=== DROP_FREQ_SAME_3_7_12 ===')
          for name,s in [('RAW',raw),('TEMP',temp)]:
              st=drop_state(s,3,7,12)[valid if name=='TEMP' else raw.notna()]
              print(name,st.value_counts(normalize=True).mul(100).round(1).to_dict())
          print('=== DROP_FREQ_TEMP_CANDIDATES ===')
          for abc in [(3,7,12),(4,8,14),(5,10,15),(5,12,20),(6,12,18)]:
              st=drop_state(temp,*abc)[valid]
              print(abc,st.value_counts(normalize=True).mul(100).round(1).to_dict())
          print('=== BAND_FREQ_TEMP ===')
          bins=[-1e9,20,35,45,55,65,80,1e9]; labs=['STRONG_BEAR','BEAR','WEAK_BEAR','NEUTRAL','WEAK_BULL','BULL','STRONG_BULL']
          print(pd.cut(temp[valid],bins=bins,labels=labs,right=False).value_counts(normalize=True).sort_index().mul(100).round(1).to_dict())
          print('latest raw',round(float(raw.dropna().iloc[-1]),2),'temp',round(float(temp.dropna().iloc[-1]),2))
          PY
