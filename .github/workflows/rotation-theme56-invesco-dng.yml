name: Rotation Theme56 Invesco DNG

on:
  workflow_dispatch:
  push:
    branches:
      - research/rotation-exact-flow-internals-20260831
    paths:
      - leadership/research/rotation_theme56_invesco_dng.py
      - .github/workflows/rotation-theme56-invesco-dng.yml

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/rotation-exact-flow-internals-20260831
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pandas requests lxml html5lib openpyxl
      - run: python -m py_compile leadership/research/rotation_theme56_invesco_dng.py
      - name: Fetch Invesco DNG holdings
        run: python leadership/research/rotation_theme56_invesco_dng.py --output leadership/research/rotation_theme56_invesco_dng
      - name: Persist output
        shell: bash
        run: |
          set -euo pipefail
          SRC="leadership/research/rotation_theme56_invesco_dng"
          TMP="$(mktemp -d)/rotation_theme56_invesco_dng"
          cp -a "$SRC" "$TMP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin research/rotation-exact-flow-internals-20260831
            git reset --hard origin/research/rotation-exact-flow-internals-20260831
            rm -rf "$SRC"
            mkdir -p "$(dirname "$SRC")"
            cp -a "$TMP" "$SRC"
            git add "$SRC"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "research: record Invesco DNG Theme56 holdings"
            if git push origin HEAD:research/rotation-exact-flow-internals-20260831; then exit 0; fi
          done
          exit 1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rotation-theme56-invesco-dng
          path: leadership/research/rotation_theme56_invesco_dng/
          retention-days: 14
