name: Research adoption validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - intelligence_engine/research_adoption.py
      - tests/test_research_adoption.py
      - .github/workflows/research-adoption-validation.yml
      - private/research-*-year-*.enc.json
      - private/research-summary.enc.json

permissions:
  contents: write

# Keep only the newest adoption build. Research-input commits trigger this workflow,
# so replacing an older pending/running build is safe and prevents stale publication.
concurrency:
  group: research-adoption-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      V38_PRIVATE_DASHBOARD_PASSPHRASE: ${{ secrets.V38_PRIVATE_DASHBOARD_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Run focused tests
        run: pytest -q tests/test_research_adoption.py
      - name: Validate secret boundary
        run: test -n "${V38_PRIVATE_DASHBOARD_PASSPHRASE:-}"
      - name: Restore encrypted research partitions
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          restored=0
          for encrypted in private/research-*-year-*.enc.json; do
            name="$(basename "$encrypted")"
            if [[ "$name" =~ ^research-([a-z_]+)-year-([0-9]{4})\.enc\.json$ ]]; then
              dataset="${BASH_REMATCH[1]}"
              year="${BASH_REMATCH[2]}"
              target="data/intelligence/research/${dataset}/year=${year}.jsonl.gz"
              mkdir -p "$(dirname "$target")"
              node scripts/private_crypto.mjs decrypt "$encrypted" "$target"
              restored=$((restored + 1))
            fi
          done
          test "$restored" -ge 40
          echo "Restored ${restored} encrypted partitions"
      - name: Build aggregate adoption report
        run: python -m intelligence_engine.research_adoption --root data/intelligence/research --output research-adoption-report.json
      - name: Validate report contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('research-adoption-report.json').read_text())
          assert p['schema_version'] == '1.0'
          assert len(p['strategies']) == 5
          assert p['implementation']['command_center_integration'] == 'SIDECAR_ONLY'
          assert all(x['decision'] in {'ADOPT','DISPLAY_ONLY','REJECT'} for x in p['strategies'])
          print(json.dumps({'decisions': {x['strategy']: x['decision'] for x in p['strategies']}}, indent=2))
          PY
      - name: Remove plaintext research partitions
        if: always()
        run: rm -rf data/intelligence
      - name: Commit aggregate report only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-adoption-report.json
          if git diff --staged --quiet; then
            echo "Adoption report unchanged"
            exit 0
          fi
          git commit -m "Publish research adoption validation"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            # If encrypted inputs changed since this run was triggered, do not
            # publish a stale report. Their commit triggers a newer validation run.
            if ! git diff --quiet "$GITHUB_SHA" HEAD^ -- \
              'private/research-*-year-*.enc.json' \
              private/research-summary.enc.json; then
              echo "Research inputs advanced; defer publication to the newer run"
              exit 0
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another main writer; retry ${attempt}/4"
            sleep $((attempt * 2))
          done
          echo "Failed to publish adoption report after retries"
          exit 1
