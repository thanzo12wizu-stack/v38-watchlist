# Research-only audit. Does not modify main, Pages, or dashboard outputs.
name: Core Rank Horizon Portfolio Research

on:
  push:
    branches:
      - research/sector-stock-leadership-20260826
    paths:
      - leadership/research/audit_core_rank_horizon_portfolio.py
      - .github/workflows/core-rank-horizon-portfolio-research.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy yfinance
      - name: Syntax check
        run: |
          python -m py_compile leadership/research/audit_core_rank_horizon_portfolio.py
          python -m py_compile leadership/research/audit_leader_factor_horizon_discovery.py
          python -m py_compile leadership/research/audit_core_releadership_priority.py
      - name: Run Core ranking horizon portfolio audit
        env:
          PYTHONPATH: .:leadership/research
        run: |
          python leadership/research/audit_core_rank_horizon_portfolio.py \
            --root . \
            --output leadership/research/core_rank_horizon_portfolio \
            --analysis-start 2020-01-02 \
            --analysis-end 2026-09-02 \
            --leader-start 2021-01-04 \
            --max-tickers 6000 \
            --batch-size 75
      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-rank-horizon-portfolio
          path: leadership/research/core_rank_horizon_portfolio/
          retention-days: 14
