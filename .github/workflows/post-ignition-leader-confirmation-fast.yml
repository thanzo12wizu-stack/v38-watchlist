name: Post ignition leader confirmation fast

on:
  workflow_dispatch:
  push:
    branches:
      - research/sector-stock-leadership-20260826
    paths:
      - .github/workflows/post-ignition-leader-confirmation-fast.yml

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy yfinance
      - name: Run confirmation-only fast validation
        run: |
          python leadership/research/validate_post_ignition_leaders_v2.py \
            --root . \
            --output leadership/research/post_ignition_leader_confirmation_fast \
            --analysis-start 2022-01-03 \
            --analysis-end 2026-06-30 \
            --max-tickers 1500 \
            --batch-size 75 \
            --min-members 3
      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-ignition-leader-confirmation-fast
          path: leadership/research/post_ignition_leader_confirmation_fast/
          if-no-files-found: warn
          retention-days: 7
