name: Rotation PIT Membership Audit

on:
  workflow_dispatch:
  push:
    branches:
      - research/rotation-exact-flow-internals-20260831
    paths:
      - leadership/research/rotation_pit_membership_audit.py
      - leadership/research/rotation_divergence_proxy_backtest.py
      - .github/workflows/rotation-pit-membership-audit.yml

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install pinned research dependencies
        run: |
          python -m pip install --disable-pip-version-check pandas numpy requests openpyxl yfinance
          python -m pip install --disable-pip-version-check "git+https://github.com/arielNacamulli/pitindex.git@c3d5d4961076a59041b3e1de90fe5ea052f61bb4"
      - name: Syntax check
        run: python -m py_compile leadership/research/rotation_pit_membership_audit.py
      - name: Audit PIT sector membership quality
        run: |
          python leadership/research/rotation_pit_membership_audit.py \
            --start 2022-01-31 \
            --end 2026-08-31 \
            --output leadership/research/rotation_pit_membership_audit_outputs
      - name: Upload audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rotation-pit-membership-audit
          path: leadership/research/rotation_pit_membership_audit_outputs/
          if-no-files-found: warn
          retention-days: 7
