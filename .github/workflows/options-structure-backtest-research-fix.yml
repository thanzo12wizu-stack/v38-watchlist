name: Options structure backtest research fix

on:
  push:
    branches:
      - research/options-intelligence-validation-20260905
    paths:
      - '.github/workflows/options-structure-backtest-research-fix.yml'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/options-intelligence-validation-20260905
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check -r requirements.txt scipy
      - name: Fix typo and syntax check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('research/options-intelligence-20260905/backtest_options_structure.py')
          s=p.read_text(encoding='utf-8')
          bad='lines += ["","## Research conclusions",""\"]'
          if bad not in s:
              bad='lines += ["","## Research conclusions",""\"]'
          # literal typo from first draft
          s=s.replace('lines += ["","## Research conclusions",""\"]', 'lines += ["", "## Research conclusions", ""]')
          s=s.replace('lines += ["","## Research conclusions",""\"]', 'lines += ["", "## Research conclusions", ""]')
          s=s.replace('lines += ["","## Research conclusions",""\"]', 'lines += ["", "## Research conclusions", ""]')
          # robust direct line rewrite
          lines=[]
          for line in s.splitlines():
              if '## Research conclusions' in line and line.lstrip().startswith('lines +='):
                  line='    lines += ["", "## Research conclusions", ""]'
              lines.append(line)
          p.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
          python -m py_compile research/options-intelligence-20260905/backtest_options_structure.py
      - name: Run backtest
        run: python research/options-intelligence-20260905/backtest_options_structure.py
      - name: Commit research fix and outputs only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/options-intelligence-20260905/backtest_options_structure.py \
                  research/options-intelligence-20260905/REPORT.md \
                  research/options-intelligence-20260905/summary.json \
                  research/options-intelligence-20260905/event_features.csv \
                  research/options-intelligence-20260905/event_study.csv \
                  research/options-intelligence-20260905/wall_behavior.csv \
                  research/options-intelligence-20260905/expected_move_calibration.csv \
                  research/options-intelligence-20260905/direction_score_validation.csv
          git commit -m "Complete Options structure research backtest"
          git push origin HEAD:research/options-intelligence-validation-20260905
