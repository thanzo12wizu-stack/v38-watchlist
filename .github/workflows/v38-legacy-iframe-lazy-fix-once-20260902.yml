name: One-off V38 legacy iframe lazy-load fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v38-legacy-iframe-lazy-fix-once-20260902.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            command-center-v38.html
            .github/workflows/v38-legacy-iframe-lazy-fix-once-20260902.yml
          sparse-checkout-cone-mode: false

      - name: Lazy-load legacy dashboard only when tab opens
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('command-center-v38.html')
          t=p.read_text(encoding='utf-8')

          old_iframe='<iframe class="legacy" src="command-center.html" title="Existing Command Center"></iframe>'
          new_iframe='<iframe class="legacy" id="legacyFrame" data-src="command-center.html" title="Existing Command Center"></iframe>'
          if t.count(old_iframe) != 1:
              raise SystemExit(f'expected one eager legacy iframe, got {t.count(old_iframe)}')
          t=t.replace(old_iframe,new_iframe,1)

          old_open="function openTab(id){document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.tab===id));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('on',x.id===id))}"
          new_open="function openTab(id){document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.tab===id));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('on',x.id===id));if(id==='legacy'){const f=$('legacyFrame');if(f&&!f.getAttribute('src'))f.setAttribute('src',(f.dataset.src||'command-center.html')+'?v='+Date.now())}}"
          if t.count(old_open) != 1:
              raise SystemExit(f'expected one openTab definition, got {t.count(old_open)}')
          t=t.replace(old_open,new_open,1)

          # Invariants: no eager iframe, exactly one lazy frame, and load only occurs in legacy tab path.
          assert 'iframe class="legacy" src="command-center.html"' not in t
          assert t.count('id="legacyFrame"') == 1
          assert t.count('data-src="command-center.html"') == 1
          assert t.count("if(id==='legacy')") == 1
          assert t.count("Date.now()") >= 1
          p.write_text(t,encoding='utf-8')
          print('command-center-v38.html verified: legacy iframe is lazy and cache-busted')
          PY
          rm -f .github/workflows/v38-legacy-iframe-lazy-fix-once-20260902.yml
          git diff --check

      - name: Commit V38 iframe fix only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Lazy-load legacy dashboard in V38 companion'
          git push origin HEAD:main
