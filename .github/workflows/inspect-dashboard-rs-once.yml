name: Inspect Dashboard RS source once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-dashboard-rs-once.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - name: Inspect Dashboard RS build anchors
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          src=Path('build_dashboard.py').read_text(encoding='utf-8')
          needles=[
            'RSマルチタイムフレーム比較','RS63 Top10','RS126 Top10','RS189 Top10',
            'df["rs126"]','df["rs21"]','def compute_metrics','compute_metrics(',
            'render_html(', 'def render', 'build_rs', 'rsx-', 'sort_values("rs126"',
            "sort_values('rs126'", 'sort_values("rs189"', "sort_values('rs189'",
            'sort_values("rs"', "sort_values('rs'"
          ]
          emitted=[]
          for needle in needles:
            start=0
            while True:
              p=src.find(needle,start)
              if p<0: break
              a=max(0,p-1800); b=min(len(src),p+6500)
              if not any(abs(a-x)<1200 for x in emitted):
                emitted.append(a)
                print(f'\n=== {needle} @ {p} ===\n{src[a:b]}')
              start=p+len(needle)
              if len(emitted)>=30: break
            if len(emitted)>=30: break
          print('\n=== FUNCTION NAMES NEAR RSX ===')
          for m in re.finditer(r'^def\s+([A-Za-z0-9_]+)\([^\n]*',src,flags=re.M):
            name=m.group(1)
            body_end=src.find('\ndef ',m.end())
            body=src[m.start(): body_end if body_end>0 else min(len(src),m.end()+20000)]
            if 'RS63 Top10' in body or 'RSマルチタイムフレーム比較' in body or 'rsx-' in body:
              print(name, m.start(), body[:18000])
          PY
