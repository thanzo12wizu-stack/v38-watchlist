name: Inspect Dashboard RS source once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-dashboard-rs-once.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dashboard deps
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Inspect exact Dashboard RS implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          src = Path('build_dashboard.py').read_text(encoding='utf-8')
          print('=== SOURCE MATCHES ===')
          pats = [r'def\s+[^\n]*rs[^\n]*', r'RS21', r'RS63', r'RS189', r'rs21', r'rs63', r'rs189', r'id=["\']t-rs', r'RSランキング', r'相対強度']
          seen=[]
          for pat in pats:
              for m in re.finditer(pat, src, flags=re.I):
                  a=max(0,m.start()-700); b=min(len(src),m.end()+1800)
                  chunk=src[a:b]
                  key=(a,b)
                  if key not in seen:
                      seen.append(key)
                      print(f'\n--- {pat} @ {m.start()} ---\n{chunk}')
                  if len(seen)>=24: break
              if len(seen)>=24: break

          html=Path('command-center.html').read_text(encoding='utf-8')
          print('\n=== CHECKED-IN T-RS SECTION ===')
          m=re.search(r'<section[^>]*id=["\']t-rs["\'][\s\S]*?</section>', html, flags=re.I)
          if m:
              sec=m.group(0)
              print(sec[:30000])
          else:
              for needle in ['RS189','RS63','RS21','RSランキング','相対強度']:
                  p=html.find(needle)
                  if p>=0: print(f'--- {needle} ---\n'+html[max(0,p-3000):p+12000])
          PY
