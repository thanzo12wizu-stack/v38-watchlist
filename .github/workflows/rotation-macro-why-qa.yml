name: Rotation Macro WHY QA

on:
  workflow_dispatch:
  push:
    branches:
      - research/rotation-exact-flow-internals-20260831
    paths:
      - leadership/research/rotation_macro_why_qa.py
      - .github/workflows/rotation-macro-why-qa.yml

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy requests openpyxl yfinance lxml
      - name: Syntax check
        run: python -m py_compile leadership/research/rotation_macro_why_qa.py
      - name: Run Macro WHY QA
        run: |
          python leadership/research/rotation_macro_why_qa.py \
            --output leadership/research/rotation_macro_why_qa_outputs
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rotation-macro-why-qa
          path: leadership/research/rotation_macro_why_qa_outputs/
          if-no-files-found: warn
          retention-days: 14
