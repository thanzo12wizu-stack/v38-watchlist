name: V38 targeted fix once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v38-targeted-fix-once.yml'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Apply staged route patch
        run: |
          python scripts/v38_route_fix_once.py
          python scripts/v38_route_fix_correction.py

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt pytest

      - name: Run targeted validation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile build_v38_strict_loo_live.py build_v38_sleeve_live.py
          pytest -q tests/test_v38_strict_loo_live.py tests/test_v38_sleeve_live.py tests/test_v38_companion.py tests/test_v38_tqqq_live.py
          grep -q 'default="/tmp/v38-sleeve-price-cache.pkl.gz"' build_v38_strict_loo_live.py
          grep -q 'default="/tmp/v38-sleeve-price-cache.pkl.gz"' build_v38_sleeve_live.py
          git diff --exit-code -- .github/workflows/dashboard.yml

      - name: Commit route fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build_v38_strict_loo_live.py build_v38_sleeve_live.py tests/test_v38_strict_loo_live.py
          git rm scripts/v38_route_fix_once.py scripts/v38_route_fix_correction.py
          git diff --cached --check
          git commit -m 'fix: share V38 price cache with live sleeves'
          git push origin HEAD:main

      - name: Dispatch canonical dashboard rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run dashboard.yml --ref main
