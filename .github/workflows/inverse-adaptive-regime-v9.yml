name: Inverse Adaptive Regime V9

on:
  workflow_dispatch:
  push:
    branches: [research/inverse-etf-regime-scan-20260902]
    paths:
      - leadership/research/audit_inverse_adaptive_regime_v9.py
      - .github/workflows/inverse-adaptive-regime-v9.yml

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: tqqq-backtest-once-20260826
          path: legacy
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --disable-pip-version-check pandas numpy scipy requests yfinance
      - name: Download frozen audited inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p inputs/v6 inputs/v2 inputs/g100 inputs/tqqq
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/9868903361/zip > /tmp/v6.zip
          unzip -q /tmp/v6.zip -d inputs/v6
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/9851768614/zip > /tmp/v2.zip
          unzip -q /tmp/v2.zip -d inputs/v2
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/9763251012/zip > /tmp/g100.zip
          unzip -q /tmp/g100.zip -d inputs/g100
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/9649902954/zip > /tmp/tqqq.zip
          unzip -q /tmp/tqqq.zip -d inputs/tqqq
      - name: Syntax check
        run: PYTHONPATH=.:leadership/research python -m py_compile leadership/research/audit_inverse_adaptive_regime_v9.py
      - name: Run adaptive regime audit
        run: |
          set -euo pipefail
          PYTHONPATH=.:leadership/research python leadership/research/audit_inverse_adaptive_regime_v9.py \
            --legacy-dir legacy \
            --legacy-state inputs/v6/legacy_state_2011_2026.csv.gz \
            --v2-features inputs/v2/feature_state_v2.csv.gz \
            --gross100 inputs/g100 \
            --tqqq inputs/tqqq/tqqq_stage56_daily.csv.gz \
            --output leadership/research/out/inverse_adaptive_v9
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inverse-adaptive-v9
          path: leadership/research/out/inverse_adaptive_v9/
          retention-days: 30
          if-no-files-found: warn
