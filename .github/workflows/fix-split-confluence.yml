name: Fix split validation and true confluence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-split-confluence.yml'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply source fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('build_dashboard.py')
          s = p.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global s
              if new in s:
                  return
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, got {n}')
              s = s.replace(old, new, 1)

          # ------------------------------------------------------------------
          # 1) Split/reverse-split: a large price jump is only a candidate.
          #    Exclude as a split only when Yahoo corporate actions confirms a
          #    Stock Splits event near the jump date. Keep a separate >1000%
          #    hard-data-anomaly guard for obvious broken history (e.g. CHRD ghost).
          # ------------------------------------------------------------------
          split_helper = r'''
          # SPLIT_EVENT_CONFIRM_V1
          SPLIT_CONFIRM_WINDOW_DAYS = 5
          SPLIT_HARD_ANOMALY = 10.0   # unmatched one-day move >1000% = broken-history guard, not "split suspicion"

          def _confirmed_split_events(candidates):
              """Return tickers whose >150% jump aligns with a real Yahoo split/reverse-split action.

              candidates: {ticker: jump_date}. A price jump by itself is never enough to call a split.
              Network/action lookup failure is fail-open for split classification; only the separate
              extreme-data-anomaly guard can still exclude obviously corrupt history.
              """
              if not candidates or not _net_ok():
                  return set()
              try:
                  import yfinance as yf
              except Exception as e:
                  sys.stderr.write(f"[split] yfinance unavailable: {type(e).__name__}\n")
                  return set()
              confirmed = set()
              for ticker, jump_date in candidates.items():
                  try:
                      jd = pd.Timestamp(jump_date)
                      if getattr(jd, "tzinfo", None) is not None:
                          jd = jd.tz_localize(None)
                      jd = jd.normalize()
                      start = (jd - pd.Timedelta(days=SPLIT_CONFIRM_WINDOW_DAYS + 2)).strftime("%Y-%m-%d")
                      end = (jd + pd.Timedelta(days=SPLIT_CONFIRM_WINDOW_DAYS + 3)).strftime("%Y-%m-%d")
                      hist = yf.Ticker(str(ticker)).history(
                          start=start, end=end, auto_adjust=False, actions=True, repair=False
                      )
                      if hist is None or hist.empty or "Stock Splits" not in hist.columns:
                          continue
                      splits = pd.to_numeric(hist["Stock Splits"], errors="coerce").fillna(0.0)
                      for event_idx, ratio in splits[splits != 0].items():
                          ed = pd.Timestamp(event_idx)
                          if getattr(ed, "tzinfo", None) is not None:
                              ed = ed.tz_localize(None)
                          if abs((ed.normalize() - jd).days) <= SPLIT_CONFIRM_WINDOW_DAYS:
                              confirmed.add(str(ticker))
                              break
                  except Exception as e:
                      sys.stderr.write(f"[split] action lookup failed {ticker}: {type(e).__name__}\n")
              return confirmed

          '''
          if 'SPLIT_EVENT_CONFIRM_V1' not in s:
              anchor = 'def compute_metrics(W, order, s2i=None, macro=None, incept=None):\n'
              if s.count(anchor) != 1:
                  raise SystemExit('compute_metrics anchor missing')
              s = s.replace(anchor, split_helper + anchor, 1)

          replace_once(
              '        maxabs1d = float(c.pct_change(fill_method=None).iloc[-200:].abs().max()) if len(c) >= 2 else np.nan\n',
              '        _chg200 = c.pct_change(fill_method=None).iloc[-200:].replace([np.inf, -np.inf], np.nan).dropna() if len(c) >= 2 else pd.Series(dtype=float)\n'
              '        if len(_chg200):\n'
              '            _abschg200 = _chg200.abs()\n'
              '            maxabs1d = float(_abschg200.max())\n'
              '            try:\n'
              '                maxabs1d_date = pd.Timestamp(_abschg200.idxmax()).strftime("%Y-%m-%d")\n'
              '            except Exception:\n'
              '                maxabs1d_date = None\n'
              '        else:\n'
              '            maxabs1d = np.nan\n'
              '            maxabs1d_date = None\n',
              'maxabs jump date')

          replace_once(
              '            maxabs1d=maxabs1d, lo10=lo10, lo10_prev=lo10_prev, ema21_10ago=ema21_10ago,\n',
              '            maxabs1d=maxabs1d, maxabs1d_date=maxabs1d_date, lo10=lo10, lo10_prev=lo10_prev, ema21_10ago=ema21_10ago,\n',
              'record jump date')

          old_split = (
              '    # A1 分割アーティファクト・ガード: 直近200日の単日変化率>150%はスプリット/データ異常のゴースト\n'
              '    #   （CHRD +80,376% 等）。RSランキングから除外＝RS=NaNで選定・リーダー判定から自然脱落。\n'
              '    df["split_suspect"] = (df["maxabs1d"] > 1.50).fillna(False)\n'
          )
          new_split = (
              '    # A1 price-event guard: >150% is only a candidate. Confirm a real split/reverse-split\n'
              '    # with Yahoo corporate actions near the jump date before excluding it as a split.\n'
              '    _raw_split_jump = (pd.to_numeric(df["maxabs1d"], errors="coerce") > 1.50).fillna(False)\n'
              '    _split_candidates = {str(t): df.at[t, "maxabs1d_date"] for t in df.index[_raw_split_jump]\n'
              '                         if df.at[t, "maxabs1d_date"]}\n'
              '    _confirmed_splits = _confirmed_split_events(_split_candidates)\n'
              '    df["split_suspect"] = pd.Series(df.index.astype(str).isin(_confirmed_splits), index=df.index, dtype=bool)\n'
              '    # Separate broken-history guard: do not mislabel a genuine 150-1000% move as a split.\n'
              '    df["data_anomaly"] = ((pd.to_numeric(df["maxabs1d"], errors="coerce") > SPLIT_HARD_ANOMALY)\n'
              '                          & ~df["split_suspect"]).fillna(False)\n'
              '    df["price_event_excluded"] = (df["split_suspect"] | df["data_anomaly"]).fillna(False)\n'
          )
          replace_once(old_split, new_split, 'split classification')

          replace_once(
              '    _pool = ((~df["split_suspect"]) & (df["close"] >= 5) & (df["dvol"] >= DVOL_FLOOR)\n',
              '    _pool = ((~df["price_event_excluded"]) & (df["close"] >= 5) & (df["dvol"] >= DVOL_FLOOR)\n',
              'RS pool event guard')

          replace_once(
              '        if bool(r.get("split_suspect")) or bool(r.get("excluded_theme")):\n',
              '        if bool(r.get("price_event_excluded", r.get("split_suspect"))) or bool(r.get("excluded_theme")):\n',
              'W30 event guard')

          replace_once(
              '    "liq": "流動性外", "price": "低位株", "split": "分割疑い",\n',
              '    "liq": "流動性外", "price": "低位株", "split": "分割/併合確認", "data": "価格データ異常",\n',
              'RS off labels')
          replace_once(
              '    "split": "直近200日に単日±150%超の変化。分割/データ異常としてRSから除外",\n',
              '    "split": "単日±150%超の変化日にYahoo corporate actionの分割/併合イベントを確認。RSから除外",\n'
              '    "data": "分割/併合イベント未確認だが単日+1000%超。価格履歴破損の可能性が高いため別枠で除外",\n',
              'RS off help')
          replace_once(
              '    if bool(r.get("split_suspect")):\n        return "split"\n',
              '    if bool(r.get("split_suspect")):\n        return "split"\n    if bool(r.get("data_anomaly")):\n        return "data"\n',
              'RS off reason')

          replace_once(
              '        mask &= ~m.get("split_suspect", pd.Series(True, index=m.index)).fillna(True)\n',
              '        _event_bad = m.get("price_event_excluded", m.get("split_suspect", pd.Series(True, index=m.index)))\n'
              '        mask &= ~_event_bad.fillna(True).astype(bool)\n',
              'setup event guard')

          old_hist = (
              '        if "split_suspect" in m.columns:\n'
              '            bad = [t for t in cols if bool(m.at[t, "split_suspect"])]\n'
              '            if bad:\n'
              '                pool.loc[:, bad] = False\n'
          )
          new_hist = (
              '        _bad_col = "price_event_excluded" if "price_event_excluded" in m.columns else "split_suspect"\n'
              '        if _bad_col in m.columns:\n'
              '            bad = [t for t in cols if bool(m.at[t, _bad_col])]\n'
              '            if bad:\n'
              '                pool.loc[:, bad] = False\n'
          )
          replace_once(old_hist, new_hist, 'historical RS event guard')

          s = s.replace('("分割サスペクト", (f\'{q.get("split_suspect")}銘柄 除外\' if q.get("split_suspect") else "0（クリーン）")),',
                        '("分割/併合確認", (f\'{q.get("split_suspect")}銘柄 除外\' if q.get("split_suspect") else "0")),\n        ("価格データ異常", (f\'{q.get("data_anomaly")}銘柄 除外\' if q.get("data_anomaly") else "0（クリーン）")),')
          s = s.replace('("RSプール幅", f\'{q.get("rs_pool", 0)}銘柄（非サスペクト×$5×$10M内で順位付け）\'),',
                        '("RSプール幅", f\'{q.get("rs_pool", 0)}銘柄（価格イベント正常×$5×$10M内で順位付け）\'),')
          replace_once(
              '        split_suspect=int(m["split_suspect"].sum()) if "split_suspect" in m else 0,\n',
              '        split_suspect=int(m["split_suspect"].sum()) if "split_suspect" in m else 0,\n'
              '        data_anomaly=int(m["data_anomaly"].sum()) if "data_anomaly" in m else 0,\n',
              'quality diagnostics')

          # ------------------------------------------------------------------
          # 2) Confluence: restore the literal meaning = actual price-level overlap.
          #    Candidate quality (RS/setup/trigger) remains context, not the definition.
          # ------------------------------------------------------------------
          overlap_helper = r'''
          # TRUE_PRICE_LEVEL_CONFLUENCE_V1
          def _confluence_overlap(r):
              """Find the densest actionable cluster of independent price levels.

              Levels: 21EMA, 50MA, 200MA, pivot, 63/252 VWAP, valid inception VWAP.
              A cluster requires >=2 levels whose total span is within a volatility-aware
              1-2% band: min(2%, max(1%, 0.25*ADR20)). Levels more than 10% from spot are
              ignored because this is an entry-watch board, not a remote S/R inventory.
              """
              def fin(v):
                  try:
                      return v is not None and np.isfinite(float(v)) and float(v) > 0
                  except Exception:
                      return False
              close = r.get("close")
              if not fin(close):
                  return dict(count=0, labels=[], center=np.nan, dist=np.nan, span=np.nan, tol=np.nan)
              close = float(close)
              adr = r.get("adr")
              try:
                  adr = float(adr) if np.isfinite(float(adr)) else np.nan
              except Exception:
                  adr = np.nan
              tol = min(0.02, max(0.01, 0.25 * adr)) if np.isfinite(adr) else 0.0125
              levels = [
                  ("21EMA", r.get("ema21")),
                  ("50MA", r.get("sma50")),
                  ("200MA", r.get("sma200")),
                  ("ピボット", r.get("pivot40")),
                  ("63VWAP", r.get("vwap63")),
                  ("252VWAP", r.get("vwap252")),
              ]
              try:
                  all_valid = bool(r.get("vwap_all_valid")) and not pd.isna(r.get("vwap_all_valid"))
              except Exception:
                  all_valid = False
              if all_valid:
                  levels.append(("上場来VWAP", r.get("vwap_all")))
              levels = [(lab, float(px)) for lab, px in levels
                        if fin(px) and abs(float(px) / close - 1.0) <= 0.10]
              levels.sort(key=lambda x: x[1])
              best = None
              for i in range(len(levels)):
                  for j in range(i, len(levels)):
                      group = levels[i:j+1]
                      center = sum(px for _lab, px in group) / len(group)
                      span = (group[-1][1] - group[0][1]) / center if center > 0 else np.inf
                      if span > tol:
                          break
                      dist = center / close - 1.0
                      key = (len(group), -abs(dist), -span)
                      if best is None or key > best[0]:
                          best = (key, group, center, dist, span)
              if best is None:
                  return dict(count=0, labels=[], center=np.nan, dist=np.nan, span=np.nan, tol=tol)
              _key, group, center, dist, span = best
              return dict(count=len(group), labels=[lab for lab, _px in group],
                          center=center, dist=dist, span=span, tol=tol)

          '''
          if 'TRUE_PRICE_LEVEL_CONFLUENCE_V1' not in s:
              anchor = '# コンフルエンスは採点しない。\n'
              if s.count(anchor) != 1:
                  raise SystemExit('confluence anchor missing')
              s = s.replace(anchor, overlap_helper + '# コンフルエンスは「価格レベルの重なり」を主語にする。\n', 1)
              s = s.replace('# 既存指標が示す「セットアップ/発火/確認/位置・警戒」を分類して、\n# 観測値とブール値をそのまま表示する。発注候補の合否には使わない。\n',
                            '# VCP/PP/RS等は文脈情報。重なりの有無そのものを代用しない。発注候補の合否には使わない。\n', 1)

          old_ret = (
              '    return dict(setup=setups, trigger=triggers, confirm=confirms,\n'
              '                location=locations, warning=warnings,\n'
              '                has_setup=bool(setups), has_trigger=bool(triggers))\n'
          )
          new_ret = (
              '    overlap = _confluence_overlap(r)\n'
              '    return dict(setup=setups, trigger=triggers, confirm=confirms,\n'
              '                location=locations, warning=warnings, overlap=overlap,\n'
              '                has_setup=bool(setups), has_trigger=bool(triggers))\n'
          )
          replace_once(old_ret, new_ret, 'confluence facts overlap')

          tier_pat = re.compile(r'def _cf_tier\(a, r\):\n.*?\n\n\ndef _cf_row\(', re.S)
          tier_new = '''def _cf_tier(a, r):
              """Tier only by literal level overlap density and distance from spot."""
              ov = a.get("overlap") or {}
              count = int(ov.get("count") or 0)
              dist = abs(float(ov.get("dist")) * 100) if _cf_fin(ov.get("dist")) else 999.0
              fresh = _cf_fresh_days(a, r)
              if count >= 3 and dist <= 3:
                  return 0, (fresh if fresh is not None else 99), dist
              if (count >= 2 and dist <= 3) or (count >= 3 and dist <= 6):
                  return 1, (fresh if fresh is not None else 99), dist
              if count >= 2 and dist <= 6:
                  return 2, (fresh if fresh is not None else 99), dist
              return 3, (fresh if fresh is not None else 99), dist


          def _cf_row('''
          s, n = tier_pat.subn(tier_new, s, count=1)
          if n != 1:
              raise SystemExit(f'cf tier replace count={n}')

          old_flow = '''    flow = ""
              if a["setup"]:
                  flow += '<span>' + _h(" / ".join(a["setup"])) + '</span>'
              if a["setup"] and a["trigger"]:
                  flow += '<i>→</i>'
              if a["trigger"]:
                  flow += '<b class="pos">' + _h(" / ".join(a["trigger"])) + '</b>'
              if not flow:
                  flow = '<span class="mut">—</span>'
          '''
          new_flow = '''    flow = ""
              _ov = a.get("overlap") or {}
              _ov_n = int(_ov.get("count") or 0)
              if _ov_n >= 2:
                  _ov_dist = float(_ov.get("dist")) * 100 if _cf_fin(_ov.get("dist")) else 999.0
                  _ov_span = float(_ov.get("span")) * 100 if _cf_fin(_ov.get("span")) else 999.0
                  _ov_txt = f"{_ov_n}重: " + " + ".join(_ov.get("labels") or []) + f" ({_ov_dist:+.1f}%, 幅{_ov_span:.1f}%)"
                  flow += '<b class="cfnear">' + _h(_ov_txt) + '</b>'
              if a["setup"]:
                  if flow:
                      flow += '<i>＋</i>'
                  flow += '<span>' + _h(" / ".join(a["setup"])) + '</span>'
              if a["trigger"]:
                  if flow:
                      flow += '<i>→</i>'
                  flow += '<b class="pos">' + _h(" / ".join(a["trigger"])) + '</b>'
              if not flow:
                  flow = '<span class="mut">—</span>'
          '''
          replace_once(old_flow, new_flow, 'confluence row flow')

          old_build = '''        a = _confluence_facts(r, ne.get(t))
                  if not (a["setup"] or a["trigger"] or a["location"]):
                      continue
                  order, fresh, pdist = _cf_tier(a, r)
                  # 並びは「執行の近さ」。第1キー=発火の鮮度、第2キー=ピボットまでの距離。
                  # どちらも事実の量で、重み付けや総合点は使っていない。
                  buckets[order].append(((fresh, round(pdist, 2), -float(r.get("rs189") or 0)), t, r, a))
          '''
          new_build = '''        a = _confluence_facts(r, ne.get(t))
                  ov = a.get("overlap") or {}
                  ov_n = int(ov.get("count") or 0)
                  ov_dist = abs(float(ov.get("dist"))) if _cf_fin(ov.get("dist")) else 999.0
                  if ov_n < 2 or ov_dist > 0.08:
                      continue
                  order, fresh, cdist = _cf_tier(a, r)
                  ov_span = float(ov.get("span")) if _cf_fin(ov.get("span")) else 999.0
                  # Literal confluence first: more overlapping levels -> nearer cluster -> tighter span.
                  # Trigger freshness and RS are context/tie-breakers only; no synthetic total score.
                  buckets[order].append(((-ov_n, round(cdist, 2), round(ov_span, 5), fresh,
                                          -float(r.get("rs189") or 0)), t, r, a))
          '''
          replace_once(old_build, new_build, 'confluence build filter/sort')
          s = s.replace('items = sorted(buckets[order], key=lambda x: (x[0], x[1]))',
                        'items = sorted(buckets[order], key=lambda x: x[0])', 1)

          # Tier labels: density/distance of the actual level cluster.
          labels = {
              0: ('A 3重以上・現値±3%', 'True'),
              1: ('B 2重近接 / 3重やや遠い', 'True'),
              2: ('C 2重・現値±6%', 'False'),
              3: ('D 2重・現値±8%（監視）', 'False'),
          }
          for tier, (label, opened) in labels.items():
              pat = re.compile(rf'\({tier},\s*"[ABCD][^"]*",\s*(True|False)\),')
              repl = f'({tier}, "{label}", {opened}),' 
              s, n = pat.subn(repl, s, count=1)
              if n != 1:
                  raise SystemExit(f'confluence tier label {tier} count={n}')

          det_pat = re.compile(r'    det = \(\'<details class="cfdet"><summary>並べ方と列の意味</summary>\'.*?\'</div></details>\'\)\n', re.S)
          det_new = '''    det = ('<details class="cfdet"><summary>重なり判定と列の意味</summary>'
                     '<div class="cflg">'
                     'コンフルエンス＝価格レベルの実際の重なり。21EMA・50MA・200MA・ピボット・63/252VWAP・上場来VWAPから、'
                     '現値±10%内にある独立レベルを集め、ADR連動の幅 min(2%, max(1%, 0.25×ADR)) 内で2本以上重なる場合だけ表示。<br>'
                     '並びは①重なり本数（多い順）→②重なり中心の現値からの距離→③帯の狭さ。発火鮮度とRSは同率時の文脈のみ。<br>'
                     'piv=ピボットまでの距離／50MAσ=50日線からのATR距離／U/D=20日の上昇下降出来高比／'
                     'ADR=1日の平均値幅／損切まで=下にある損切候補のうち最も近いものまでの距離。'
                     '</div></details>')
          '''
          s, n = det_pat.subn(det_new, s, count=1)
          if n != 1:
              raise SystemExit(f'confluence detail replace count={n}')

          s = s.replace('f\'<div class="sub">RS189≥{min_rs}の該当なし。{det}</div>\'',
                        'f\'<div class="sub">RS189≥{min_rs}の中に、2本以上の価格レベルが実際に重なる銘柄なし。{det}</div>\'', 1)
          s = s.replace('f\'<div class="sub">RS189≥{min_rs}。発火の新しい順・ピボットに近い順。pivは±3%以内を強調、\'\n            f\'-15%より下を淡色表示（距離表示のみ・合否ではない）。{det}</div>\'',
                        'f\'<div class="sub">RS189≥{min_rs}は候補母集団の条件のみ。表示条件は2本以上の価格レベル重なり。\'\n            f\'重なり本数→中心距離→帯の狭さの順。VCP/PP/RS/ブレイクは文脈で、重なりの代用にはしない。{det}</div>\'', 1)

          # Update stale wording around shared eligibility.
          s = s.replace('分割疑い除外・除外テーマ除外', '確認済み分割/併合・価格データ異常・除外テーマ除外')
          s = s.replace('株価・流動性・時価総額・分割疑い・除外テーマを共通適用',
                        '株価・流動性・時価総額・確認済み分割/併合・価格データ異常・除外テーマを共通適用')

          p.write_text(s, encoding='utf-8')
          PY

          python -m py_compile build_dashboard.py
          grep -F 'SPLIT_EVENT_CONFIRM_V1' build_dashboard.py
          grep -F 'TRUE_PRICE_LEVEL_CONFLUENCE_V1' build_dashboard.py
          grep -F 'df["price_event_excluded"]' build_dashboard.py
          grep -F 'if ov_n < 2 or ov_dist > 0.08:' build_dashboard.py
          git diff --check

      - name: Install runtime and validate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet -r requirements.txt
          python - <<'PY'
          import ast, json
          from pathlib import Path
          import numpy as np

          src = Path('build_dashboard.py').read_text(encoding='utf-8')
          tree = ast.parse(src)
          fn = next(n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name == '_confluence_overlap')
          ns={'np': np}
          # function references pd only for vwap_all validity; keep it invalid in the unit fixture
          import pandas as pd
          ns['pd']=pd
          exec(compile(ast.Module(body=[fn], type_ignores=[]), '<cf>', 'exec'), ns)
          f=ns['_confluence_overlap']
          dense=f(dict(close=100, adr=.04, ema21=99.5, sma50=100.2, sma200=89,
                       pivot40=100.6, vwap63=99.8, vwap252=111, vwap_all_valid=False))
          sparse=f(dict(close=100, adr=.04, ema21=91, sma50=100, sma200=109,
                        pivot40=106, vwap63=94, vwap252=103, vwap_all_valid=False))
          assert dense['count'] >= 3, dense
          assert sparse['count'] < 2, sparse

          result={'source_markers': True, 'confluence_dense_fixture': dense,
                  'confluence_sparse_fixture': sparse}
          try:
              import yfinance as yf
              h=yf.Ticker('MRNA').history(period='1y', auto_adjust=False, actions=True, repair=False)
              c=h['Close'].dropna()
              chg=c.pct_change(fill_method=None).dropna()
              tail=chg.iloc[-200:]
              if len(tail):
                  jump_date=tail.abs().idxmax()
                  jd=pd.Timestamp(jump_date)
                  if jd.tzinfo is not None: jd=jd.tz_localize(None)
                  splits=pd.to_numeric(h.get('Stock Splits', pd.Series(index=h.index, dtype=float)), errors='coerce').fillna(0)
                  nearby=[]
                  for ix,ratio in splits[splits != 0].items():
                      ed=pd.Timestamp(ix)
                      if ed.tzinfo is not None: ed=ed.tz_localize(None)
                      if abs((ed.normalize()-jd.normalize()).days) <= 5:
                          nearby.append({'date':ed.strftime('%Y-%m-%d'),'ratio':float(ratio)})
                  maxabs=float(tail.abs().max())
                  result['MRNA']={'max_abs_1d':maxabs,'jump_date':jd.strftime('%Y-%m-%d'),
                                  'nearby_stock_splits':nearby,
                                  'would_split_exclude':bool(maxabs>1.5 and nearby),
                                  'would_hard_data_exclude':bool(maxabs>10.0 and not nearby)}
              else:
                  result['MRNA']={'error':'no_change_data'}
          except Exception as e:
              result['MRNA']={'error':type(e).__name__}
          Path('fix_validation.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

          # Existing offline selftest is useful but may be lengthy; run with a hard cap.
          timeout 240 python build_dashboard.py --selftest

      - name: Commit fix and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build_dashboard.py fix_validation.json
          for f in \
            .github/workflows/fix-split-confluence.yml \
            .github/workflows/diag-dashboard-logic.yml \
            .github/workflows/complete-remaining-dashboard-fixes.yml \
            dashboard_logic_diag.txt dashboard_logic_focused.txt dashboard_source_slices.txt; do
            if [[ -e "$f" ]]; then git rm -f -- "$f"; fi
          done
          git commit -m "Confirm split events and restore true price confluence"
          git push origin HEAD:main
          echo "FIX_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Dispatch production dashboard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run dashboard.yml --ref main
          echo "Production dashboard dispatched from $FIX_SHA"
