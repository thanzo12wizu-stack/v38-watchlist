name: Diagnose split confluence patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-split-confluence.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Count patch anchors
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,re
          s=Path('build_dashboard.py').read_text(encoding='utf-8')
          anchors={
            'compute_metrics': 'def compute_metrics(W, order, s2i=None, macro=None, incept=None):\n',
            'maxabs': '        maxabs1d = float(c.pct_change(fill_method=None).iloc[-200:].abs().max()) if len(c) >= 2 else np.nan\n',
            'rec_maxabs': '            maxabs1d=maxabs1d, lo10=lo10, lo10_prev=lo10_prev, ema21_10ago=ema21_10ago,\n',
            'old_split': '    df["split_suspect"] = (df["maxabs1d"] > 1.50).fillna(False)\n',
            'rs_pool': '    _pool = ((~df["split_suspect"]) & (df["close"] >= 5) & (df["dvol"] >= DVOL_FLOOR)\n',
            'w30': '        if bool(r.get("split_suspect")) or bool(r.get("excluded_theme")):\n',
            'setup_guard': '        mask &= ~m.get("split_suspect", pd.Series(True, index=m.index)).fillna(True)\n',
            'cf_anchor': '# コンフルエンスは採点しない。\n',
            'cf_return': '    return dict(setup=setups, trigger=triggers, confirm=confirms,\n                location=locations, warning=warnings,\n                has_setup=bool(setups), has_trigger=bool(triggers))\n',
            'cf_sort': '        items = sorted(buckets[order], key=lambda x: (x[0], x[1]))\n',
          }
          out={'anchors':{k:s.count(v) for k,v in anchors.items()}}
          out['tier_pattern']=len(re.findall(r'def _cf_tier\(a, r\):\n.*?\n\n\ndef _cf_row\(',s,re.S))
          out['cf_sections']={str(i):len(re.findall(rf'\({i},\s*"[ABCD][^"]*",\s*(?:True|False)\),',s)) for i in range(4)}
          out['markers']={'split': 'SPLIT_EVENT_CONFIRM_V1' in s,'cf':'TRUE_PRICE_LEVEL_CONFLUENCE_V1' in s}
          Path('fix_diag.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fix_diag.json
          git commit -m "Persist split confluence patch diagnostics"
          git push origin HEAD:main
