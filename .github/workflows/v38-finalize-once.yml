name: V38 finalize live sleeves once

on:
  push:
    branches: [fix/v38-gross100-live-20260901]
    paths:
      - '.github/workflows/v38-finalize-once.yml'
      - 'tools/v38-final.patch.*'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply reviewed final patch and isolate non-workflow files
        run: |
          set -euo pipefail
          cat tools/v38-final.patch.* | git apply --index -
          git rm --ignore-unmatch tools/v38-final.patch.*
          git rm --ignore-unmatch tools/dev_seed_v38_normal.py
          # GitHub Actions tokens cannot modify workflow files. Restore every
          # workflow path here; those exact workflow changes are applied through
          # the GitHub connector after this non-workflow commit succeeds.
          git reset HEAD -- .github/workflows/dashboard.yml .github/workflows/v38-audit-check.yml .github/workflows/v38-sleeve-live-once.yml .github/workflows/v38-finalize-once.yml .github/workflows/v38-gross100-dev-snapshot.yml .github/workflows/v38-normal-seed-once.yml || true
          git checkout -- .github/workflows/dashboard.yml .github/workflows/v38-audit-check.yml .github/workflows/v38-finalize-once.yml .github/workflows/v38-gross100-dev-snapshot.yml .github/workflows/v38-normal-seed-once.yml
          rm -f .github/workflows/v38-sleeve-live-once.yml
          git add build_v38_companion.py build_v38_sleeve_live.py command-center-v38.html docs/V38_RULEBOOK_AUDIT_20260830.md tests/test_v38_companion.py tests/test_v38_sleeve_live.py
          git status --short
      - name: Commit finalized non-workflow implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Complete live V38 sleeves and RSI30 monitor'
          git push origin HEAD:fix/v38-gross100-live-20260901
