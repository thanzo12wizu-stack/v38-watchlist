name: V38 JS runtime fix once

on:
  push:
    branches:
      - fix/v38-js-runtime-20260902
    paths:
      - '.github/workflows/v38-js-runtime-fix-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Restore missing runtime helpers only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('command-center-v38.html')
          s = p.read_text(encoding='utf-8')

          for fn in ('rotationFor', 'rotationLabel', 'whyText'):
              if f'function {fn}(' in s:
                  raise SystemExit(f'{fn} already exists; refusing duplicate insertion')

          anchor = "function rankMeta(x,kind){let m=STATE.market;if(kind==='selective')return{rank:x.selective_watch_rank,score:x.rs189,label:'RS189'};if(kind==='attack')return{rank:x.attack_watch_rank,score:x.attack_watch_score,label:'V38 70/30'};if(m.mode==='SELECTIVE')return{rank:x.final_rank,score:x.rs189,label:'RS189'};if(m.mode==='ATTACK')return{rank:x.final_rank,score:x.attack_score,label:'V38 Final'};return{rank:x.attack_watch_rank,score:x.attack_watch_score,label:'再開時V38'}}\n"
          if s.count(anchor) != 1:
              raise SystemExit(f'expected one rankMeta anchor, found {s.count(anchor)}')

          helpers = """function rotationFor(ticker){if(!ROTCTX)return null;let found=[];for(const row of ROTCTX.industry_context||[]){for(const key of['existing_emerging_or_leading_leaders_in_full_intersection','existing_leadership_leaders_in_top15_intersection']){for(const s of row[key]||[]){if(s.symbol===ticker)found.push({etf:row.etf,state:row.rotation?.state,reason:row.rotation?.state_reason})}}}return found[0]||null}\nfunction rotationLabel(x){let r=rotationFor(x.ticker);if(!r)return'Rotation: 正式順位には未使用';let state=r.state||'';let jp=state.includes('DISTRIBUTION')||state.includes('WEAK')?'警戒Context':state.includes('CURRENT_STRENGTH')?'現在強い':state.includes('LEAD')||state.includes('EARLY')?'先行WATCH':'参考';return`${r.etf} / ${jp}`}\nfunction whyText(x){let parts=[];parts.push(`RS189 ${fmt(x.rs189)} / RS63 ${fmt(x.rs63)} / $Vol ${fmt(x.daily_dollar_volume_m,1)}M / 50>200 ${x.sma50_gt_sma200?'PASS':'FAIL'} / Price>200 ${(x.close_vs_sma200_pct??0)>0?'PASS':'FAIL'}`);if(x.peer_theme)parts.push(`${x.peer_theme}のLOO Theme Score ${fmt(x.peer_theme_score)}`);else parts.push('有効Themeなし → Final計算だけ中立50');return parts.join('。')+'。'}\n"""

          out = s.replace(anchor, anchor + helpers, 1)
          p.write_text(out, encoding='utf-8')
          PY

      - name: Verify exact repair and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          s = Path('command-center-v38.html').read_text(encoding='utf-8')
          for fn in ('rotationFor', 'rotationLabel', 'whyText'):
              n = s.count(f'function {fn}(')
              assert n == 1, (fn, n)
          assert 'rotationLabel(x)' in s
          assert 'whyText(x)' in s
          scripts = re.findall(r'<script>(.*?)</script>', s, flags=re.S)
          assert len(scripts) == 1, len(scripts)
          Path('/tmp/v38-runtime.js').write_text(scripts[0], encoding='utf-8')
          PY
          node --check /tmp/v38-runtime.js

      - name: Commit only the HTML repair and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add command-center-v38.html
          git rm .github/workflows/v38-js-runtime-fix-once.yml
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=(.github/workflows/v38-js-runtime-fix-once.yml command-center-v38.html)
          [[ "${changed[*]}" == "${expected[*]}" ]] || { printf 'Unexpected staged files: %s\n' "${changed[*]}"; exit 1; }
          git commit -m 'Fix V38 runtime helper regression'
          git push origin HEAD:${GITHUB_REF_NAME}
