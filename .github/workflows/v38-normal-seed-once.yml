name: V38 normal sleeve seed once

on:
  push:
    branches: [fix/v38-gross100-live-20260901]
    paths:
      - 'tools/dev_seed_v38_normal.py'
      - '.github/workflows/v38-normal-seed-once.yml'

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas numpy scipy yfinance
      - name: Materialize audited research code
        run: |
          mkdir -p /tmp/v38-research
          git archive 02c6746e65fe688bcad68d3d76f27fef344b7cab leadership/research | tar -x -C /tmp/v38-research
      - name: Build normal sleeve seed through current market asof
        run: |
          python tools/dev_seed_v38_normal.py \
            --root . \
            --research-path /tmp/v38-research/leadership/research \
            --out /tmp/v38-normal-sleeve-seed.json \
            --start 2016-01-04 \
            --end 2026-08-28
      - uses: actions/upload-artifact@v4
        with:
          name: v38-normal-sleeve-seed
          path: /tmp/v38-normal-sleeve-seed.json
          retention-days: 2
