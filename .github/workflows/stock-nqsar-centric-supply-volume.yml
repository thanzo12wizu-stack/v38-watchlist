name: Stock NQSAR Centric Supply Volume

on:
  workflow_dispatch: {}
  push:
    branches: [research/stock-nqsar-centric-20260907]
    paths:
      - 'research/nqsar_centric_supply_volume.py'
      - '.github/workflows/stock-nqsar-centric-supply-volume.yml'

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check -r requirements.txt
      - run: python -m py_compile research/nqsar_centric_supply_volume.py
      - name: Run supply-volume interaction scan
        run: python -m research.nqsar_centric_supply_volume --output research/output/nqsar-centric-supply-volume --batch-size 100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stock-nqsar-centric-supply-volume-20260907
          path: research/output/nqsar-centric-supply-volume/
