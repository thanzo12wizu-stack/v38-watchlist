name: Shallow pullback portfolio audit

on:
  workflow_dispatch:
  push:
    branches: [research/vix-rsi-rulebook-20260828]
    paths:
      - 'leadership/research/audit_shallow_pullback_portfolio.py'
      - '.github/workflows/shallow-pullback-portfolio-audit.yml'

permissions:
  contents: write
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: '3.11'}
      - run: pip install --disable-pip-version-check -r requirements.txt
      - name: Download broad audit artifact
        uses: actions/download-artifact@v4
        with:
          name: strong-stock-shallow-pullback-audit
          path: research/shallow_portfolio_input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: thanzo12wizu-stack/v38-watchlist
          run-id: '33160272562'
      - name: Syntax check
        run: PYTHONPATH=.:leadership/research python -m py_compile leadership/research/audit_shallow_pullback_portfolio.py
      - name: Run portfolio audit
        shell: bash
        run: |
          set -o pipefail
          rm -rf research/shallow_pullback_portfolio_output
          PYTHONPATH=.:leadership/research python leadership/research/audit_shallow_pullback_portfolio.py \
            --root . \
            --deep-events research/shallow_portfolio_input/strong_stock_shallow_pullback_output/event_rows.csv.gz \
            --output research/shallow_pullback_portfolio_output \
            --asof 2026-08-28 2>&1 | tee research/shallow_pullback_portfolio_audit.log
      - name: Verify outputs
        run: |
          test -s research/shallow_pullback_portfolio_output/summary.json
          test -s research/shallow_pullback_portfolio_output/portfolio_summary.csv
          python - <<'PY'
          import json,pandas as pd
          from pathlib import Path
          out=Path('research/shallow_pullback_portfolio_output');s=json.loads((out/'summary.json').read_text());assert s['status']=='SHALLOW_PULLBACK_PORTFOLIO_AUDIT'
          p=pd.read_csv(out/'portfolio_summary.csv');assert {'SHALLOW','SHALLOW_UP','DEEP_RSI30'} <= set(p.variant);assert {1,2,4} <= set(p.max_pos)
          print('portfolio QA passed')
          PY
      - name: Upload audit package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shallow-pullback-portfolio-audit
          retention-days: 30
          path: |
            research/shallow_pullback_portfolio_audit.log
            research/shallow_pullback_portfolio_output/
      - name: Commit compact results to research branch
        if: success()
        run: |
          mkdir -p research/shallow_pullback_portfolio/results
          cp research/shallow_pullback_portfolio_output/summary.json research/shallow_pullback_portfolio/results/
          cp research/shallow_pullback_portfolio_output/portfolio_summary.csv research/shallow_pullback_portfolio/results/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/shallow_pullback_portfolio/results
          git diff --cached --quiet || git commit -m 'research: record shallow pullback portfolio results'
          git pull --rebase origin research/vix-rsi-rulebook-20260828
          git push origin HEAD:research/vix-rsi-rulebook-20260828
