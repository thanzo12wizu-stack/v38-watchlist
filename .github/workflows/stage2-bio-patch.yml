name: Stage2 bio audit patcher

on:
  push:
    branches:
      - stage2-bio-revenue-audit
    paths:
      - '.github/workflows/stage2-bio-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage2-bio-revenue-audit
          fetch-depth: 1

      - name: Patch dashboard workflow for warning-only bio audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('.github/workflows/dashboard.yml')
          s = p.read_text(encoding='utf-8')

          old = "      - 'scripts/privacy_audit.py'\n      - '.github/workflows/dashboard.yml'"
          new = "      - 'scripts/privacy_audit.py'\n      - 'scripts/audit_bio_revenue.py'\n      - '.github/workflows/dashboard.yml'"
          if s.count(old) != 1:
              raise SystemExit(f'push-path anchor count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = "        options_targets.json\n        commit_manifest.json"
          new = "        options_targets.json\n        bio_revenue_audit.json\n        commit_manifest.json"
          if s.count(old) != 1:
              raise SystemExit(f'artifact anchor count={s.count(old)}')
          s = s.replace(old, new, 1)

          anchor = "      - name: Validate generated files\n"
          if s.count(anchor) != 1:
              raise SystemExit(f'validation anchor count={s.count(anchor)}')
          step = '''      - name: Audit bio revenue threshold (warning only)\n        if: steps.build.outputs.skipped != 'true'\n        continue-on-error: true\n        env:\n          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}\n        shell: bash\n        run: |\n          set -uo pipefail\n          python scripts/audit_bio_revenue.py \\\n            --state state.json \\\n            --universe universe.csv \\\n            --output bio_revenue_audit.json \\\n            --mcap-max 10000000000 \\\n            --revenue-max 50000000\n\n'''
          s = s.replace(anchor, step + anchor, 1)
          p.write_text(s, encoding='utf-8')
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/dashboard.yml scripts/audit_bio_revenue.py
          git rm .github/workflows/stage2-bio-patch.yml
          git commit -m "Add warning-only bio revenue diagnostic"
          git push origin HEAD:stage2-bio-revenue-audit
