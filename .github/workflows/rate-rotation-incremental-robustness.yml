name: Rate Rotation Incremental Robustness

on:
  workflow_dispatch:
  push:
    branches:
      - research/rate-regime-audit-20260902
    paths:
      - leadership/research/audit_rate_rotation_incremental_robustness.py
      - .github/workflows/rate-rotation-incremental-robustness.yml

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Syntax check
        run: python -m py_compile leadership/research/audit_rate_rotation_incremental_robustness.py
      - name: Download frozen incremental panel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p inputs/incremental
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/9847553564/zip > /tmp/incremental.zip
          unzip -q /tmp/incremental.zip -d inputs/incremental
          test -s inputs/incremental/rate_rotation_incremental_panel.csv.gz
      - name: Run robustness audit
        run: |
          set -euo pipefail
          python leadership/research/audit_rate_rotation_incremental_robustness.py \
            --panel inputs/incremental/rate_rotation_incremental_panel.csv.gz \
            --output leadership/research/out/rate_rotation_incremental_robustness
      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rate-rotation-incremental-robustness
          path: leadership/research/out/rate_rotation_incremental_robustness/
          if-no-files-found: warn
          retention-days: 14
