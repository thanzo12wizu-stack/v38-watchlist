name: One-off inspect MC15 implementation targets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-mc15-impl-once.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Print final MC15 patch targets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          lines=Path('build_dashboard.py').read_text(encoding='utf-8',errors='replace').splitlines()
          for a,b in [(590,665),(1565,1625),(1875,1975),(3650,3908),(20770,20838)]:
              print(f'\n=== {a}-{b} ===')
              for n in range(a,min(b,len(lines))+1): print(f'{n}: {lines[n-1]}')
          PY
