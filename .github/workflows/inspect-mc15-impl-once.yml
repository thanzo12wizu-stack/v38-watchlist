name: One-off inspect MC15 implementation targets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-mc15-impl-once.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Measure live MC15 calibration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import numpy as np
          import pandas as pd
          import yfinance as yf
          import build_dashboard as b

          tickers = list(b.MC_MARKET_TICKERS)
          raw = yf.download(tickers, start='2005-01-01', progress=False,
                            auto_adjust=True, group_by='ticker', threads=True)
          frames = b._extract(raw, tickers, minbars=30)
          missing = [t for t in tickers if t not in frames]
          for t in missing:
              try:
                  h = yf.Ticker(t).history(start='2005-01-01', auto_adjust=True)
                  g = b._extract(h, [t], minbars=30).get(t)
                  if g is not None:
                      frames[t] = g
              except Exception:
                  pass
          print('LONG_COVERAGE', len(frames), '/', len(tickers))
          legacy, _, _, _, vals = b.mri_frame(frames)
          rs = pd.to_numeric(legacy, errors='coerce')
          base = rs.shift(1)
          n = 252 * 15
          mu = base.rolling(n, min_periods=n).mean()
          sd = base.rolling(n, min_periods=n).std(ddof=0)
          z = (rs - mu) / sd.replace(0, np.nan)
          temp1 = 100.0 / (1.0 + np.exp(-z))
          temp_ln3 = 100.0 / (1.0 + np.exp(-np.log(3.0) * z))
          good = z.dropna()
          i = good.index[-1]
          print('LATEST_DATE', i.date())
          print('RAW', float(rs.loc[i]))
          print('MEAN15', float(mu.loc[i]))
          print('SD15', float(sd.loc[i]))
          print('Z15', float(z.loc[i]))
          print('TEMP_K1', float(temp1.loc[i]))
          print('TEMP_LN3', float(temp_ln3.loc[i]))

          def occ(series, mask=None):
              x = pd.to_numeric(series, errors='coerce').dropna()
              if mask is not None:
                  x = x[mask.reindex(x.index).fillna(False)]
              n0 = len(x)
              if not n0:
                  return None
              bull = float((x >= 55).mean() * 100)
              neu = float(((x >= 45) & (x < 55)).mean() * 100)
              bear = float((x < 45).mean() * 100)
              return (str(x.index[0].date()), str(x.index[-1].date()), n0, bull, neu, bear)

          cov = pd.to_numeric(vals['mc_coverage'], errors='coerce')
          m50 = cov >= (50.0 / 57.0 * 100.0)
          print('OCC_K1_ALL', occ(temp1))
          print('OCC_K1_50ETF', occ(temp1, m50))
          print('OCC_LN3_ALL', occ(temp_ln3))
          print('OCC_LN3_50ETF', occ(temp_ln3, m50))
          PY
