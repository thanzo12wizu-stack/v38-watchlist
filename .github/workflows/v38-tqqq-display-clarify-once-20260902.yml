name: One-off V38 TQQQ display clarification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v38-tqqq-display-clarify-once-20260902.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            command-center-v38.html
            .github/workflows/v38-tqqq-display-clarify-once-20260902.yml
          sparse-checkout-cone-mode: false

      - name: Clarify TQQQ and normal-stock display only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('command-center-v38.html')
          t=p.read_text(encoding='utf-8')

          replacements = [
            ('<div class="mini"><span>TQQQ</span><b id="tqqqDecision">—</b></div>',
             '<div class="mini"><span>TQQQ（通常保有枠）</span><b id="tqqqDecision">—</b></div>'),
            ('<div class="mini"><span>保有株</span><b id="holdingDecision">—</b></div>',
             '<div class="mini"><span>通常個別株の保有</span><b id="holdingDecision">—</b></div>'),
            ('<div class="mini"><span>新規再開の条件</span><b id="resumeCondition">—</b></div>',
             '<div class="mini"><span>通常個別株の再開条件</span><b id="resumeCondition">—</b></div>'),
          ]
          for old,new in replacements:
              if t.count(old)!=1:
                  raise SystemExit(f'expected exactly one markup target: {old[:60]} count={t.count(old)}')
              t=t.replace(old,new,1)

          old_mode = "function modeText(m){if(m.mode==='ATTACK')return['買える地合い','Blue/GreenかつBreadth 60%以上。通常株を最大12枠まで使える。','good'];if(m.mode==='SELECTIVE')return['選別して買える','Blue/GreenだがBreadthは50〜60%。通常株は合計最大4枠まで。','warn'];if(m.mode==='DEFENSE')return['防御モード','NQSAR Red。通常個別株は次回寄りで全退避。','bad'];return['新規買付を止める','通常株の新規Entry条件を満たしていない。既存株はRedでなければ個別Exitまで継続。','warn']}\nfunction humanReason(m){if(m.mode==='STOP'&&String(m.nqsar).toLowerCase()==='yellow')return`NQSARがYellowのため新規買付停止。Breadth ${fmt(m.breadth50)}%はSELECTIVE水準ですが、Yellowが優先されます。`;if(m.mode==='DEFENSE')return'NQSARがRed。通常個別株は次回寄りで全退避します。';if(m.mode==='SELECTIVE')return`Breadth ${fmt(m.breadth50)}%。広がりが十分ではないため、強い銘柄だけ最大4枠に絞ります。`;if(m.mode==='ATTACK')return`Breadth ${fmt(m.breadth50)}%。市場の広がりも十分で、通常株を最大12枠まで使えます。`;return m.reason||'—'}"
          new_mode = "function tqqqActionText(n){if(!n||n.status!=='READY'||n.underlying_target_pct==null)return'判定不可';let x=Number(n.underlying_target_pct);if(x<=0.01)return'0% 退避';if(Math.abs(x-30)<0.05)return'30% 保有継続';return`${pct(x)} 保有`}\nfunction tqqqLockText(n){let a=[];if(n?.slow_lock)a.push('SLOW');if(n?.fast_lock)a.push('FAST');if(n?.mc_lock)a.push('MC');return a.join(' / ')||'なし'}\nfunction modeText(m){if(m.mode==='ATTACK')return['買える地合い','Blue/GreenかつBreadth 60%以上。通常株を最大12枠まで使える。','good'];if(m.mode==='SELECTIVE')return['選別して買える','Blue/GreenだがBreadthは50〜60%。通常株は合計最大4枠まで。','warn'];if(m.mode==='DEFENSE')return['防御モード','NQSAR Red。通常個別株は次回寄りで全退避。','bad'];return['新規買付を止める','通常株の新規Entry条件を満たしていない。既存株はRedでなければ個別Exitまで継続。','warn']}\nfunction humanReason(m){let tq=tqqqActionText(STATE?.normal_tqqq||{});if(m.mode==='STOP'&&String(m.nqsar).toLowerCase()==='yellow')return`NQSAR Yellowのため通常個別株のみ新規停止。TQQQは別判定で現在 ${tq}。Breadth ${fmt(m.breadth50)}%はSELECTIVE水準ですが、通常株ではYellowが優先されます。`;if(m.mode==='DEFENSE')return`NQSAR Red。通常個別株は次回寄りで全退避。TQQQは別判定で現在 ${tq}。`;if(m.mode==='SELECTIVE')return`Breadth ${fmt(m.breadth50)}%。通常個別株は強い銘柄だけ最大4枠。TQQQは別判定で現在 ${tq}。`;if(m.mode==='ATTACK')return`Breadth ${fmt(m.breadth50)}%。通常個別株を最大12枠まで使えます。TQQQは別判定で現在 ${tq}。`;return m.reason||'—'}"
          if t.count(old_mode)!=1:
              raise SystemExit(f'mode/humanReason target count={t.count(old_mode)}')
          t=t.replace(old_mode,new_mode,1)

          old_today = "function renderToday(){if(!STATE)return;let m=STATE.market,held=positions().length,mt=modeText(m);$('modeHuman').textContent=mt[0];$('modeHuman').className='v '+mt[2];$('modeHumanReason').textContent=mt[1];$('nqsarHuman').textContent=m.nqsar||'—';$('nqsarHuman').className='v '+(String(m.nqsar).toLowerCase()==='red'?'bad':String(m.nqsar).toLowerCase()==='yellow'?'warn':'good');$('breadthHuman').textContent=fmt(m.breadth50)+'%';$('todayReason').textContent=humanReason(m);$('mode').textContent=m.mode;$('breadth').textContent=`${fmt(m.breadth50)}% / ${(m.coverage*100).toFixed(1)}%`;$('capacity').textContent=m.new_entry_limit;$('looStatus').textContent=STATE.ranking?.attack_watch_status||STATE.ranking?.strict_loo_live_status||'—';if(m.mode==='DEFENSE'){$('todayAction').textContent='通常株は次回寄りで全退避';$('normalDecision').textContent='新規0・全退避';$('holdingDecision').textContent=held?'次回寄りで全退避':'保有なし'}else if(m.mode==='STOP'){$('todayAction').textContent='今日は通常株を新規で買わない';$('normalDecision').textContent='新規0';$('holdingDecision').textContent=held?`${held}銘柄を個別Exitまで継続`:'保有なし'}else{let cap=Math.max(0,m.new_entry_limit-held);$('todayAction').textContent=cap>0?`通常株を最大${cap}銘柄まで追加可能`:'今日は通常株を追加しない';$('normalDecision').textContent=`最大${m.new_entry_limit}枠`;$('holdingDecision').textContent=held?`${held}銘柄保有`:'保有なし'}$('resumeCondition').textContent=m.mode==='STOP'||m.mode==='DEFENSE'?'Blue/Green＋Breadth≥50%':'現在Entry資格あり';renderRanking()}"
          new_today = "function renderToday(){if(!STATE)return;let m=STATE.market,held=positions().length,mt=modeText(m),tq=tqqqActionText(STATE.normal_tqqq||{});$('modeHuman').textContent=mt[0];$('modeHuman').className='v '+mt[2];$('modeHumanReason').textContent=mt[1];$('nqsarHuman').textContent=m.nqsar||'—';$('nqsarHuman').className='v '+(String(m.nqsar).toLowerCase()==='red'?'bad':String(m.nqsar).toLowerCase()==='yellow'?'warn':'good');$('breadthHuman').textContent=fmt(m.breadth50)+'%';$('todayReason').textContent=humanReason(m);$('mode').textContent=m.mode;$('breadth').textContent=`${fmt(m.breadth50)}% / ${(m.coverage*100).toFixed(1)}%`;$('capacity').textContent=m.new_entry_limit;$('looStatus').textContent=STATE.ranking?.attack_watch_status||STATE.ranking?.strict_loo_live_status||'—';if(m.mode==='DEFENSE'){$('todayAction').textContent=`通常株：全退避 ／ TQQQ：${tq}`;$('normalDecision').textContent='新規0・全退避';$('holdingDecision').textContent=held?'次回寄りで全退避':'保有なし'}else if(m.mode==='STOP'){$('todayAction').textContent=`通常株：新規停止 ／ TQQQ：${tq}`;$('normalDecision').textContent='新規0';$('holdingDecision').textContent=held?`${held}銘柄を個別Exitまで継続`:'保有なし'}else{let cap=Math.max(0,m.new_entry_limit-held);$('todayAction').textContent=cap>0?`通常株：最大${cap}銘柄追加 ／ TQQQ：${tq}`:`通常株：追加なし ／ TQQQ：${tq}`;$('normalDecision').textContent=`最大${m.new_entry_limit}枠`;$('holdingDecision').textContent=held?`${held}銘柄保有`:'保有なし'}$('resumeCondition').textContent=m.mode==='STOP'||m.mode==='DEFENSE'?'Blue/Green＋Breadth≥50%':'現在Entry資格あり';renderRanking()}"
          if t.count(old_today)!=1:
              raise SystemExit(f'renderToday target count={t.count(old_today)}')
          t=t.replace(old_today,new_today,1)

          old_tq = "function renderTqqq(){let p=STATE.panic_tqqq||{},n=STATE.normal_tqqq||{};$('tqqqDecision').textContent=n.status==='READY'?`目標 ${pct(n.underlying_target_pct)}`:'判定不可';let active=!!p.active;$('tqqqPlain').textContent=active?'Panic F80が稼働中。CURRENT30の目標を最低80%へ引き上げています。':`Panic F80は未発動。現在はCURRENT30 hierarchyの目標 ${pct(n.underlying_target_pct)}。30%は通常baseで固定値ではありません。`;"
          new_tq = "function renderTqqq(){let p=STATE.panic_tqqq||{},n=STATE.normal_tqqq||{};$('tqqqDecision').textContent=tqqqActionText(n);let active=!!p.active,zero=n.status==='READY'&&Number(n.underlying_target_pct)<=0.01;if(active)$('tqqqPlain').textContent='Panic F80が稼働中。CURRENT30の目標に対して最低80%へ引き上げています。';else if(zero)$('tqqqPlain').textContent=`CURRENT30 risk lock発動（${tqqqLockText(n)}）。現在のTQQQ目標は0%。NQSAR Yellow/Redだけで機械的に0%にするのではなく、CURRENT30 hierarchyのrisk lock判定です。`;else $('tqqqPlain').textContent=`Panic F80は未発動。CURRENT30の現在目標 ${pct(n.underlying_target_pct)}。30%は通常Exposureで、risk lock時は0%になり得ます。`;"
          if t.count(old_tq)!=1:
              raise SystemExit(f'renderTqqq target count={t.count(old_tq)}')
          t=t.replace(old_tq,new_tq,1)

          # Display-only invariants.
          assert 'TQQQ（通常保有枠）' in t
          assert '通常個別株の保有' in t
          assert '通常個別株の再開条件' in t
          assert '通常株：新規停止 ／ TQQQ：' in t
          assert "return'0% 退避'" in t
          assert "return'30% 保有継続'" in t
          # Existing trading/allocation primitives remain present.
          assert "function finalStop(p){return Math.max(p.entry*.92,p.peak*.70)}" in t
          assert "function renderAllocation()" in t
          assert "function renderResetWatch()" in t
          p.write_text(t,encoding='utf-8')
          print('command-center-v38.html: display clarification verified')
          PY
          rm -f .github/workflows/v38-tqqq-display-clarify-once-20260902.yml
          git diff --check

      - name: Commit display-only change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Clarify TQQQ versus normal-stock actions in V38 UI'
          git push origin HEAD:main
