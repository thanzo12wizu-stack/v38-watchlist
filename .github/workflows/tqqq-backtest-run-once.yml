name: TQQQ backtest run once

on:
  push:
    branches: [tqqq-backtest-once-20260826]
    paths:
      - '.github/workflows/tqqq-backtest-run-once.yml'
      - 'research/tqqq_stage28_bull_event_quality.py'
      - 'research/tqqq_stage27_bull_exit_diagnostics.py'
      - 'research/tqqq_stage26_event_driven_bull.py'
      - 'research/tqqq_stage17_hierarchy_crisis_fix.py'
      - 'research/tqqq_stage16_adversarial_bear_stress.py'

permissions:
  contents: read
  actions: read

jobs:
  stage28:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Run bull event quality study
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python research/tqqq_stage28_bull_event_quality.py 2>&1 | tee tqqq_stage28.log
      - name: Upload Stage28 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tqqq-stage28-bull-event-quality
          if-no-files-found: warn
          path: |
            tqqq_stage28.log
            tqqq_stage28_summary.json
            tqqq_stage28_events.csv
            tqqq_stage28_groups.csv
            tqqq_stage28_years.csv
