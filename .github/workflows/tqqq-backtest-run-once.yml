name: TQQQ backtest run once

on:
  push:
    branches: [tqqq-backtest-once-20260826]
    paths:
      - '.github/workflows/tqqq-backtest-run-once.yml'
      - 'research/tqqq_stage30_dual_bull_regimes.py'
      - 'research/tqqq_stage24_smart_bull_continuation.py'
      - 'research/tqqq_stage17_hierarchy_crisis_fix.py'
      - 'research/tqqq_stage16_adversarial_bear_stress.py'

permissions:
  contents: read
  actions: read

jobs:
  stage30:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Run dual bull regime study
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python research/tqqq_stage30_dual_bull_regimes.py 2>&1 | tee tqqq_stage30.log
      - name: Upload Stage30 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tqqq-stage30-dual-bull-regimes
          if-no-files-found: warn
          path: |
            tqqq_stage30.log
            tqqq_stage30_summary.json
            tqqq_stage30_screen.csv
            tqqq_stage30_bull_capture.csv
