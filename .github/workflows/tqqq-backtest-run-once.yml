name: TQQQ backtest run once

on:
  push:
    branches: [tqqq-backtest-once-20260826]
    paths:
      - '.github/workflows/tqqq-backtest-run-once.yml'
      - 'research/tqqq_stage17_hierarchy_crisis_fix.py'
      - 'research/tqqq_stage16_adversarial_bear_stress.py'

permissions:
  contents: read
  actions: read

jobs:
  stage17:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Run crisis hierarchy validation
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python research/tqqq_stage17_hierarchy_crisis_fix.py 2>&1 | tee tqqq_stage17.log
      - name: Upload Stage17 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tqqq-stage17-hierarchy-crisis
          if-no-files-found: warn
          path: |
            tqqq_stage17.log
            tqqq_stage17_summary.json
            tqqq_stage17_summary.csv
            tqqq_stage17_ranked.csv
            tqqq_stage17_mc.csv
            tqqq_stage17_historical.csv
