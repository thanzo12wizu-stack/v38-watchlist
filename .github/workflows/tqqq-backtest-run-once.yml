name: TQQQ backtest run once

on:
  push:
    branches: [tqqq-backtest-once-20260826]
    paths:
      - '.github/workflows/tqqq-backtest-run-once.yml'
      - 'research/tqqq_stage21_bull_capture.py'
      - 'research/tqqq_stage17_hierarchy_crisis_fix.py'
      - 'research/tqqq_stage16_adversarial_bear_stress.py'

permissions:
  contents: read
  actions: read

jobs:
  stage21:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Run bull capture validation
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python research/tqqq_stage21_bull_capture.py 2>&1 | tee tqqq_stage21.log
      - name: Upload Stage21 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tqqq-stage21-bull-capture
          if-no-files-found: warn
          path: |
            tqqq_stage21.log
            tqqq_stage21_summary.json
            tqqq_stage21_bull_capture.csv
            tqqq_stage21_missed_up_days.csv
            tqqq_stage21_daily.csv
