name: TQQQ backtest run once

on:
  push:
    branches: [tqqq-backtest-once-20260826]
    paths:
      - '.github/workflows/tqqq-backtest-run-once.yml'
      - 'research/tqqq_stage8_attribution.py'

permissions:
  contents: read
  actions: read

jobs:
  stage8:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Run TQQQ attribution
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python research/tqqq_stage8_attribution.py 2>&1 | tee tqqq_stage8.log
      - name: Upload Stage8 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tqqq-stage8-results
          if-no-files-found: warn
          path: |
            tqqq_stage8.log
            tqqq_stage8_summary.json
            tqqq_stage8_annual.csv
            tqqq_stage8_start_year.csv
            tqqq_stage8_drawdowns.csv
            tqqq_stage8_monthly.csv
            tqqq_stage8_daily.csv
