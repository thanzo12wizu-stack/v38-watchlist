name: TQQQ backtest run once

on:
  push:
    branches: [tqqq-backtest-once-20260826]
    paths:
      - '.github/workflows/tqqq-backtest-run-once.yml'
      - 'research/tqqq_stage20_base_exposure_tradeoff.py'
      - 'research/tqqq_stage17_hierarchy_crisis_fix.py'
      - 'research/tqqq_stage16_adversarial_bear_stress.py'

permissions:
  contents: read
  actions: read

jobs:
  stage20:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Run exposure tradeoff validation
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python research/tqqq_stage20_base_exposure_tradeoff.py 2>&1 | tee tqqq_stage20.log
      - name: Upload Stage20 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tqqq-stage20-exposure-tradeoff
          if-no-files-found: warn
          path: |
            tqqq_stage20.log
            tqqq_stage20_summary.json
            tqqq_stage20_summary.csv
            tqqq_stage20_normal_mc.csv
            tqqq_stage20_adversarial_mc.csv
            tqqq_stage20_family.csv
            tqqq_stage20_historical.csv
