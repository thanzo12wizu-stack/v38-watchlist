name: TQQQ backtest run once

on:
  push:
    branches: [tqqq-backtest-once-20260826]
    paths:
      - '.github/workflows/tqqq-backtest-run-once.yml'
      - 'research/tqqq_stage2_from_grid.py'

permissions:
  contents: read
  actions: read

jobs:
  stage2:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Download completed Stage1 grid
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 32978209078 -n tqqq-backtest-results -D prev
      - name: Run MC57 and VIX Stage2
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python research/tqqq_stage2_from_grid.py 2>&1 | tee tqqq_stage2.log
      - name: Upload Stage2 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tqqq-stage2-results
          if-no-files-found: warn
          path: |
            tqqq_stage2.log
            tqqq_summary.json
            tqqq_stage2_regime.csv
            tqqq_best_position_audit.csv
            tqqq_vix_signals.csv
