name: TQQQ backtest run once

on:
  push:
    branches: [tqqq-backtest-once-20260826]
    paths:
      - '.github/workflows/tqqq-backtest-run-once.yml'
      - 'research/tqqq_stage15c_joint_state_numpy.py'

permissions:
  contents: read
  actions: read

jobs:
  stage15c:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Run NumPy joint-state Monte Carlo
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python research/tqqq_stage15c_joint_state_numpy.py 2>&1 | tee tqqq_stage15c.log
      - name: Upload Stage15c results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tqqq-stage15c-joint-state-numpy
          if-no-files-found: warn
          path: |
            tqqq_stage15c.log
            tqqq_stage15c_summary.json
            tqqq_stage15c_summary.csv
            tqqq_stage15c_mc.csv
