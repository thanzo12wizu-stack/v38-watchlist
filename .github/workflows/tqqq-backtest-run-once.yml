name: TQQQ backtest run once

on:
  push:
    branches: [tqqq-backtest-once-20260826]
    paths:
      - '.github/workflows/tqqq-backtest-run-once.yml'
      - 'research/tqqq_stage22_bull_gate_diagnostics.py'
      - 'research/tqqq_stage21_bull_capture.py'
      - 'research/tqqq_stage17_hierarchy_crisis_fix.py'
      - 'research/tqqq_stage16_adversarial_bear_stress.py'

permissions:
  contents: read
  actions: read

jobs:
  stage22:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Run bull gate diagnostics
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python research/tqqq_stage22_bull_gate_diagnostics.py 2>&1 | tee tqqq_stage22.log
      - name: Upload Stage22 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tqqq-stage22-bull-gate-diagnostics
          if-no-files-found: warn
          path: |
            tqqq_stage22.log
            tqqq_stage22_summary.json
            tqqq_stage22_bull_gate_diagnostics.csv
            tqqq_stage22_mc_threshold_diagnostic.csv
