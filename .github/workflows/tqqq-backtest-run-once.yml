name: TQQQ backtest run once

on:
  push:
    branches: [tqqq-backtest-once-20260826]
    paths:
      - '.github/workflows/tqqq-backtest-run-once.yml'
      - 'research/tqqq_stage4_nqsar_proxy.py'

permissions:
  contents: read
  actions: read

jobs:
  stage4:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Download completed Stage3 results
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 32979801442 -n tqqq-stage3-results -D prev3
      - name: Run NQSAR overlay test
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python research/tqqq_stage4_nqsar_proxy.py 2>&1 | tee tqqq_stage4.log
      - name: Upload Stage4 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tqqq-stage4-results
          if-no-files-found: warn
          path: |
            tqqq_stage4.log
            tqqq_stage4_summary.json
            tqqq_stage4_nqsar.csv
