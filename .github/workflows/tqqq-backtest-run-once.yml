name: TQQQ backtest run once

on:
  push:
    branches: [tqqq-backtest-once-20260826]
    paths:
      - '.github/workflows/tqqq-backtest-run-once.yml'
      - 'research/tqqq_stage54_implementation_readiness_audit.py'
      - 'research/tqqq_stage53_qqq_vs_tqqq_4h_rsi.py'
      - 'research/tqqq_stage52_4h_rsi_divergence_backtest.py'
      - 'research/tqqq_stage51_4h_rsi30_entry_backtest.py'
      - 'research/tqqq_stage50_vix_event_semantics_audit.py'
      - 'research/tqqq_stage49_runner_audit.py'
      - 'research/tqqq_stage48_crash_seed_lower_boundary.py'
      - 'research/tqqq_stage47_crash_seed_plateau.py'
      - 'research/tqqq_stage46_crash_seed_refinement.py'
      - 'research/tqqq_stage45_crash_to_bull_regime.py'
      - 'research/tqqq_stage44_mc_vix_conditional_throttle.py'
      - 'research/tqqq_stage43_mc57_vix_2d_optimizer.py'
      - 'research/tqqq_stage42_annual_drawdown_profile.py'
      - 'research/tqqq_stage41_vix_throttle.py'
      - 'research/tqqq_stage40_postcap_frontier.py'
      - 'research/tqqq_stage39_multilevel_ladder.py'
      - 'research/tqqq_stage38_drawdown_throttle.py'
      - 'research/tqqq_stage37_aggressive_frontier_final.py'
      - 'research/tqqq_stage36_goal_first_taxaware.py'
      - 'research/tqqq_stage35_yellow_pullback_overlay.py'
      - 'research/tqqq_stage34_final_gb_runner_validation.py'
      - 'research/tqqq_stage24_smart_bull_continuation.py'
      - 'research/tqqq_stage17_hierarchy_crisis_fix.py'
      - 'research/tqqq_stage16_adversarial_bear_stress.py'

permissions:
  contents: read
  actions: read

jobs:
  stage53:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Run QQQ vs TQQQ 4H RSI comparison
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python research/tqqq_stage53_qqq_vs_tqqq_4h_rsi.py 2>&1 | tee tqqq_stage53.log
      - name: Upload Stage53 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tqqq-stage53-qqq-vs-tqqq-rsi
          if-no-files-found: warn
          path: |
            tqqq_stage53.log
            tqqq_stage53_summary.json
            tqqq_stage53_scan.csv
            tqqq_stage53_subperiods.csv
            tqqq_stage53_costs.csv
            tqqq_stage53_mc.csv
            tqqq_stage53_mc_summary.csv
            tqqq_stage53_pairwise.csv
            tqqq_stage53_final_rank.csv

  stage54:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Run implementation readiness audit
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python research/tqqq_stage54_implementation_readiness_audit.py 2>&1 | tee tqqq_stage54.log
      - name: Upload Stage54 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tqqq-stage54-readiness-audit
          if-no-files-found: warn
          path: |
            tqqq_stage54.log
            tqqq_stage54_audit_summary.json
            tqqq_stage54_mc57_coverage.csv
