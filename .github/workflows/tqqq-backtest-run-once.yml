name: TQQQ backtest run once

on:
  push:
    branches: [tqqq-backtest-once-20260826]
    paths:
      - '.github/workflows/tqqq-backtest-run-once.yml'
      - 'research/tqqq_stage35_yellow_pullback_overlay.py'
      - 'research/tqqq_stage34_final_gb_runner_validation.py'
      - 'research/tqqq_stage24_smart_bull_continuation.py'
      - 'research/tqqq_stage17_hierarchy_crisis_fix.py'
      - 'research/tqqq_stage16_adversarial_bear_stress.py'

permissions:
  contents: read
  actions: read

jobs:
  stage35:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Run Yellow pullback overlay validation
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python research/tqqq_stage35_yellow_pullback_overlay.py 2>&1 | tee tqqq_stage35.log
      - name: Upload Stage35 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tqqq-stage35-yellow-pullback
          if-no-files-found: warn
          path: |
            tqqq_stage35.log
            tqqq_stage35_summary.json
            tqqq_stage35_historical.csv
            tqqq_stage35_walkforward.csv
            tqqq_stage35_annual.csv
            tqqq_stage35_costs.csv
            tqqq_stage35_normal_mc.csv
            tqqq_stage35_bear_mc.csv
            tqqq_stage35_mc_summary.csv
