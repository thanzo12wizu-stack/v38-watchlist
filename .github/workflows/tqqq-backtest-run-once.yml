name: TQQQ backtest run once

on:
  push:
    branches: [tqqq-backtest-once-20260826]
    paths:
      - '.github/workflows/tqqq-backtest-run-once.yml'
      - 'research/tqqq_stage11_anchor_robust.py'
      - 'research/tqqq_stage11_integrated_nqsar.py'

permissions:
  contents: read
  actions: read

jobs:
  stage11:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Run anchor robustness integrated NQSAR study
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python research/tqqq_stage11_anchor_robust.py 2>&1 | tee tqqq_stage11.log
      - name: Upload Stage11 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tqqq-stage11-integrated-nqsar-anchor
          if-no-files-found: warn
          path: |
            tqqq_stage11.log
            tqqq_stage11_summary.json
            tqqq_stage11_base_grid.csv
            tqqq_stage11_integrated_grid.csv
            tqqq_stage11_robust.csv
