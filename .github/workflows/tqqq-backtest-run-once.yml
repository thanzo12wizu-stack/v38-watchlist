name: TQQQ backtest run once

on:
  push:
    branches: [tqqq-backtest-once-20260826]
    paths:
      - '.github/workflows/tqqq-backtest-run-once.yml'
      - 'research/tqqq_stage25_blue_floor.py'
      - 'research/tqqq_stage23_bull_floor_screen.py'
      - 'research/tqqq_stage17_hierarchy_crisis_fix.py'
      - 'research/tqqq_stage16_adversarial_bear_stress.py'

permissions:
  contents: read
  actions: read

jobs:
  stage25:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Run NQSAR Blue floor screen
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python research/tqqq_stage25_blue_floor.py 2>&1 | tee tqqq_stage25.log
      - name: Upload Stage25 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tqqq-stage25-blue-floor
          if-no-files-found: warn
          path: |
            tqqq_stage25.log
            tqqq_stage25_summary.json
            tqqq_stage25_screen.csv
            tqqq_stage25_bull_capture.csv
