name: TQQQ backtest run once

on:
  push:
    branches: [tqqq-backtest-once-20260826]
    paths:
      - '.github/workflows/tqqq-backtest-run-once.yml'
      - 'research/tqqq_stage19_final_candidate_mc.py'
      - 'research/tqqq_stage17_hierarchy_crisis_fix.py'
      - 'research/tqqq_stage16_adversarial_bear_stress.py'

permissions:
  contents: read
  actions: read

jobs:
  stage19:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Run final candidate normal Monte Carlo
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python research/tqqq_stage19_final_candidate_mc.py 2>&1 | tee tqqq_stage19.log
      - name: Upload Stage19 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tqqq-stage19-final-candidate-mc
          if-no-files-found: warn
          path: |
            tqqq_stage19.log
            tqqq_stage19_summary.json
            tqqq_stage19_summary.csv
            tqqq_stage19_mc.csv
            tqqq_stage19_historical.csv
