name: TQQQ backtest run once

on:
  push:
    branches: [tqqq-backtest-once-20260826]
    paths:
      - '.github/workflows/tqqq-backtest-run-once.yml'
      - 'research/tqqq_stage10_nqsar_partial_profit.py'

permissions:
  contents: read
  actions: read

jobs:
  stage10:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Run NQSAR partial profit study
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python research/tqqq_stage10_nqsar_partial_profit.py 2>&1 | tee tqqq_stage10.log
      - name: Upload Stage10 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tqqq-stage10-nqsar-partial-profit
          if-no-files-found: warn
          path: |
            tqqq_stage10.log
            tqqq_stage10_summary.json
            tqqq_stage10_signals.csv
            tqqq_stage10_partial_grid.csv
            tqqq_stage10_portfolio_grid.csv
            tqqq_stage10_robust.csv
