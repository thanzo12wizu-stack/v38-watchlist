name: TQQQ backtest run once

on:
  push:
    branches: [tqqq-backtest-once-20260826]
    paths:
      - '.github/workflows/tqqq-backtest-run-once.yml'
      - 'research/tqqq_stage15_joint_state_mc.py'

permissions:
  contents: read
  actions: read

jobs:
  stage15:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Run joint-state synthetic market Monte Carlo
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python research/tqqq_stage15_joint_state_mc.py 2>&1 | tee tqqq_stage15.log
      - name: Upload Stage15 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tqqq-stage15-joint-state-mc
          if-no-files-found: warn
          path: |
            tqqq_stage15.log
            tqqq_stage15_summary.json
            tqqq_stage15_summary.csv
            tqqq_stage15_joint_state_mc.csv
