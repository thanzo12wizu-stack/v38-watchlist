name: Ordinary Stock Rate Entry Gates

on:
  workflow_dispatch:
  push:
    branches: [research/rate-regime-audit-20260902]
    paths:
      - leadership/research/audit_ordinary_stock_rate_entry_gates.py
      - .github/workflows/ordinary-stock-rate-entry-gates.yml

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy yfinance
      - name: Download frozen audited inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p inputs/{rates,full,gross}
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/9845484500/zip > /tmp/rates.zip
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/9848757773/zip > /tmp/full.zip
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/9739833328/zip > /tmp/gross.zip
          unzip -q /tmp/rates.zip -d inputs/rates
          unzip -q /tmp/full.zip -d inputs/full
          unzip -q /tmp/gross.zip -d inputs/gross
          test -s inputs/rates/rate_features.csv.gz
          test -s inputs/full/policy_target_history.csv
          test -s inputs/gross/ordinary_PEAK30_PART25_R3_daily.csv.gz
      - name: Syntax check
        run: PYTHONPATH=.:leadership/research python -m py_compile leadership/research/audit_ordinary_stock_rate_entry_gates.py
      - name: Run exact current-rule entry-gate audit
        run: |
          set -euo pipefail
          PYTHONPATH=.:leadership/research python leadership/research/audit_ordinary_stock_rate_entry_gates.py \
            --root . \
            --rates inputs/rates/rate_features.csv.gz \
            --policy inputs/full/policy_target_history.csv \
            --frozen-baseline inputs/gross/ordinary_PEAK30_PART25_R3_daily.csv.gz \
            --output leadership/research/out/ordinary_rate_entry_gates \
            --analysis-start 2016-01-04 \
            --analysis-end 2026-03-20
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ordinary-stock-rate-entry-gates
          path: leadership/research/out/ordinary_rate_entry_gates/
          if-no-files-found: warn
          retention-days: 14
