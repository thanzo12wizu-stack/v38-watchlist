name: One-off cancel stale dashboard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel-stale-dashboard-once.yml'

permissions:
  actions: write
  contents: write

jobs:
  cancel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Cancel stale dashboard run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run cancel 32822088772 --repo thanzo12wizu-stack/v38-watchlist

      - name: Remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main
          git rm .github/workflows/cancel-stale-dashboard-once.yml
          git commit -m "Remove one-off stale dashboard canceller"
          git push origin HEAD:main
