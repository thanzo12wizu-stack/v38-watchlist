name: Universe security audit

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/universe-security-audit.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply-final:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply final patch
        shell: bash
        run: |
          set -euo pipefail
          python scripts/finalize_dashboard_patch.py
          python -m py_compile build_dashboard.py
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build_dashboard.py .github/workflows/dashboard.yml
          if git diff --staged --quiet; then
            echo "Final patch already applied"
            exit 0
          fi
          git commit -m "Include DR listings and finalize dashboard guards"
          git push origin HEAD:main
