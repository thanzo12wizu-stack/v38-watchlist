name: Universe security audit

on:
  workflow_run:
    workflows:
      - Dashboard daily build
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - 'scripts/audit_universe_security.py'
      - '.github/workflows/universe-security-audit.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: universe-security-audit-main
  cancel-in-progress: true

jobs:
  audit:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Audit security types and duplicate share classes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_universe_security.py
          python scripts/probe_tv_symbols.py

      - name: Commit diagnostic only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add universe_security_audit.json tv_symbol_probe.json
          if git diff --staged --quiet; then
            echo "Universe security diagnostic already current"
            exit 0
          fi
          session_date="$(python -c 'import json; print(json.load(open("state.json"))["date"])')"
          git commit -m "Universe security diagnostic ${session_date}"
          git push origin HEAD:main
