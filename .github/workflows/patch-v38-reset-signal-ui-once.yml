name: Patch V38 Reset signal UI once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-v38-reset-signal-ui-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - name: Patch audited V38 HTML only
        run: python scripts/patch_v38_reset_signal_ui_once.py
      - name: Validate and commit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="resetSignalRows"' command-center-v38.html
          grep -q 'RSI30接近候補（まだ買わない）' command-center-v38.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add command-center-v38.html
          git diff --cached --check
          git commit -m "Separate formal RSI Reset signals from watchlist"
          git push origin HEAD:main
