name: Patch Options card scroll once
# trigger 2026-09-06

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-options-card-scroll-once.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - name: Keep card tap scroll position
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('options-intelligence.js')
          s = p.read_text(encoding='utf-8')
          old = "function bind(root) { for (const e of root.querySelectorAll('[data-ticker]')) e.addEventListener('click', () => selectTicker(e.dataset.ticker, true)); }"
          new = "function bind(root) { for (const e of root.querySelectorAll('[data-ticker]')) e.addEventListener('click', () => selectTicker(e.dataset.ticker, false)); }"
          if s.count(old) != 1:
              raise SystemExit(f'card bind anchor count={s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('options-intelligence.html')
          h = p.read_text(encoding='utf-8')
          oldv = './options-intelligence.js?v=20260906-dashboardrs12'
          newv = './options-intelligence.js?v=20260906-cardscroll1'
          if h.count(oldv) != 1:
              raise SystemExit(f'cache anchor count={h.count(oldv)}')
          h = h.replace(oldv, newv, 1)
          p.write_text(h, encoding='utf-8')
          PY
          node --check options-intelligence.js
          git diff --check
          grep -F "function bind(root) { for (const e of root.querySelectorAll('[data-ticker]')) e.addEventListener('click', () => selectTicker(e.dataset.ticker, false)); }" options-intelligence.js
          grep -F './options-intelligence.js?v=20260906-cardscroll1' options-intelligence.html
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- options-intelligence.js options-intelligence.html
          unexpected="$(git diff --cached --name-only | grep -Ev '^(options-intelligence\.js|options-intelligence\.html)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "unexpected staged file: $unexpected"
            exit 1
          fi
          git commit -m 'Keep scroll position on Options card tap'
          git push origin HEAD:main