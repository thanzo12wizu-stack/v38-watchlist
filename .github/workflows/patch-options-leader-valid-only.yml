name: Patch Options leaders to valid-only

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-options-leader-valid-only.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - name: Filter leader cards to usable Options only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          js = Path('options-intelligence.js')
          s = js.read_text()

          old = ".filter(x => x.metricValue !== null)\n    .sort((a, b) => b.metricValue - a.metricValue"
          new = ".filter(x => x.metricValue !== null && isUsable(x.o))\n    .sort((a, b) => b.metricValue - a.metricValue"
          if old not in s:
              raise SystemExit('missing buildLeaderRows filter anchor')
          s = s.replace(old, new, 1)

          old = "$('#leaders').innerHTML = a.length ? a.map(x => miniCard(x.t, x.o, x.l, x.metricValue.toFixed(1))).join('') : `<div class=\"empty\">${metric.label} Leadershipデータなし。</div>`;"
          new = "$('#leaders').innerHTML = a.length ? a.map(x => miniCard(x.t, x.o, x.l, x.metricValue.toFixed(1))).join('') : `<div class=\"empty\">この期間で有効Optionsを持つ${metric.label}リーダーなし。</div>`;"
          if old not in s:
              raise SystemExit('missing leaders empty-state anchor')
          s = s.replace(old, new, 1)
          js.write_text(s)

          html = Path('options-intelligence.html')
          h = html.read_text()
          old = '<div class="sectionHead"><div><span class="eyebrow">TODAY\'S LEADERS</span><h2>見るべきリーダー</h2></div><p>短期=RS21 / スイング=RS63 / 中期=RS189。Optionsと同じ期間タブで同期。</p></div>'
          new = '<div class="sectionHead"><div><span class="eyebrow">TODAY\'S LEADERS</span><h2>見るべきリーダー</h2></div><p>期間別RS上位のうち、選択期間で有効Optionsがある銘柄だけ表示。</p></div>'
          if old not in h:
              raise SystemExit('missing leaders copy anchor')
          h = h.replace(old, new, 1)
          if 'options-intelligence.js?v=20260906-rsperiod1' not in h:
              raise SystemExit('missing JS cache anchor')
          h = h.replace('options-intelligence.js?v=20260906-rsperiod1', 'options-intelligence.js?v=20260906-rsperiod2', 1)
          html.write_text(h)
          PY
          node --check options-intelligence.js
          git diff --check
      - name: Commit valid-only leader UI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- options-intelligence.js options-intelligence.html
          git diff --staged --stat
          git commit -m "Show only option-valid RS leaders"
          git push origin HEAD:main
