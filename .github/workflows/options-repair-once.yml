name: Options repair once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/options-repair-once.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

concurrency:
  group: options-repair-once
  cancel-in-progress: false

env:
  REPO: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Lock same-session upstream
        id: target
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          git reset --hard origin/main
          target="$(python - <<'PY'
          import json
          print(str(json.load(open('state.json', encoding='utf-8')).get('date') or ''))
          PY
          )"
          [[ -n "$target" ]] || { echo '::error::state.json has no date'; exit 1; }
          python tools/validate_options_release.py --mode upstream --expected-session "$target"
          echo "session=$target" >> "$GITHUB_OUTPUT"
          echo "OPTIONS_REPAIR_TARGET=$target"

      - name: Refresh Options with bounded retries
        shell: bash
        env:
          TARGET_SESSION: ${{ steps.target.outputs.session }}
        run: |
          set -euo pipefail
          success=false

          for repair_attempt in 1 2 3; do
            before="$(gh run list --repo "$REPO" --workflow options.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            gh workflow run options.yml --repo "$REPO" --ref main -f expected_session="$TARGET_SESSION"

            run_id=''
            for poll in $(seq 1 40); do
              candidate="$(gh run list --repo "$REPO" --workflow options.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
              if [[ "$candidate" != '0' && "$candidate" != "$before" ]]; then
                run_id="$candidate"
                break
              fi
              sleep 3
            done

            if [[ -z "$run_id" ]]; then
              echo "::warning::Could not resolve Options run on repair attempt $repair_attempt"
            else
              echo "Options repair attempt=$repair_attempt run_id=$run_id target=$TARGET_SESSION"
              if gh run watch "$run_id" --repo "$REPO" --exit-status --interval 10; then
                success=true
                break
              fi
              echo "::warning::Options run failed on repair attempt $repair_attempt"
            fi

            if [[ "$repair_attempt" -lt 3 ]]; then
              sleep $((repair_attempt * 120))
            fi
          done

          [[ "$success" == true ]] || { echo '::error::Options repair failed after 3 attempts'; exit 1; }

      - name: Verify published same-session Options release
        shell: bash
        env:
          TARGET_SESSION: ${{ steps.target.outputs.session }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          git reset --hard origin/main
          python tools/validate_options_release.py --mode release --expected-session "$TARGET_SESSION"
          python - <<'PY'
          import json, os
          from pathlib import Path
          target=os.environ['TARGET_SESSION']
          state=json.loads(Path('state.json').read_text(encoding='utf-8'))
          pos=json.loads(Path('options_positioning.json').read_text(encoding='utf-8'))
          daily=json.loads(Path('options_daily_liquid_status.json').read_text(encoding='utf-8'))
          intel=json.loads(Path('options_intelligence.json').read_text(encoding='utf-8'))
          dates={
              'state': str(state.get('date') or ''),
              'positioning': str(pos.get('session_date') or ''),
              'daily_liquid': str(daily.get('session_date') or ''),
              'intelligence': str(intel.get('session_date') or ''),
          }
          if any(v != target for v in dates.values()):
              raise SystemExit(f'final Options session mismatch: target={target} dates={dates}')
          print('OPTIONS_REPAIR_READY', dates)
          PY
