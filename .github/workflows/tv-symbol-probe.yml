name: TV symbol probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tv-symbol-probe.yml'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe scanner
        run: python scripts/probe_tv_symbols.py
      - name: Commit probe
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tv_symbol_probe.json
          git commit -m "TradingView symbol probe" || exit 0
          git push origin HEAD:main
