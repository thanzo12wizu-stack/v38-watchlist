name: TV symbol probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tv-symbol-probe.yml'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply final patch
        shell: bash
        run: |
          set +e
          python scripts/finalize_dashboard_patch.py > final_patch_diagnostic.txt 2>&1
          rc=$?
          echo "patch_rc=$rc" >> final_patch_diagnostic.txt
          if [[ $rc -eq 0 ]]; then
            python -m py_compile build_dashboard.py >> final_patch_diagnostic.txt 2>&1
            echo "pycompile_rc=$?" >> final_patch_diagnostic.txt
            git diff --check >> final_patch_diagnostic.txt 2>&1
            echo "diffcheck_rc=$?" >> final_patch_diagnostic.txt
          fi
          cat final_patch_diagnostic.txt
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add final_patch_diagnostic.txt
          if grep -q '^patch_rc=0$' final_patch_diagnostic.txt && grep -q '^pycompile_rc=0$' final_patch_diagnostic.txt; then
            git add build_dashboard.py .github/workflows/dashboard.yml
            git commit -m "Include DR listings and finalize dashboard guards"
          else
            git commit -m "Capture final patch diagnostic"
          fi
          git push origin HEAD:main
