name: True shallow good-market audit

on:
  workflow_dispatch:
  push:
    branches:
      - research/vix-rsi-rulebook-20260828
    paths:
      - leadership/research/audit_true_shallow_good_market.py
      - .github/workflows/true-shallow-good-market-audit.yml

permissions:
  contents: read

concurrency:
  group: true-shallow-good-market-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/vix-rsi-rulebook-20260828
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Syntax check
        run: python -m py_compile leadership/research/audit_true_shallow_good_market.py
      - name: Run true shallow audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/true_shallow_good_market/results
          PYTHONPATH=.:leadership/research python leadership/research/audit_true_shallow_good_market.py \
            --root . \
            --output research/true_shallow_good_market/results \
            --asof 2026-08-28 \
            --start 2016-01-04 \
            --end 2026-06-30 | tee research/true_shallow_good_market/run.log
      - name: Verify outputs
        run: |
          test -s research/true_shallow_good_market/results/summary.json
          test -s research/true_shallow_good_market/results/event_summary.csv
          test -s research/true_shallow_good_market/results/paired_vs_now.csv
          test -s research/true_shallow_good_market/results/runner_coverage.csv
          test -s research/true_shallow_good_market/results/year_summary.csv
          test -s research/true_shallow_good_market/results/trade_rows.csv.gz
          test -s research/true_shallow_good_market/results/episodes.csv.gz
      - name: Upload audit package
        uses: actions/upload-artifact@v4
        with:
          name: true-shallow-good-market-audit
          path: |
            research/true_shallow_good_market/results
            research/true_shallow_good_market/run.log
          if-no-files-found: error
          retention-days: 30
