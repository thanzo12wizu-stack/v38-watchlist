name: Rate Rotation ETF Audit

on:
  workflow_dispatch:
  push:
    branches:
      - research/rate-regime-audit-20260902
    paths:
      - leadership/research/audit_rate_rotation_etfs.py
      - .github/workflows/rate-rotation-etf-audit.yml

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy yfinance
      - name: Syntax check
        run: python -m py_compile leadership/research/audit_rate_rotation_etfs.py
      - name: Download frozen rate features
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p inputs/rates
          gh run download 33627699450 -R "$GITHUB_REPOSITORY" -n rate-regime-audit -D inputs/rates
          test -s inputs/rates/rate_features.csv.gz
      - name: Run holdout rotation audit
        run: |
          set -euo pipefail
          python leadership/research/audit_rate_rotation_etfs.py \
            --rates inputs/rates/rate_features.csv.gz \
            --output leadership/research/out/rate_rotation_etfs \
            --start 2016-01-04 \
            --end 2026-03-21
      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rate-rotation-etf-audit
          path: leadership/research/out/rate_rotation_etfs/
          if-no-files-found: warn
          retention-days: 14
