name: Leadership Command isolated build

on:
  pull_request:
    paths:
      - 'leadership/**'
      - '.github/workflows/leadership-command.yml'
  push:
    branches:
      - main
    paths:
      - 'leadership/**'
      - '.github/workflows/leadership-command.yml'
  schedule:
    # Existing dashboard runs independently at UTC 22:17 and 04:17.
    # Run later, but do not depend on, cancel, write to, or import that flow.
    - cron: '10 23 * * 1-5'
    - cron: '10 5 * * 2-6'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: leadership-command-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Unit tests
        run: python -m unittest discover -s leadership/tests -p 'test_*.py' -v

      - name: Build Leadership Command
        run: python leadership/build_leadership.py --root . --output leadership/dist

      - name: Show source-adapter coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('leadership/dist/diagnostics.json').read_text())
          print(json.dumps({
            'top_level_keys': d.get('top_level_keys'),
            'symbols_extracted': d.get('symbols_extracted'),
            'sample_metric_keys': d.get('sample_metric_keys'),
            'coverage': d.get('coverage'),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: leadership-command-preview
          path: leadership/dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      LEADERSHIP_PUBLIC_REPOSITORY: ${{ vars.LEADERSHIP_PUBLIC_REPOSITORY }}
      LEADERSHIP_PUBLIC_TOKEN: ${{ secrets.LEADERSHIP_PUBLIC_TOKEN }}
    steps:
      - name: Check isolated public target
        id: config
        shell: bash
        run: |
          if [[ -z "${LEADERSHIP_PUBLIC_REPOSITORY:-}" || -z "${LEADERSHIP_PUBLIC_TOKEN:-}" ]]; then
            echo '::notice::Dedicated Leadership public repository is not configured; existing site is untouched.'
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          elif [[ ! "$LEADERSHIP_PUBLIC_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo 'Invalid LEADERSHIP_PUBLIC_REPOSITORY'
            exit 1
          else
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.config.outputs.enabled == 'true'
        with:
          name: leadership-command-preview
          path: /tmp/leadership-site

      - name: Publish only to dedicated repository
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          target=/tmp/leadership-pages
          git clone --depth 1 "https://x-access-token:${LEADERSHIP_PUBLIC_TOKEN}@github.com/${LEADERSHIP_PUBLIC_REPOSITORY}.git" "$target"
          find "$target" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/leadership-site/. "$target/"
          touch "$target/.nojekyll"
          cd "$target"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --staged --quiet; then
            echo 'Leadership public site already current'
            exit 0
          fi
          git commit -m 'Publish Leadership Command'
          git push origin HEAD:main
