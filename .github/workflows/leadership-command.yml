name: Leadership Command isolated build

on:
  pull_request:
    paths:
      - 'leadership/**'
      - '.github/workflows/leadership-command.yml'

permissions:
  contents: read

concurrency:
  group: leadership-command-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install isolated Leadership dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy yfinance

      - name: Unit tests
        run: python -m unittest discover -s leadership/tests -p 'test_*.py' -v

      - name: Build full independent market snapshot
        run: |
          python leadership/build_market_snapshot.py \
            --universe universe.csv \
            --output leadership/market_snapshot.json \
            --benchmark QQQ \
            --period 15mo \
            --batch-size 80 \
            --max-symbols 0

      - name: Build exact-universe Leadership Command
        run: python leadership/build_leadership_exact.py --root . --output leadership/dist

      - name: Validate exact full universe end-to-end
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          from pathlib import Path

          snap=json.loads(Path('leadership/market_snapshot.json').read_text())
          diag=json.loads(Path('leadership/dist/diagnostics.json').read_text())
          cov=diag.get('coverage', {})
          symbols=[]
          seen=set()
          with Path('universe.csv').open('r', encoding='utf-8-sig', newline='') as f:
              for row in csv.DictReader(f):
                  sym=str(row.get('シンボル') or row.get('symbol') or row.get('Symbol') or '').strip().upper()
                  if sym and sym not in seen:
                      seen.add(sym)
                      symbols.append(sym)
          expected_fingerprint=hashlib.sha256('\n'.join(symbols).encode('utf-8')).hexdigest()
          expected_requested=len(symbols) - (1 if 'QQQ' in seen else 0)
          report={
            'source_total': len(symbols),
            'snapshot_source_total': snap.get('universe_source_total'),
            'download_requested': snap.get('universe_requested'),
            'valid_market_data': snap.get('universe_valid'),
            'rendered_model_stocks': cov.get('stocks'),
            'universe_exact': cov.get('universe_exact'),
            'no_data_retained': cov.get('no_data'),
            'rs21': cov.get('rs21'),
            'rs63': cov.get('rs63'),
            'rs189': cov.get('rs189'),
            'entry_inputs': cov.get('entry_inputs'),
            'fingerprint_match': snap.get('universe_fingerprint') == expected_fingerprint,
            'metric_source': cov.get('metric_source'),
          }
          print(json.dumps(report, ensure_ascii=False, indent=2))
          if snap.get('universe_fingerprint') != expected_fingerprint:
              raise SystemExit('Universe fingerprint mismatch')
          if int(snap.get('universe_source_total') or -1) != len(symbols):
              raise SystemExit('Snapshot source universe count mismatch')
          if int(snap.get('universe_requested') or -1) != expected_requested:
              raise SystemExit('Full source universe was not requested')
          if int(cov.get('stocks') or -1) != len(symbols):
              raise SystemExit('Rendered model dropped source symbols')
          if cov.get('universe_exact') is not True:
              raise SystemExit('Rendered model is not exact-universe mode')
          if cov.get('metric_source') != 'leadership/market_snapshot.json':
              raise SystemExit('Independent market snapshot not used')
          if int(cov.get('rs63') or 0) < 3000:
              raise SystemExit('RS63 full-universe coverage unexpectedly low')
          if int(cov.get('entry_inputs') or 0) < 3000:
              raise SystemExit('Entry full-universe coverage unexpectedly low')
          PY

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: leadership-command-preview
          path: leadership/dist/
          if-no-files-found: error
          retention-days: 7
