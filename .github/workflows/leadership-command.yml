name: Leadership Command isolated build

on:
  pull_request:
    paths:
      - 'leadership/**'
      - 'scripts/export_public_site.py'
      - 'scripts/privacy_audit.py'
      - 'tests/test_public_site_export.py'
      - 'tests/test_privacy_audit.py'
      - '.github/workflows/leadership-command.yml'
  push:
    branches:
      - main
    # Generated public HTML / LOO state are intentionally excluded so the
    # persistence commit below cannot recursively trigger another full build.
    paths:
      - 'leadership/build_market_snapshot.py'
      - 'leadership/build_market_snapshot_diffusion.py'
      - 'leadership/loo_theme_live.py'
      - 'leadership/diffusion.py'
      - 'leadership/diffusion_overlay.py'
      - 'leadership/rotation_diffusion.py'
      - 'leadership/render_public_diffusion.py'
      - 'leadership/build_leadership.py'
      - 'leadership/build_leadership_exact.py'
      - 'leadership/render_japanese.py'
      - 'leadership/render_public.py'
      - 'leadership/tests/**'
      - '.github/workflows/leadership-command.yml'
  schedule:
    # Existing dashboard runs independently at UTC 22:17 and 04:17.
    # Leadership starts later but has no writeback to the legacy dashboard.
    - cron: '10 23 * * 1-5'
    - cron: '10 5 * * 2-6'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: leadership-command-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install isolated Leadership dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy yfinance pytest

      - name: Unit tests
        run: |
          python -m unittest discover -s leadership/tests -p 'test_*.py' -v
          pytest -q tests/test_public_site_export.py tests/test_privacy_audit.py

      - name: Build independent market snapshot
        shell: bash
        run: |
          set -euo pipefail
          MAX_SYMBOLS=0
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # PR limits Yahoo downloads only. The rendered model still keeps
            # every symbol in the complete source universe as data or NO_DATA.
            # LOO output is therefore explicitly PARTIAL_SMOKE_ONLY on PRs.
            MAX_SYMBOLS=400
          fi
          python leadership/build_market_snapshot_diffusion.py \
            --universe universe.csv \
            --output leadership/market_snapshot.json \
            --sector-snapshot sector_snapshot.json \
            --loo-output loo-theme-live.json \
            --benchmark QQQ \
            --period 15mo \
            --batch-size 80 \
            --max-symbols "$MAX_SYMBOLS"

      - name: Build Leadership Command
        run: |
          python leadership/build_leadership_exact.py --root . --output leadership/dist
          python leadership/render_public_diffusion.py \
            --model leadership/dist/leadership.json \
            --output leadership/dist/index.html

      - name: Validate universe parity and live coverage
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          import os
          from pathlib import Path

          snap=json.loads(Path('leadership/market_snapshot.json').read_text())
          loo=json.loads(Path('loo-theme-live.json').read_text())
          diag=json.loads(Path('leadership/dist/diagnostics.json').read_text())
          cov=diag.get('coverage', {})

          symbols=[]
          seen=set()
          with Path('universe.csv').open('r', encoding='utf-8-sig', newline='') as f:
              for row in csv.DictReader(f):
                  sym=str(row.get('シンボル') or row.get('symbol') or row.get('Symbol') or '').strip().upper()
                  if sym and sym not in seen:
                      seen.add(sym)
                      symbols.append(sym)
          expected_fingerprint=hashlib.sha256('\n'.join(symbols).encode('utf-8')).hexdigest()

          report={
            'snapshot_asof': snap.get('asof'),
            'source_universe_rows': len(symbols),
            'snapshot_source_total': snap.get('universe_source_total'),
            'rendered_model_stocks': cov.get('stocks'),
            'rendered_universe_exact': cov.get('universe_exact'),
            'no_data_retained': cov.get('no_data'),
            'universe_fingerprint_match': snap.get('universe_fingerprint') == expected_fingerprint,
            'download_requested': snap.get('universe_requested'),
            'valid_market_data': snap.get('universe_valid'),
            'metric_source': cov.get('metric_source'),
            'rs63': cov.get('rs63'),
            'entry_inputs': cov.get('entry_inputs'),
            'confidence': cov.get('confidence'),
            'loo_status': loo.get('status'),
            'loo_asof': loo.get('asof'),
            'loo_taxonomy': loo.get('taxonomy'),
            'loo_coverage': loo.get('coverage'),
          }
          print(json.dumps(report, ensure_ascii=False, indent=2))

          if snap.get('universe_policy') != 'exact source universe; no Leadership-only symbol filter':
              raise SystemExit('Leadership universe policy is not exact-source mode')
          if int(snap.get('universe_source_total') or -1) != len(symbols):
              raise SystemExit('Leadership source universe count differs from universe.csv')
          if snap.get('universe_fingerprint') != expected_fingerprint:
              raise SystemExit('Leadership source universe symbols/order differ from universe.csv')
          if int(cov.get('stocks') or -1) != len(symbols):
              raise SystemExit('Rendered Leadership model dropped source-universe symbols')
          if cov.get('universe_exact') is not True:
              raise SystemExit('Rendered Leadership model is not exact-universe mode')
          if cov.get('metric_source') != 'leadership/market_snapshot.json':
              raise SystemExit('Leadership builder did not use its independent market snapshot')
          if int(cov.get('rs63') or 0) < 30:
              raise SystemExit('Insufficient RS coverage')
          if int(cov.get('entry_inputs') or 0) < 30:
              raise SystemExit('Insufficient entry-metric coverage')
          if loo.get('schema') != 'v38-loo-theme-live-1':
              raise SystemExit('Invalid LOO Theme schema')
          event=os.environ.get('GITHUB_EVENT_NAME','')
          expected='PARTIAL_SMOKE_ONLY' if event == 'pull_request' else 'LIVE_CURRENT_TAXONOMY'
          if loo.get('status') != expected:
              raise SystemExit(f"LOO Theme status {loo.get('status')} != {expected}")
          if loo.get('asof') != snap.get('asof'):
              raise SystemExit(f"LOO Theme asof mismatch: {loo.get('asof')} != {snap.get('asof')}")
          if loo.get('taxonomy') != 'CURRENT_S2T_NOT_PIT':
              raise SystemExit('LOO Theme taxonomy caveat missing')
          PY

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: leadership-command-preview
          path: |
            leadership/dist/
            loo-theme-live.json
          if-no-files-found: error
          retention-days: 7

      - name: Persist public Leadership entrypoint and audited LOO state
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          generated=/tmp/leadership-index.html
          loo_generated=/tmp/loo-theme-live.json
          cp leadership/dist/index.html "$generated"
          cp loo-theme-live.json "$loo_generated"
          python - <<'PY'
          import json
          x=json.load(open('/tmp/loo-theme-live.json', encoding='utf-8'))
          if x.get('status') != 'LIVE_CURRENT_TAXONOMY':
              raise SystemExit('Refuse to persist incomplete LOO Theme state')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            git fetch --depth=1 origin main
            git reset --hard origin/main
            mkdir -p leadership/dist leadership
            cp "$generated" leadership/dist/index.html
            cp "$generated" leadership/index.html
            cp "$loo_generated" loo-theme-live.json
            git add -f leadership/dist/index.html leadership/index.html loo-theme-live.json

            if git diff --staged --quiet; then
              echo 'Persisted Leadership entrypoints and LOO state already current'
              exit 0
            fi

            git commit -m 'Update Leadership public entrypoint and LOO Theme state'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "::warning::Leadership persistence push raced with main; retry $attempt/3"
            sleep $((attempt * 2))
          done

          echo 'Leadership persistence failed after retries'
          exit 1

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PUBLIC_REPOSITORY: ${{ vars.V38_PUBLIC_PAGES_REPOSITORY }}
      PUBLIC_TOKEN: ${{ secrets.V38_PUBLIC_PAGES_TOKEN }}
    steps:
      - name: Check existing public mirror target
        id: config
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PUBLIC_REPOSITORY:-}" || -z "${PUBLIC_TOKEN:-}" ]]; then
            echo 'Existing V38 public Pages mirror is not configured'
            exit 1
          fi
          if [[ ! "$PUBLIC_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo 'Invalid V38_PUBLIC_PAGES_REPOSITORY'
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: leadership-command-preview
          path: /tmp/leadership-site

      - name: Publish only /leadership to existing Pages repository
        shell: bash
        run: |
          set -euo pipefail
          generated=/tmp/leadership-site/index.html
          test -s "$generated"

          for attempt in 1 2 3; do
            target="/tmp/v38-leadership-pages-$attempt"
            rm -rf "$target"
            git clone --depth 1 \
              "https://x-access-token:${PUBLIC_TOKEN}@github.com/${PUBLIC_REPOSITORY}.git" \
              "$target"

            rm -rf "$target/leadership"
            mkdir -p "$target/leadership"
            cp "$generated" "$target/leadership/index.html"

            cd "$target"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A -- leadership

            if git diff --staged --quiet; then
              echo 'Public /leadership already current'
              exit 0
            fi

            git commit -m 'Publish Leadership Command'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "::warning::Public mirror changed concurrently; retry $attempt/3"
            sleep $((attempt * 2))
          done

          echo 'Leadership public publish failed after retries'
          exit 1
