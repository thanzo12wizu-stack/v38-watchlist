name: Leadership Command isolated build

on:
  pull_request:
    paths:
      - 'leadership/**'
      - '.github/workflows/leadership-command.yml'
  push:
    branches:
      - main
    paths:
      - 'leadership/**'
      - '.github/workflows/leadership-command.yml'
  schedule:
    - cron: '10 23 * * 1-5'
    - cron: '10 5 * * 2-6'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: leadership-command-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install isolated Leadership dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy yfinance

      - name: Unit tests
        run: python -m unittest discover -s leadership/tests -p 'test_*.py' -v

      - name: Build full independent market snapshot
        run: |
          python leadership/build_market_snapshot.py \
            --universe universe.csv \
            --output leadership/market_snapshot.json \
            --benchmark QQQ \
            --period 15mo \
            --batch-size 80 \
            --max-symbols 0

      - name: Build Leadership Command
        run: python leadership/build_leadership.py --root . --output leadership/dist

      - name: Validate exact full-universe run
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          from pathlib import Path

          snap=json.loads(Path('leadership/market_snapshot.json').read_text())
          diag=json.loads(Path('leadership/dist/diagnostics.json').read_text())
          cov=diag.get('coverage', {})
          symbols=[]
          seen=set()
          with Path('universe.csv').open('r', encoding='utf-8-sig', newline='') as f:
              for row in csv.DictReader(f):
                  sym=str(row.get('シンボル') or row.get('symbol') or row.get('Symbol') or '').strip().upper()
                  if sym and sym not in seen:
                      seen.add(sym)
                      symbols.append(sym)
          expected_fingerprint=hashlib.sha256('\n'.join(symbols).encode('utf-8')).hexdigest()
          expected_requested=len(symbols) - (1 if 'QQQ' in seen else 0)
          report={
            'source_total': len(symbols),
            'requested': snap.get('universe_requested'),
            'valid_market_data': snap.get('universe_valid'),
            'rs21': cov.get('rs21'),
            'rs63': cov.get('rs63'),
            'rs189': cov.get('rs189'),
            'entry_inputs': cov.get('entry_inputs'),
            'fingerprint_match': snap.get('universe_fingerprint') == expected_fingerprint,
          }
          print(json.dumps(report, ensure_ascii=False, indent=2))
          if snap.get('universe_fingerprint') != expected_fingerprint:
              raise SystemExit('Universe fingerprint mismatch')
          if int(snap.get('universe_source_total') or -1) != len(symbols):
              raise SystemExit('Universe count mismatch')
          if int(snap.get('universe_requested') or -1) != expected_requested:
              raise SystemExit('Full universe was not requested')
          if cov.get('metric_source') != 'leadership/market_snapshot.json':
              raise SystemExit('Independent market snapshot not used')
          if int(cov.get('rs63') or 0) < 1000:
              raise SystemExit('RS63 coverage too low for full-universe run')
          if int(cov.get('entry_inputs') or 0) < 1000:
              raise SystemExit('Entry coverage too low for full-universe run')
          PY

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: leadership-command-preview
          path: leadership/dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      LEADERSHIP_PUBLIC_REPOSITORY: ${{ vars.LEADERSHIP_PUBLIC_REPOSITORY }}
      LEADERSHIP_PUBLIC_TOKEN: ${{ secrets.LEADERSHIP_PUBLIC_TOKEN }}
    steps:
      - name: Check isolated public target
        id: config
        shell: bash
        run: |
          if [[ -z "${LEADERSHIP_PUBLIC_REPOSITORY:-}" || -z "${LEADERSHIP_PUBLIC_TOKEN:-}" ]]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.config.outputs.enabled == 'true'
        with:
          name: leadership-command-preview
          path: /tmp/leadership-site

      - name: Publish only to dedicated repository
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          target=/tmp/leadership-pages
          git clone --depth 1 "https://x-access-token:${LEADERSHIP_PUBLIC_TOKEN}@github.com/${LEADERSHIP_PUBLIC_REPOSITORY}.git" "$target"
          find "$target" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/leadership-site/. "$target/"
          touch "$target/.nojekyll"
          cd "$target"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'Publish Leadership Command'
          git push origin HEAD:main
