# Research-only. Does not modify main, live data, or dashboard outputs.
name: Gross100 Early slot overlay audit

on:
  workflow_dispatch:
  push:
    branches: [research/leader-entry-delay-audit-20260904]
    paths:
      - 'leadership/research/audit_gross100_early_slot_overlay.py'
      - '.github/workflows/gross100-early-slot-overlay-audit.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: gross100-early-slot-overlay-research
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy scipy yfinance

      - name: Download final reproducible RSI Reset signals
        uses: actions/download-artifact@v4
        with:
          name: rsi-strong-stock-threshold-interaction-audit
          path: leadership/research/early_slot_input/reset
          github-token: ${{ github.token }}
          run-id: 33130536827

      - name: Download frozen TQQQ Stage56 daily series
        uses: actions/download-artifact@v4
        with:
          name: tqqq-stage56-mandate-fx-tax
          path: leadership/research/early_slot_input/tqqq
          github-token: ${{ github.token }}
          run-id: 33080590798

      - name: Syntax and strict inputs
        run: |
          PYTHONPATH=.:leadership/research python -m py_compile \
            leadership/research/audit_gross100_early_slot_overlay.py
          test -s leadership/research/early_slot_input/reset/threshold_trade_rows.csv.gz
          test -s leadership/research/early_slot_input/tqqq/tqqq_stage56_daily.csv.gz

      - name: Run Early 0 1 2 3 slot audit
        run: |
          PYTHONPATH=.:leadership/research python leadership/research/audit_gross100_early_slot_overlay.py \
            --root . \
            --reset-trades leadership/research/early_slot_input/reset/threshold_trade_rows.csv.gz \
            --tqqq-daily leadership/research/early_slot_input/tqqq/tqqq_stage56_daily.csv.gz \
            --output leadership/research/gross100_early_slot_output \
            --analysis-start 2016-01-04 \
            --analysis-end 2026-03-20 \
            --tqqq-target target_M30_TOUCH30_F80_D10 \
            --bootstrap-sims 5000

      - name: Upload Early slot audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gross100-early-slot-overlay-audit
          path: |
            leadership/research/gross100_early_slot_output/early_slot_summary.json
            leadership/research/gross100_early_slot_output/early_slot_variants.csv
            leadership/research/gross100_early_slot_output/early_slot_subperiods.csv
            leadership/research/gross100_early_slot_output/early_slot_diagnostics.csv
            leadership/research/gross100_early_slot_output/early_slot_bootstrap.csv
            leadership/research/gross100_early_slot_output/early_slot_primary_ranking.csv
          retention-days: 30
          if-no-files-found: warn
