name: Patch Options chart NQSAR overlay once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-options-nqsar-overlay-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Apply NQSAR overlay to Options chart only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def one(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing anchor: {label}')
              return text.replace(old, new, 1)

          p = Path('options-chart.js')
          s = p.read_text(encoding='utf-8')

          s = one(s,
          """const L = () => window.LightweightCharts;\nconst finite = v => Number.isFinite(Number(v)) ? Number(v) : null;\n""",
          """const L = () => window.LightweightCharts;\nconst finite = v => Number.isFinite(Number(v)) ? Number(v) : null;\nlet regimePromise = null;\n\nfunction normalizeRegime(value) {\n  const key = String(value || '').trim().toLowerCase();\n  return ['blue', 'green', 'yellow', 'red'].includes(key) ? key : null;\n}\n\nfunction loadRegimes() {\n  if (!regimePromise) {\n    regimePromise = fetch(`./trend_history.json?v=${Date.now()}`, { cache: 'no-store' })\n      .then(r => { if (!r.ok) throw new Error(`trend_history:${r.status}`); return r.json(); })\n      .then(rows => Array.isArray(rows) ? rows : [])\n      .catch(() => { regimePromise = null; return []; });\n  }\n  return regimePromise;\n}\n\nfunction createNqsarLayer(element, chart, timeline, regimes) {\n  const bandLayer = document.createElement('div');\n  bandLayer.className = 'v38NqsarLayer';\n  bandLayer.setAttribute('aria-hidden', 'true');\n  const tagLayer = document.createElement('div');\n  tagLayer.className = 'v38NqsarTagLayer';\n  tagLayer.setAttribute('aria-hidden', 'true');\n  element.appendChild(bandLayer);\n  element.appendChild(tagLayer);\n\n  const dates = new Set((timeline || []).map(x => String(x.time || '').slice(0, 10)));\n  const rows = (regimes || []).map(row => ({\n    time: String(Array.isArray(row) ? row[0] : row?.date || '').slice(0, 10),\n    regime: normalizeRegime(Array.isArray(row) ? row[1] : row?.state),\n  })).filter(row => row.time && row.regime && dates.has(row.time));\n\n  function render() {\n    if (!bandLayer.isConnected || !tagLayer.isConnected) return;\n    const points = rows.map(row => ({ ...row, x: chart.timeScale().timeToCoordinate(row.time) }))\n      .filter(row => Number.isFinite(row.x));\n    bandLayer.innerHTML = '';\n    tagLayer.innerHTML = '';\n    if (!points.length) return;\n\n    let previousVisibleRegime = null;\n    points.forEach((point, index) => {\n      const previous = points[index - 1];\n      const next = points[index + 1];\n      const leftGap = previous ? point.x - previous.x : (next ? next.x - point.x : 6);\n      const rightGap = next ? next.x - point.x : (previous ? point.x - previous.x : 6);\n      const left = point.x - Math.max(2, leftGap / 2);\n      const right = point.x + Math.max(2, rightGap / 2);\n      if (right < 0 || left > element.clientWidth) return;\n      const band = document.createElement('div');\n      band.className = `v38NqsarBand ${point.regime}`;\n      band.style.left = `${left}px`;\n      band.style.width = `${Math.max(1, right - left)}px`;\n      bandLayer.appendChild(band);\n\n      if (point.regime !== previousVisibleRegime) {\n        const tag = document.createElement('div');\n        tag.className = `v38NqsarTag ${point.regime}`;\n        tag.textContent = `NQSAR ${point.regime.toUpperCase()}`;\n        tag.style.left = `${Math.max(3, left + 3)}px`;\n        tagLayer.appendChild(tag);\n        previousVisibleRegime = point.regime;\n      }\n    });\n  }\n\n  const schedule = () => requestAnimationFrame(render);\n  chart.timeScale().subscribeVisibleLogicalRangeChange(schedule);\n  requestAnimationFrame(render);\n  return {\n    schedule,\n    destroy() {\n      try { chart.timeScale().unsubscribeVisibleLogicalRangeChange(schedule); } catch (_) {}\n      bandLayer.remove();\n      tagLayer.remove();\n    },\n  };\n}\n""",
          'nqsar helpers')

          s = one(s,
          """  chart.timeScale().fitContent();\n  requestAnimationFrame(updateBand);\n  const scheduleBand = () => requestAnimationFrame(updateBand);\n""",
          """  let nqsarLayer = null;\n  loadRegimes().then(regimes => {\n    if (!element.isConnected) return;\n    nqsarLayer = createNqsarLayer(element, chart, timeline, regimes);\n    nqsarLayer.schedule();\n  });\n\n  chart.timeScale().fitContent();\n  requestAnimationFrame(updateBand);\n  const scheduleBand = () => requestAnimationFrame(updateBand);\n""",
          'mount nqsar layer')

          s = one(s,
          """  const ro = new ResizeObserver(() => {\n    chart.applyOptions({ width: Math.max(280, element.clientWidth || 640), height: Math.max(330, element.clientHeight || 410) });\n    scheduleBand();\n  });\n""",
          """  const ro = new ResizeObserver(() => {\n    chart.applyOptions({ width: Math.max(280, element.clientWidth || 640), height: Math.max(330, element.clientHeight || 410) });\n    scheduleBand();\n    nqsarLayer?.schedule();\n  });\n""",
          'resize nqsar')

          s = one(s,
          """  return { ticker, chart, mode: hasCandles ? 'candles' : 'options_spot', destroy() { ro.disconnect(); try { chart.remove(); } catch (_) {} } };\n""",
          """  return { ticker, chart, mode: hasCandles ? 'candles' : 'options_spot', destroy() { ro.disconnect(); nqsarLayer?.destroy(); try { chart.remove(); } catch (_) {} } };\n""",
          'destroy nqsar')
          p.write_text(s, encoding='utf-8')

          p = Path('options-chart.css')
          s = p.read_text(encoding='utf-8')
          anchor = ".v38ChartCanvas{position:relative;width:100%;height:410px;border-top:1px solid rgba(255,255,255,.065);background:#0b0d10}.v38ChartCanvas.isStale{opacity:.82}.v38ExpectedBand{position:absolute;left:0;right:54px;z-index:2;pointer-events:none;background:rgba(94,142,224,.055);border-top:1px solid rgba(120,170,255,.12);border-bottom:1px solid rgba(120,170,255,.12)}"
          repl = ".v38ChartCanvas{position:relative;width:100%;height:410px;border-top:1px solid rgba(255,255,255,.065);background:#0b0d10}.v38ChartCanvas.isStale{opacity:.82}.v38NqsarLayer{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}.v38NqsarBand{position:absolute;top:0;bottom:0;pointer-events:none}.v38NqsarBand.blue{background:rgba(83,145,255,.085)}.v38NqsarBand.green{background:rgba(87,199,133,.075)}.v38NqsarBand.yellow{background:rgba(240,201,77,.085)}.v38NqsarBand.red{background:rgba(239,106,106,.10)}.v38NqsarTagLayer{position:absolute;inset:0;z-index:5;pointer-events:none;overflow:hidden}.v38NqsarTag{position:absolute;top:7px;padding:2px 5px;border:1px solid currentColor;border-radius:999px;background:rgba(11,13,16,.88);font-size:7px;font-weight:900;line-height:1.2;white-space:nowrap;box-shadow:0 1px 5px rgba(0,0,0,.22)}.v38NqsarTag.blue{color:#77a7ff}.v38NqsarTag.green{color:#70d59a}.v38NqsarTag.yellow{color:#f0c94d}.v38NqsarTag.red{color:#ef7777}.v38ExpectedBand{position:absolute;left:0;right:54px;z-index:2;pointer-events:none;background:rgba(94,142,224,.055);border-top:1px solid rgba(120,170,255,.12);border-bottom:1px solid rgba(120,170,255,.12)}"
          s = one(s, anchor, repl, 'nqsar css')
          s = one(s,
          "@media(max-width:680px){.v38ChartPanel{margin-left:-2px;margin-right:-2px;border-radius:15px}.v38ChartHead{padding:13px 12px 8px;display:block}.v38ChartStatus{justify-content:flex-start;margin-top:8px}.v38ChartLegend{padding:0 12px 9px}.v38ChartCanvas{height:360px}.v38ChartFoot{padding:8px 11px 10px;align-items:flex-start;flex-direction:column;gap:4px}}",
          "@media(max-width:680px){.v38ChartPanel{margin-left:-2px;margin-right:-2px;border-radius:15px}.v38ChartHead{padding:13px 12px 8px;display:block}.v38ChartStatus{justify-content:flex-start;margin-top:8px}.v38ChartLegend{padding:0 12px 9px}.v38ChartCanvas{height:360px}.v38NqsarTag{top:6px;font-size:6.5px;padding:2px 4px}.v38ChartFoot{padding:8px 11px 10px;align-items:flex-start;flex-direction:column;gap:4px}}",
          'mobile nqsar tag')
          p.write_text(s, encoding='utf-8')

          p = Path('options-intelligence.html')
          h = p.read_text(encoding='utf-8')
          h = one(h, 'options-chart.css?v=20260907-techlegend1', 'options-chart.css?v=20260907-nqsar1', 'css cache')
          h = one(h, 'options-chart.js?v=20260907-techlegend1', 'options-chart.js?v=20260907-nqsar1', 'js cache')
          p.write_text(h, encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check options-chart.js
          git diff --check
          grep -q "trend_history.json" options-chart.js
          grep -q "createNqsarLayer" options-chart.js
          grep -q "v38NqsarBand" options-chart.css
          grep -q "v38NqsarTag" options-chart.css
          grep -q "nqsar1" options-intelligence.html
          ! git diff --name-only | grep -Ev '^(options-chart.js|options-chart.css|options-intelligence.html)$'

      - name: Commit intended files only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- options-chart.js options-chart.css options-intelligence.html
          staged="$(git diff --cached --name-only)"
          printf '%s\n' "$staged"
          for f in $staged; do
            case "$f" in
              options-chart.js|options-chart.css|options-intelligence.html) ;;
              *) echo "unexpected file: $f"; exit 1 ;;
            esac
          done
          test "$(printf '%s\n' "$staged" | wc -l)" -eq 3
          git commit -m 'Add NQSAR regime colors to Options chart'
          git push origin HEAD:main
