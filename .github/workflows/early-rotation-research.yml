name: Pioneer Leader research validation

on:
  push:
    branches:
      - 'research/pioneer-leader-*'
    paths:
      - 'leadership/research/validate_early_rotation.py'
      - 'leadership/research/validate_confirmed_leadership.py'
      - 'leadership/research/validate_pioneer_leader.py'
      - '.github/workflows/early-rotation-research.yml'

permissions:
  contents: read

concurrency:
  group: pioneer-leader-research-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    if: startsWith(github.ref_name, 'research/pioneer-leader-')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy yfinance

      - name: Syntax check
        run: |
          python -m py_compile leadership/research/validate_early_rotation.py
          python -m py_compile leadership/research/validate_confirmed_leadership.py
          python -m py_compile leadership/research/validate_pioneer_leader.py

      - name: Run Pioneer Leader validation
        run: |
          python leadership/research/validate_pioneer_leader.py \
            --root . \
            --output leadership/research/pioneer_output \
            --analysis-start 2016-01-04 \
            --analysis-end 2026-06-20 \
            --max-tickers 1500 \
            --batch-size 75 \
            --min-members 3

      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pioneer-leader-validation
          path: leadership/research/pioneer_output/
          if-no-files-found: warn
          retention-days: 7
