name: Options scan verify fix once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/options-scan-verify-fix-once.yml'

permissions:
  contents: write

jobs:
  patch-test-rebuild:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check -r requirements.txt pytest
      - run: python tools/tmp_patch_options_scan_verify.py
      - name: Syntax and regression tests
        run: |
          python -m py_compile tools/build_options_intelligence.py
          node --check options-intelligence.js
          pytest -q tests/test_options_intelligence.py tests/test_options_time_direction.py tests/test_options_daily_liquid.py
      - name: Rebuild Options Intelligence only
        run: python tools/build_options_intelligence.py
      - name: Commit fix and recomposed intelligence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/build_options_intelligence.py options-intelligence.js tests/test_options_time_direction.py options_intelligence.json options_intelligence_history.csv
          git commit -m "Use same-session liquid Options scan in intelligence"
          for a in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((a*2))
          done
          exit 1
