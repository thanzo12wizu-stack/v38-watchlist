name: Audit 8T3I1E Live CLI Latest

on:
  workflow_dispatch:
  push:
    branches:
      - research/stock-nqsar-transition-early-20260907
    paths:
      - 'build_v38_8t3i1e_live.py'
      - '.github/workflows/audit-8t3i1e-live-cli-latest.yml'

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install --disable-pip-version-check -r requirements.txt
      - name: Compile dedicated builder
        run: python -m py_compile build_v38_8t3i1e_live.py
      - name: Run live CLI with default 2200-day lookback
        run: |
          python -u build_v38_8t3i1e_live.py \
            --root . \
            --asof 2026-09-04 \
            --output research_outputs/audit_8t3i1e_live_cli_latest/live.json \
            --batch-size 100 \
            --lookback-days 2200
      - name: Compare CLI output to full-history Exact reference
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('research_outputs/audit_8t3i1e_live_cli_latest/live.json').read_text(encoding='utf-8'))
          expected_tickers=['MRNA','AMLX','SLN','AGCO','CDNA','XNCR','ELF','ASST','NIQ','ARCT','ARX','PLSE']
          expected_sources=['TREND','TREND','TREND','IGNITION','TREND','TREND','TREND','IGNITION','TREND','TREND','IGNITION','TREND']
          got_tickers=[str(x.get('ticker')) for x in p.get('candidates',[])]
          got_sources=[str(x.get('source')) for x in p.get('candidates',[])]
          summary={
              'asof':p.get('asof'),
              'status':p.get('status'),
              'schema':p.get('schema'),
              'quality':p.get('quality'),
              'expected_tickers':expected_tickers,
              'got_tickers':got_tickers,
              'expected_sources':expected_sources,
              'got_sources':got_sources,
              'tickers_exact':got_tickers==expected_tickers,
              'sources_exact':got_sources==expected_sources,
              'all_ddv20_pass':[bool(x.get('entry_ddv20_pass')) for x in p.get('candidates',[])],
          }
          summary['audit_verdict']='PASS' if summary['tickers_exact'] and summary['sources_exact'] and p.get('status')=='READY' else 'FAIL'
          Path('research_outputs/audit_8t3i1e_live_cli_latest/summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(summary,ensure_ascii=False,indent=2))
          if summary['audit_verdict']!='PASS': raise SystemExit('LIVE_CLI_EXACT_MISMATCH')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-8t3i1e-live-cli-latest-20260908
          path: research_outputs/audit_8t3i1e_live_cli_latest
          if-no-files-found: warn
