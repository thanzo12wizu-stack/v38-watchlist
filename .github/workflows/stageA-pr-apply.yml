# sync trigger after default workflow activation
name: Stage A PR apply

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/stageA-pr-apply.yml'
      - 'scripts/finalize_stageA.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply and validate Stage A
        shell: bash
        run: |
          set -euo pipefail
          python scripts/finalize_stageA.py
          python -m py_compile build_dashboard.py
          git diff --check
          grep -q 'for _typ in ("stock", "dr")' build_dashboard.py
          grep -q 'selection_excluded' build_dashboard.py
          grep -q 'V38_BIO_REVENUE_MAX' .github/workflows/dashboard.yml
      - name: Commit completed source to PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build_dashboard.py .github/workflows/dashboard.yml
          git rm -f scripts/finalize_stageA.py .github/workflows/finalize-stageA.yml 2>/dev/null || true
          git rm -f scripts/stage2c_patch.py .github/workflows/stage2c-bio-preview-patch.yml 2>/dev/null || true
          git rm -f .github/workflows/stageA-pr-apply.yml
          git commit -m "Apply final Stage A universe and biotech eligibility"
          git push origin HEAD:${{ github.head_ref }}
