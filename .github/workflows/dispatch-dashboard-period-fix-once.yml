name: One-off dispatch dashboard after MC period fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-dashboard-period-fix-once.yml'

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Dispatch existing dashboard workflow once
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run dashboard.yml --repo "$GITHUB_REPOSITORY"
      - name: Remove this one-off dispatcher
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/dispatch-dashboard-period-fix-once.yml
          git add .github/workflows/dispatch-dashboard-period-fix-once.yml
          git commit -m "Remove one-off MC period dashboard dispatcher"
          git push origin HEAD:main
