name: Fix Multi VWAP inception gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-multi-vwap-all-gate.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply exact candidate-gate fix
        shell: bash
        run: |
          set -euo pipefail
          python scripts/fix_multi_vwap_all_gate.py
          python -m py_compile build_dashboard.py
          git diff --check
          grep -F 'keep_roll = elig & (entry_worthy(m) | ipo) & loc_roll &' build_dashboard.py
          grep -F 'keep_all = setup_eligible_core(m) & loc_all' build_dashboard.py
          grep -F '_near_threshold = min(0.05, max(0.02, 0.5 * _adr20))' build_dashboard.py

      - name: Persist source fix and remove temporary patchers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build_dashboard.py
          git rm -f --ignore-unmatch \
            scripts/fix_multi_vwap_all_gate.py \
            .github/workflows/fix-multi-vwap-all-gate.yml \
            scripts/patch_inception_vwap_recent_ipo.py \
            .github/workflows/patch-recent-ipo-inception-vwap.yml
          git commit -m "Fix inception VWAP candidate gate"
          git push origin HEAD:main
