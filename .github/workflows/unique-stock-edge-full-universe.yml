name: Unique Stock Edge Full Universe

on:
  push:
    branches:
      - research/sector-stock-leadership-20260826
    paths:
      - leadership/research/summarize_unique_stock_edge_full.py
      - .github/workflows/unique-stock-edge-full-universe.yml
  workflow_dispatch:

jobs:
  validate-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy yfinance
      - name: Syntax check
        run: |
          python -m py_compile leadership/research/validate_unique_stock_edge.py
          python -m py_compile leadership/research/summarize_unique_stock_edge_full.py
      - name: Run frozen full-universe validation
        run: |
          python leadership/research/validate_unique_stock_edge.py \
            --root . \
            --output leadership/research/unique_stock_edge_full \
            --analysis-start 2016-01-04 \
            --analysis-end 2026-06-20 \
            --exclude-first 0 \
            --max-tickers 6000 \
            --batch-size 75 \
            --min-members 3
      - name: Summarize temporal stability
        run: |
          python leadership/research/summarize_unique_stock_edge_full.py \
            --rows leadership/research/unique_stock_edge_full/unique_stock_edge_rows.csv \
            --base-summary leadership/research/unique_stock_edge_full/summary.json \
            --output leadership/research/unique_stock_edge_full/full_universe_stability.json
      - name: Upload research outputs
        uses: actions/upload-artifact@v4
        with:
          name: unique-stock-edge-full-universe
          path: leadership/research/unique_stock_edge_full/
          retention-days: 7
