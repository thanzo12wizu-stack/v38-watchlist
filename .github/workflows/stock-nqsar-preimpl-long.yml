name: Stock NQSAR Preimplementation Long

on:
  push:
    branches: [research/stock-nqsar-preimpl-20260907]
    paths:
      - 'research/preimpl_core11_early1_long.py'
      - '.github/workflows/stock-nqsar-preimpl-long.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Compile
        run: |
          python -m py_compile research/preimpl_core11_early1_pit.py
          python -m py_compile research/preimpl_core11_early1_long.py
      - name: Run long-history production-slot interaction audit
        env:
          PYTHONPATH: .
        run: |
          python research/preimpl_core11_early1_long.py \
            --root . \
            --output research_output/stock_nqsar_preimpl_long_20260907 \
            --batch-size 100
      - uses: actions/upload-artifact@v4
        with:
          name: stock-nqsar-preimpl-long-20260907
          path: research_output/stock_nqsar_preimpl_long_20260907
