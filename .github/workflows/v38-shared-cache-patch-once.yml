name: V38 shared cache one-shot patch

on:
  push:
    branches: [fix/v38-sleeve-price-cache-20260901]
    paths:
      - '.github/workflows/v38-shared-cache-patch-once.yml'
      - 'tools/patch_v38_shared_cache_workflows.py'
      - 'build_v38_strict_loo_with_cache.py'
      - 'build_v38_sleeve_live_from_cache.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/v38-sleeve-price-cache-20260901
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Apply exact workflow patches
        run: python tools/patch_v38_shared_cache_workflows.py
      - name: Syntax check wrappers
        run: python -m py_compile build_v38_strict_loo_with_cache.py build_v38_sleeve_live_from_cache.py
      - name: Commit patches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/dashboard.yml .github/workflows/v38-audit-check.yml
          if git diff --staged --quiet; then
            echo 'No patch changes required'
            exit 0
          fi
          git commit -m 'fix: reuse strict LOO price batch for live sleeves'
          git push origin HEAD:fix/v38-sleeve-price-cache-20260901
