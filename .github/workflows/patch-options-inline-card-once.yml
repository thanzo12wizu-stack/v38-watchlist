name: Patch Options inline card once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-options-inline-card-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Apply inline card patch
        run: python .tmp_patch_options_inline.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check options-intelligence.js
          node --check options-chart-bridge.js
          git diff --check
          grep -q "toggleInlineCard(e, e.dataset.ticker)" options-intelligence.js
          grep -q "activeSelectedCard" options-chart-bridge.js
          grep -q "options:inline-selected-change" options-chart-bridge.js
          grep -q "miniCard.inlineExpanded" options-intelligence.css
          grep -q "options-intelligence.js?v=20260906-inlinecard1" options-intelligence.html
          grep -q "options-chart-bridge.js?v=20260906-inlinecard1" options-intelligence.html
          ! grep -q "selectTicker(e.dataset.ticker, false)" options-intelligence.js

      - name: Commit intended files only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- options-intelligence.js options-chart-bridge.js options-intelligence.css options-intelligence.html
          staged="$(git diff --cached --name-only)"
          printf '%s\n' "$staged"
          for f in $staged; do
            case "$f" in
              options-intelligence.js|options-chart-bridge.js|options-intelligence.css|options-intelligence.html) ;;
              *) echo "unexpected file: $f"; exit 1 ;;
            esac
          done
          test "$(printf '%s\n' "$staged" | wc -l)" -eq 4
          git commit -m 'Expand Options analysis inside tapped card'
          git push origin HEAD:main
