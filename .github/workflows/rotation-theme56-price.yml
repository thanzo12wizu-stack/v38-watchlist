name: Rotation Theme56 Price Layer

on:
  workflow_dispatch:
  push:
    branches:
      - research/rotation-exact-flow-internals-20260831
    paths:
      - leadership/research/rotation_theme56_config.json
      - leadership/research/rotation_theme56_price_snapshot.py
      - .github/workflows/rotation-theme56-price.yml

permissions:
  contents: write

concurrency:
  group: rotation-theme56-price
  cancel-in-progress: true

jobs:
  price:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/rotation-exact-flow-internals-20260831
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy requests openpyxl yfinance lxml html5lib
      - name: Syntax check
        run: python -m py_compile leadership/research/rotation_theme56_price_snapshot.py
      - name: Build Theme56 price layer
        run: |
          python leadership/research/rotation_theme56_price_snapshot.py \
            --config leadership/research/rotation_theme56_config.json \
            --output leadership/research/rotation_theme56_live \
            --download-start 2025-01-01 \
            --download-end 2026-09-02
      - name: Persist Theme56 price outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          OUT_TMP="$(mktemp -d)/rotation_theme56_live"
          cp -a leadership/research/rotation_theme56_live "$OUT_TMP"

          for attempt in 1 2 3; do
            git fetch origin research/rotation-exact-flow-internals-20260831
            git reset --hard origin/research/rotation-exact-flow-internals-20260831
            rm -rf leadership/research/rotation_theme56_live
            mkdir -p leadership/research
            cp -a "$OUT_TMP" leadership/research/rotation_theme56_live
            git add leadership/research/rotation_theme56_live/
            if git diff --cached --quiet; then
              echo "No Theme56 price changes"
              exit 0
            fi
            git commit -m "research: record theme56 price layer"
            if git push origin HEAD:research/rotation-exact-flow-internals-20260831; then
              exit 0
            fi
            echo "Push race on attempt ${attempt}; retrying"
          done
          echo "Failed to persist Theme56 price outputs after 3 attempts" >&2
          exit 1
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rotation-theme56-price
          path: leadership/research/rotation_theme56_live/
          if-no-files-found: warn
          retention-days: 14
