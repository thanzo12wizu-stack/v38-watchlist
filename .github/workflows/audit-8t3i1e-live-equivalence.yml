name: Audit 8T3I1E Live Equivalence

on:
  workflow_dispatch:
  push:
    branches:
      - research/stock-nqsar-transition-early-20260907
    paths:
      - 'research/audit_8t3i1e_live_equivalence.py'
      - '.github/workflows/audit-8t3i1e-live-equivalence.yml'

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install --disable-pip-version-check -r requirements.txt
      - name: Compile audit
        run: python -m py_compile research/audit_8t3i1e_live_equivalence.py
      - name: Run audit
        run: python -u -m research.audit_8t3i1e_live_equivalence --root . --output research_outputs/audit_8t3i1e_live_equivalence --batch-size 100
      - uses: actions/upload-artifact@v4
        with:
          name: audit-8t3i1e-live-equivalence-20260908
          path: research_outputs/audit_8t3i1e_live_equivalence
          if-no-files-found: error
