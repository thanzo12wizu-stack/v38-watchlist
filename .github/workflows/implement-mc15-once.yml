name: One-off implement MC15 Market Conditions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/implement-mc15-once.yml'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
