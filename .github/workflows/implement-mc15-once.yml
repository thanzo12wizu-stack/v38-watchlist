          import numpy as np
          import build_dashboard as b
          long = b._fetch_mc_long_history({})
          if len(long) < 50:
              raise SystemExit(f'MC15 live history coverage too low: {len(long)}/57')
          mri, breakdown, dropped, active, vals = b.mri_frame(long)
          cur = float(mri.dropna().iloc[-1])
          last = vals.reindex(mri.dropna().index).iloc[-1]
          raw = float(last['mc_raw']); mu = float(last['mc_mean15']); sd = float(last['mc_sd15']); z = float(last['mc_z15'])
          if not all(np.isfinite(x) for x in (cur, raw, mu, sd, z)):
              raise SystemExit('MC15 produced non-finite latest values')
          if not (0.0 < cur < 100.0 and sd > 0):
              raise SystemExit(f'MC15 invalid range: cur={cur} sd={sd}')
          print(f'MC15_SMOKE current={cur:.2f} raw={raw:.2f} mean15={mu:.2f} sd15={sd:.2f} z={z:+.3f} coverage={len(long)}/57')
          PY

