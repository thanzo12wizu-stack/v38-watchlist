name: One-off implement MC15 Market Conditions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/implement-mc15-once.yml'
      - '.github/scripts/implement_mc15_once.py'
      - '.github/scripts/fix_mc15_patch_escape_once.py'

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Prepare narrow MC15 patch
        run: |
          python .github/scripts/fix_mc15_patch_escape_once.py
          python .github/scripts/implement_mc15_once.py
      - name: Static checks
        run: |
          git diff --check
          python -m py_compile build_dashboard.py
          git diff --stat
      - name: Regression tests
        run: |
          pytest -q tests/test_dashboard_build_regressions.py tests/test_options_positioning_quality.py tests/test_eps_acceleration.py
      - name: Live MC15 smoke test
        run: |
          python - <<'PY'
          import numpy as np
          import pandas as pd
          import build_dashboard as b
          asof = pd.Timestamp('2026-08-24')
          long = b._fetch_mc_long_history(asof=asof)
          if len(long) < 50:
              raise SystemExit(f'MC15 live history coverage too low: {len(long)}/57')
          mri, breakdown, dropped, active, vals = b.mri_frame(long)
          clean = mri.dropna()
          cur = float(clean.iloc[-1])
          last = vals.reindex(clean.index).iloc[-1]
          raw = float(last['mc_raw'])
          mu = float(last['mc_mean15'])
          sd = float(last['mc_sd15'])
          z = float(last['mc_z15'])
          if not all(np.isfinite(x) for x in (cur, raw, mu, sd, z)):
              raise SystemExit('MC15 produced non-finite latest values')
          if not (0 < cur < 100 and sd > 0):
              raise SystemExit(f'MC15 invalid range: cur={cur} sd={sd}')
          if not (54 <= cur <= 62 and 67 <= raw <= 74):
              raise SystemExit(f'MC15 2026-08-24 regression drift: cur={cur:.2f} raw={raw:.2f}')
          print(f'MC15_SMOKE asof={clean.index[-1].date()} current={cur:.2f} raw={raw:.2f} mean15={mu:.2f} sd15={sd:.2f} z={z:+.3f} coverage={len(long)}/57')
          PY
      - name: Commit tested implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build_dashboard.py tests/test_dashboard_build_regressions.py
          git diff --cached --check
          git commit -m "Normalize Market Conditions to 15-year temperature"
          git push origin HEAD:main
