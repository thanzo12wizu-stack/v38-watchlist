def _fetch_mc_long_history(existing_macro=None):
    """Fetch a dedicated long daily history for the fixed 57-ETF MC universe.

    The normal macro cache stays short because many other cards only need a few years.
    MC15 alone needs 15 completed years plus metric warm-up, so it is enriched here.
    Missing/late-inception ETFs remain missing before inception; they are never zero-filled.
    """
    if not _net_ok():
        return {}
    try:
        import yfinance as yf
    except Exception as exc:
        sys.stderr.write("[mc15] yfinance import failed: %s\\n" % type(exc).__name__)
        return {}
    try:
        _now = pd.Timestamp.utcnow()
        try:
            _now = _now.tz_localize(None)
        except TypeError:
            _now = _now.tz_convert(None)
        start = (_now.normalize() - pd.DateOffset(years=MC_LONG_LOOKBACK_YEARS)).strftime("%Y-%m-%d")
    except Exception:
        start = "2005-01-01"

    out = {}
    try:
        raw = yf.download(MC_MARKET_TICKERS, start=start, progress=False,
                          auto_adjust=True, group_by="ticker", threads=True)
        out.update(_extract(raw, MC_MARKET_TICKERS, minbars=30))
    except Exception as exc:
        sys.stderr.write("[mc15] batch history failed: %s\\n" % type(exc).__name__)

    missing = [t for t in MC_MARKET_TICKERS if t not in out]
    for t in missing:
        try:
            hist = yf.Ticker(t).history(start=start, auto_adjust=True)
            got = _extract(hist, [t], minbars=30).get(t)
            if got is not None and len(got):
                out[t] = got
        except Exception as exc:
            sys.stderr.write("[mc15] %s history fallback failed: %s\\n" % (t, type(exc).__name__))

    if out:
        try:
            first = min(pd.Timestamp(v.index.min()) for v in out.values() if len(v))
            last = max(pd.Timestamp(v.index.max()) for v in out.values() if len(v))
            sys.stderr.write("[mc15] long history: %d/%d ETFs, %s..%s\\n" %
                             (len(out), len(MC_MARKET_TICKERS), first.date(), last.date()))
        except Exception:
            sys.stderr.write("[mc15] long history: %d/%d ETFs\\n" % (len(out), len(MC_MARKET_TICKERS)))
    return out


