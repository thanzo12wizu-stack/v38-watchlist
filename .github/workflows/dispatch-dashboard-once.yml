name: One-off dispatch dashboard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-dashboard-once.yml'

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Dispatch dashboard build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run dashboard.yml --ref main

      - name: Remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main
          git rm .github/workflows/dispatch-dashboard-once.yml
          git commit -m "Remove one-off dashboard dispatcher"
          git push origin HEAD:main
