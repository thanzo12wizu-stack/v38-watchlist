# Research-only falsification control. Does not modify main, Pages, Dashboard, or live rules.
name: Early1 Value Falsification Research

on:
  push:
    branches:
      - research/sector-stock-leadership-20260826
    paths:
      - leadership/research/audit_early1_value_falsification.py
      - .github/workflows/early1-value-falsification-research.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy yfinance
      - name: Syntax check
        run: python -m py_compile leadership/research/audit_early1_value_falsification.py
      - name: Run Early1 value falsification
        env:
          PYTHONPATH: .:leadership/research
        run: |
          python leadership/research/audit_early1_value_falsification.py \
            --root . \
            --output leadership/research/early1_value_falsification \
            --analysis-start 2016-01-04 \
            --analysis-end 2025-12-31 \
            --max-tickers 6000 \
            --batch-size 75
      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: early1-value-falsification
          path: leadership/research/early1_value_falsification/
          retention-days: 14
