name: Validate minimal Market Conditions fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Apply scoped repair
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          python tools/fix_market_conditions_minimal.py
          if git diff --quiet -- build_dashboard.py; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          git diff --check
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Run production preflight
        run: |
          python -m py_compile build_dashboard.py
          pytest -q tests/test_dashboard_build_regressions.py tests/test_options_positioning_quality.py tests/test_eps_acceleration.py
      - name: Validate Market Conditions contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import numpy as np
          import pandas as pd
          import build_dashboard as d

          assert [x[1] for x in d.STATUS_DEF] == [15, 55, 20, 10], d.STATUS_DEF
          idx = pd.bdate_range('2024-01-02', periods=320)
          macro = {}
          for j, t in enumerate(d.MC_MARKET_TICKERS + ['QQQE']):
              close = pd.Series(np.linspace(100 + j, 160 + j, len(idx)), index=idx)
              macro[t] = pd.DataFrame({'Close': close})
          score, breakdown, dropped, active, vals = d.mri_frame(macro)
          assert len(d.MC_MARKET_TICKERS) == 43
          assert np.isfinite(float(score.dropna().iloc[-1]))
          assert [x['key'] for x in breakdown] == ['short','medium','long','damage']
          for k in ('qqq_50','qqq_200','spy_50','spy_200','rsp_50','rsp_200','qqqe_50'):
              assert k in vals.columns, k
          assert 'repair_thrust10' not in vals.columns
          assert 'NQSAR' not in open(d.__file__, encoding='utf-8').read()
          print('Market Conditions contract OK:', float(score.dropna().iloc[-1]))
          PY
      - name: Run production dashboard build without persistence
        if: steps.repair.outputs.changed == 'true'
        env:
          V38_UNIVERSE_CSV: universe.csv
          V38_UNIVERSE_AUTO: '1'
          V38_UNIVERSE_MIN_MCAP: '200000000'
          V38_UNIVERSE_MIN_PRICE: '1'
          V38_SECTOR_JSON: sector_snapshot.json
          V38_OUT_HTML: command-center.html
          V38_MKTCAP_JSON: mktcap.json
          V38_TREND_JSON: trend_history.json
          V38_LOG_CSV: daily_log.csv
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          V38_FRED_CACHE: fred_cache.json
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          V38_FMP_REFERENCE_CACHE: fmp_reference_cache.json
          V38_FMP_REFERENCE_BUDGET: '40'
          V38_STATE_JSON: state.json
          V38_EQUITY_CSV: equity.csv
          V38_ER_JSON: earnings.json
          V38_EARNINGS_FETCH_BUDGET: '120'
          V38_EARNINGS_FETCH_SECONDS: '180'
          V38_EARNINGS_PRIORITY_RESERVE: '20'
          V38_INCEPT_VWAP_JSON: inception_vwap.json
          V38_INCEPT_VWAP_BUDGET: '1400'
          V38_INDUSTRY_JSON: industry_map.json
          V38_INDUSTRY_MAX_AGE_DAYS: '7'
          V38_OPT_JSON: options_positioning.json
          V38_OPT_SCAN_HISTORY: options_scan_history.csv
          V38_OPT_TARGETS: options_targets.json
        shell: bash
        run: |
          set -euo pipefail
          python build_dashboard.py 2>&1 | tee build-dashboard.log
          grep -q 'SELFTEST OK' build-dashboard.log
          test -s command-center.html
          test "$(wc -c < command-center.html)" -gt 200000
          grep -q 'Command Center' command-center.html
          grep -q 'トレンド判定' command-center.html
          ! grep -q 'NQSAR' command-center.html
          ! grep -q 'RECOVERY ·' command-center.html
      - name: Persist validated builder repair
        if: steps.repair.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build_dashboard.py
          test "$(git diff --cached --name-only)" = "build_dashboard.py"
          git commit -m 'Repair Market Conditions without changing NQ UI'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
