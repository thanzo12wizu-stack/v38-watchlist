name: RSI30 MC NQSAR audit

on:
  workflow_dispatch:
  push:
    branches:
      - research/sector-stock-leadership-20260826
    paths:
      - 'leadership/research/audit_rsi30_mc_nqsar.py'
      - '.github/workflows/rsi30-mc-nqsar-audit.yml'

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance gspread

      - name: Download focused RSI audit trades
        uses: actions/download-artifact@v4
        with:
          name: rsi-reset-focused-robust-audit
          path: leadership/research/rsi30_mc_nqsar_input
          github-token: ${{ github.token }}
          run-id: 33063836403

      - name: Syntax and input checks
        run: |
          python -m py_compile leadership/research/audit_rsi30_mc_nqsar.py
          test -s leadership/research/rsi30_mc_nqsar_input/audit_trades.csv.gz

      - name: Normalize research date-index labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('leadership/research/audit_rsi30_mc_nqsar.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('mc2 = mc.reset_index().rename(columns={"index": "signal_date"})', 'mc2 = mc.rename_axis("signal_date").reset_index()')
          s = s.replace('nq2 = nq.reset_index().rename(columns={"index": "signal_date"})', 'nq2 = nq.rename_axis("signal_date").reset_index()')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Run MC and NQSAR confirmation audit
        run: |
          PYTHONPATH=. python leadership/research/audit_rsi30_mc_nqsar.py \
            --input leadership/research/rsi30_mc_nqsar_input/audit_trades.csv.gz \
            --output leadership/research/rsi30_mc_nqsar_output \
            --asof 2026-08-27 \
            --nq-start 2010-01-01

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsi30-mc-nqsar-audit
          path: leadership/research/rsi30_mc_nqsar_output/
          retention-days: 14
          if-no-files-found: warn
