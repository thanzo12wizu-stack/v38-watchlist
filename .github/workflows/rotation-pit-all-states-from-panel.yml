name: Rotation PIT All States From Panel

on:
  workflow_dispatch:
  push:
    branches:
      - research/rotation-exact-flow-internals-20260831
    paths:
      - leadership/research/rotation_pit_all_states_from_panel.py
      - .github/workflows/rotation-pit-all-states-from-panel.yml

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy requests openpyxl yfinance lxml
      - name: Download audited PIT panel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/pit-panel
          gh api repos/${{ github.repository }}/actions/artifacts/9743199098/zip > /tmp/pit-panel.zip
          unzip -q /tmp/pit-panel.zip -d /tmp/pit-panel
          test -s /tmp/pit-panel/distribution_pit_panel_cov80.csv
      - name: Syntax check
        run: python -m py_compile leadership/research/rotation_pit_all_states_from_panel.py
      - name: Run all PIT state grids
        run: |
          python leadership/research/rotation_pit_all_states_from_panel.py \
            --panel /tmp/pit-panel/distribution_pit_panel_cov80.csv \
            --output leadership/research/rotation_pit_all_states_from_panel_outputs
      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rotation-pit-all-states-from-panel
          path: leadership/research/rotation_pit_all_states_from_panel_outputs/
          if-no-files-found: warn
          retention-days: 14
