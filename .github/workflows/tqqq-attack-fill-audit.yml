# Research-only cross-sleeve audit. Does not modify dashboard/main outputs.
name: TQQQ Attack Cash Fill Audit

on:
  push:
    branches:
      - research/tqqq-attack-fill-20260901
    paths:
      - leadership/research/audit_tqqq_attack_fill.py
      - .github/workflows/tqqq-attack-fill-audit.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy yfinance
      - name: Syntax check
        run: |
          python -m py_compile leadership/research/audit_tqqq_attack_fill.py
          python -m py_compile leadership/research/audit_ordinary_stock_market_mode_robustness.py
          python -m py_compile leadership/research/audit_rsi30_mc_nqsar.py
      - name: Download frozen component artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs/components inputs/tqqq
          gh run download 33338433195 -R "$GITHUB_REPOSITORY" -n gross100-component-series -D inputs/components
          gh run download 33080590798 -R "$GITHUB_REPOSITORY" -n tqqq-stage56-mandate-fx-tax -D inputs/tqqq
          test -f inputs/components/ordinary_PEAK30_PART25_R3_daily.csv.gz
          test -f inputs/components/rsi_RESET_RISE30_S029_P4_H20_daily.csv.gz
          test -f inputs/tqqq/tqqq_stage56_daily.csv.gz
      - name: Run three fixed variants
        env:
          PYTHONPATH: .:leadership/research
        run: |
          python leadership/research/audit_tqqq_attack_fill.py \
            --root . \
            --components-dir inputs/components \
            --tqqq-daily inputs/tqqq/tqqq_stage56_daily.csv.gz \
            --output leadership/research/out/tqqq_attack_fill \
            --analysis-start 2016-01-04 \
            --analysis-end 2026-03-20 \
            --max-tickers 6000 \
            --batch-size 75
      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tqqq-attack-cash-fill-audit
          path: leadership/research/out/tqqq_attack_fill/
          retention-days: 14
