name: Stage1 validation runner

on:
  push:
    branches:
      - stage1-validation-build
    paths:
      - '.github/workflows/stage1-validation-runner.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage1-validation-build
          fetch-depth: 1
      - name: Patch validation
        run: python scripts/stage1_patch_validation.py
      - name: Commit validation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/dashboard.yml
          git diff --check
          git diff --staged --quiet && { echo "No patch needed"; exit 0; }
          git commit -m "Enforce dashboard session date consistency"
          git push origin HEAD:stage1-validation-build
