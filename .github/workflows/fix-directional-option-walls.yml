name: Fix directional option walls

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_directional_option_walls.py'
      - '.github/workflows/fix-directional-option-walls.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply and verify repair
        shell: bash
        run: |
          set -euo pipefail
          python scripts/fix_directional_option_walls.py
          python -m py_compile tools/build_options_positioning.py build_dashboard.py
          git diff --check
          grep -F 'sub = sub[sub.index > spot] if kind == "C" else sub[sub.index < spot]' tools/build_options_positioning.py
          grep -F '# INCEPTION_VWAP_BYPASS_PRESENTATION_CAP_V1' build_dashboard.py
          grep -F '_near_threshold = min(0.05, max(0.02, 0.5 * _adr20))' build_dashboard.py
          python - <<'PY'
          import csv, json

          # Detailed JSON invariant.
          try:
              p=json.load(open('options_positioning.json', encoding='utf-8'))
          except FileNotFoundError:
              p={}
          bad=[]
          for tk,r in (p.get('tickers') or {}).items():
              s=r.get('spot')
              cw=(r.get('call_wall') or {}).get('px')
              pw=(r.get('put_wall') or {}).get('px')
              if s is None: continue
              if cw is not None and not (float(cw) > float(s)): bad.append((tk,'call',s,cw))
              if pw is not None and not (float(pw) < float(s)): bad.append((tk,'put',s,pw))
          if bad:
              raise SystemExit(f'detailed directional wall invariant failed: {bad[:10]}')

          # Compact-history fallback invariant.
          hbad=[]
          with open('options_scan_history.csv', encoding='utf-8', newline='') as fh:
              for r in csv.DictReader(fh):
                  try: s=float(r['spot'])
                  except Exception: continue
                  try: cw=float(r['call_wall'])
                  except Exception: cw=None
                  try: pw=float(r['put_wall'])
                  except Exception: pw=None
                  if cw is not None and not cw > s: hbad.append((r.get('ticker'),'call',s,cw))
                  if pw is not None and not pw < s: hbad.append((r.get('ticker'),'put',s,pw))
          if hbad:
              raise SystemExit(f'history directional wall invariant failed: {hbad[:10]}')
          print('DIRECTIONAL_WALL_INVARIANTS_OK')
          PY
      - name: Persist repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/build_options_positioning.py build_dashboard.py options_positioning.json options_scan_history.csv
          if git diff --cached --quiet; then
            echo 'Nothing to persist.'
            exit 0
          fi
          git commit -m "Fix option direction and inception VWAP visibility"
          git pull --rebase origin main
          git push origin HEAD:main
