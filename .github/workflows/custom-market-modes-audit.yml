name: Custom market modes audit

on:
  workflow_dispatch:
  push:
    branches: [research/vix-rsi-rulebook-20260828]
    paths:
      - 'research/rulebook_v3/**'
      - '.github/workflows/custom-market-modes-audit.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: custom-market-modes-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy yfinance requests gspread
      - name: Syntax check
        run: PYTHONPATH=.:leadership/research python -m py_compile research/rulebook_v3/audit_custom_market_modes.py
      - name: Run audit
        run: |
          PYTHONPATH=.:leadership/research python research/rulebook_v3/audit_custom_market_modes.py \
            --root . \
            --output research/custom_market_modes/results \
            --asof 2026-08-28
      - name: Verify outputs
        run: |
          test -s research/custom_market_modes/results/summary.json
          test -s research/custom_market_modes/results/threshold_scan.csv
          test -s research/custom_market_modes/results/combo_scan.csv
          test -s research/custom_market_modes/results/simulation_comparison.csv
          test -s research/custom_market_modes/results/indicator_spearman.csv
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-market-modes-audit
          retention-days: 30
          if-no-files-found: warn
          path: research/custom_market_modes/results/
