name: Options robustness research

on:
  push:
    branches:
      - research/options-intelligence-validation-20260905
    paths:
      - '.github/workflows/options-robustness-research.yml'

permissions:
  contents: write

concurrency:
  group: options-robustness-research-20260905
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/options-intelligence-validation-20260905
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check pandas numpy scipy
      - name: Syntax check
        run: python -m py_compile research/options-intelligence-20260905/validate_robustness.py
      - name: Run robustness validation
        run: python research/options-intelligence-20260905/validate_robustness.py
      - name: Commit research outputs only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/options-intelligence-20260905/ROBUSTNESS.md \
                  research/options-intelligence-20260905/robustness_summary.json \
                  research/options-intelligence-20260905/threshold_sweep.csv \
                  research/options-intelligence-20260905/score_variant_validation.csv \
                  research/options-intelligence-20260905/flip_strata.csv \
                  research/options-intelligence-20260905/flip_sector_neutral.csv \
                  research/options-intelligence-20260905/wall_diagnostics.csv \
                  research/options-intelligence-20260905/ablation_lodo.csv \
                  research/options-intelligence-20260905/ablation_lodo_by_date.csv
          if git diff --cached --quiet; then
            echo "No research output changes"
            exit 0
          fi
          git commit -m "Complete Options robustness validation"
          git push origin HEAD:research/options-intelligence-validation-20260905
