name: ONeil Supply Dry-up Research

on:
  push:
    branches:
      - research/sector-stock-leadership-20260826
    paths:
      - leadership/research/validate_oneil_supply_dryup.py
      - .github/workflows/oneil-supply-dryup-research.yml
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: t1
            exclude_first: 0
            max_tickers: 1500
          - label: t2
            exclude_first: 1500
            max_tickers: 1500
          - label: t3
            exclude_first: 3000
            max_tickers: 1500
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy yfinance
      - name: Syntax check
        run: python -m py_compile leadership/research/validate_oneil_supply_dryup.py
      - name: Run fixed ONeil supply dry-up research
        run: |
          python leadership/research/validate_oneil_supply_dryup.py \
            --root . \
            --output leadership/research/oneil_supply_${{ matrix.label }} \
            --analysis-start 2016-01-04 \
            --analysis-end 2026-06-20 \
            --exclude-first ${{ matrix.exclude_first }} \
            --max-tickers ${{ matrix.max_tickers }} \
            --batch-size 75 \
            --min-members 3
      - name: Upload research outputs
        uses: actions/upload-artifact@v4
        with:
          name: oneil-supply-${{ matrix.label }}
          path: leadership/research/oneil_supply_${{ matrix.label }}/
          retention-days: 7
