# Research-only audit. Does not modify main, production data, or dashboard outputs.
# Trigger after workflow creation.
name: Emerging Fresh Radar Rotation

on:
  push:
    branches:
      - research/leader-entry-delay-audit-20260904
    paths:
      - leadership/research/audit_emerging_fresh_radar_rotation.py
      - .github/workflows/emerging-fresh-radar-rotation.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy yfinance
      - name: Syntax check
        run: python -m py_compile leadership/research/audit_emerging_fresh_radar_rotation.py
      - name: Run fresh radar rotation audit
        env:
          PYTHONPATH: .:leadership/research
        run: |
          python leadership/research/audit_emerging_fresh_radar_rotation.py \
            --root . \
            --output leadership/research/emerging_fresh_radar_rotation_output \
            --analysis-start 2016-01-04 \
            --analysis-end 2026-09-02 \
            --max-tickers 6000 \
            --batch-size 75
      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emerging-fresh-radar-rotation
          path: leadership/research/emerging_fresh_radar_rotation_output/
          retention-days: 14
