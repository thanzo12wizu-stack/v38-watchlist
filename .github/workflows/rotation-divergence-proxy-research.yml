name: Rotation Divergence Proxy Research

on:
  workflow_dispatch:
  push:
    branches:
      - research/rotation-exact-flow-internals-20260831
    paths:
      - leadership/research/rotation_divergence_proxy_backtest.py
      - leadership/research/rotation_exact_flow_research.py
      - .github/workflows/rotation-divergence-proxy-research.yml

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy yfinance requests openpyxl
      - name: Syntax check
        run: python -m py_compile leadership/research/rotation_divergence_proxy_backtest.py leadership/research/rotation_exact_flow_research.py
      - name: Run exact-flow divergence proxy backtest
        run: |
          python leadership/research/rotation_divergence_proxy_backtest.py \
            --analysis-start 2022-01-03 \
            --analysis-end 2026-08-31 \
            --download-start 2021-01-01 \
            --output leadership/research/rotation_divergence_proxy_outputs
      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rotation-divergence-proxy-research
          path: leadership/research/rotation_divergence_proxy_outputs/
          if-no-files-found: warn
          retention-days: 7
