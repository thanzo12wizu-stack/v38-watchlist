name: Options time tests once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/options-time-tests-once.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Test Options time and direction
        run: |
          python -m py_compile tools/build_options_positioning.py tools/build_options_positioning_directional.py tools/build_options_intelligence.py
          node --check options-intelligence.js
          pytest -q tests/test_options_positioning_quality.py tests/test_options_intelligence.py tests/test_options_time_direction.py
