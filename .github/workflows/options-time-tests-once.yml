name: Options time tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'options-intelligence.js'
      - 'options-intelligence.html'
      - 'options-intelligence.css'
      - 'options-intelligence-period.css'
      - 'tools/build_options_positioning.py'
      - 'tools/build_options_positioning_directional.py'
      - 'tools/build_options_daily_liquid.py'
      - 'tools/build_options_intelligence.py'
      - 'tests/test_options_positioning_quality.py'
      - 'tests/test_options_daily_liquid.py'
      - 'tests/test_options_intelligence.py'
      - 'tests/test_options_time_direction.py'
      - '.github/workflows/options-time-tests-once.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Test Options time, direction, daily universe and UI syntax
        run: |
          python -m py_compile tools/build_options_positioning.py \
            tools/build_options_positioning_directional.py \
            tools/build_options_daily_liquid.py \
            tools/build_options_intelligence.py
          node --check options-intelligence.js
          pytest -q tests/test_options_positioning_quality.py \
            tests/test_options_daily_liquid.py \
            tests/test_options_intelligence.py \
            tests/test_options_time_direction.py
      - name: Report liquid Options universe without provider calls
        run: python tools/build_options_daily_liquid.py --count-only
