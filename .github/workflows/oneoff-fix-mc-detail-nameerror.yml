name: One-off MC detail NameError fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix MC detail render NameError'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Restore removed bear-chip locals only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('build_dashboard.py')
          s = p.read_text(encoding='utf-8')
          needle = '    _bchips = ("".join(f\'<span class="bfl on">{lab}</span>\' for lab in _blit)\n'
          if s.count(needle) != 1:
              raise SystemExit(f'unexpected _bchips anchor count: {s.count(needle)}')
          pos = s.index(needle)
          nearby = s[max(0, pos-1500):pos]
          if '_blit = [lab for lab, on in _bf if on]' in nearby:
              raise SystemExit('locals already restored; refusing duplicate insertion')
          insert = (
              '    _bf = aux.get("bear_flags", [])\n'
              '    _blit = [lab for lab, on in _bf if on]\n'
              '    _boff = [lab for lab, on in _bf if not on]\n'
          )
          s = s[:pos] + insert + s[pos:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Syntax and touched-region check
        run: |
          python -m py_compile build_dashboard.py
          python - <<'PY'
          from pathlib import Path
          s = Path('build_dashboard.py').read_text(encoding='utf-8')
          pos = s.index('    _bchips = ("".join')
          region = s[pos-600:pos+1200]
          for name in ('_bf = aux.get("bear_flags", [])', '_blit = [lab for lab, on in _bf if on]', '_boff = [lab for lab, on in _bf if not on]'):
              assert name in region, name
          assert 'for lab in _blit' in region
          assert 'for lab in _boff' in region
          print('MC detail locals OK')
          PY
      - name: Production-equivalent preflight tests
        run: |
          python -m pip install -q -r requirements.txt pytest
          python -m pytest -q \
            tests/test_dashboard_build_regressions.py \
            tests/test_options_positioning_quality.py \
            tests/test_eps_acceleration.py
      - name: Commit only build_dashboard.py
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build_dashboard.py
          test "$(git diff --cached --name-only)" = "build_dashboard.py"
          git commit -m 'Fix MC detail render NameError'
          git push origin HEAD:main
