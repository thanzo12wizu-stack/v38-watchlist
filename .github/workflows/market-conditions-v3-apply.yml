name: Apply Market Conditions v3 on implementation branch

on:
  push:
    branches:
      - market-conditions-v3
    paths:
      - 'tools/apply_market_conditions_v3.py'
      - '.github/workflows/market-conditions-v3-apply.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: market-conditions-v3
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Apply surgical patch
        run: python tools/apply_market_conditions_v3.py
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Compile and regression tests
        run: |
          python -m py_compile build_dashboard.py
          pytest -q tests/test_dashboard_build_regressions.py tests/test_eps_acceleration.py
          python build_dashboard.py --selftest
      - name: Verify scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- build_dashboard.py | grep -q 'MARKET CONDITIONS'
          git diff -- build_dashboard.py | grep -q 'NQSAR（短期）'
          git diff -- build_dashboard.py | grep -q 'RECOVERY'
      - name: Persist patched builder on branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build_dashboard.py
          git commit -m 'Implement independent Market Conditions axis' || exit 0
          git push origin HEAD:market-conditions-v3
