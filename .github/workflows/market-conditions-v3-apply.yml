name: Apply Market Conditions v3 on PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Apply surgical patch
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'MC_BROAD_ETFS =' build_dashboard.py; then
            echo 'Market Conditions patch already applied'
          else
            python tools/apply_market_conditions_v3.py
          fi
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Compile and regression tests
        run: |
          python -m py_compile build_dashboard.py
          pytest -q tests/test_dashboard_build_regressions.py tests/test_eps_acceleration.py
          python build_dashboard.py --selftest
      - name: Verify scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'MARKET CONDITIONS' build_dashboard.py
          grep -q 'NQSAR（短期）' build_dashboard.py
          grep -q 'RECOVERY' build_dashboard.py
      - name: Persist patched builder on PR branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- build_dashboard.py; then
            echo 'No builder changes to persist'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build_dashboard.py
          test "$(git diff --cached --name-only)" = "build_dashboard.py"
          git commit -m 'Implement independent Market Conditions axis'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
