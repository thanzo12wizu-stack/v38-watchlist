name: Options full refresh once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/options-full-refresh-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch production Options workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run options.yml --repo thanzo12wizu-stack/v38-watchlist --ref main
