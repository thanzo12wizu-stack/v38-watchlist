name: Rotation Theme56 ETFcom Holdings Paging Probe

on:
  workflow_dispatch:
  push:
    branches:
      - research/rotation-exact-flow-internals-20260831
    paths:
      - leadership/research/rotation_theme56_etfcom_holdings_paging_probe.py
      - .github/workflows/rotation-theme56-etfcom-holdings-paging-probe.yml

permissions:
  contents: write

concurrency:
  group: rotation-theme56-etfcom-holdings-paging-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/rotation-exact-flow-internals-20260831
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Run probe
        run: python leadership/research/rotation_theme56_etfcom_holdings_paging_probe.py
      - name: Persist output
        shell: bash
        run: |
          set -euo pipefail
          SRC="leadership/research/rotation_theme56_etfcom_holdings_paging_probe"
          TMP="$(mktemp -d)/probe"
          cp -a "$SRC" "$TMP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin research/rotation-exact-flow-internals-20260831
            git reset --hard origin/research/rotation-exact-flow-internals-20260831
            rm -rf "$SRC"
            mkdir -p "$(dirname "$SRC")"
            cp -a "$TMP" "$SRC"
            git add "$SRC"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "research: record ETF.com holdings paging probe"
            if git push origin HEAD:research/rotation-exact-flow-internals-20260831; then exit 0; fi
          done
          exit 1
