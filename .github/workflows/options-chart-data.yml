name: Options chart data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/build_options_chart_data.py
      - tools/build_options_chart_history_shards.py
      - options-chart.js
      - options-chart-bridge.js
      - options-chart.css
      - options-intelligence.html

permissions:
  contents: write

concurrency:
  group: options-chart-data-main
  cancel-in-progress: true

jobs:
  chart-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Validate chart UI syntax
        run: |
          node --check options-chart.js
          node --check options-chart-bridge.js
          python -m py_compile tools/validate_options_release.py

      - name: Install
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Build Options chart datasets
        env:
          V38_OPT_JSON: options_positioning.json
          V38_OPT_HISTORY: options_history.csv
          V38_OPT_SCAN_HISTORY: options_scan_history.csv
          V38_OPT_CHART_JSON: options_chart_data.json
          V38_OPT_CHART_HISTORY_DIR: options_chart_history
          V38_OPT_CHART_HISTORY_MAX: '260'
          V38_OPT_CHART_PERIOD: 1y
          V38_OPT_CHART_WORKERS: '3'
          V38_OPT_CHART_ATTEMPTS: '2'
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/build_options_chart_data.py tools/build_options_chart_history_shards.py
          python tools/build_options_chart_data.py
          python tools/build_options_chart_history_shards.py

          target="$(python - <<'PY'
          import json
          print(str(json.load(open("options_positioning.json", encoding="utf-8")).get("session_date") or ""))
          PY
          )"
          [[ -n "$target" ]] || { echo "::error::Options positioning has no session_date"; exit 1; }

          # Chart-only repair is publishable only while the rest of the Options
          # snapshot is still a complete same-session release.
          python tools/validate_options_release.py \
            --mode release \
            --expected-session "$target" \
            --write-manifest options_release_manifest.json

          [[ -d release/options ]] || {
            echo "::error::release/options does not exist; run Full production refresh first"
            exit 1
          }

          cp options_chart_data.json release/options/options_chart_data.json
          rm -rf release/options/options_chart_history
          mkdir -p release/options/options_chart_history
          cp -a options_chart_history/. release/options/options_chart_history/
          cp options_release_manifest.json release/options/options_release_manifest.json

      - name: Commit chart artifacts only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- options_chart_data.json options_release_manifest.json
          git add -A options_chart_history \
            release/options/options_chart_data.json \
            release/options/options_chart_history \
            release/options/options_release_manifest.json

          unexpected="$(git diff --cached --name-only | while IFS= read -r changed; do
            case "$changed" in
              options_chart_data.json|options_release_manifest.json|options_chart_history/*|release/options/options_chart_data.json|release/options/options_chart_history/*|release/options/options_release_manifest.json) ;;
              *) echo "$changed" ;;
            esac
          done)"
          if [[ -n "$unexpected" ]]; then
            echo "::error::Chart workflow attempted to stage files outside its ownership: $unexpected"
            exit 1
          fi

          if git diff --staged --quiet; then
            echo "no chart data changes"
            exit 0
          fi

          git commit -m "Refresh complete Options chart snapshot $(date +%F)"
          for a in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            sleep $((a*2))
          done
          exit 1
