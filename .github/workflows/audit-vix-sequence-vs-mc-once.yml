name: One-off audit VIX sequence vs MC

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-vix-sequence-vs-mc-once.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt
      - name: Compare implemented VIX sequence with 15y Market Conditions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import numpy as np
          import pandas as pd
          import yfinance as yf
          import build_dashboard as bd

          broad=["SPY","QQQ","DIA","IWM","MDY","RSP","VTI","QQQE"]
          sectors=["XLK","XLY","VOX","XLF","XLI","XLE","XLB","XLV","XLP","XLU","XLRE"]
          industry=["SOXX","SMH","XSD","IGV","SKYY","CIBR","HACK","FDN","XBI","IBB","PPH","IHI","IHF","KRE","KBE","XRT","ITB","XHB","IYT","JETS","ITA","XAR","ROBO","XME","COPX","PICK","GDX","SIL","LIT","XOP","OIH","URA","TAN","ICLN","VNQ","MOO","PHO","PAVE"]
          tickers=list(dict.fromkeys(broad+sectors+industry)); assert len(tickers)==57

          px=yf.download(tickers,start='2004-01-01',end='2026-08-25',auto_adjust=True,progress=False,threads=True)
          c=px['Close'].copy(); c.index=pd.to_datetime(c.index).tz_localize(None); c=c.reindex(columns=tickers)
          vx=yf.download('^VIX',start='1990-01-01',end='2026-08-25',auto_adjust=False,progress=False,threads=False)
          if isinstance(vx.columns,pd.MultiIndex):
              vx=vx.xs('^VIX',axis=1,level=1,drop_level=True)
          vx.index=pd.to_datetime(vx.index).tz_localize(None)

          # Exact current production VIX sequence implementation.
          vc=bd.build_vix_cycle({'^VIX':vx},asof=pd.Timestamp('2026-08-24'))
          print('=== VIX_CYCLE_STATUS ===')
          print('available',vc.get('available'),'state',vc.get('state'),'history_complete',vc.get('history_complete'),'reason',vc.get('reason'))
          print('latest',vc.get('latest'))

          # Proposed 15y Market Conditions temperature, preserving current 57 ETF x 12 raw score.
          def part(mask): return mask.mean(axis=1,skipna=True)*100.0
          ma10=c.rolling(10).mean(); ma20=c.rolling(20).mean(); ma50=c.rolling(50).mean(); ma200=c.rolling(200).mean()
          p={}
          for n,h in [('ret5',5),('ret21',21),('ret63',63),('ret252',252)]:
              p[n]=part((c/c.shift(h)-1>0).where(c.shift(h).notna()&c.notna()))
          p['above10']=part((c>ma10).where(ma10.notna()&c.notna()))
          p['above20']=part((c>ma20).where(ma20.notna()&c.notna()))
          p['above50']=part((c>ma50).where(ma50.notna()&c.notna()))
          p['above200']=part((c>ma200).where(ma200.notna()&c.notna()))
          p['ma20_gt_50']=part((ma20>ma50).where(ma20.notna()&ma50.notna()))
          p['ma50_gt_200']=part((ma50>ma200).where(ma50.notna()&ma200.notna()))
          hi252=c.rolling(252,min_periods=200).max(); dd=c/hi252-1
          p['dd_score']=((dd+0.30)/0.25*100).clip(0,100).mean(axis=1,skipna=True)
          p['within10']=part((dd>=-0.10).where(dd.notna()))
          keys=('ret5','ret21','ret63','ret252','above10','above20','above50','above200','ma20_gt_50','ma50_gt_200','dd_score','within10')
          raw=pd.concat({k:p[k] for k in keys},axis=1).mean(axis=1,skipna=True).ewm(span=2,adjust=False).mean()
          base=raw.shift(1); W=252*15
          mu=base.rolling(W,min_periods=W).mean(); sd=base.rolling(W,min_periods=W).std(ddof=0)
          z=(raw-mu)/sd.replace(0,np.nan)
          temp=100/(1+np.exp(-np.log(3.0)*z))
          d5=temp-temp.shift(5)
          q=c['QQQ']

          def at(s,ds):
              t=pd.Timestamp(ds); ix=s.index[s.index<=t]
              return float(s.loc[ix[-1]]) if len(ix) and pd.notna(s.loc[ix[-1]]) else np.nan
          def trading_lag(d1,d2):
              if d1 is None or d2 is None: return np.nan
              a=pd.Timestamp(d1); b=pd.Timestamp(d2)
              if a==b: return 0
              lo=min(a,b); hi=max(a,b)
              n=int(((q.index>lo)&(q.index<=hi)).sum())
              return n if b>=a else -n

          # Reconstruct daily phase from the production signal stream.
          signals=sorted(vc.get('signals') or [],key=lambda x:x.get('date',''))
          phase=pd.Series('NORMAL',index=c.index,dtype=object)
          cur='NORMAL'; j=0
          transitions={'EVENT':'EXTREME','ROLLOVER':'ROLLOVER','BOTTOM':'BOTTOM','RE-EXTREME':'RE-EXTREME','REARM':'NORMAL'}
          for dt in phase.index:
              ds=dt.strftime('%Y-%m-%d')
              while j<len(signals) and signals[j].get('date','')<=ds:
                  typ=signals[j].get('type')
                  if typ in transitions: cur=transitions[typ]
                  j+=1
              phase.at[dt]=cur

          print('=== PRODUCTION_VIX_HISTORY_2019_2026 ===')
          rows=[]
          for h in vc.get('history') or []:
              bd0=h.get('bottom'); ev=h.get('event'); ro=h.get('rollover')
              if not bd0 or bd0<'2019-01-01': continue
              # Local QQQ low from event through 20 sessions after BOTTOM.
              evd=pd.Timestamp(ev); bdd=pd.Timestamp(bd0)
              after=q.index[q.index>bdd][:20]
              end=after[-1] if len(after) else bdd
              seg=q.loc[(q.index>=evd)&(q.index<=end)].dropna()
              lowd=seg.idxmin() if len(seg) else pd.NaT
              rows.append([ev,ro,bd0,h.get('peak'),h.get('days'),
                           at(temp,ev),at(temp,ro),at(temp,bd0),at(d5,bd0),
                           lowd.strftime('%Y-%m-%d') if pd.notna(lowd) else None,
                           trading_lag(bdd,lowd) if pd.notna(lowd) else np.nan,
                           (float(q.loc[lowd]/q.loc[evd]-1)*100 if pd.notna(lowd) and evd in q.index else np.nan)])
          cols=['EVENT','ROLL','BOTTOM','VIX_PEAK','EVENT_DAYS','MC_EVENT','MC_ROLL','MC_BOTTOM','MC_D5_BOTTOM','QQQ_LOCAL_LOW','BOTTOM_TO_LOW_TD','QQQ_EVENT_TO_LOW_PCT']
          hist=pd.DataFrame(rows,columns=cols)
          print(hist.round(2).to_string(index=False))

          print('=== MAJOR_LOW_COVERAGE ===')
          major=['2020-03-23','2022-06-16','2022-10-13','2025-04-08']
          bottoms=[pd.Timestamp(h['bottom']) for h in vc.get('history') or [] if h.get('bottom')]
          out=[]
          for ds in major:
              t=pd.Timestamp(ds)
              near=min(bottoms,key=lambda x:abs((x-t).days)) if bottoms else None
              out.append([ds,near.strftime('%Y-%m-%d') if near is not None else None,
                          trading_lag(t,near) if near is not None else np.nan,
                          at(temp,ds),at(d5,ds),at(temp,near) if near is not None else np.nan,
                          phase.asof(t) if len(phase) else None])
          print(pd.DataFrame(out,columns=['QQQ_LOW','NEAREST_VIX_BOTTOM','LOW_TO_BOTTOM_TD','MC_AT_LOW','MC_D5_AT_LOW','MC_AT_VIX_BOTTOM','VIX_PHASE_AT_LOW']).round(2).to_string(index=False))

          print('=== LOW_MC_PHASE_DISTRIBUTION ===')
          m=temp.notna()&(temp<=20)&(temp.index>='2019-01-01')
          print(pd.DataFrame({'phase':phase[m]}).value_counts().to_string())
          print('low_mc_days',int(m.sum()))

          # Potential contradictions: bottom confirmation while internals still very strong; severe MC with no active VIX event.
          print('=== CONSISTENCY_FLAGS ===')
          flags=[]
          for h in vc.get('history') or []:
              b=h.get('bottom')
              if not b or b<'2019-01-01': continue
              tb=at(temp,b); db=at(d5,b)
              if np.isfinite(tb) and tb>=65:
                  flags.append(['VIX_BOTTOM_WHILE_MC_STRONG',b,tb,db])
          severe=temp.notna()&(temp<=20)&(temp.index>='2019-01-01')&(phase=='NORMAL')
          # collapse severe NORMAL days into contiguous episodes
          dates=list(temp.index[severe]); episodes=[]
          if dates:
              st=pr=dates[0]
              for dt in dates[1:]:
                  if (dt-pr).days>4:
                      episodes.append((st,pr)); st=dt
                  pr=dt
              episodes.append((st,pr))
          for st,en in episodes:
              flags.append(['MC_LE20_WHILE_VIX_NORMAL',st.strftime('%Y-%m-%d'),round(float(temp.loc[st:en].min()),2),f'{st.date()}..{en.date()}'])
          if flags:
              for f in flags: print(*f)
          else:
              print('NONE')
          PY
