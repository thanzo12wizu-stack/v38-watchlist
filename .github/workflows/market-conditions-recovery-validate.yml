name: One-off Market Conditions recovery validation

on:
  push:
    branches:
      - analysis-market-conditions-compare
    paths:
      - 'tools/market_conditions_recovery_validate.py'
      - '.github/workflows/market-conditions-recovery-validate.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install analysis dependencies
        run: pip install --disable-pip-version-check yfinance pandas numpy
      - name: Run recovery-focused validation
        working-directory: tools
        run: python market_conditions_recovery_validate.py
      - name: Persist validation results on analysis branch only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mv tools/market_conditions_recovery_validation.json .
          mv tools/market_conditions_recovery_validation_compact.json .
          git add market_conditions_recovery_validation.json market_conditions_recovery_validation_compact.json
          if git diff --cached --quiet; then
            echo "No result changes"
            exit 0
          fi
          git commit -m "Persist recovery-focused Market Conditions validation"
          git push origin HEAD:analysis-market-conditions-compare
