# Research-only historical audit. Does not modify main, Pages, or dashboard outputs.
name: Historical Leader Capture 2016-2020 Research

on:
  push:
    branches:
      - research/sector-stock-leadership-20260826
    paths:
      - .github/workflows/historical-leader-capture-2016-2020-research.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy yfinance
      - name: Syntax check
        run: |
          python -m py_compile leadership/research/audit_annual_leader_releadership_capture.py
          python -m py_compile leadership/research/audit_core_releadership_volume_decomposition.py
          python -m py_compile leadership/research/audit_five_year_leader_capture.py
      - name: Run historical leader capture audit
        env:
          PYTHONPATH: .:leadership/research
        run: |
          python leadership/research/audit_annual_leader_releadership_capture.py \
            --root . \
            --output leadership/research/historical_leader_capture_2016_2020 \
            --analysis-start 2015-01-02 \
            --analysis-end 2020-12-31 \
            --leader-start 2016-01-04 \
            --max-tickers 6000 \
            --batch-size 75
      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-leader-capture-2016-2020
          path: leadership/research/historical_leader_capture_2016_2020/
          retention-days: 14
