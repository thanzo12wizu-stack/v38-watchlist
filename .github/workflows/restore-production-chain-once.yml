name: Finish RSI semantic consistency once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-production-chain-once.yml'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: finish-rsi-semantic-consistency-once
  cancel-in-progress: false

jobs:
  patch-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Fix final Reset monitor overwrite and strengthen atomic gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'build_v38_sleeve_refresh.py',
              '        "active_positions": sum(str(row.get("status") or "") == "ACTIVE_POSITION" for row in visible),',
              '        "active_positions": len(reset.get("positions", [])),',
          )

          validator = Path('scripts/validate_atomic_publish.py')
          text = validator.read_text(encoding='utf-8')
          anchor = '''    _require(\n        quality.get("coverage_ok") is True,\n        "ATOMIC_PUBLISH_RSI_RESET_COVERAGE_NOT_READY",\n        json.dumps(quality, ensure_ascii=False, sort_keys=True),\n    )\n\n'''
          insert = anchor + '''    reset_positions = [p for p in reset.get("positions", []) if isinstance(p, dict)]\n    reset_summary = reset.get("monitor_summary") if isinstance(reset.get("monitor_summary"), dict) else {}\n    reset_count = reset.get("position_count")\n    _require(\n        isinstance(reset_count, int)\n        and reset_count == len(reset_positions)\n        and reset_summary.get("active_positions") == len(reset_positions),\n        "ATOMIC_PUBLISH_RSI_RESET_POSITION_MISMATCH",\n        json.dumps(\n            {\n                "position_count": reset_count,\n                "positions": [p.get("symbol") for p in reset_positions],\n                "active_positions": reset_summary.get("active_positions"),\n            },\n            ensure_ascii=False,\n            sort_keys=True,\n        ),\n    )\n\n    live_reset = live.get("panic_reset") if isinstance(live.get("panic_reset"), dict) else {}\n    live_reset_positions = [p for p in live_reset.get("positions", []) if isinstance(p, dict)]\n    reset_symbols = sorted(str(p.get("symbol") or "") for p in reset_positions if str(p.get("symbol") or ""))\n    live_reset_symbols = sorted(str(p.get("symbol") or "") for p in live_reset_positions if str(p.get("symbol") or ""))\n    _require(\n        live_reset.get("position_count") == len(live_reset_positions)\n        and live_reset.get("position_count") == reset_count\n        and live_reset_symbols == reset_symbols,\n        "ATOMIC_PUBLISH_RSI_RESET_V38_MISMATCH",\n        json.dumps(\n            {\n                "sleeve_count": reset_count,\n                "sleeve_symbols": reset_symbols,\n                "v38_count": live_reset.get("position_count"),\n                "v38_symbols": live_reset_symbols,\n            },\n            ensure_ascii=False,\n            sort_keys=True,\n        ),\n    )\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit('atomic validator Reset coverage anchor mismatch')
          validator.write_text(text.replace(anchor, insert, 1), encoding='utf-8')

          test = Path('tests/test_atomic_publish_gate.py')
          text = test.read_text(encoding='utf-8')
          replace_once(
              'tests/test_atomic_publish_gate.py',
              '            "gross100_allocation": {"status": "LIVE ALLOCATION READY"},',
              '            "gross100_allocation": {"status": "LIVE ALLOCATION READY"},\n'
              '            "panic_reset": {"position_count": 1, "positions": [{"symbol": "VIK"}]},',
          )
          text = test.read_text(encoding='utf-8')
          old_reset = '''            "rsi_reset": {\n                "status": "READY",\n                "asof": asof,\n                "download_quality": {"coverage_ok": True},\n                "pending": {"entries": []},\n            },'''
          new_reset = '''            "rsi_reset": {\n                "status": "READY",\n                "asof": asof,\n                "position_count": 1,\n                "positions": [{"symbol": "VIK"}],\n                "monitor_summary": {"active_positions": 1},\n                "download_quality": {"coverage_ok": True},\n                "pending": {"entries": []},\n            },'''
          if text.count(old_reset) != 1:
              raise SystemExit('atomic fixture Reset anchor mismatch')
          text = text.replace(old_reset, new_reset, 1)
          text += '''\n\ndef test_atomic_publish_gate_rejects_reset_active_count_mismatch(tmp_path: Path):\n    _atomic_fixture(tmp_path)\n    sleeve = json.loads((tmp_path / "v38-sleeve-state.json").read_text(encoding="utf-8"))\n    sleeve["rsi_reset"]["monitor_summary"]["active_positions"] = 0\n    _write(tmp_path / "v38-sleeve-state.json", sleeve)\n    with pytest.raises(AtomicPublishError, match="ATOMIC_PUBLISH_RSI_RESET_POSITION_MISMATCH"):\n        validate_atomic_live_snapshot(tmp_path)\n\n\ndef test_atomic_publish_gate_rejects_reset_v38_holding_mismatch(tmp_path: Path):\n    _atomic_fixture(tmp_path)\n    live = json.loads((tmp_path / "v38-live-state.json").read_text(encoding="utf-8"))\n    live["panic_reset"] = {"position_count": 1, "positions": [{"symbol": "RCL"}]}\n    _write(tmp_path / "v38-live-state.json", live)\n    with pytest.raises(AtomicPublishError, match="ATOMIC_PUBLISH_RSI_RESET_V38_MISMATCH"):\n        validate_atomic_live_snapshot(tmp_path)\n'''
          test.write_text(text, encoding='utf-8')

          site_test = Path('tests/test_v38_site_consistency.py')
          text = site_test.read_text(encoding='utf-8')
          if 'build_v38_sleeve_refresh.py' not in text:
              text += '''\n\ndef test_reset_display_filter_preserves_actual_active_position_count():\n    text = (ROOT / "build_v38_sleeve_refresh.py").read_text(encoding="utf-8")\n    assert '\"active_positions\": len(reset.get(\"positions\", []))' in text\n    assert 'sum(str(row.get(\"status\") or \"\") == \"ACTIVE_POSITION\" for row in visible)' not in text\n'''
          site_test.write_text(text, encoding='utf-8')
          PY

      - name: Run targeted semantic consistency tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt pytest
          python -m py_compile build_v38_sleeve_refresh.py scripts/validate_atomic_publish.py
          pytest -q \
            tests/test_v38_site_consistency.py \
            tests/test_atomic_publish_gate.py \
            tests/test_v38_sleeve_refresh.py \
            tests/test_v38_sleeve_live.py \
            tests/test_v38_companion.py

      - name: Commit semantic consistency guards
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build_v38_sleeve_refresh.py scripts/validate_atomic_publish.py tests/test_atomic_publish_gate.py tests/test_v38_site_consistency.py
          git diff --cached --check
          git diff --cached --name-only
          git commit -m 'Enforce RSI holdings consistency before publish'
          git push origin HEAD:main

      - name: Dispatch full downstream verification
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run production-downstream-chain.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'Full downstream chain dispatched with strengthened semantic gate.'
