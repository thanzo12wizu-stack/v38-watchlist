name: Validate downstream production chain once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-production-chain-once.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

concurrency:
  group: validate-downstream-production-chain-once
  cancel-in-progress: false

jobs:
  validate-and-dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Validate production ownership and wiring
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest
          pytest -q \
            tests/test_atomic_pipeline_workflows.py \
            tests/test_atomic_publish_gate.py \
            tests/test_public_site_export.py

      - name: Dispatch downstream chain once
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run production-downstream-chain.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo 'Downstream production chain dispatched for end-to-end verification.'
