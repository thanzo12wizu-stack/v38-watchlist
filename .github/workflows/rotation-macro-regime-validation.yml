name: Rotation macro regime validation

on:
  workflow_dispatch:
  push:
    branches:
      - research/rotation-validation-20260905-work
    paths:
      - leadership/research/validate_rotation_macro_regimes_v2.py
      - leadership/research/validate_rotation_macro_regimes_v3.py
      - leadership/research/summarize_rotation_macro_regimes.py
      - .github/workflows/rotation-macro-regime-validation.yml

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy requests yfinance
      - name: Download audited PIT panel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/pit
          gh api repos/${{ github.repository }}/actions/artifacts/9743199098/zip > /tmp/pit.zip
          unzip -q /tmp/pit.zip -d /tmp/pit
          test -s /tmp/pit/distribution_pit_panel_cov80.csv
      - name: Syntax check
        run: python -m py_compile leadership/research/validate_rotation_macro_regimes_v2.py leadership/research/validate_rotation_macro_regimes_v3.py leadership/research/summarize_rotation_macro_regimes.py
      - name: Run macro regime validation
        run: |
          python leadership/research/validate_rotation_macro_regimes_v3.py \
            --panel /tmp/pit/distribution_pit_panel_cov80.csv \
            --output leadership/research/rotation_macro_regime_outputs
          python leadership/research/summarize_rotation_macro_regimes.py \
            --report leadership/research/rotation_macro_regime_outputs/macro_regime_report.json \
            --output leadership/research/rotation_macro_regime_outputs/macro_regime_eligible_summary.json
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rotation-macro-regime-validation-v3
          path: leadership/research/rotation_macro_regime_outputs/
          if-no-files-found: warn
          retention-days: 14
