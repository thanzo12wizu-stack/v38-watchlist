# Research-only audit. Does not modify main, production data, or dashboard outputs.
name: Major Leader Entry Delay Audit

on:
  push:
    branches:
      - research/leader-entry-delay-audit-20260904
    paths:
      - leadership/research/audit_major_leader_entry_delay.py
      - .github/workflows/major-leader-entry-delay-audit.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy yfinance
      - name: Syntax check
        run: |
          python -m py_compile leadership/research/audit_major_leader_entry_delay.py
          python -m py_compile leadership/research/audit_ordinary_stock_exit_trail.py
          python -m py_compile leadership/research/audit_ordinary_stock_theme_leave_one_out.py
      - name: Run major leader delay decomposition
        env:
          PYTHONPATH: .:leadership/research
        run: |
          python leadership/research/audit_major_leader_entry_delay.py \
            --root . \
            --output leadership/research/major_leader_entry_delay_output \
            --analysis-start 2016-01-04 \
            --analysis-end 2026-09-02 \
            --max-tickers 6000 \
            --batch-size 75
      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: major-leader-entry-delay-audit
          path: leadership/research/major_leader_entry_delay_output/
          retention-days: 14
