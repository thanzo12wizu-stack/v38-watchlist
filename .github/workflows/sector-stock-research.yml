name: Sector stock leadership research

on:
  push:
    branches:
      - research/sector-stock-leadership-20260826
    paths:
      - 'leadership/research/validate_sector_stock_stack.py'
      - '.github/workflows/sector-stock-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy yfinance
      - name: Syntax check
        run: python -m py_compile leadership/research/validate_sector_stock_stack.py
      - name: Run sector-stock hierarchy validation
        run: |
          python leadership/research/validate_sector_stock_stack.py \
            --root . \
            --output leadership/research/sector_stock_output \
            --analysis-start 2016-01-04 \
            --analysis-end 2026-06-20 \
            --max-tickers 1500 \
            --batch-size 75 \
            --min-members 3
      - name: Upload research outputs
        uses: actions/upload-artifact@v4
        with:
          name: sector-stock-leadership-validation
          path: leadership/research/sector_stock_output/
          retention-days: 7
