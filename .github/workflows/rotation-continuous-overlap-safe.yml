name: Rotation continuous overlap-safe validation

on:
  workflow_dispatch:
  push:
    branches:
      - research/rotation-validation-20260905-work
    paths:
      - leadership/research/validate_rotation_continuous_robustness.py
      - .github/workflows/rotation-continuous-overlap-safe.yml

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy statsmodels
      - name: Download audited PIT panel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/pit
          gh api repos/${{ github.repository }}/actions/artifacts/9743199098/zip > /tmp/pit.zip
          unzip -q /tmp/pit.zip -d /tmp/pit
          test -s /tmp/pit/distribution_pit_panel_cov80.csv
      - name: Run overlap-safe validation
        run: |
          python leadership/research/validate_rotation_continuous_robustness.py \
            --panel /tmp/pit/distribution_pit_panel_cov80.csv \
            --output leadership/research/rotation_continuous_robustness_outputs
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rotation-continuous-overlap-safe
          path: leadership/research/rotation_continuous_robustness_outputs/
          if-no-files-found: warn
          retention-days: 14
