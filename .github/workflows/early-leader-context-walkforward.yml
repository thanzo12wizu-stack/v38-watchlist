name: Early Leader Context Walkforward

on:
  push:
    branches:
      - research/leader-entry-delay-audit-20260904
    paths:
      - leadership/research/audit_early_leader_context_walkforward.py
      - .github/workflows/early-leader-context-walkforward.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy yfinance
      - name: Syntax check
        run: |
          python -m py_compile leadership/research/audit_early_leader_context_walkforward.py
          python -m py_compile leadership/research/audit_radar_cohort_discriminator.py
      - name: Run context walk-forward
        env:
          PYTHONPATH: .:leadership/research
        run: |
          python leadership/research/audit_early_leader_context_walkforward.py \
            --root . \
            --output leadership/research/early_leader_context_walkforward_output \
            --analysis-start 2016-01-04 \
            --analysis-end 2026-09-02 \
            --max-tickers 6000 \
            --batch-size 75
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: early-leader-context-walkforward
          path: leadership/research/early_leader_context_walkforward_output/
          retention-days: 14
