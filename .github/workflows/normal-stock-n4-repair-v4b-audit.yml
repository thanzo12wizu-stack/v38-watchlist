name: Normal stock N4 repair v4b audit

on:
  workflow_dispatch:
  push:
    branches:
      - research/vix-rsi-rulebook-20260828
    paths:
      - 'research/rulebook_v3/audit_normal_stock_n4_repair_v4b.py'
      - '.github/workflows/normal-stock-n4-repair-v4b-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy yfinance requests gspread
      - name: Syntax check
        run: PYTHONPATH=.:leadership/research python -m py_compile research/rulebook_v3/audit_normal_stock_n4_repair_v4b.py
      - name: Run audit
        run: |
          PYTHONPATH=.:leadership/research python research/rulebook_v3/audit_normal_stock_n4_repair_v4b.py \
            --root . \
            --output research/normal_stock_n4_repair_v4b/results \
            --asof 2026-08-28
      - name: Verify outputs
        run: |
          test -s research/normal_stock_n4_repair_v4b/results/n4_repair_comparison.csv
          test -s research/normal_stock_n4_repair_v4b/results/summary.json
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: normal-stock-n4-repair-v4b-audit
          retention-days: 30
          path: research/normal_stock_n4_repair_v4b/results/
