name: Patch Options chart controls once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-options-chart-controls-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Apply patch
        run: python .tmp_patch_options_chart_controls.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check options-intelligence.js
          node --check options-chart-bridge.js
          git diff --check
          grep -q 'inlineChartSlot' options-intelligence.js
          grep -q 'TradingViewで開く' options-intelligence.js
          grep -q 'inlineChartSlot' options-chart-bridge.js
          grep -q 'chartcontrols1' options-intelligence.html

      - name: Commit intended files only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- options-intelligence.js options-chart-bridge.js options-intelligence.css options-intelligence.html
          staged="$(git diff --cached --name-only)"
          printf '%s\n' "$staged"
          for f in $staged; do
            case "$f" in
              options-intelligence.js|options-chart-bridge.js|options-intelligence.css|options-intelligence.html) ;;
              *) echo "unexpected file: $f"; exit 1 ;;
            esac
          done
          test "$(printf '%s\n' "$staged" | wc -l)" -eq 4
          git commit -m 'Place Options period controls above chart'
          git push origin HEAD:main
