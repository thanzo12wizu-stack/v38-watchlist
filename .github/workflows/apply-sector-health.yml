name: Apply sector health integration

on:
  push:
    branches:
      - analysis-sector-health-20260825
    paths:
      - .github/workflows/apply-sector-health.yml
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: analysis-sector-health-20260825
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dashboard dependencies
        run: pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Patch Sector Health only
        run: python tools/apply_sector_health_patch.py
      - name: Syntax and scope checks
        run: |
          python -m py_compile build_dashboard.py
          python - <<'PY'
          from pathlib import Path
          s = Path('build_dashboard.py').read_text(encoding='utf-8')
          assert s.count('def _sector_health_series(') == 1
          assert '<th>Health</th><th>10日Δ</th>' in s
          assert 'def load_market_extras(period="2y", asof_date=None):' in s
          assert 'トレンド判定' in s
          assert 'VIX反転シーケンス' in s
          print('static scope checks OK')
          PY
          pytest -q tests/test_dashboard_build_regressions.py \
            tests/test_options_positioning_quality.py \
            tests/test_eps_acceleration.py
      - name: Commit Sector Health patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add build_dashboard.py
          git commit -m 'Add equal-weight Sector Health to sector ETF table'
          git push origin HEAD:analysis-sector-health-20260825
