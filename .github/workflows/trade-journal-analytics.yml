name: Trade Journal Analytics

on:
  workflow_dispatch:
    inputs:
      starting_equity_jpy:
        description: Starting equity in JPY when no equity.csv is available
        required: false
        default: "7300000"
      demo:
        description: Build with deterministic demo data
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - "intelligence_engine/trade_journal*.py"
      - "tests/test_trade_journal*.py"
      - "config/trade_journal.example.json"
      - "docs/TRADE_JOURNAL_ANALYTICS_JA.md"
      - ".github/workflows/trade-journal-analytics.yml"
      - ".github/workflows/trade-journal-private.yml"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: trade-journal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Japanese fonts
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - run: python -m pip install -e '.[test]'
      - name: Test journal engine and single-file UI
        run: pytest -q tests/test_trade_journal*.py
      - name: Build analytics artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/trade-journal
          EXTRA=()
          if [[ "${{ github.event_name }}" == "pull_request" || "${{ inputs.demo }}" == "true" ]]; then
            EXTRA+=(--demo)
          fi
          python -m intelligence_engine.trade_journal_run \
            --input data/trade_journal \
            --output artifacts/trade-journal \
            --starting-equity-jpy "${{ inputs.starting_equity_jpy || '7300000' }}" \
            "${EXTRA[@]}"
      - name: Verify Signal Ledger single-file dashboard and share assets
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/trade-journal/index.html
          for section in today performance portfolio journal edge review share; do
            grep -q "id=\"${section}\"" artifacts/trade-journal/index.html
            grep -q "href=\"#${section}\"" artifacts/trade-journal/index.html
          done
          for legacy in assets.html portfolio.html trades.html edge.html review.html share.html; do
            test ! -e "artifacts/trade-journal/${legacy}"
            ! grep -q "href=\"${legacy}\"" artifacts/trade-journal/index.html
          done
          grep -q 'V38 SIGNAL LEDGER' artifacts/trade-journal/index.html
          grep -q '01 / OPERATIONS' artifacts/trade-journal/index.html
          grep -q -- '--acid:#d7ff38' artifacts/trade-journal/index.html
          grep -q 'src="data:image/png;base64,' artifacts/trade-journal/index.html
          grep -q 'id="trade-search"' artifacts/trade-journal/index.html
          test -s artifacts/trade-journal/daily_card.png
          test -s artifacts/trade-journal/portfolio_card.png
      - name: Publish weekly review
        if: always()
        run: |
          if [[ -f artifacts/trade-journal/weekly_review.md ]]; then
            cat artifacts/trade-journal/weekly_review.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload dashboard and share cards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trade-journal-analytics
          path: artifacts/trade-journal
          if-no-files-found: error
          retention-days: 30
