name: TEMP guarded sleeve stale-state patch

on:
  push:
    branches: [fix/sleeve-stale-preserve-20260902]
    paths:
      - '.github/workflows/temp-sleeve-stale-fix.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/sleeve-stale-preserve-20260902
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Apply source patch only
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin c654752adf2d2b8da30c0b3294d220b5fb7345b4
          git show c654752adf2d2b8da30c0b3294d220b5fb7345b4:.github/workflows/temp-sleeve-stale-fix.yml > /tmp/original-harness.yml
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('/tmp/original-harness.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          block = workflow.split(marker, 1)[1].split("\n          PY\n", 1)[0]
          block = textwrap.dedent(block)
          block = block.split("\np = Path('tests/test_v38_sleeve_refresh.py')", 1)[0]
          exec(compile(block, '<guarded-sleeve-source-patch>', 'exec'), {})

          path = Path('build_v38_sleeve_refresh.py')
          text = path.read_text(encoding='utf-8')
          old = '            error_text = f"{type(exc).__name__}: {exc}"\n'
          new = (
              '            failed_reason = str(failed_payload.get("reason") or "").strip()\n'
              '            error_text = failed_reason or f"{type(exc).__name__}: {exc}"\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'expected one error_text assignment, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install test dependencies
        run: pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Compile and test guarded stale preservation
        run: |
          python -m py_compile build_v38_sleeve_live.py build_v38_sleeve_refresh.py build_v38_companion.py
          pytest -q tests/test_v38_sleeve_refresh.py tests/test_v38_companion.py tests/test_v38_sleeve_stale_guard.py
      - name: Commit tested source patch to fix branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build_v38_sleeve_live.py build_v38_sleeve_refresh.py build_v38_companion.py
          git commit -m "fix: preserve READY sleeve on dashboard refresh failure"
          git push origin HEAD:fix/sleeve-stale-preserve-20260902
