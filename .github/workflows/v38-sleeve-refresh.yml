name: V38 sleeve live refresh

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: v38-sleeve-live-refresh-pipeline
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      TZ: Asia/Tokyo
      PIPELINE_BRANCH: pipeline-live

    steps:
      - uses: actions/checkout@v7
        with:
          ref: pipeline-live
          fetch-depth: 1

      - name: Sync staged V38 snapshot
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$PIPELINE_BRANCH"
          git reset --hard "origin/$PIPELINE_BRANCH"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt pytest

      - name: Restore validated Reset OHLC cache
        uses: actions/cache@v5
        with:
          path: .cache/v38-reset-prices
          key: ${{ runner.os }}-v38-reset-prices-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-v38-reset-prices-

      - name: Compile and test V38 sleeves
        run: |
          python -m py_compile \
            build_v38_sleeve_live.py \
            build_v38_sleeve_refresh.py \
            run_v38_sleeve_refresh_live.py \
            build_v38_companion.py \
            build_v38_strict_loo_live.py \
            v38_rules.py
          pytest -q \
            tests/test_v38_sleeve_live.py \
            tests/test_v38_sleeve_refresh.py \
            tests/test_v38_companion.py

      - name: Preserve pre-refresh READY inputs
        shell: bash
        run: |
          set -euo pipefail
          cp v38-sleeve-state.json /tmp/v38-sleeve-state-before.json
          cp tqqq-panic-state.json /tmp/tqqq-panic-state-before.json

      - name: Rebuild Normal Stock and RSI Reset sleeves with retries
        env:
          V38_RESET_CACHE_DIR: .cache/v38-reset-prices
        shell: bash
        run: |
          set -euo pipefail
          refreshed=false
          for attempt in 1 2 3 4; do
            echo "Sleeve/RSI Reset refresh attempt ${attempt}/4"
            if python run_v38_sleeve_refresh_live.py \
              --companion v38-live-state.json \
              --state v38-sleeve-state.json \
              --seed v38-normal-sleeve-seed.json \
              --strict-history v38-strict-loo-history.json \
              --tqqq-state tqqq-panic-state.json \
              --out v38-sleeve-state.json; then
              refreshed=true
              break
            fi
            if [[ "$attempt" -lt 4 ]]; then
              sleep $((attempt * 10))
            fi
          done
          if [[ "$refreshed" != true ]]; then
            echo "::error::Sleeve/RSI Reset refresh failed after 4 attempts"
            exit 1
          fi

      - name: Rebuild same Reset input from validated cache
        env:
          V38_RESET_CACHE_DIR: .cache/v38-reset-prices
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/tqqq-panic-state-before.json /tmp/tqqq-panic-state-repeat.json
          python run_v38_sleeve_refresh_live.py \
            --companion v38-live-state.json \
            --state /tmp/v38-sleeve-state-before.json \
            --seed v38-normal-sleeve-seed.json \
            --strict-history v38-strict-loo-history.json \
            --tqqq-state /tmp/tqqq-panic-state-repeat.json \
            --out /tmp/v38-sleeve-state-repeat.json

      - name: Verify Reset same-input reproducibility
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from build_v38_sleeve_refresh import reset_reproducibility_payload
          first = json.loads(Path('v38-sleeve-state.json').read_text(encoding='utf-8'))
          repeat = json.loads(Path('/tmp/v38-sleeve-state-repeat.json').read_text(encoding='utf-8'))
          a = reset_reproducibility_payload(first)
          b = reset_reproducibility_payload(repeat)
          if a != b:
              raise SystemExit('RESET_REPRODUCIBILITY_MISMATCH\n' + json.dumps({'first': a, 'repeat': b}, ensure_ascii=False, indent=2))
          print('RESET_REPRODUCIBILITY_PASS', json.dumps(a, ensure_ascii=False, sort_keys=True))
          PY

      - name: Rebuild audited companion with live Gross100 inputs
        run: |
          python build_v38_companion.py \
            --legacy command-center.html \
            --universe universe.csv \
            --strict-loo v38-strict-loo-live.json \
            --tqqq-panic tqqq-panic-state.json \
            --sleeve-state v38-sleeve-state.json \
            --out v38-live-state.json

      - name: Validate live sleeves and allocation
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          sleeve = json.loads(Path('v38-sleeve-state.json').read_text(encoding='utf-8'))
          live = json.loads(Path('v38-live-state.json').read_text(encoding='utf-8'))
          tqqq = json.loads(Path('tqqq-panic-state.json').read_text(encoding='utf-8'))
          asof = live.get('asof')
          if not asof or sleeve.get('asof') != asof or tqqq.get('asof') != asof:
              raise SystemExit(f'asof mismatch: live={asof} sleeve={sleeve.get("asof")} tqqq={tqqq.get("asof")}')
          if tqqq.get('live_generation_status') != 'READY' or tqqq.get('current30', {}).get('status') != 'READY':
              raise SystemExit(f'TQQQ/CURRENT30 not READY before sleeve merge: {tqqq.get("live_generation_status")} / {tqqq.get("current30", {}).get("status")}')
          if sleeve.get('status') != 'READY':
              raise SystemExit(f'sleeve not READY: {sleeve.get("reason")}')
          if sleeve.get('normal_stock', {}).get('status') != 'READY':
              raise SystemExit('normal sleeve not READY')
          if sleeve.get('rsi_reset', {}).get('status') != 'READY':
              raise SystemExit('reset sleeve not READY')
          reset = sleeve.get('rsi_reset', {})
          if not isinstance(reset.get('monitor'), list):
              raise SystemExit('RSI30 monitor output missing')
          if tqqq.get('sleeve_live_status') != 'READY':
              raise SystemExit(f'TQQQ sleeve merge not READY: {tqqq.get("sleeve_live_reason")}')
          gross = live.get('gross100_allocation', {})
          if 'LIVE ALLOCATION READY' not in str(gross.get('status')):
              raise SystemExit(f'Gross100 not live-ready: {gross.get("status")}')
          if gross.get('selective_fill_rule') != 'SELECTIVE_FILL_NO_ZERO_OVERRIDE':
              raise SystemExit(f'unexpected Selective Fill rule: {gross.get("selective_fill_rule")}')
          final_gross = gross.get('gross_allocated_pct')
          if final_gross is None or float(final_gross) > 100.000001:
              raise SystemExit(f'invalid Gross100 allocation: {final_gross}')
          normal_alloc = gross.get('normal_stock_allocated_pct')
          if normal_alloc is None or float(normal_alloc) > 70.000001:
              raise SystemExit(f'Normal Stock allocation exceeds 70% cap: {normal_alloc}')
          native_tqqq = gross.get('native_tqqq_target_pct')
          selective_fill = gross.get('tqqq_selective_fill_pct')
          if native_tqqq is None or selective_fill is None:
              raise SystemExit('Selective Fill guard inputs missing')
          if float(native_tqqq) <= 0 and abs(float(selective_fill)) > 1e-9:
              raise SystemExit('Selective Fill overrode native TQQQ zero')
          mode = str(live.get('market', {}).get('mode') or '')
          if mode not in {'ATTACK', 'SELECTIVE'} and abs(float(selective_fill)) > 1e-9:
              raise SystemExit(f'Selective Fill active outside ATTACK/SELECTIVE: {mode}')
          quality = reset.get('download_quality')
          if reset.get('strategy') != 'RS63_TOP3_RISE30_SIGTOP3':
              raise SystemExit(f'unexpected Reset rule: {reset.get("strategy")}')
          if not isinstance(quality, dict) or quality.get('coverage_ok') is not True:
              raise SystemExit(f'Reset OHLC coverage not proven: {quality}')
          print('V38_SLEEVE_REFRESH_READY', asof)
          PY

      - name: Commit refreshed audited live states to staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          stage_dir="$(mktemp -d)"
          cp v38-sleeve-state.json "$stage_dir/v38-sleeve-state.json"
          cp tqqq-panic-state.json "$stage_dir/tqqq-panic-state.json"
          cp v38-live-state.json "$stage_dir/v38-live-state.json"

          git fetch --depth=1 origin "$PIPELINE_BRANCH"
          if [[ "$(git rev-parse "origin/$PIPELINE_BRANCH")" != "$SOURCE_SHA" ]]; then
            echo "::error::Pipeline staging advanced during sleeve refresh; reject stale output"
            exit 1
          fi
          git reset --hard "origin/$PIPELINE_BRANCH"
          cp "$stage_dir/v38-sleeve-state.json" v38-sleeve-state.json
          cp "$stage_dir/tqqq-panic-state.json" tqqq-panic-state.json
          cp "$stage_dir/v38-live-state.json" v38-live-state.json
          git add v38-sleeve-state.json tqqq-panic-state.json v38-live-state.json
          if git diff --cached --quiet; then
            echo "No sleeve staging changes to commit"
            exit 0
          fi
          git commit -m "Stage V38 live sleeves + Gross100 allocation"
          git push origin "HEAD:refs/heads/$PIPELINE_BRANCH"

      - name: Hand off to Rotation
        run: echo "Sleeve/RSI Reset READY on staging; Rotation Theme56 live build is the next workflow stage"
