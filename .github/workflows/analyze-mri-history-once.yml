name: One-off analyze MRI historical calibration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/analyze-mri-history-once.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check pandas numpy yfinance
      - name: Fixed calibration out-of-sample diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import numpy as np
          import pandas as pd
          import yfinance as yf

          broad=["SPY","QQQ","DIA","IWM","MDY","RSP","VTI","QQQE"]
          sectors=["XLK","XLY","VOX","XLF","XLI","XLE","XLB","XLV","XLP","XLU","XLRE"]
          industry=["SOXX","SMH","XSD","IGV","SKYY","CIBR","HACK","FDN","XBI","IBB","PPH","IHI","IHF","KRE","KBE","XRT","ITB","XHB","IYT","JETS","ITA","XAR","ROBO","XME","COPX","PICK","GDX","SIL","LIT","XOP","OIH","URA","TAN","ICLN","VNQ","MOO","PHO","PAVE"]
          tickers=list(dict.fromkeys(broad+sectors+industry)); assert len(tickers)==57
          d=yf.download(tickers,start='2009-01-01',end='2026-08-25',auto_adjust=True,progress=False,threads=True)
          c=d['Close'].copy(); c.index=pd.to_datetime(c.index).tz_localize(None); c=c.reindex(columns=tickers)
          vraw=yf.download('^VIX',start='2009-01-01',end='2026-08-25',auto_adjust=False,progress=False,threads=False)
          vix=pd.to_numeric(vraw['Close'].squeeze(),errors='coerce'); vix.index=pd.to_datetime(vix.index).tz_localize(None)

          def part(mask): return mask.mean(axis=1,skipna=True)*100.0
          ma10=c.rolling(10).mean(); ma20=c.rolling(20).mean(); ma50=c.rolling(50).mean(); ma200=c.rolling(200).mean()
          p={}
          p['ret5']=part((c/c.shift(5)-1>0).where(c.shift(5).notna()&c.notna()))
          p['ret21']=part((c/c.shift(21)-1>0).where(c.shift(21).notna()&c.notna()))
          p['ret63']=part((c/c.shift(63)-1>0).where(c.shift(63).notna()&c.notna()))
          p['ret252']=part((c/c.shift(252)-1>0).where(c.shift(252).notna()&c.notna()))
          p['above10']=part((c>ma10).where(ma10.notna()&c.notna()))
          p['above20']=part((c>ma20).where(ma20.notna()&c.notna()))
          p['above50']=part((c>ma50).where(ma50.notna()&c.notna()))
          p['above200']=part((c>ma200).where(ma200.notna()&c.notna()))
          p['ma20_gt_50']=part((ma20>ma50).where(ma20.notna()&ma50.notna()))
          p['ma50_gt_200']=part((ma50>ma200).where(ma50.notna()&ma200.notna()))
          hi252=c.rolling(252,min_periods=200).max(); dd=c/hi252-1
          p['dd_score']=((dd+0.30)/0.25*100).clip(0,100).mean(axis=1,skipna=True)
          p['within10']=part((dd>=-0.10).where(dd.notna()))
          keys=('ret5','ret21','ret63','ret252','above10','above20','above50','above200','ma20_gt_50','ma50_gt_200','dd_score','within10')
          comps=pd.concat({k:p[k] for k in keys},axis=1)
          score=comps.mean(axis=1,skipna=True).ewm(span=2,adjust=False).mean()
          cov=c.notna().sum(axis=1)/57*100
          valid=(cov>=70)&score.notna()

          # VIX replacement candidate: fixed absolute stress mapping, only for comparison.
          vx=np.array([10,12,15,20,25,30,40,60],float)
          vy=np.array([100,95,80,50,30,15,5,0],float)
          vix_score=pd.Series(np.interp(vix.to_numpy(float),vx,vy,left=100,right=0),index=vix.index)
          altcomps=comps.drop(columns=['within10']).copy(); altcomps['vix_score']=vix_score.reindex(altcomps.index)
          score_vix=altcomps.mean(axis=1,skipna=True).ewm(span=2,adjust=False).mean()

          # Freeze scale using 2010-2019 only. The mapping is never rolling.
          train=score[valid & (score.index>='2010-01-01') & (score.index<='2019-12-31')].dropna()
          qs=train.quantile([.01,.05,.25,.50,.75,.95,.99])
          xin=qs.to_numpy(float); yout=np.array([0,10,30,50,70,90,100],float)
          def calibrate(s):
              arr=s.to_numpy(float)
              return pd.Series(np.interp(arr,xin,yout,left=0,right=100),index=s.index)
          calibrated=calibrate(score)
          calibrated_vix=calibrate(score_vix)

          print('=== TRAIN_ANCHORS_2010_2019 ===')
          for q,v in qs.items(): print(q,round(float(v),2))
          print('raw_train_mean',round(float(train.mean()),2),'median',round(float(train.median()),2))

          print('=== CURRENT_COMPONENTS_2026_08_24 ===')
          d0=pd.Timestamp('2026-08-24')
          for k in keys: print(k,round(float(comps.at[d0,k]),2))
          print('raw_score',round(float(score.at[d0]),2),'calibrated',round(float(calibrated.at[d0]),2),'vix_replace_raw',round(float(score_vix.at[d0]),2),'vix_replace_cal',round(float(calibrated_vix.at[d0]),2),'vix',round(float(vix.at[d0]),2))

          print('=== OOS_2020_2026_ANNUAL ===')
          rows=[]
          for yr in range(2020,2027):
              mask=valid & (score.index.year==yr)
              if not mask.any(): continue
              rows.append([yr,score[mask].mean(),calibrated[mask].mean(),score_vix[mask].mean(),calibrated_vix[mask].mean(),(score[mask]>=70).mean()*100,(calibrated[mask]>=70).mean()*100])
          print(pd.DataFrame(rows,columns=['year','raw_mean','cal_mean','vix_raw_mean','vix_cal_mean','raw_ge70_pct','cal_ge70_pct']).set_index('year').round(2).to_string())

          print('=== NOTABLE_DATES ===')
          dates=['2018-12-24','2020-02-19','2020-03-23','2020-06-08','2022-01-03','2022-06-16','2022-10-12','2023-07-31','2024-07-10','2025-04-08','2025-08-21','2026-08-21','2026-08-24']
          rows=[]
          for ds in dates:
              t=pd.Timestamp(ds); idx=score.index[score.index<=t]
              if not len(idx): continue
              z=idx[-1]
              rows.append([ds,score.get(z,np.nan),calibrated.get(z,np.nan),score_vix.get(z,np.nan),calibrated_vix.get(z,np.nan),vix.get(z,np.nan)])
          print(pd.DataFrame(rows,columns=['date','raw','cal','vix_raw','vix_cal','vix']).set_index('date').round(2).to_string())

          print('=== OOS_DISTRIBUTION_2020_2026 ===')
          oos=valid & (score.index>='2020-01-01')
          for name,s in [('raw',score),('cal',calibrated),('vix_raw',score_vix),('vix_cal',calibrated_vix)]:
              a=s[oos].dropna()
              print(name,'mean',round(float(a.mean()),2),'median',round(float(a.median()),2),'p25',round(float(a.quantile(.25)),2),'p75',round(float(a.quantile(.75)),2),'ge70',round(float((a>=70).mean()*100),1),'le35',round(float((a<=35).mean()*100),1))
          PY
