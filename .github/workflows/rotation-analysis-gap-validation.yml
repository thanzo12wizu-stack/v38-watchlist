name: Rotation analysis gap validation

on:
  workflow_dispatch:
  push:
    branches:
      - research/rotation-validation-20260905-work
    paths:
      - leadership/research/validate_rotation_analysis_gaps.py
      - leadership/research/validate_rotation_analysis_gaps_v2.py
      - .github/workflows/rotation-analysis-gap-validation.yml

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy statsmodels yfinance
      - name: Download audited PIT panels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/pit
          gh api repos/${{ github.repository }}/actions/artifacts/9743199098/zip > /tmp/pit.zip
          unzip -q /tmp/pit.zip -d /tmp/pit
          test -s /tmp/pit/distribution_pit_panel_cov60.csv
          test -s /tmp/pit/distribution_pit_panel_cov80.csv
          test -s /tmp/pit/distribution_pit_panel_cov90.csv
      - name: Run validation
        run: |
          python leadership/research/validate_rotation_analysis_gaps_v2.py \
            --panel60 /tmp/pit/distribution_pit_panel_cov60.csv \
            --panel80 /tmp/pit/distribution_pit_panel_cov80.csv \
            --panel90 /tmp/pit/distribution_pit_panel_cov90.csv \
            --fred-cache fred_cache.json \
            --output leadership/research/rotation_gap_validation_outputs
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rotation-analysis-gap-validation-v2
          path: leadership/research/rotation_gap_validation_outputs/
          if-no-files-found: warn
          retention-days: 14
