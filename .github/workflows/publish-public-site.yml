name: Publish safe public site mirror

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "command-center.html"
      - "intelligence-dashboard.html"
      - "trade-journal-almanac.html"
      - "scripts/export_public_site.py"
      - "scripts/privacy_audit.py"
      - ".github/workflows/publish-public-site.yml"
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read
  actions: write

concurrency:
  group: publish-safe-public-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_REPOSITORY: ${{ vars.V38_PUBLIC_PAGES_REPOSITORY }}
      PUBLIC_TOKEN: ${{ secrets.V38_PUBLIC_PAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Remove historical logs containing private candidate tickers
        if: github.workflow == 'Publish safe public site mirror'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_ids=(
            30599801291
            30630465309
            30817608528
            30859809101
            30896860719
            30900646395
            30904854110
            30909173118
          )
          for run_id in "${run_ids[@]}"; do
            status="$(curl --silent --show-error --output /tmp/delete-run-log-response \
              --write-out '%{http_code}' \
              --request DELETE \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/logs")"
            if [[ "$status" != "204" && "$status" != "404" ]]; then
              echo "Failed to remove logs for run ${run_id}: HTTP ${status}"
              exit 1
            fi
            echo "Run ${run_id} log deletion status: HTTP ${status}"
          done
      - name: Audit privacy boundary
        run: |
          python scripts/privacy_audit.py --root . --output /tmp/privacy-audit-status.json
          cat /tmp/privacy-audit-status.json
      - name: Export allowlisted public artifacts
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          python scripts/export_public_site.py \
            --root . \
            --output /tmp/v38-public-site \
            --source-commit "$source_commit"
      - name: Validate deployment configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PUBLIC_REPOSITORY:-}" || -z "${PUBLIC_TOKEN:-}" ]]; then
            echo "::warning::Public Pages mirror is not configured; export validation completed without deployment"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$PUBLIC_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "Invalid V38_PUBLIC_PAGES_REPOSITORY: expected owner/repository"
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: Publish to clean Pages repository
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          target=/tmp/v38-pages-repository
          git clone --depth 1 "https://x-access-token:${PUBLIC_TOKEN}@github.com/${PUBLIC_REPOSITORY}.git" "$target"
          find "$target" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/v38-public-site/. "$target/"
          cd "$target"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Public site mirror already current"
            exit 0
          fi
          git commit -m "Publish V38 public site"
          git push origin HEAD:main
