name: Publish safe public site mirror

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "command-center.html"
      - "intelligence-dashboard.html"
      - "scripts/export_public_site.py"
      - "scripts/privacy_audit.py"
      - ".github/workflows/publish-public-site.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

concurrency:
  group: publish-safe-public-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLIC_REPOSITORY: ${{ vars.V38_PUBLIC_PAGES_REPOSITORY }}
      PUBLIC_TOKEN: ${{ secrets.V38_PUBLIC_PAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Remove obsolete Actions history
        env:
          ACTIONS_CLEANUP_TOKEN: ${{ github.token }}
          ACTIONS_CLEANUP_REPOSITORY: ${{ github.repository }}
          ACTIONS_CLEANUP_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          api_root = "https://api.github.com"
          repository = os.environ["ACTIONS_CLEANUP_REPOSITORY"]
          token = os.environ["ACTIONS_CLEANUP_TOKEN"]
          current_run_id = int(os.environ["ACTIONS_CLEANUP_RUN_ID"])
          keep_paths = {
              ".github/workflows/dashboard.yml",
              ".github/workflows/intelligence-engine.yml",
              ".github/workflows/publish-public-site.yml",
          }

          def call(path, method="GET", tolerate=()):
              data = b"" if method in {"PUT", "POST", "PATCH"} else None
              request = urllib.request.Request(
                  api_root + path,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "v38-actions-history-cleanup",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      raw = response.read()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  if exc.code in tolerate:
                      return None
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"GitHub API {method} {path} failed: {exc.code} {detail}") from exc

          workflows = []
          page = 1
          while True:
              payload = call(f"/repos/{repository}/actions/workflows?per_page=100&page={page}")
              batch = payload.get("workflows", [])
              workflows.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          obsolete = []
          for workflow in workflows:
              path = str(workflow.get("path") or "")
              if path in keep_paths or path.startswith("dynamic/pages/"):
                  print(f"KEEP {workflow.get('name')} [{path}]")
              else:
                  obsolete.append(workflow)

          total_deleted = 0
          for workflow in obsolete:
              workflow_id = workflow["id"]
              name = workflow.get("name") or str(workflow_id)
              path = workflow.get("path") or ""
              print(f"CLEAN {name} [{path}] id={workflow_id}")
              call(
                  f"/repos/{repository}/actions/workflows/{workflow_id}/disable",
                  method="PUT",
                  tolerate=(404, 409, 422),
              )

              workflow_deleted = 0
              for _ in range(200):
                  payload = call(
                      f"/repos/{repository}/actions/workflows/{workflow_id}/runs?per_page=100&page=1"
                  )
                  runs = payload.get("workflow_runs", [])
                  deletable = [
                      run for run in runs
                      if int(run.get("id") or 0) != current_run_id
                      and run.get("status") == "completed"
                  ]
                  if not deletable:
                      break
                  for run in deletable:
                      call(
                          f"/repos/{repository}/actions/runs/{run['id']}",
                          method="DELETE",
                          tolerate=(404,),
                      )
                      workflow_deleted += 1
                      total_deleted += 1
                      time.sleep(0.03)
              else:
                  raise RuntimeError(f"Cleanup safety limit reached for workflow {name}")

              print(f"DELETED {workflow_deleted} runs from {name}")

          print(f"Obsolete workflows found: {len(obsolete)}")
          print(f"Obsolete workflow runs deleted: {total_deleted}")
          PY
      - name: Audit privacy boundary
        run: |
          python scripts/privacy_audit.py --root . --output /tmp/privacy-audit-status.json
          cat /tmp/privacy-audit-status.json
      - name: Export allowlisted public artifacts
        run: python scripts/export_public_site.py --root . --output /tmp/v38-public-site --source-commit "${GITHUB_SHA}"
      - name: Validate deployment configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PUBLIC_REPOSITORY:-}" || -z "${PUBLIC_TOKEN:-}" ]]; then
            echo "::warning::Public Pages mirror is not configured; export validation completed without deployment"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$PUBLIC_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "Invalid V38_PUBLIC_PAGES_REPOSITORY: expected owner/repository"
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: Publish to clean Pages repository
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          target=/tmp/v38-pages-repository
          git clone --depth 1 "https://x-access-token:${PUBLIC_TOKEN}@github.com/${PUBLIC_REPOSITORY}.git" "$target"
          find "$target" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/v38-public-site/. "$target/"
          cd "$target"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Public site mirror already current"
            exit 0
          fi
          git commit -m "Publish V38 public site"
          git push origin HEAD:main
