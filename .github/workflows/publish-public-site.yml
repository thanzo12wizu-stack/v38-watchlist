name: Publish safe public site mirror

on:
  workflow_run:
    workflows: ["Rotation Theme56 live build"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'scripts/export_public_site.py'
      - 'scripts/privacy_audit.py'
      - 'scripts/validate_atomic_publish.py'
      - 'tests/test_public_site_export.py'
      - 'tests/test_privacy_audit.py'
      - 'tests/test_atomic_publish_gate.py'
      - 'command-center-v38.html'
      - 'v38-freshness.js'
      - 'rotation/index.html'
      - 'rotation/app-v2.js'
      - 'rotation/app-live.js'
      - '.github/workflows/publish-public-site.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publish-safe-public-site
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_REPOSITORY: ${{ vars.V38_PUBLIC_PAGES_REPOSITORY }}
      PUBLIC_TOKEN: ${{ secrets.V38_PUBLIC_PAGES_TOKEN }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Public export and atomic-gate tests
        run: |
          pip install --disable-pip-version-check pytest
          pytest -q \
            tests/test_public_site_export.py \
            tests/test_privacy_audit.py \
            tests/test_atomic_publish_gate.py

      - name: Require one READY as-of across the full live pipeline
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_atomic_publish.py \
            --root . \
            --output /tmp/atomic-publish-status.json
          cat /tmp/atomic-publish-status.json

      - name: Audit privacy boundary
        run: |
          python scripts/privacy_audit.py \
            --root . \
            --output /tmp/privacy-audit-status.json
          cat /tmp/privacy-audit-status.json

      - name: Export allowlisted public artifacts
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          python scripts/export_public_site.py \
            --root . \
            --output /tmp/v38-public-site \
            --source-commit "$source_commit"

      - name: Validate deployment configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PUBLIC_REPOSITORY:-}" || -z "${PUBLIC_TOKEN:-}" ]]; then
            echo "::warning::Public Pages mirror is not configured; export validation completed without deployment"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$PUBLIC_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "Invalid V38_PUBLIC_PAGES_REPOSITORY: expected owner/repository"
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Publish to clean Pages repository
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          target=/tmp/v38-pages-repository
          git clone \
            --depth 1 \
            "https://x-access-token:${PUBLIC_TOKEN}@github.com/${PUBLIC_REPOSITORY}.git" \
            "$target"
          find "$target" \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name .git \
            -exec rm -rf -- {} +
          cp -a /tmp/v38-public-site/. "$target/"
          cd "$target"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Public site mirror already current"
            exit 0
          fi
          git commit -m "Publish V38 atomic public site"
          git push origin HEAD:main
