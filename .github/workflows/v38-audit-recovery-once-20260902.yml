name: V38 audited live-state recovery once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v38-audit-recovery-once-20260902.yml'

permissions:
  contents: write

concurrency:
  group: v38-audit-recovery-20260902
  cancel-in-progress: false

jobs:
  recover-test-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt pytest

      - name: Focused regression suite
        run: |
          set -euo pipefail
          python -m py_compile build_v38_tqqq_live.py build_v38_sleeve_live.py build_v38_companion.py v38_rules.py
          pytest -q tests/test_v38_tqqq_live.py tests/test_v38_sleeve_live.py tests/test_v38_companion.py tests/test_v38_rules.py

      - name: Refresh dedicated QQQ and TQQQ market inputs
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          set -euo pipefail
          python build_v38_tqqq_live.py --prefetch-cache v38-tqqq-live-source-cache.json

      - name: Rebuild TQQQ live state only
        run: |
          set -euo pipefail
          python build_v38_tqqq_live.py \
            --state state.json \
            --cache v38-tqqq-live-source-cache.json \
            --out tqqq-panic-state.json

      - name: Rebuild provisional audited companion
        run: |
          set -euo pipefail
          python build_v38_companion.py \
            --legacy command-center.html \
            --universe universe.csv \
            --strict-loo v38-strict-loo-live.json \
            --tqqq-panic tqqq-panic-state.json \
            --out v38-live-state.json

      - name: Rebuild Normal Stock and RSI Reset sleeves
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          set -euo pipefail
          python build_v38_sleeve_live.py \
            --companion v38-live-state.json \
            --state v38-sleeve-state.json \
            --seed v38-normal-sleeve-seed.json \
            --strict-history v38-strict-loo-history.json \
            --tqqq-state tqqq-panic-state.json \
            --out v38-sleeve-state.json

      - name: Rebuild audited companion with sleeve inputs
        run: |
          set -euo pipefail
          python build_v38_companion.py \
            --legacy command-center.html \
            --universe universe.csv \
            --strict-loo v38-strict-loo-live.json \
            --tqqq-panic tqqq-panic-state.json \
            --sleeve-state v38-sleeve-state.json \
            --out v38-live-state.json

      - name: Audit corrected live numbers and routes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          from build_v38_tqqq_live import load_source_cache, build_4h_bars

          state = json.loads(Path('state.json').read_text(encoding='utf-8'))
          tq = json.loads(Path('tqqq-panic-state.json').read_text(encoding='utf-8'))
          live = json.loads(Path('v38-live-state.json').read_text(encoding='utf-8'))
          sleeve = json.loads(Path('v38-sleeve-state.json').read_text(encoding='utf-8'))
          asof = str(state.get('date') or '')
          assert asof and tq.get('asof') == asof and live.get('asof') == asof and sleeve.get('asof') == asof

          sources = load_source_cache('v38-tqqq-live-source-cache.json')
          q5 = sources['qqq_5m']
          assert q5.index.tz is not None, 'QQQ 5m timezone was lost in cache round-trip'
          bars = build_4h_bars(q5)
          completed = bars[bars['date'] <= __import__('pandas').Timestamp(asof)]
          assert not completed.empty
          manual_rsi = float(completed['rsi14'].dropna().iloc[-1])
          live_rsi = float(tq['rsi4h'])
          assert math.isclose(manual_rsi, live_rsi, rel_tol=0, abs_tol=1e-10), (manual_rsi, live_rsi)

          ranking = live.get('ranking') or {}
          candidates = live.get('candidates') or []
          assert len(candidates) == int(ranking.get('full_eligible_count') or -1), 'candidate list still truncated'
          sel = ranking.get('selective_reopen_top4') or []
          atk = ranking.get('attack_reopen_top12') or []
          assert len(sel) == min(4, len(candidates)), sel
          if ranking.get('attack_watch_status') == 'READY':
              assert len(atk) == min(12, len(candidates)), atk
          assert ranking.get('selective_watch_semantics') == 'STOP/DEFENSE REOPEN TO SELECTIVE: RS189 ONLY; TOP4'
          assert ranking.get('attack_watch_semantics') == 'STOP/DEFENSE REOPEN TO ATTACK: 70/30 STRICT LOO; TOP12'

          for row in candidates:
              policy = str((row.get('normal_biotech_policy') or {}).get('policy') or '')
              assert 'STRUCTURAL_CLINICAL_BIOTECH_ONLY' in policy

          html = Path('command-center-v38.html').read_text(encoding='utf-8')
          assert 'QQQ 4H RSI14（Panic判定）' in html
          assert "LIVE_HOLDINGS_KEY='v38_holdings'" in html
          assert '戦略モデルの目標配分（実保有とは別）' in html
          assert 'SELECTIVE復帰' in html and 'ATTACK復帰' in html

          summary = {
              'asof': asof,
              'market_mode': (live.get('market') or {}).get('mode'),
              'nqsar': (live.get('market') or {}).get('nqsar'),
              'breadth50': (live.get('market') or {}).get('breadth50'),
              'qqq_4h_rsi14': live_rsi,
              'qqq_4h_rsi14_manual_from_cached_5m': manual_rsi,
              'qqq_5m_provider': (tq.get('source_providers') or {}).get('qqq_5m'),
              'vix_close': tq.get('vix_close'),
              'panic_seed': tq.get('strict_seed'),
              'panic_active': tq.get('active'),
              'tqqq_current30_target_pct': (tq.get('current30') or {}).get('underlying_target_pct'),
              'tqqq_requested_target_pct': tq.get('requested_target_pct'),
              'eligible_count': len(candidates),
              'selective_reopen_top4': sel,
              'attack_reopen_top12': atk,
              'sleeve_status': sleeve.get('status'),
              'reset_desired_pct': (sleeve.get('rsi_reset') or {}).get('desired_pct'),
              'normal_stock_desired_pct': (sleeve.get('normal_stock') or {}).get('desired_pct'),
          }
          Path('/tmp/v38-recovery-summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Persist corrected audited states and remove one-off workflow
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          staging="$(mktemp -d)"
          for f in tqqq-panic-state.json v38-sleeve-state.json v38-live-state.json v38-tqqq-live-source-cache.json; do
            cp -a "$f" "$staging/$f"
          done
          git fetch --depth=1 origin main
          git reset --hard FETCH_HEAD
          for f in tqqq-panic-state.json v38-sleeve-state.json v38-live-state.json v38-tqqq-live-source-cache.json; do
            cp -a "$staging/$f" "$f"
            git add -- "$f"
          done
          rm -f .github/workflows/v38-audit-recovery-once-20260902.yml
          git add -A -- .github/workflows/v38-audit-recovery-once-20260902.yml
          if ! git diff --staged --quiet; then
            git commit -m 'Refresh audited V38 live states after RSI path fix'
            git push origin HEAD:main
          fi
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Audit public privacy boundary
        run: |
          python scripts/privacy_audit.py --root . --output /tmp/privacy-audit-status.json
          cat /tmp/privacy-audit-status.json

      - name: Export allowlisted public site
        run: |
          set -euo pipefail
          python scripts/export_public_site.py \
            --root . \
            --output /tmp/v38-public-site \
            --source-commit "${{ steps.persist.outputs.source_sha }}"

      - name: Publish clean public mirror
        id: publish
        shell: bash
        env:
          PUBLIC_REPOSITORY: ${{ vars.V38_PUBLIC_PAGES_REPOSITORY }}
          PUBLIC_TOKEN: ${{ secrets.V38_PUBLIC_PAGES_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${PUBLIC_REPOSITORY:-}" && test -n "${PUBLIC_TOKEN:-}"
          target=/tmp/v38-pages-repository
          git clone --depth 1 "https://x-access-token:${PUBLIC_TOKEN}@github.com/${PUBLIC_REPOSITORY}.git" "$target"
          find "$target" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/v38-public-site/. "$target/"
          cd "$target"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Publish audited recovery ${{ steps.persist.outputs.source_sha }}"
            git push origin HEAD:main
          fi

      - name: Recovery summary
        run: |
          cat /tmp/v38-recovery-summary.json
