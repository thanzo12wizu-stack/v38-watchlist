name: Trade Journal Almanac Sidecar

on:
  workflow_dispatch:
    inputs:
      starting_equity_jpy:
        description: Starting equity in JPY when no equity.csv is available
        required: false
        default: "7300000"
      demo:
        description: Build with deterministic 15-position demo data
        required: false
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - "intelligence_engine/trade_journal_almanac*.py"
      - "tests/test_trade_journal_almanac_sidecar.py"
      - "docs/TRADE_JOURNAL_ALMANAC_SIDECAR_JA.md"
      - ".github/workflows/trade-journal-almanac-sidecar.yml"

permissions:
  contents: read

concurrency:
  group: trade-journal-almanac-sidecar-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Japanese fonts
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - run: python -m pip install -e '.[test]'
      - name: Test Almanac sidecar isolation
        run: pytest -q tests/test_trade_journal_almanac_sidecar.py
      - name: Build standalone Almanac artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifacts/trade-journal-almanac
          mkdir -p artifacts/trade-journal-almanac
          if [[ "${{ github.event_name }}" == "pull_request" || "${{ inputs.demo }}" == "true" ]]; then
            python -m intelligence_engine.trade_journal_almanac_demo15 \
              --output artifacts/trade-journal-almanac \
              --starting-equity-jpy "${{ inputs.starting_equity_jpy || '7300000' }}"
          else
            python -m intelligence_engine.trade_journal_almanac_run \
              --input data/trade_journal \
              --output artifacts/trade-journal-almanac \
              --starting-equity-jpy "${{ inputs.starting_equity_jpy || '7300000' }}"
          fi
      - name: Verify standalone output contract
        shell: bash
        run: |
          set -euo pipefail
          test -s artifacts/trade-journal-almanac/index.html
          test -s artifacts/trade-journal-almanac/daily_card.png
          test -s artifacts/trade-journal-almanac/portfolio_card.png
          grep -q 'Trade Journal Almanac' artifacts/trade-journal-almanac/index.html
          grep -q -- '--bg:#f5f2ea' artifacts/trade-journal-almanac/index.html
          grep -q 'overflow-x:hidden' artifacts/trade-journal-almanac/index.html
          grep -q 'id="holdings-more"' artifacts/trade-journal-almanac/index.html
          test "$(($(wc -l < artifacts/trade-journal-almanac/holdings_normalized.csv) - 1))" -eq 15
          test ! -e artifacts/trade-journal/index.html
          test ! -e artifacts/intelligence/index.html
      - name: Upload standalone Almanac
        uses: actions/upload-artifact@v4
        with:
          name: trade-journal-almanac-sidecar
          path: artifacts/trade-journal-almanac
          if-no-files-found: error
          retention-days: 30
