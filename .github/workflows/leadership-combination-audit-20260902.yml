name: Leadership Combination Audit 20260902

on:
  push:
    branches:
      - research/leadership-cycle-audit-20260902
    paths:
      - leadership/research/audit_leadership_combinations.py
      - .github/workflows/leadership-combination-audit-20260902.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combinations:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/leadership-cycle-audit-20260902

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run leadership combination audit
        env:
          PYTHONPATH: .:leadership/research
        run: |
          python leadership/research/audit_leadership_combinations.py \
            --root . \
            --output leadership_combination_output \
            --analysis-start 2016-01-04 \
            --analysis-end 2026-08-31 \
            --max-tickers 6000 \
            --batch-size 75

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leadership-combination-audit-20260902
          path: leadership_combination_output/
          retention-days: 30
