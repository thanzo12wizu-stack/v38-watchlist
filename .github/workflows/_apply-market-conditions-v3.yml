name: One-off apply Market Conditions v3
# trigger after workflow exists on main

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_apply-market-conditions-v3.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - name: Sync latest main and fetch validated patcher
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          git reset --hard origin/main
          git fetch --depth=1 origin market-conditions-v3
          git show FETCH_HEAD:tools/apply_market_conditions_v3.py > /tmp/apply_market_conditions_v3.py
      - name: Apply surgical patch
        run: python /tmp/apply_market_conditions_v3.py
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Compile and regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile build_dashboard.py
          pytest -q tests/test_dashboard_build_regressions.py tests/test_eps_acceleration.py
          python build_dashboard.py --selftest
          git diff --check
          git diff -- build_dashboard.py | grep -q 'MARKET CONDITIONS'
          git diff -- build_dashboard.py | grep -q 'NQSAR（短期）'
          git diff -- build_dashboard.py | grep -q 'RECOVERY'
      - name: Commit only builder change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build_dashboard.py
          test "$(git diff --cached --name-only)" = "build_dashboard.py"
          git commit -m 'Implement independent Market Conditions axis'
          git push origin HEAD:main
