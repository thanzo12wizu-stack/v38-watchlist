name: Rotation Theme56 Share Flow Validation

on:
  workflow_dispatch:
  push:
    branches:
      - research/rotation-exact-flow-internals-20260831
    paths:
      - leadership/research/rotation_theme56_shareflow_validation.py
      - leadership/research/rotation_theme56_provider_qa/**
      - .github/workflows/rotation-theme56-shareflow-validation.yml

permissions:
  contents: write

concurrency:
  group: rotation-theme56-shareflow-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/rotation-exact-flow-internals-20260831
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy yfinance requests
      - name: Syntax check
        run: python -m py_compile leadership/research/rotation_theme56_shareflow_validation.py
      - name: Validate share Creation/Redemption fallback
        run: |
          python leadership/research/rotation_theme56_shareflow_validation.py \
            --official-flows leadership/research/rotation_theme56_provider_qa/theme56_exact_flows.csv \
            --provider-qa leadership/research/rotation_theme56_provider_qa/theme56_provider_qa.csv \
            --output leadership/research/rotation_theme56_shareflow_validation \
            --start 2024-01-01 \
            --end 2026-09-02
      - name: Persist validation outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          OUT_TMP="$(mktemp -d)/rotation_theme56_shareflow_validation"
          cp -a leadership/research/rotation_theme56_shareflow_validation "$OUT_TMP"
          for attempt in 1 2 3; do
            git fetch origin research/rotation-exact-flow-internals-20260831
            git reset --hard origin/research/rotation-exact-flow-internals-20260831
            rm -rf leadership/research/rotation_theme56_shareflow_validation
            mkdir -p leadership/research
            cp -a "$OUT_TMP" leadership/research/rotation_theme56_shareflow_validation
            git add leadership/research/rotation_theme56_shareflow_validation/
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "research: record theme56 share-flow validation"
            if git push origin HEAD:research/rotation-exact-flow-internals-20260831; then
              exit 0
            fi
          done
          exit 1
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rotation-theme56-shareflow-validation
          path: leadership/research/rotation_theme56_shareflow_validation/
          if-no-files-found: warn
          retention-days: 14
