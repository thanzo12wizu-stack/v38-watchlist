# Research-only audit. Does not modify main, Pages, or dashboard outputs.
name: Leader Radar Precision Research

on:
  push:
    branches:
      - research/sector-stock-leadership-20260826
    paths:
      - leadership/research/audit_leader_radar_precision.py
      - .github/workflows/leader-radar-precision-research.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy yfinance
      - name: Syntax check
        run: |
          python -m py_compile leadership/research/audit_leader_radar_precision.py
          python -m py_compile leadership/research/audit_leader_factor_horizon_discovery.py
      - name: Run leader radar precision audit
        env:
          PYTHONPATH: .:leadership/research
        run: |
          python leadership/research/audit_leader_radar_precision.py \
            --root . \
            --output leadership/research/leader_radar_precision \
            --analysis-start 2020-01-02 \
            --analysis-end 2026-09-02 \
            --max-tickers 6000 \
            --batch-size 75
      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leader-radar-precision
          path: leadership/research/leader_radar_precision/
          retention-days: 14
