name: Rotation PIT State Fast Research

on:
  workflow_dispatch:
  push:
    branches:
      - research/rotation-exact-flow-internals-20260831
    paths:
      - leadership/research/rotation_pit_all_states_fast.py
      - .github/workflows/rotation-pit-state-fast-research.yml

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check pandas numpy requests openpyxl yfinance lxml
          python -m pip install --disable-pip-version-check "git+https://github.com/arielNacamulli/pitindex.git@c3d5d4961076a59041b3e1de90fe5ea052f61bb4"
      - name: Download audited PIT panel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/pit-panel
          gh api repos/${{ github.repository }}/actions/artifacts/9743199098/zip > /tmp/pit-panel.zip
          unzip -q /tmp/pit-panel.zip -d /tmp/pit-panel
          test -s /tmp/pit-panel/distribution_pit_panel_cov80.csv
      - name: Syntax check
        run: python -m py_compile leadership/research/rotation_pit_all_states_fast.py
      - name: Run efficient PIT state validation
        run: |
          python leadership/research/rotation_pit_all_states_fast.py \
            --panel /tmp/pit-panel/distribution_pit_panel_cov80.csv \
            --output leadership/research/rotation_pit_state_fast_outputs
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rotation-pit-state-fast-research
          path: leadership/research/rotation_pit_state_fast_outputs/
          if-no-files-found: warn
          retention-days: 14
