name: Simple Capital Flow Eventized Research

on:
  workflow_dispatch:
  push:
    branches:
      - research/sector-stock-leadership-20260826
    paths:
      - leadership/research/validate_simple_capital_flow_eventized.py
      - leadership/research/validate_rrg_tail_system.py
      - leadership/research/validate_rrg_tail_system_v2.py
      - .github/workflows/simple-capital-flow-eventized-research.yml

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy yfinance
      - name: Syntax check
        run: python -m py_compile leadership/research/validate_simple_capital_flow_eventized.py
      - name: Run eventized capital flow validation
        run: |
          python leadership/research/validate_simple_capital_flow_eventized.py \
            --root . \
            --output leadership/research/simple_capital_flow_eventized_outputs \
            --max-tickers 6000 \
            --batch-size 75
      - name: Upload research outputs
        uses: actions/upload-artifact@v4
        with:
          name: simple-capital-flow-eventized-research
          path: leadership/research/simple_capital_flow_eventized_outputs/
          retention-days: 7

  rrg_tail:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy yfinance
      - name: Syntax check
        run: |
          python -m py_compile leadership/research/validate_rrg_tail_system.py
          python -m py_compile leadership/research/validate_rrg_tail_system_v2.py
      - name: Run hardened RRG-like pre-rotation and asymmetric exit validation
        run: |
          python leadership/research/validate_rrg_tail_system_v2.py \
            --root . \
            --output leadership/research/rrg_tail_outputs \
            --analysis-start 2016-01-04 \
            --analysis-end 2026-06-30 \
            --max-tickers 6000 \
            --batch-size 75 \
            --min-members 3
      - name: Upload RRG-tail research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rrg-tail-research
          path: leadership/research/rrg_tail_outputs/
          if-no-files-found: warn
          retention-days: 14
