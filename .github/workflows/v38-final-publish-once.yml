name: V38 manual pipeline validation once

# One-shot operational repair + validation. This workflow runs only when this
# file itself changes. It patches the identified Options bug, then dispatches
# the existing production workflows without changing their ownership model.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/v38-final-publish-once.yml']

permissions:
  contents: write
  actions: write

concurrency:
  group: v38-manual-pipeline-validation-once
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      PIPELINE_BRANCH: pipeline-live
      COMMAND_CENTER_OWNED_FILES: >-
        command-center.html
        command-center_share.html
        state.json
        trend_history.json
        daily_log.csv
        mktcap.json
        fred_cache.json
        fmp_reference_cache.json
        earnings.json
        inception_vwap.json
        industry_map.json
        universe.csv
        options_targets.json
        commit_manifest.json

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Apply minimal Options repair
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          git reset --hard origin/main

          python - <<'PY'
          from pathlib import Path

          base = Path('tools/build_options_positioning.py')
          text = base.read_text(encoding='utf-8')
          old = '''    # bid=ask=0 かつ出来高なしは板が無い行。gammaを歪めるので落とす。\n    dead = (d["bid"].fillna(0) <= 0) & (d["ask"].fillna(0) <= 0) & (d["volume"].fillna(0) <= 0)\n    d = d[~dead]\n'''
          new = '''    # OI×推定GammaはOIとIVを使う。寄り前/引け後はbid/ask/volumeが0になり得るため、\n    # quoteがゼロという理由だけで有効なOIを捨てない。\n'''
          if old in text:
              text = text.replace(old, new, 1)
              base.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('Options _clean target block not found')

          tests = Path('tests/test_options_positioning_quality.py')
          t = tests.read_text(encoding='utf-8')
          marker = 'def test_zero_quote_rows_keep_valid_oi_for_gex_proxy():'
          if marker not in t:
              t += '''\n\ndef test_zero_quote_rows_keep_valid_oi_for_gex_proxy():\n    calls = pd.DataFrame({\n        "strike": [101, 102, 103, 104, 105, 106, 107, 108],\n        "openInterest": [100] * 8,\n        "impliedVolatility": [0.25] * 8,\n        "volume": [0] * 8,\n        "bid": [0] * 8,\n        "ask": [0] * 8,\n    })\n    puts = pd.DataFrame({\n        "strike": [92, 93, 94, 95, 96, 97, 98, 99],\n        "openInterest": [100] * 8,\n        "impliedVolatility": [0.25] * 8,\n        "volume": [0] * 8,\n        "bid": [0] * 8,\n        "ask": [0] * 8,\n    })\n\n    rec = options.analyse_expiry(\n        calls, puts, 100.0, "2026-09-18", "2026-09-04T22:00:00+00:00"\n    )\n\n    assert rec is not None\n    assert rec["total_oi"] == 1600\n    assert rec["call_wall"] > 100\n    assert rec["put_wall"] < 100\n'''
              tests.write_text(t, encoding='utf-8')

          workflow = Path('.github/workflows/options.yml')
          w = workflow.read_text(encoding='utf-8')
          old_preflight = '''          import sys\n          import time\n          import yfinance as yf\n\n          refs = ("SPY", "QQQ", "IWM")\n          last = {}\n          for attempt in range(1, 4):\n              usable = {}\n              for ticker in refs:\n                  try:\n                      expiries = list(yf.Ticker(ticker).options or [])\n                  except Exception as exc:\n                      expiries = []\n                      print(f"[opt-preflight] {ticker} attempt={attempt} error={type(exc).__name__}: {exc}")\n                  usable[ticker] = len(expiries)\n              last = usable\n              print(f"[opt-preflight] attempt={attempt} expiries={usable}")\n              if any(count > 0 for count in usable.values()):\n                  print("[opt-preflight] provider ready")\n                  raise SystemExit(0)\n              if attempt < 3:\n                  time.sleep(attempt * 2)\n\n          print(f"[opt-preflight] provider unavailable for all references: {last}")\n          raise SystemExit(42)\n'''
          new_preflight = '''          import time\n          import yfinance as yf\n          from tools import build_options_positioning as opt\n\n          refs = ("SPY", "QQQ", "IWM")\n          last = {}\n          for attempt in range(1, 4):\n              usable = {}\n              asof = opt._now()\n              for ticker in refs:\n                  try:\n                      rec = opt._build_record_once(yf, ticker, asof)\n                      usable[ticker] = len(rec.get("expiries") or {})\n                  except Exception as exc:\n                      usable[ticker] = 0\n                      print(f"[opt-preflight] {ticker} attempt={attempt} error={type(exc).__name__}: {exc}")\n              last = usable\n              print(f"[opt-preflight] attempt={attempt} usable_expiries={usable}")\n              if any(count > 0 for count in usable.values()):\n                  print("[opt-preflight] provider ready")\n                  raise SystemExit(0)\n              if attempt < 3:\n                  time.sleep(attempt * 2)\n\n          print(f"[opt-preflight] provider unavailable for all references: {last}")\n          raise SystemExit(42)\n'''
          if old_preflight in w:
              w = w.replace(old_preflight, new_preflight, 1)
              workflow.write_text(w, encoding='utf-8')
          elif new_preflight not in w:
              raise SystemExit('Options preflight target block not found')
          PY

          python -m py_compile tools/build_options_positioning.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/build_options_positioning.py tests/test_options_positioning_quality.py .github/workflows/options.yml
          if git diff --staged --quiet; then
            echo "Options repair already present"
          else
            git commit -m "Fix premarket Options OI chain handling"
            git push origin HEAD:main
          fi

      - name: Run repaired pipeline end to end
        shell: bash
        run: |
          set -euo pipefail

          latest_dispatch_id() {
            local workflow="$1"
            gh run list --workflow "$workflow" --event workflow_dispatch --limit 1 \
              --json databaseId --jq '.[0].databaseId // 0'
          }

          dispatch_and_wait() {
            local workflow="$1"
            local label="$2"
            shift 2
            local before run_id
            before="$(latest_dispatch_id "$workflow")"
            gh workflow run "$workflow" --ref main "$@"
            run_id=""
            for _ in $(seq 1 45); do
              run_id="$(latest_dispatch_id "$workflow")"
              if [[ -n "$run_id" && "$run_id" != "0" && "$run_id" != "$before" ]]; then
                break
              fi
              sleep 2
            done
            if [[ -z "$run_id" || "$run_id" == "0" || "$run_id" == "$before" ]]; then
              echo "::error::Could not identify dispatched run for $workflow"
              exit 1
            fi
            echo "$label run: $run_id"
            echo "- $label run: [$run_id](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/$run_id)" >> "$GITHUB_STEP_SUMMARY"
            gh run watch "$run_id" --exit-status --interval 15
          }

          wait_for_new_dispatch() {
            local workflow="$1"
            local label="$2"
            local before="$3"
            local run_id=""
            for _ in $(seq 1 60); do
              run_id="$(latest_dispatch_id "$workflow")"
              if [[ -n "$run_id" && "$run_id" != "0" && "$run_id" != "$before" ]]; then
                break
              fi
              sleep 2
            done
            if [[ -z "$run_id" || "$run_id" == "0" || "$run_id" == "$before" ]]; then
              echo "::error::Expected downstream dispatch did not appear for $workflow"
              exit 1
            fi
            echo "$label run: $run_id"
            echo "- $label run: [$run_id](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/$run_id)" >> "$GITHUB_STEP_SUMMARY"
            gh run watch "$run_id" --exit-status --interval 15
          }

          assert_command_center_unchanged() {
            local after="$1"
            git fetch --depth=1 origin main
            if ! git diff --quiet "$COMMAND_CENTER_BASE" origin/main -- $COMMAND_CENTER_OWNED_FILES; then
              echo "::error::Command Center-owned files changed after $after"
              git diff --name-status "$COMMAND_CENTER_BASE" origin/main -- $COMMAND_CENTER_OWNED_FILES
              exit 1
            fi
            echo "COMMAND_CENTER_NO_REVERSE_WRITE_AFTER_${after^^}=PASS"
          }

          echo "### Full repaired pipeline run" >> "$GITHUB_STEP_SUMMARY"

          dashboard_before="$(latest_dispatch_id dashboard.yml)"
          dispatch_and_wait options.yml "Options" -f force_full_refresh=true
          wait_for_new_dispatch dashboard.yml "Command Center" "$dashboard_before"

          git fetch --depth=1 origin main
          COMMAND_CENTER_BASE="$(git rev-parse origin/main)"
          export COMMAND_CENTER_BASE
          echo "- Command Center baseline commit: $COMMAND_CENTER_BASE" >> "$GITHUB_STEP_SUMMARY"

          git show "origin/main:state.json" > /tmp/state.json
          git show "origin/main:trend_history.json" > /tmp/trend_history.json
          git show "origin/main:daily_log.csv" > /tmp/daily_log.csv
          python - <<'PY'
          import csv
          import json
          import re
          from pathlib import Path

          iso = re.compile(r"^\d{4}-\d{2}-\d{2}$")
          state = json.loads(Path('/tmp/state.json').read_text(encoding='utf-8'))
          asof = str(state.get('date') or '')
          trend = json.loads(Path('/tmp/trend_history.json').read_text(encoding='utf-8'))
          trend_dates = []
          for row in trend if isinstance(trend, list) else []:
              value = row[0] if isinstance(row, (list, tuple)) and row else row.get('date') if isinstance(row, dict) else ''
              if iso.fullmatch(str(value or '')):
                  trend_dates.append(str(value))
          with Path('/tmp/daily_log.csv').open(encoding='utf-8', newline='') as handle:
              log_dates = [str(row.get('date') or '') for row in csv.DictReader(handle)]
          log_dates = [value for value in log_dates if iso.fullmatch(value)]
          prior = sorted({value for value in trend_dates + log_dates if value < asof})
          prevday = state.get('prevday') if isinstance(state.get('prevday'), dict) else {}
          if not asof or max(trend_dates, default='') != asof or max(log_dates, default='') != asof:
              raise SystemExit('Command Center chronology mismatch')
          if prior and str(prevday.get('date') or '') != prior[-1]:
              raise SystemExit(f"Command Center comparison baseline mismatch: {prevday.get('date')} != {prior[-1]}")
          print('COMMAND_CENTER_READY', asof, prevday.get('date'))
          PY

          dispatch_and_wait v38-live.yml "V38 / TQQQ / CURRENT30"
          assert_command_center_unchanged v38

          dispatch_and_wait v38-sleeve-refresh.yml "Sleeve / RSI Reset"
          assert_command_center_unchanged sleeve

          dispatch_and_wait rotation-live.yml "Rotation Theme56"
          assert_command_center_unchanged rotation

          dispatch_and_wait publish-public-site.yml "Public mirror"
          assert_command_center_unchanged public_mirror

          git fetch --depth=1 origin "$PIPELINE_BRANCH"
          git show "origin/$PIPELINE_BRANCH:v38-live-state.json" > /tmp/v38-live-state.json
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('/tmp/state.json').read_text(encoding='utf-8'))
          live = json.loads(Path('/tmp/v38-live-state.json').read_text(encoding='utf-8'))
          asof = str(state.get('date') or '')
          if live.get('asof') != asof:
              raise SystemExit(f"Final V38 staging mismatch: command_center={asof} v38={live.get('asof')}")
          print('FINAL_PIPELINE_ASOF_MATCH', asof)
          PY

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Reverse-flow audit" >> "$GITHUB_STEP_SUMMARY"
          echo "- V38 after-check: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Sleeve after-check: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rotation after-check: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Public mirror after-check: PASS" >> "$GITHUB_STEP_SUMMARY"
