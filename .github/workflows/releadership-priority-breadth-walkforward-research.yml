# Research-only audit. Does not modify main, Pages, or dashboard outputs.
name: Re-Leadership Priority Breadth Walk-forward Research

on:
  push:
    branches:
      - research/sector-stock-leadership-20260826
    paths:
      - leadership/research/audit_releadership_priority_breadth_walkforward.py
      - .github/workflows/releadership-priority-breadth-walkforward-research.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy yfinance
      - name: Syntax check
        run: |
          python -m py_compile leadership/research/audit_releadership_priority_breadth_walkforward.py
          python -m py_compile leadership/research/audit_core_releadership_volume_decomposition.py
      - name: Run Re-Leadership priority breadth walk-forward audit
        env:
          PYTHONPATH: .:leadership/research
        run: |
          python leadership/research/audit_releadership_priority_breadth_walkforward.py \
            --root . \
            --output leadership/research/releadership_priority_breadth_walkforward \
            --analysis-start 2020-01-02 \
            --analysis-end 2026-09-02 \
            --leader-start 2021-01-04 \
            --max-tickers 6000 \
            --batch-size 75
      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: releadership-priority-breadth-walkforward
          path: leadership/research/releadership_priority_breadth_walkforward/
          retention-days: 14
