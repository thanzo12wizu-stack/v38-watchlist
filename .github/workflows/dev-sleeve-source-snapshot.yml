name: dev sleeve source snapshot
on:
  push:
    branches: [fix/v38-normal-price-fallback-20260901]
    paths: ['.github/workflows/dev-sleeve-source-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-artifact@v4
        with:
          name: dev-sleeve-source
          path: |
            build_v38_sleeve_live.py
            tests/test_v38_sleeve_live.py
          retention-days: 1
