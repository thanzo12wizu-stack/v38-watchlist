name: Rotation Exact Flow Research

on:
  workflow_dispatch:
  push:
    branches:
      - research/rotation-exact-flow-internals-20260831
    paths:
      - leadership/research/rotation_exact_flow_research.py
      - .github/workflows/rotation-exact-flow-research.yml

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas requests openpyxl
      - name: Syntax check
        run: python -m py_compile leadership/research/rotation_exact_flow_research.py
      - name: Reconstruct official exact ETF flows
        run: |
          python leadership/research/rotation_exact_flow_research.py \
            --start 2022-01-01 \
            --output leadership/research/rotation_exact_flow_outputs
      - name: Upload research outputs
        uses: actions/upload-artifact@v4
        with:
          name: rotation-exact-flow-research
          path: leadership/research/rotation_exact_flow_outputs/
          retention-days: 7
