name: Patch recent IPO inception VWAP eligibility

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_inception_vwap_recent_ipo.py'
      - '.github/workflows/patch-recent-ipo-inception-vwap.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply and verify narrow patch
        run: |
          set -euo pipefail
          python scripts/patch_inception_vwap_recent_ipo.py
          python -m py_compile build_dashboard.py
          git diff --check
          grep -F '_near_threshold = min(0.05, max(0.02, 0.5 * _adr20))' build_dashboard.py
      - name: Persist and self-clean
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build_dashboard.py
          git rm scripts/patch_inception_vwap_recent_ipo.py .github/workflows/patch-recent-ipo-inception-vwap.yml
          git commit -m "Allow recent IPOs without RS189 in inception VWAP"
          git push origin HEAD:main
