name: One-off MC15 long-history repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-mc-history-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt pytest

      - name: Patch MC history only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('build_dashboard.py')
          s = path.read_text(encoding='utf-8')

          def rep(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              s = s.replace(old, new, 1)

          rep(
              '''MC_BASELINE_BARS = 252 * 15
          MC_LONG_LOOKBACK_YEARS = 21
          # Historical occupancy is display-only context from the audited MC15 series.
          # It is NEVER an input to the score.
          MC_OCCUPANCY_LONG = ("2008–2026", 52.4, 11.9, 35.6)
          MC_OCCUPANCY_50ETF = ("2013–2026・50ETF以上", 57.1, 12.4, 30.5)
          ''',
              '''MC_BASELINE_BARS = 252 * 15
          # SPY begins in 1993. Starting the dedicated MC history in 1992 gives the
          # 2008 MC15 series a full 3780-session prior baseline without future data.
          MC_LONG_HISTORY_START = "1992-01-01"
          MC_HISTORY_DISPLAY_START = "2008-01-01"
          ''',
              'MC history constants',
          )

          rep(
              '''        _start = (_end_ts - pd.DateOffset(years=MC_LONG_LOOKBACK_YEARS)).strftime("%Y-%m-%d")''',
              '''        _start = MC_LONG_HISTORY_START''',
              'MC fetch start',
          )
          rep(
              '''        _start, _end, _end_ts = "2005-01-01", None, None''',
              '''        _start, _end, _end_ts = MC_LONG_HISTORY_START, None, None''',
              'MC fetch fallback start',
          )

          rep(
              '''    return _mc_z_to_temperature(z15), mean15, sd15, z15


def mri_frame(macro, W=None):''',
              '''    return _mc_z_to_temperature(z15), mean15, sd15, z15


def _mc_occupancy_stats(mri, coverage=None):
              """Display-only Bull/Neutral/Bear occupancy from the live MC15 series."""
              s = pd.to_numeric(mri, errors="coerce").dropna()
              if s.empty:
                  return {"long": None, "coverage50": None}
              idx = pd.DatetimeIndex(pd.to_datetime(s.index))
              if idx.tz is not None:
                  idx = idx.tz_convert(None)
              s = s.copy()
              s.index = idx
              last_year = int(s.index.max().year)

              def _pack(sub, label):
                  sub = pd.to_numeric(sub, errors="coerce").dropna()
                  if sub.empty:
                      return {"label": label, "n": 0, "bull": None, "neutral": None, "bear": None}
                  return {
                      "label": label,
                      "n": int(len(sub)),
                      "bull": float((sub >= 55.0).mean() * 100.0),
                      "neutral": float(((sub >= 45.0) & (sub < 55.0)).mean() * 100.0),
                      "bear": float((sub < 45.0).mean() * 100.0),
                  }

              long = s[s.index >= pd.Timestamp(MC_HISTORY_DISPLAY_START)]
              long_stats = _pack(long, f"2008–{last_year}")

              cov_stats = None
              if coverage is not None:
                  cov = pd.to_numeric(coverage, errors="coerce")
                  if isinstance(cov, pd.Series):
                      cidx = pd.DatetimeIndex(pd.to_datetime(cov.index))
                      if cidx.tz is not None:
                          cidx = cidx.tz_convert(None)
                      cov = cov.copy()
                      cov.index = cidx
                      cov = cov.reindex(s.index)
                      min_cov = 100.0 * 50.0 / float(len(MC_MARKET_TICKERS))
                      use = (
                          (s.index >= pd.Timestamp("2013-01-01"))
                          & (cov >= min_cov).fillna(False).to_numpy()
                      )
                      cov_stats = _pack(s[use], f"2013–{last_year}・50ETF以上")
              if cov_stats is None:
                  cov_stats = {"label": f"2013–{last_year}・50ETF以上", "n": 0,
                               "bull": None, "neutral": None, "bear": None}
              return {"long": long_stats, "coverage50": cov_stats}


def mri_frame(macro, W=None):''',
              'dynamic MC occupancy helper',
          )

          rep(
              '''        for d, v in clean.tail(260).items() if np.isfinite(float(v))
              }
              return dict''',
              '''        for d, v in clean.tail(260).items() if np.isfinite(float(v))
              }
              _coverage_hist = vals["mc_coverage"] if isinstance(vals, pd.DataFrame) and "mc_coverage" in vals.columns else None
              mc_occupancy = _mc_occupancy_stats(mri, _coverage_hist)
              return dict''',
              'occupancy auxiliary calculation',
          )
          rep(
              '''                recent_mri=recent_mri)''',
              '''                recent_mri=recent_mri, mc_occupancy=mc_occupancy)''',
              'occupancy auxiliary return',
          )

          rep(
              '''    _op, _ob, _on, _or = MC_OCCUPANCY_LONG
              _op2, _ob2, _on2, _or2 = MC_OCCUPANCY_50ETF
              _bd_rows.append(
                  f'<div class="mnote">長期滞在比率（検証値・scoreには不算入）: {_op} Bull(55+) {_ob:.1f}% / '
                  f'Neutral(45–55) {_on:.1f}% / Bear(&lt;45) {_or:.1f}%。'
                  f'{_op2}: Bull {_ob2:.1f}% / Neutral {_on2:.1f}% / Bear {_or2:.1f}%。</div>'
              )''',
              '''    _occ = aux.get("mc_occupancy") or {}
              _ol = _occ.get("long") or {}
              _oc = _occ.get("coverage50") or {}
              if _ol.get("n") and _oc.get("n"):
                  _bd_rows.append(
                      f'<div class="mnote">長期滞在比率（本番MC15履歴から毎回再計算・scoreには不算入）: '
                      f'{_ol.get("label")} Bull(55+) {float(_ol.get("bull")):.1f}% / '
                      f'Neutral(45–55) {float(_ol.get("neutral")):.1f}% / Bear(&lt;45) {float(_ol.get("bear")):.1f}%。'
                      f'{_oc.get("label")}: Bull {float(_oc.get("bull")):.1f}% / '
                      f'Neutral {float(_oc.get("neutral")):.1f}% / Bear {float(_oc.get("bear")):.1f}%。</div>'
                  )
              else:
                  _bd_rows.append('<div class="mnote">長期滞在比率は本番MC15履歴から算出できた場合のみ表示します。</div>')''',
              'dynamic occupancy render',
          )

          rep(
              '''mri.iloc[-CHART_LB:].items()''',
              '''mri.loc[mri.index >= pd.Timestamp(MC_HISTORY_DISPLAY_START)].dropna().items()''',
              'MC chart full 2008 history',
          )

          path.write_text(s, encoding='utf-8')

          tpath = Path('tests/test_dashboard_build_regressions.py')
          t = tpath.read_text(encoding='utf-8')
          marker = 'def test_market_condition_history_is_recomputed_from_production_series():'
          if marker in t:
              raise SystemExit('history regression test already present')
          t += '''\n\n
def test_market_condition_history_is_recomputed_from_production_series():
              assert dashboard.MC_LONG_HISTORY_START <= "1993-01-01"
              assert dashboard.MC_HISTORY_DISPLAY_START == "2008-01-01"
              idx = pd.to_datetime([
                  "2008-01-02", "2012-01-03", "2013-01-02", "2014-01-02", "2015-01-02"
              ])
              mri = pd.Series([60.0, 50.0, 40.0, 70.0, 30.0], index=idx)
              coverage = pd.Series([100.0, 100.0, 100.0, 90.0, 80.0], index=idx)
              occ = dashboard._mc_occupancy_stats(mri, coverage)

              assert occ["long"]["n"] == 5
              assert np.isclose(occ["long"]["bull"], 40.0)
              assert np.isclose(occ["long"]["neutral"], 20.0)
              assert np.isclose(occ["long"]["bear"], 40.0)
              assert occ["coverage50"]["n"] == 2
              assert np.isclose(occ["coverage50"]["bull"], 50.0)
              assert np.isclose(occ["coverage50"]["bear"], 50.0)

              source = Path(dashboard.__file__).read_text(encoding="utf-8")
              assert "MC_OCCUPANCY_LONG" not in source
              assert "MC_OCCUPANCY_50ETF" not in source
              assert "mri.iloc[-CHART_LB:].items()" not in source
              assert "本番MC15履歴から毎回再計算" in source
          '''
          tpath.write_text(t, encoding='utf-8')
          PY

      - name: Regression tests
        run: |
          python -m py_compile build_dashboard.py
          pytest -q tests/test_dashboard_build_regressions.py

      - name: Live MC15 history validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import numpy as np
          import pandas as pd
          import build_dashboard as d

          state = json.load(open('state.json', encoding='utf-8'))
          asof = str(state.get('date') or '2026-08-25')
          old = float(state.get('mri'))
          hist = d._fetch_mc_long_history(asof=asof)
          if len(hist) < 50:
              raise SystemExit(f'long history coverage too low: {len(hist)}/57')
          result = d.mri_frame(hist)
          mri = result[0] if isinstance(result, tuple) else result
          if not isinstance(mri, pd.Series):
              raise SystemExit(f'unexpected mri_frame return: {type(mri)}')
          clean = pd.to_numeric(mri, errors='coerce').dropna()
          if clean.empty:
              raise SystemExit('MC15 series is empty')
          first = pd.Timestamp(clean.index[0]).tz_localize(None) if getattr(pd.Timestamp(clean.index[0]), 'tzinfo', None) else pd.Timestamp(clean.index[0])
          if first > pd.Timestamp('2008-12-31'):
              raise SystemExit(f'MC15 history starts too late: {first.date()}')
          latest = float(clean.iloc[-1])
          if abs(latest - old) > 0.2:
              raise SystemExit(f'current MC changed unexpectedly: state={old:.1f}, recomputed={latest:.3f}')

          print(f'CURRENT_UNCHANGED state={old:.1f} recomputed={latest:.3f}')
          print(f'EARLIEST_VALID_MC15 {first.date()}')
          for label, start, end in [
              ('2008', '2008-09-01', '2009-03-31'),
              ('2018Q4', '2018-10-01', '2018-12-31'),
              ('2020', '2020-02-01', '2020-04-30'),
              ('2022', '2022-01-01', '2022-12-31'),
          ]:
              w = clean.loc[start:end]
              if w.empty or not np.isfinite(float(w.min())):
                  raise SystemExit(f'{label} window missing')
              dt = pd.Timestamp(w.idxmin())
              print(f'CRISIS_{label} min={float(w.min()):.2f} date={dt.date()} n={len(w)}')
          PY

      - name: Commit only the approved MC history fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/oneoff-mc-history-fix.yml
          git add build_dashboard.py tests/test_dashboard_build_regressions.py
          git commit -m "Rebuild MC15 history from full production series"
          git pull --rebase origin main
          git push origin HEAD:main
