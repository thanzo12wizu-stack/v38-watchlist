name: One-off MC15 long-history repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-mc-history-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt pytest

      - name: Apply approved MC-only history repair
        run: python .github/scripts/oneoff_mc_history_fix.py patch

      - name: Regression tests
        run: |
          python -m py_compile build_dashboard.py
          pytest -q tests/test_dashboard_build_regressions.py

      - name: Validate live long history and crisis windows
        run: PYTHONPATH=. python .github/scripts/oneoff_mc_history_fix.py validate

      - name: Commit approved repair and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/oneoff-mc-history-fix.yml .github/scripts/oneoff_mc_history_fix.py
          git add build_dashboard.py tests/test_dashboard_build_regressions.py
          git commit -m "Rebuild MC15 history from full production series"
          git pull --rebase origin main
          git push origin HEAD:main
