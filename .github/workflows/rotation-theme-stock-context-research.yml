name: Rotation Theme Stock Context Research

on:
  workflow_dispatch:
  push:
    branches:
      - research/rotation-exact-flow-internals-20260831
    paths:
      - leadership/research/rotation_theme_stock_context.py
      - leadership/research/rotation_theme56_stock_context.py
      - leadership/research/rotation_theme56_config.json
      - leadership/research/rotation_theme56_fullstack/**
      - leadership/research/rotation_theme56_provider_qa/theme56_exact_current_holdings.csv
      - leadership/research/rotation_theme56_holdings_expansion/exact_current_holdings_expansion.csv
      - leadership/research/rotation_live/latest_matrix.csv
      - .github/workflows/rotation-theme-stock-context-research.yml

permissions:
  contents: write

concurrency:
  group: rotation-theme-stock-context-research
  cancel-in-progress: true

jobs:
  context:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/rotation-exact-flow-internals-20260831
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install isolated research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy yfinance requests openpyxl lxml html5lib

      - name: Syntax check
        run: |
          python -m py_compile leadership/research/rotation_theme_stock_context.py
          python -m py_compile leadership/research/rotation_theme56_stock_context.py
          python -m py_compile leadership/build_market_snapshot.py
          python -m py_compile leadership/build_leadership_exact.py

      - name: Build independent Leadership market snapshot
        run: |
          python leadership/build_market_snapshot.py \
            --universe universe.csv \
            --output leadership/market_snapshot.json \
            --benchmark QQQ \
            --period 15mo \
            --batch-size 80 \
            --max-symbols 0

      - name: Build full-stock Leadership model in temp only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/rotation-leadership-model
          mkdir -p /tmp/rotation-leadership-model
          cp leadership/build_leadership_exact.py /tmp/build_leadership_exact_rotation.py
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/build_leadership_exact_rotation.py')
          text = p.read_text(encoding='utf-8')
          old = '"stocks": ranked[:15],'
          if text.count(old) != 1:
              raise SystemExit(f'expected one stock-export limiter, found {text.count(old)}')
          p.write_text(text.replace(old, '"stocks": ranked,'), encoding='utf-8')
          PY
          PYTHONPATH=. python /tmp/build_leadership_exact_rotation.py \
            --root . \
            --output /tmp/rotation-leadership-model

      - name: Build legacy 15-ETF context
        run: |
          rm -rf leadership/research/rotation_theme_stock_context
          python leadership/research/rotation_theme_stock_context.py \
            --leadership /tmp/rotation-leadership-model/leadership.json \
            --matrix leadership/research/rotation_live/latest_matrix.csv \
            --output leadership/research/rotation_theme_stock_context

      - name: Upgrade legacy context to full Leadership export coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          root=Path('leadership/research/rotation_theme_stock_context'); jp=root/'rotation_theme_stock_context.json'; cp=root/'rotation_theme_stock_context.csv'
          data=json.loads(jp.read_text(encoding='utf-8')); df=pd.read_csv(cp)
          def clean(v):
              if pd.isna(v): return None
              if hasattr(v,'item'):
                  try: return v.item()
                  except Exception: pass
              return v
          total=0
          for item in data.get('industry_context') or []:
              etf=str(item.get('etf') or ''); g=df[df['etf'].astype(str)==etf].copy()
              if not g.empty:
                  for c in ('group_rank','stock_rank_within_group','holding_rank'): g[c]=pd.to_numeric(g[c],errors='coerce')
                  g=g.sort_values(['group_rank','stock_rank_within_group','holding_rank'],na_position='last')
              leaders=g[g['role'].astype(str).isin(['PIONEER','LEADER']) & g['group_phase'].astype(str).isin(['EMERGING','LEADING'])] if not g.empty else g
              cols=['symbol','name','group','group_sector','group_phase','group_rank','group_score','stock_rank_within_group','role','strength','rs189','rs63','rs21','acceleration','holding_rank','holding_weight_pct']
              rows=[{k:clean(r.get(k)) for k in cols} for r in leaders.head(30).to_dict('records')]
              item['leadership_full_intersections']=int(len(g)); members=int(item.get('membership_rows') or 0)
              item['leadership_full_intersection_pct']=(100.0*len(g)/members) if members else None
              item['existing_emerging_or_leading_leaders_in_full_intersection']=rows
              item['existing_emerging_or_leading_leaders_in_top15_intersection']=rows
              total+=len(g)
          data['schema']=5; data['context_scope']='FULL_ETF_MEMBERSHIP_X_FULL_LEADERSHIP_EXPORT'; data['full_leadership_export_for_rotation_only']=True; data['full_intersections_total']=int(total)
          jp.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Build Theme56 leading-stock context
        run: |
          rm -rf leadership/research/rotation_theme56_stock_context
          python leadership/research/rotation_theme56_stock_context.py \
            --config leadership/research/rotation_theme56_config.json \
            --leadership /tmp/rotation-leadership-model/leadership.json \
            --fullstack leadership/research/rotation_theme56_fullstack/theme56_fullstack_snapshot.json \
            --holdings leadership/research/rotation_theme56_provider_qa/theme56_exact_current_holdings.csv \
            --holdings-expansion leadership/research/rotation_theme56_holdings_expansion/exact_current_holdings_expansion.csv \
            --output leadership/research/rotation_theme56_stock_context

      - name: Validate Theme56 context
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('leadership/research/rotation_theme56_stock_context/rotation_theme56_stock_context.json').read_text(encoding='utf-8'))
          items=d.get('industry_context') or []
          if d.get('research_only') is not True or d.get('context_scope')!='THEME56_EXACT_CURRENT_MEMBERSHIP_X_FULL_LEADERSHIP_EXPORT': raise SystemExit('Theme56 context guard missing')
          if len(items)!=56 or len({x.get('etf') for x in items})!=56: raise SystemExit('Theme56 ETF set mismatch')
          if int(d.get('exact_membership_theme_count') or 0)<35: raise SystemExit('Theme56 exact membership coverage unexpectedly low')
          if int(d.get('themes_with_leaders') or 0)<10: raise SystemExit('Theme56 leader coverage unexpectedly low')
          print(json.dumps({'themes':len(items),'membership':d.get('exact_membership_theme_count'),'with_leaders':d.get('themes_with_leaders')},ensure_ascii=False))
          PY

      - name: Upload research-only contexts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rotation-theme-stock-context-research
          path: |
            leadership/research/rotation_theme_stock_context/
            leadership/research/rotation_theme56_stock_context/
          if-no-files-found: error
          retention-days: 14

      - name: Persist both context outputs
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="research/rotation-exact-flow-internals-20260831"
          T1="$(mktemp -d)/rotation_theme_stock_context"; T2="$(mktemp -d)/rotation_theme56_stock_context"
          cp -a leadership/research/rotation_theme_stock_context "$T1"
          cp -a leadership/research/rotation_theme56_stock_context "$T2"
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"; git reset --hard "origin/$BRANCH"
            rm -rf leadership/research/rotation_theme_stock_context leadership/research/rotation_theme56_stock_context
            cp -a "$T1" leadership/research/rotation_theme_stock_context
            cp -a "$T2" leadership/research/rotation_theme56_stock_context
            git add leadership/research/rotation_theme_stock_context leadership/research/rotation_theme56_stock_context
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "research: record Rotation 15 and Theme56 stock contexts"
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
          done
          exit 1
