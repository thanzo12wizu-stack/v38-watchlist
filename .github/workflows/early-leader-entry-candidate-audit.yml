# Research-only. Does not modify main, live data, or dashboard outputs.
name: Early Leader Entry Candidate Audit

on:
  push:
    branches:
      - research/leader-entry-delay-audit-20260904
    paths:
      - leadership/research/audit_early_leader_entry_candidates.py
      - leadership/research/run_early_leader_entry_candidates_fixed.py
      - .github/workflows/early-leader-entry-candidate-audit.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy yfinance
      - name: Syntax check
        run: |
          python -m py_compile leadership/research/audit_early_leader_entry_candidates.py
          python -m py_compile leadership/research/run_early_leader_entry_candidates_fixed.py
          python -m py_compile leadership/research/audit_major_leader_entry_delay.py
      - name: Run early leader entry candidate audit
        env:
          PYTHONPATH: .:leadership/research
        run: |
          python leadership/research/run_early_leader_entry_candidates_fixed.py \
            --root . \
            --output leadership/research/early_leader_entry_candidate_output \
            --analysis-start 2016-01-04 \
            --analysis-end 2026-09-02 \
            --max-tickers 6000 \
            --batch-size 75
      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: early-leader-entry-candidate-audit
          path: leadership/research/early_leader_entry_candidate_output/
          retention-days: 14
