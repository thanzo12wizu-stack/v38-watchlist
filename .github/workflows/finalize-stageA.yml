# trigger existing workflow
name: Finalize Stage A universe and eligibility

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/finalize-stageA.yml'

permissions:
  contents: write

concurrency:
  group: finalize-stageA-main
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply Stage A patch
        shell: bash
        run: |
          set -euo pipefail
          python scripts/finalize_stageA.py
          python -m py_compile build_dashboard.py
          git diff --check
          grep -q 'for _typ in ("stock", "dr")' build_dashboard.py
          grep -q 'selection_excluded' build_dashboard.py
          grep -q 'V38_BIO_REVENUE_MAX' .github/workflows/dashboard.yml
      - name: Commit final Stage A source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build_dashboard.py .github/workflows/dashboard.yml
          git rm -f scripts/finalize_stageA.py .github/workflows/finalize-stageA.yml
          # Remove abandoned preview patcher; the final rule is implemented above.
          git rm -f scripts/stage2c_patch.py .github/workflows/stage2c-bio-preview-patch.yml 2>/dev/null || true
          git commit -m "Include US DRs and isolate clinical-stage names from selection"
          git push origin HEAD:main
