name: One-off audit MRI history calculation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-mri-history-once.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Trace MRI history chart wiring
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('build_dashboard.py').read_text(encoding='utf-8')
          lines = s.splitlines()

          def ctx(i, before=12, after=20):
              print(f'--- around line {i} ---')
              for j in range(max(1,i-before), min(len(lines),i+after)+1):
                  print(f'{j}: {lines[j-1]}')

          print('=== ALL MRI VARIABLE USES AFTER MAIN ASSIGNMENT ===')
          for i,line in enumerate(lines,1):
              if i >= 20800 and re.search(r'\bmri\b', line):
                  print(f'{i}: {line[:800]}')

          print('=== MARKET CONDITIONS HISTORY UI CONTEXT ===')
          for i,line in enumerate(lines,1):
              if 'Market Conditions 推移' in line or 'Regime History' in line:
                  ctx(i, 25, 45)

          print('=== SCORE SERIES SERIALIZATION CANDIDATES ===')
          for i,line in enumerate(lines,1):
              if any(tok in line for tok in ['mri.tail', 'mri.dropna', 'mri.index', 'mri.to_', 'mri.tolist', 'mri.items', 'mri.loc', 'mri.iloc']):
                  ctx(i, 8, 16)

          print('=== FUNCTIONS RECEIVING MRI ===')
          for i,line in enumerate(lines,1):
              if re.search(r'def .*\bmri\b', line):
                  ctx(i, 5, 60)

          print('=== HTML HISTORY LABEL CONTEXT ===')
          html = Path('command-center.html').read_text(encoding='utf-8', errors='ignore')
          for needle in ['Market Conditions 推移','Regime History']:
              pos = html.find(needle)
              print('needle', needle, 'pos', pos)
              if pos >= 0:
                  print(html[max(0,pos-1500):pos+4000].replace('\n',' ')[:5500])
          PY
