name: RS persistence research validation

on:
  pull_request:
    paths:
      - 'leadership/research/validate_rs_persistence.py'
      - '.github/workflows/rs-persistence-research.yml'

permissions:
  contents: read

concurrency:
  group: rs-persistence-research-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    if: startsWith(github.head_ref, 'research/rs-period-')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy yfinance

      - name: Syntax check
        run: |
          python -m py_compile leadership/research/validate_early_rotation.py
          python -m py_compile leadership/research/validate_confirmed_leadership.py
          python -m py_compile leadership/research/validate_pioneer_leader.py
          python -m py_compile leadership/research/validate_rs_periods.py
          python -m py_compile leadership/research/validate_rs_persistence.py

      - name: Run RS persistence validation
        run: |
          python leadership/research/validate_rs_persistence.py \
            --root . \
            --output leadership/research/rs_persistence_output \
            --analysis-start 2016-01-04 \
            --analysis-end 2026-06-20 \
            --max-tickers 1500 \
            --batch-size 75 \
            --min-members 3

      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rs-persistence-validation
          path: leadership/research/rs_persistence_output/
          if-no-files-found: warn
          retention-days: 7
