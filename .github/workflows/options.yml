name: Options positioning

on:
  schedule:
    # 米引け後（JST翌朝6:47）。EODのOIが載ったタイミングで取得する。
    - cron: '47 21 * * 1-5'
  push:
    branches: [main]
    paths:
      - '.github/workflows/options.yml'
      - 'tools/build_options_positioning_directional.py'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: options-positioning-main
  cancel-in-progress: false

jobs:
  options:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check -r requirements.txt

      - name: Build options positioning
        env:
          V38_STATE_JSON: state.json
          V38_OPT_JSON: options_positioning.json
          V38_OPT_HISTORY: options_history.csv
          V38_OPT_CACHE: options_cache
          # 対象。空なら state.json の picks/hold（Core 12）を使う。
          V38_OPT_TICKERS: ''
          V38_OPT_MAX_EXPIRY: '4'
          V38_OPT_HTML: options-positioning.html
          # 定時runは全銘柄履歴を継続。ソース変更のpush runだけは表示対象に絞って速く反映する。
          V38_OPT_SCAN_ALL: ${{ github.event_name == 'schedule' && '1' || '0' }}
          V38_UNIVERSE_CSV: universe.csv
          V38_OPT_SCAN_HISTORY: options_scan_history.csv
          V38_OPT_SCAN_WORKERS: '8'
          V38_OPT_TARGETS: options_targets.json
        run: |
          python -m py_compile tools/build_options_positioning.py tools/build_options_positioning_directional.py
          python tools/build_options_positioning_directional.py
          python tools/render_options_html.py

      - name: Commit and refresh dashboard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in options_positioning.json options_history.csv \
                   options-positioning.html options_scan_history.csv; do
            [[ -f "$f" ]] && git add -- "$f"
          done
          [[ -d options_cache ]] && git add -A options_cache || true
          if git diff --staged --quiet; then
            echo "no options changes"
            gh workflow run dashboard.yml --ref main || true
            exit 0
          fi
          git commit -m "Options positioning $(date +%F)"
          pushed=false
          for a in 1 2 3; do
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            sleep $((a*2))
          done
          [[ "$pushed" == true ]] || exit 1
          gh workflow run dashboard.yml --ref main || true
