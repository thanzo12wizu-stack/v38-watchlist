name: Options positioning

on:
  schedule:
    # 米引け後（JST翌朝6:47）。EODのOIが載ったタイミングで取得する。
    - cron: '47 21 * * 1-5'
  push:
    branches: [main]
    paths:
      - '.github/workflows/options.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: options-positioning-main
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  options:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Repair directional wall semantics
        shell: bash
        run: |
          set -euo pipefail
          python scripts/fix_directional_option_walls.py
          python -m py_compile tools/build_options_positioning.py

      - run: pip install --disable-pip-version-check -r requirements.txt

      - name: Build options positioning
        env:
          V38_STATE_JSON: state.json
          V38_OPT_JSON: options_positioning.json
          V38_OPT_HISTORY: options_history.csv
          V38_OPT_CACHE: options_cache
          # 対象。空なら state.json の picks/hold（Core 12）を使う。
          V38_OPT_TICKERS: ''
          V38_OPT_MAX_EXPIRY: '4'
          V38_OPT_HTML: options-positioning.html
          # 定時runは全銘柄履歴を継続。今回のpush修正runだけは表示対象に絞って速く反映する。
          V38_OPT_SCAN_ALL: ${{ github.event_name == 'schedule' && '1' || '0' }}
          V38_UNIVERSE_CSV: universe.csv
          V38_OPT_SCAN_HISTORY: options_scan_history.csv
          V38_OPT_SCAN_WORKERS: '8'
          V38_OPT_TARGETS: options_targets.json
        run: |
          python tools/build_options_positioning.py
          python tools/render_options_html.py

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in options_positioning.json options_history.csv \
                   options-positioning.html options_scan_history.csv \
                   tools/build_options_positioning.py .github/workflows/dashboard.yml; do
            [[ -f "$f" ]] && git add -- "$f"
          done
          [[ -d options_cache ]] && git add -A options_cache || true
          git rm -f --ignore-unmatch scripts/fix_directional_option_walls.py \
                                      .github/workflows/fix-directional-option-walls.yml
          if git diff --staged --quiet; then
            echo "no options changes"; exit 0
          fi
          git commit -m "Fix directional option walls and refresh positioning"
          for a in 1 2 3; do
            git push origin HEAD:main && exit 0
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            sleep $((a*2))
          done
          exit 1
