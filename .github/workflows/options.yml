name: Options positioning

on:
  schedule:
    # 米引け後（JST翌朝6:47）。EODのOIが載ったタイミングで取得する。
    - cron: '47 21 * * 1-5'
  # コードpush時はYahooのOI更新前・メンテナンス時間にも走って全滅し得るため実データ取得しない。
  # 修復確認は明示的な手動実行、通常更新は米引け後のscheduleだけに限定する。
  workflow_dispatch:
    inputs:
      force_full_refresh:
        description: '全ユニバースを再取得対象にする（14日ローテーションを無視）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: options-positioning-main
  cancel-in-progress: false

jobs:
  options:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.force_full_refresh && 180 || 30 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check -r requirements.txt pytest

      - name: Preflight tests
        run: |
          python -m py_compile build_dashboard.py tools/build_options_positioning.py \
            tools/build_options_positioning_directional.py tools/render_options_html.py
          pytest -q tests/test_dashboard_build_regressions.py \
            tests/test_options_positioning_quality.py

      - name: Build options positioning
        env:
          V38_STATE_JSON: state.json
          V38_OPT_JSON: options_positioning.json
          V38_OPT_HISTORY: options_history.csv
          V38_OPT_CACHE: options_cache
          # 対象。空なら state.json の picks/hold（Core 12）を使う。
          V38_OPT_TICKERS: ''
          V38_OPT_MAX_EXPIRY: '4'
          V38_OPT_HTML: options-positioning.html
          # Core＋候補は毎回詳細取得。残りは少量ローテーションし、数週間かけて広域蓄積する。
          V38_OPT_SCAN_ALL: '1'
          V38_UNIVERSE_CSV: universe.csv
          V38_OPT_SCAN_HISTORY: options_scan_history.csv
          V38_OPT_SCAN_STATE: options_scan_state.json
          # 手動force時は一時state/historyを空から作り、全銘柄をdue扱いにする。
          # 通常runは従来どおり60件ローテーション。
          V38_OPT_FORCE_FULL_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_full_refresh && '1' || '0' }}
          V38_OPT_SCAN_BUDGET: ${{ github.event_name == 'workflow_dispatch' && inputs.force_full_refresh && '100000' || '60' }}
          V38_OPT_SCAN_WORKERS: '2'
          V38_OPT_SCAN_REFRESH_DAYS: '14'
          # 一時的な空レスポンス/429には短いバックオフ。全滅時は失敗にして前回commitを維持。
          V38_OPT_FETCH_ATTEMPTS: '3'
          V38_OPT_RETRY_BASE_SECONDS: '2'
          V38_OPT_MIN_REFRESH_RATIO: '0.35'
          V38_OPT_STALE_DAYS: '3'
          V38_OPT_TARGETS: options_targets.json
        shell: bash
        run: |
          set -euo pipefail

          # Manual runs can occur while Yahoo exposes expiry labels but not a
          # usable OI/IV chain. Probe the same analysis path used by production
          # before starting a full refresh. If all three reference ETFs are
          # unusable, preserve the committed last-known-good snapshot and finish
          # green so the rest of the site pipeline can continue safely.
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            set +e
            python - <<'PY'
          import sys
          import time
          import yfinance as yf

          sys.path.insert(0, "tools")
          import build_options_positioning_directional as directional

          base = directional.base
          refs = ("SPY", "QQQ", "IWM")
          last = {}
          for attempt in range(1, 4):
              usable = {}
              asof = base._now()
              for ticker in refs:
                  try:
                      rec = base._build_record_once(yf, ticker, asof)
                      usable[ticker] = len(rec.get("expiries") or {})
                  except Exception as exc:
                      usable[ticker] = 0
                      print(
                          f"[opt-preflight] {ticker} attempt={attempt} "
                          f"error={type(exc).__name__}: {exc}"
                      )
              last = usable
              print(f"[opt-preflight] attempt={attempt} usable_expiries={usable}")
              if any(count > 0 for count in usable.values()):
                  print("[opt-preflight] provider ready")
                  raise SystemExit(0)
              if attempt < 3:
                  time.sleep(attempt * 2)

          print(f"[opt-preflight] no usable reference chains: {last}")
          raise SystemExit(42)
          PY
            preflight_rc=$?
            set -e
            if [[ "$preflight_rc" == "42" ]]; then
              echo "::warning::Yahoo option chains are not currently usable for SPY/QQQ/IWM. Keeping the previous committed Options snapshot and continuing the site pipeline."
              echo "### Options positioning" >> "$GITHUB_STEP_SUMMARY"
              echo "- Status: retained last-known-good" >> "$GITHUB_STEP_SUMMARY"
              echo "- Reason: no usable OI/IV chain for SPY / QQQ / IWM during manual run" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ "$preflight_rc" != "0" ]]; then
              exit "$preflight_rc"
            fi
          fi

          if [[ "${V38_OPT_FORCE_FULL_REFRESH}" == "1" ]]; then
            echo "[opt] force full refresh: all universe names are due in this run"
            export V38_OPT_SCAN_HISTORY=/tmp/options_scan_history.full.csv
            export V38_OPT_SCAN_STATE=/tmp/options_scan_state.full.json
            rm -f "$V38_OPT_SCAN_HISTORY" "$V38_OPT_SCAN_STATE"
            printf '{}\n' > "$V38_OPT_SCAN_STATE"

            python tools/build_options_positioning_directional.py

            # 通常の履歴/stateを消さず、今回の全件再取得結果だけをマージする。
            python - <<'PY'
          import csv
          import json
          from pathlib import Path

          old_hist = Path("options_scan_history.csv")
          new_hist = Path("/tmp/options_scan_history.full.csv")
          merged = {}
          fieldnames = []
          for path in (old_hist, new_hist):
              if not path.is_file():
                  continue
              with path.open(encoding="utf-8-sig", newline="") as fh:
                  reader = csv.DictReader(fh)
                  if reader.fieldnames:
                      for name in reader.fieldnames:
                          if name not in fieldnames:
                              fieldnames.append(name)
                  for row in reader:
                      key = (row.get("date", ""), row.get("ticker", ""), row.get("expiry", ""))
                      if any(key):
                          merged[key] = row
          if fieldnames and merged:
              with old_hist.open("w", encoding="utf-8", newline="") as fh:
                  writer = csv.DictWriter(fh, fieldnames=fieldnames, extrasaction="ignore")
                  writer.writeheader()
                  for row in merged.values():
                      writer.writerow(row)

          old_state_path = Path("options_scan_state.json")
          new_state_path = Path("/tmp/options_scan_state.full.json")
          try:
              old_state = json.loads(old_state_path.read_text(encoding="utf-8")) if old_state_path.is_file() else {}
          except Exception:
              old_state = {}
          try:
              new_state = json.loads(new_state_path.read_text(encoding="utf-8")) if new_state_path.is_file() else {}
          except Exception:
              new_state = {}
          if not isinstance(old_state, dict):
              old_state = {}
          if isinstance(new_state, dict):
              old_state.update(new_state)
          old_state_path.write_text(
              json.dumps(old_state, ensure_ascii=False, sort_keys=True),
              encoding="utf-8",
          )
          PY

            V38_OPT_SCAN_HISTORY=options_scan_history.csv \
              V38_OPT_SCAN_STATE=options_scan_state.json \
              python tools/render_options_html.py
          else
            python tools/build_options_positioning_directional.py
            python tools/render_options_html.py
          fi

      - name: Commit and refresh dashboard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in options_positioning.json options_history.csv \
                   options-positioning.html options_scan_history.csv options_scan_state.json; do
            [[ -f "$f" ]] && git add -- "$f"
          done
          [[ -d options_cache ]] && git add -A options_cache || true
          if git diff --staged --quiet; then
            echo "no options changes"
            gh workflow run dashboard.yml --ref main || true
            exit 0
          fi
          git commit -m "Options positioning $(date +%F)"
          pushed=false
          for a in 1 2 3; do
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            sleep $((a*2))
          done
          [[ "$pushed" == true ]] || exit 1
          gh workflow run dashboard.yml --ref main || true
