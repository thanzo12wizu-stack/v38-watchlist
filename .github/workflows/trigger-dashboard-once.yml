name: Trigger dashboard rebuild once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-dashboard-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch dashboard build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run dashboard.yml --ref main
