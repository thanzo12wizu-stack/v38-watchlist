name: Base Transition Research

on:
  workflow_dispatch:
  push:
    branches:
      - research/sector-stock-leadership-20260826
    paths:
      - leadership/research/discover_base_transition.py
      - .github/workflows/base-transition-research.yml

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy scikit-learn yfinance
      - name: Syntax check
        run: python -m py_compile leadership/research/discover_base_transition.py
      - name: Run base transition discovery
        run: |
          python leadership/research/discover_base_transition.py \
            --root . \
            --output leadership/research/base_transition_outputs \
            --max-tickers 6000 \
            --batch-size 75 \
            --min-members 3
      - name: Upload research outputs
        uses: actions/upload-artifact@v4
        with:
          name: base-transition-research
          path: leadership/research/base_transition_outputs/
          retention-days: 7
