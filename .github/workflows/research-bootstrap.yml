name: Archived ten-year research bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Confirm archived completion state
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('research-bootstrap-status.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          if payload.get('status') != 'COMPLETE' or payload.get('missing_years'):
              raise SystemExit('Archived bootstrap state is not complete')
          print('Ten-year bootstrap is archived and complete. No worker will be dispatched.')
          PY
