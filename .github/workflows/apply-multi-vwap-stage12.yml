name: Apply Multi VWAP Stage 1-2 filter

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-multi-vwap-stage12.yml'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-multi-vwap-stage12
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply guarded source patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path("build_dashboard.py")
          s = p.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 anchor, found {n}")
              s = s.replace(old, new, 1)

          replace_once(
              "/* SETUP_STAGE_BADGE_V1: display only; no setup eligibility/ranking changes. */",
              "/* MULTI_VWAP_STAGE12_BADGE_V1: display is restricted to the filtered Multi VWAP table. */",
              "stage badge marker",
          )
          replace_once(
              "document.querySelectorAll('#t-today [data-tkone]').forEach(function(el){",
              "document.querySelectorAll('#t-today .vwtbl [data-tkone]').forEach(function(el){",
              "stage badge selector",
          )

          rs_anchor = (
              '    rs = pd.to_numeric(m.get("rs189", pd.Series(0, index=m.index)), '
              'errors="coerce").fillna(0)\n'
          )
          stage_block = rs_anchor + (
              '    # MULTI_VWAP_WEEKLY_STAGE12_FILTER_V1\n'
              '    # VWAP proximity is actionable only in Weinstein weekly Stage 1/2.\n'
              '    # Stage 3/4 and missing stage data are excluded from every VWAP path.\n'
              '    _wst = pd.to_numeric(m.get("wst", pd.Series(np.nan, index=m.index)), errors="coerce")\n'
              '    stage12 = _wst.isin([1, 2]).fillna(False)\n'
          )
          replace_once(rs_anchor, stage_block, "stage12 insertion")

          replace_once(
              '    keep_roll = elig & (entry_worthy(m) | ipo) & loc_roll & \\\n'
              '        ((rs >= MULTI_VWAP_RS189_MIN) | ipo)\n',
              '    keep_roll = stage12 & elig & (entry_worthy(m) | ipo) & loc_roll & \\\n'
              '        ((rs >= MULTI_VWAP_RS189_MIN) | ipo)\n',
              "rolling VWAP stage gate",
          )
          replace_once(
              '    keep_all = setup_eligible_core(m) & loc_all\n',
              '    keep_all = stage12 & setup_eligible_core(m) & loc_all\n',
              "inception VWAP stage gate",
          )

          replace_once(
              '        \'ステージ2かつ50日線から6ATR以内・ピボットから+12%以内に限定。\'\n',
              '        \'週足ステージ1または2に限定。ステージ3・4・判定欠損は表示しない。\'\n',
              "empty-card stage copy",
          )
          normal_copy = (
              '            \'63/252VWAPはRS189≥85のリーダーのみ。上場来VWAPはRS条件なし（稀少イベントのため）。\'\n'
              '            \'上場来VWAPは取得期間内に上場し、全履歴がある銘柄のみ算出。古い銘柄は対象外表示で、不利に採点しない。</div>\'\n'
          )
          normal_copy_new = (
              '            \'63/252VWAPはRS189≥85のリーダーのみ。上場来VWAPはRS条件なし（稀少イベントのため）。\'\n'
              '            \'週足ステージ1または2の銘柄だけを表示し、ステージ3・4・判定欠損は除外。\'\n'
              '            \'上場来VWAPは取得期間内に上場し、全履歴がある銘柄のみ算出。古い銘柄は対象外表示で、不利に採点しない。</div>\'\n'
          )
          replace_once(normal_copy, normal_copy_new, "normal-card stage copy")

          replace_once(
              '    """63/252/all-time VWAP watch with a dedicated all-time break column."""\n',
              '    """Stage-1/2-only 63/252/all-time VWAP watch with a dedicated all-time break column."""\n',
              "VWAP function docstring",
          )

          required = [
              "SPLIT_EVENT_CONFIRM_V1",
              "TRUE_PRICE_LEVEL_CONFLUENCE_V1",
              'if ov_n < 2 or ov_dist > 0.08:',
              '_rrg_card(mkt.get("rrg_etf"), None, mkt.get("etf_hier"), 100',
              'MULTI_VWAP_WEEKLY_STAGE12_FILTER_V1',
              'keep_roll = stage12 & elig',
              'keep_all = stage12 & setup_eligible_core(m) & loc_all',
              "document.querySelectorAll('#t-today .vwtbl [data-tkone]')",
          ]
          for needle in required:
              if needle not in s:
                  raise SystemExit("required invariant missing: " + needle)
          if "SETUP_STAGE_BADGE_V1" in s:
              raise SystemExit("old display-only Stage badge marker survived")
          if "document.querySelectorAll('#t-today [data-tkone]')" in s:
              raise SystemExit("generic Setups Stage decoration survived")

          p.write_text(s, encoding="utf-8")
          PY

          python -m py_compile build_dashboard.py
          git diff --check
          grep -F 'MULTI_VWAP_WEEKLY_STAGE12_FILTER_V1' build_dashboard.py
          grep -F 'keep_roll = stage12 & elig' build_dashboard.py
          grep -F 'keep_all = stage12 & setup_eligible_core(m) & loc_all' build_dashboard.py
          grep -F 'SPLIT_EVENT_CONFIRM_V1' build_dashboard.py
          grep -F 'TRUE_PRICE_LEVEL_CONFLUENCE_V1' build_dashboard.py
          grep -F '_rrg_card(mkt.get("rrg_etf"), None, mkt.get("etf_hier"), 100' build_dashboard.py

      - name: Install runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet -r requirements.txt

      - name: Validate offline dashboard
        shell: bash
        run: |
          set -euo pipefail
          timeout 300 python build_dashboard.py --selftest
          python - <<'PY'
          import ast
          from pathlib import Path

          src = Path("build_dashboard.py").read_text(encoding="utf-8")
          tree = ast.parse(src)
          fn = next(n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name == "build_multi_vwap_card")
          body = ast.get_source_segment(src, fn)
          assert body
          assert "stage12 = _wst.isin([1, 2]).fillna(False)" in body
          assert "keep_roll = stage12 & elig" in body
          assert "keep_all = stage12 & setup_eligible_core(m) & loc_all" in body
          assert "週足ステージ1または2の銘柄だけを表示" in body
          print("MULTI_VWAP_STAGE12_STATIC_OK")
          PY

      - name: Commit source and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- build_dashboard.py
          git rm -- .github/workflows/apply-multi-vwap-stage12.yml
          git commit -m "Restrict Multi VWAP setups to weekly Stage 1 and 2"
          git push origin HEAD:main
          echo "FIX_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Rebuild production dashboard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run dashboard.yml --ref main
          run_id=""
          for _ in $(seq 1 60); do
            sleep 2
            run_id="$(gh run list --workflow dashboard.yml --branch main --event workflow_dispatch --limit 20 --json databaseId,headSha --jq '.[] | select(.headSha == env.FIX_SHA) | .databaseId' | head -n1)"
            if [[ -n "$run_id" ]]; then
              break
            fi
          done
          if [[ -z "$run_id" ]]; then
            echo "Could not identify production dashboard run for $FIX_SHA" >&2
            exit 1
          fi
          echo "PRODUCTION_RUN_ID=$run_id"
          gh run watch "$run_id" --exit-status --interval 15
          gh run view "$run_id" --json databaseId,status,conclusion,event,headSha,url
