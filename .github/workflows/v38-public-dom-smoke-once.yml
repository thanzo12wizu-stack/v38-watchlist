name: V38 public DOM smoke once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v38-public-dom-smoke-once.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Verify Chrome exists
        run: |
          command -v google-chrome
          google-chrome --version

      - name: Dump rendered public DOM
        shell: bash
        run: |
          set -euo pipefail
          url="https://thanzo12wizu-stack.github.io/v38-watchlist/command-center-v38.html?domsmoke=$(date +%s)"
          timeout 45s google-chrome \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=12000 \
            --dump-dom "$url" > /tmp/v38-public-dom.html 2>/tmp/chrome.err || rc=$?
          rc=${rc:-0}
          echo "chrome_rc=$rc"
          cat /tmp/chrome.err || true
          test -s /tmp/v38-public-dom.html

      - name: Assert rendered V38 values
        shell: bash
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import json

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.stack=[]
                  self.by_id={}
                  self.all=[]
              def handle_starttag(self, tag, attrs):
                  attrs=dict(attrs)
                  self.stack.append(attrs.get('id'))
              def handle_startendtag(self, tag, attrs):
                  pass
              def handle_endtag(self, tag):
                  if self.stack:
                      self.stack.pop()
              def handle_data(self, data):
                  self.all.append(data)
                  for id_ in self.stack:
                      if id_:
                          self.by_id[id_]=self.by_id.get(id_,'')+data

          text=Path('/tmp/v38-public-dom.html').read_text(encoding='utf-8', errors='replace')
          p=Parser(); p.feed(text)
          def v(k): return ' '.join(p.by_id.get(k,'').split())
          body=' '.join(' '.join(p.all).split())
          result={
              'asof':v('asof'),
              'resetHoldingCount':v('resetHoldingCount'),
              'resetActiveCount':v('resetActiveCount'),
              'rotStrong':v('rotStrong'),
              'rotWatch':v('rotWatch'),
              'rotWeak':v('rotWeak'),
              'VIK_visible': 'VIK' in body,
          }
          print(json.dumps(result,ensure_ascii=False,indent=2))
          assert result['asof'] not in ('','データ読込中'), result
          assert result['resetHoldingCount']=='1銘柄', result
          assert result['resetActiveCount']=='1', result
          assert result['VIK_visible'], result
          assert all(x not in ('','読込中','判定中') for x in (result['rotStrong'],result['rotWatch'],result['rotWeak'])), result
          print('PUBLIC_DOM_SMOKE=PASS')
          PY
