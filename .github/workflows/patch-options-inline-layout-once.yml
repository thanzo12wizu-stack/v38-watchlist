name: Patch Options expanded card layout once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-options-inline-layout-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Apply patch
        run: python .tmp_patch_options_inline_layout.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check options-intelligence.js
          git diff --check
          grep -q 'compactInlineLayout' options-intelligence.js
          grep -q 'inlineCompactSummary' options-intelligence.js
          grep -q 'inlineReadout' options-intelligence.js
          grep -q 'layout2' options-intelligence.html

      - name: Commit intended files only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- options-intelligence.js options-intelligence.css options-intelligence.html
          staged="$(git diff --cached --name-only)"
          printf '%s\n' "$staged"
          for f in $staged; do
            case "$f" in
              options-intelligence.js|options-intelligence.css|options-intelligence.html) ;;
              *) echo "unexpected file: $f"; exit 1 ;;
            esac
          done
          test "$(printf '%s\n' "$staged" | wc -l)" -eq 3
          git commit -m 'Reorganize Options expanded card layout'
          git push origin HEAD:main
