# Research-only audit. Does not modify main or dashboard outputs.
name: Ordinary Stock Market Mode Robustness

on:
  push:
    branches:
      - research/sector-stock-leadership-20260826
    paths:
      - leadership/research/audit_ordinary_stock_market_mode_robustness.py
      - .github/workflows/ordinary-stock-market-mode-robustness.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy yfinance
      - name: Syntax check
        run: |
          python -m py_compile leadership/research/audit_ordinary_stock_market_mode_robustness.py
          python -m py_compile leadership/research/audit_rsi30_mc_nqsar.py
      - name: Run ordinary-stock market-mode robustness audit
        run: |
          cd leadership/research
          python audit_ordinary_stock_market_mode_robustness.py \
            --root ../.. \
            --output leadership/research/ordinary_stock_market_mode_robustness \
            --analysis-start 2016-01-04 \
            --analysis-end 2026-06-20 \
            --max-tickers 6000 \
            --batch-size 75
      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ordinary-stock-market-mode-robustness
          path: leadership/research/ordinary_stock_market_mode_robustness/
          retention-days: 7
