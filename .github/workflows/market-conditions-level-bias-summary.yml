name: Market Conditions level bias summary

on:
  push:
    branches:
      - analysis-market-conditions-deterioration-20260825
    paths:
      - tools/market_conditions_level_bias_summary.py
      - .github/workflows/market-conditions-level-bias-summary.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: analysis-market-conditions-deterioration-20260825
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python tools/market_conditions_level_bias_summary.py
      - name: Persist summary
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market_conditions_level_bias_summary.json
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Persist Market Conditions level-bias summary"
          git push origin HEAD:analysis-market-conditions-deterioration-20260825
