# Research-only. No main/Pages/dashboard writes.
name: Early Slot Big Leader Capture

on:
  push:
    branches:
      - research/leader-entry-delay-audit-20260904
    paths:
      - leadership/research/audit_early_slot_big_leader_capture.py
      - .github/workflows/early-slot-big-leader-capture.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy yfinance
      - name: Syntax check
        run: |
          python -m py_compile leadership/research/audit_early_slot_big_leader_capture.py
          python -m py_compile leadership/research/audit_early1_big_leader_capture.py
      - name: Run slot capture audit
        env:
          PYTHONPATH: .:leadership/research
        run: |
          python leadership/research/audit_early_slot_big_leader_capture.py \
            --root . \
            --output leadership/research/early_slot_big_leader_capture_output \
            --analysis-start 2016-01-04 \
            --analysis-end 2026-09-02 \
            --max-tickers 6000 \
            --batch-size 75
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: early-slot-big-leader-capture
          path: leadership/research/early_slot_big_leader_capture_output/
          retention-days: 14
