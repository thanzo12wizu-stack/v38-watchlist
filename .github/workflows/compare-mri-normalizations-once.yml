name: One-off compare MRI normalization methods

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compare-mri-normalizations-once.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check pandas numpy yfinance
      - name: Compare normalization methods
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import numpy as np
          import pandas as pd
          import yfinance as yf

          broad=["SPY","QQQ","DIA","IWM","MDY","RSP","VTI","QQQE"]
          sectors=["XLK","XLY","VOX","XLF","XLI","XLE","XLB","XLV","XLP","XLU","XLRE"]
          industry=["SOXX","SMH","XSD","IGV","SKYY","CIBR","HACK","FDN","XBI","IBB","PPH","IHI","IHF","KRE","KBE","XRT","ITB","XHB","IYT","JETS","ITA","XAR","ROBO","XME","COPX","PICK","GDX","SIL","LIT","XOP","OIH","URA","TAN","ICLN","VNQ","MOO","PHO","PAVE"]
          tickers=list(dict.fromkeys(broad+sectors+industry)); assert len(tickers)==57
          d=yf.download(tickers,start='2005-01-01',end='2026-08-25',auto_adjust=True,progress=False,threads=True)
          c=d['Close'].copy(); c.index=pd.to_datetime(c.index).tz_localize(None); c=c.reindex(columns=tickers)
          vr=yf.download('^VIX',start='2005-01-01',end='2026-08-25',auto_adjust=False,progress=False,threads=False)
          vix=pd.to_numeric(vr['Close'].squeeze(),errors='coerce'); vix.index=pd.to_datetime(vix.index).tz_localize(None)

          def part(mask): return mask.mean(axis=1,skipna=True)*100.0
          ma10=c.rolling(10).mean(); ma20=c.rolling(20).mean(); ma50=c.rolling(50).mean(); ma200=c.rolling(200).mean()
          p={}
          p['ret5']=part((c/c.shift(5)-1>0).where(c.shift(5).notna()&c.notna()))
          p['ret21']=part((c/c.shift(21)-1>0).where(c.shift(21).notna()&c.notna()))
          p['ret63']=part((c/c.shift(63)-1>0).where(c.shift(63).notna()&c.notna()))
          p['ret252']=part((c/c.shift(252)-1>0).where(c.shift(252).notna()&c.notna()))
          p['above10']=part((c>ma10).where(ma10.notna()&c.notna()))
          p['above20']=part((c>ma20).where(ma20.notna()&c.notna()))
          p['above50']=part((c>ma50).where(ma50.notna()&c.notna()))
          p['above200']=part((c>ma200).where(ma200.notna()&c.notna()))
          p['ma20_gt_50']=part((ma20>ma50).where(ma20.notna()&ma50.notna()))
          p['ma50_gt_200']=part((ma50>ma200).where(ma50.notna()&ma200.notna()))
          hi252=c.rolling(252,min_periods=200).max(); dd=c/hi252-1
          p['dd_score']=((dd+0.30)/0.25*100).clip(0,100).mean(axis=1,skipna=True)
          p['within10']=part((dd>=-0.10).where(dd.notna()))
          keys=('ret5','ret21','ret63','ret252','above10','above20','above50','above200','ma20_gt_50','ma50_gt_200','dd_score','within10')
          comps=pd.concat({k:p[k] for k in keys},axis=1)
          raw=comps.mean(axis=1,skipna=True).ewm(span=2,adjust=False).mean()
          coverage=c.notna().sum(axis=1)/57*100

          def z_to_temp(z): return (50+20*z).clip(0,100)
          def z_roll(s,window,minp):
              base=s.shift(1)
              mu=base.rolling(window,min_periods=minp).mean(); sd=base.rolling(window,min_periods=minp).std(ddof=0)
              return z_to_temp((s-mu)/sd.replace(0,np.nan))
          def z_expand(s,minp=1260):
              base=s.shift(1); mu=base.expanding(min_periods=minp).mean(); sd=base.expanding(min_periods=minp).std(ddof=0)
              return z_to_temp((s-mu)/sd.replace(0,np.nan))
          def z_robust15(s):
              base=s.shift(1); r=base.rolling(3780,min_periods=1764)
              med=r.median(); q1=r.quantile(.25); q3=r.quantile(.75); sig=(q3-q1)/1.349
              return z_to_temp((s-med)/sig.replace(0,np.nan))
          def z_ewma(s):
              base=s.shift(1); e=base.ewm(halflife=1260,min_periods=1260,adjust=False)
              mu=e.mean(); sd=e.std(bias=True)
              return z_to_temp((s-mu)/sd.replace(0,np.nan))
          def pct15(s):
              return s.rolling(3780,min_periods=1764).rank(pct=True)*100
          def comp_method(fn):
              z=pd.concat({k:fn(comps[k]) for k in keys},axis=1)
              return z.mean(axis=1,skipna=False).ewm(span=2,adjust=False).mean()

          methods={
              'raw':raw,
              'raw_z10':z_roll(raw,2520,1260),
              'comp_z10':comp_method(lambda s:z_roll(s,2520,1260)),
              'comp_robust15':comp_method(z_robust15),
              'comp_pct15':comp_method(pct15),
              'comp_expanding':comp_method(z_expand),
              'comp_ewma':comp_method(z_ewma),
          }

          # VIX as a separate, adaptive stress overlay candidate: log VIX, 15y robust baseline, reversed direction.
          lv=np.log(vix.clip(lower=1)); base=lv.shift(1); rr=base.rolling(3780,min_periods=1764)
          med=rr.median(); sig=(rr.quantile(.75)-rr.quantile(.25))/1.349
          vix_temp=(50-20*((lv-med)/sig.replace(0,np.nan))).clip(0,100)
          methods['comp_robust15_vix_replace']=None
          cz=pd.concat({k:z_robust15(comps[k]) for k in keys if k!='within10'},axis=1)
          cz['vix']=vix_temp.reindex(cz.index)
          methods['comp_robust15_vix_replace']=cz.mean(axis=1,skipna=False).ewm(span=2,adjust=False).mean()

          mdf=pd.DataFrame(methods)
          valid=(coverage>=70)
          print('=== LATEST ===')
          d0=pd.Timestamp('2026-08-24')
          for k in mdf.columns:
              print(k, round(float(mdf.at[d0,k]),2) if pd.notna(mdf.at[d0,k]) else None)
          print('vix',round(float(vix.at[d0]),2),'vix_overlay_temp',round(float(vix_temp.at[d0]),2) if pd.notna(vix_temp.at[d0]) else None)

          print('=== DISTRIBUTION_2018_2026 ===')
          mask=valid & (mdf.index>='2018-01-01')
          rows=[]
          for k in mdf.columns:
              s=mdf.loc[mask,k].dropna()
              rows.append([k,len(s),s.mean(),s.median(),s.quantile(.1),s.quantile(.25),s.quantile(.75),s.quantile(.9),(s>=70).mean()*100,(s>=80).mean()*100,(s<=30).mean()*100])
          print(pd.DataFrame(rows,columns=['method','n','mean','median','p10','p25','p75','p90','ge70','ge80','le30']).set_index('method').round(2).to_string())

          print('=== ANNUAL_MEANS ===')
          out={}
          for k in mdf.columns:
              s=mdf.loc[valid,k]
              out[k]=s.groupby(s.index.year).mean()
          ann=pd.DataFrame(out)
          print(ann.loc[ann.index>=2018].round(2).to_string())

          print('=== NOTABLE_DATES ===')
          dates=['2018-09-20','2018-12-24','2020-02-19','2020-03-23','2020-06-08','2022-01-03','2022-06-16','2022-10-12','2023-07-31','2024-07-10','2025-04-08','2025-08-21','2026-08-21','2026-08-24']
          rows=[]
          for ds in dates:
              t=pd.Timestamp(ds); idx=mdf.index[mdf.index<=t]
              if not len(idx): continue
              z=idx[-1]; row={'date':ds}
              for k in mdf.columns: row[k]=mdf.at[z,k]
              rows.append(row)
          print(pd.DataFrame(rows).set_index('date').round(2).to_string())

          print('=== STRESS_CROSSINGS_DAYS ===')
          events={'2018Q4':'2018-09-20','COVID':'2020-02-19','2022Bear':'2022-01-03','2025Shock':'2025-02-19'}
          for en,ds in events.items():
              st=pd.Timestamp(ds); print(en)
              for k in mdf.columns:
                  s=mdf.loc[st:st+pd.Timedelta(days=180),k].dropna()
                  def days_to(cond):
                      hit=s[cond(s)]
                      return int((hit.index[0]-st).days) if len(hit) else None
                  print(k,'to50',days_to(lambda x:x<=50),'to30',days_to(lambda x:x<=30))

          print('=== RECOVERY_CROSSINGS_DAYS ===')
          bottoms={'2018Q4':'2018-12-24','COVID':'2020-03-23','2022Bear':'2022-10-12','2025Shock':'2025-04-08'}
          for en,ds in bottoms.items():
              st=pd.Timestamp(ds); print(en)
              for k in mdf.columns:
                  s=mdf.loc[st:st+pd.Timedelta(days=365),k].dropna()
                  def days_to(cond):
                      hit=s[cond(s)]
                      return int((hit.index[0]-st).days) if len(hit) else None
                  print(k,'to50',days_to(lambda x:x>=50),'to70',days_to(lambda x:x>=70))

          # Simple contemporaneous sanity check against QQQ trend/drawdown state.
          q=c['QQQ']; q50=q.rolling(50).mean(); q200=q.rolling(200).mean(); qhi=q.rolling(252,min_periods=200).max(); qdd=q/qhi-1
          state=pd.Series('mixed',index=q.index,dtype=object)
          state[(q>q50)&(q>q200)&(q50>q200)&(qdd>-0.10)]='healthy'
          state[(q<q200)|(qdd<=-0.15)]='stress'
          print('=== CONTEMPORANEOUS_QQQ_STATE_2018_2026 ===')
          for k in mdf.columns:
              x=pd.DataFrame({'s':mdf[k],'state':state}).loc['2018-01-01':].dropna()
              g=x.groupby('state').s.agg(['mean','median','count'])
              print(k); print(g.round(2).to_string())
          PY
