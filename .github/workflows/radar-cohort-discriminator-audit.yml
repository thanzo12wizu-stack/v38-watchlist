# Research-only. Does not modify main, Pages, or dashboard outputs.
# Re-run 2026-09-04 for leader-entry prioritization audit.
name: Radar Cohort Discriminator Audit

on:
  push:
    branches:
      - research/leader-entry-delay-audit-20260904
    paths:
      - leadership/research/audit_radar_cohort_discriminator.py
      - leadership/research/run_radar_cohort_discriminator_strict.py
      - .github/workflows/radar-cohort-discriminator-audit.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy yfinance
      - name: Syntax check
        run: |
          python -m py_compile leadership/research/audit_radar_cohort_discriminator.py
          python -m py_compile leadership/research/run_radar_cohort_discriminator_strict.py
          python -m py_compile leadership/research/audit_major_leader_entry_delay.py
      - name: Run radar cohort discriminator audit
        env:
          PYTHONPATH: .:leadership/research
        run: |
          python leadership/research/run_radar_cohort_discriminator_strict.py \
            --root . \
            --output leadership/research/radar_cohort_discriminator_output \
            --analysis-start 2016-01-04 \
            --analysis-end 2026-09-02 \
            --max-tickers 6000 \
            --batch-size 75
      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-cohort-discriminator-audit
          path: leadership/research/radar_cohort_discriminator_output/
          retention-days: 14
