name: Finalize exported V38 live workflow once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/implement-v38-canonical-live-once.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - name: Keep V38 live dispatch-only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('generated-v38-live.yml.txt')
          s=p.read_text(encoding='utf-8')
          block='''on:\n  workflow_dispatch: {}\n  push:\n    branches: [main]\n    paths:\n      - ".github/workflows/v38-live.yml"\n'''
          if s.count(block) != 1:
              raise SystemExit(f'V38 live temporary push trigger mismatch: {s.count(block)}')
          s=s.replace(block,'on:\n  workflow_dispatch: {}\n',1)
          required=['v38-early1-live.json','build_v38_early1_live.py','tests/test_v38_early1_live.py','EARLY1 mismatch/not ready']
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('final V38 live missing '+repr(missing))
          if 'push:\n    branches: [main]\n    paths:\n      - ".github/workflows/v38-live.yml"' in s:
              raise SystemExit('temporary V38 live self trigger remains')
          p.write_text(s,encoding='utf-8')
          print('FINAL_V38_LIVE_WORKFLOW_READY')
          PY
      - name: Commit final generated text
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated-v38-live.yml.txt
          git commit -m 'Finalize canonical V38 live workflow text'
          git push origin HEAD:main
