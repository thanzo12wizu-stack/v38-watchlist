name: Defensive Risk Engine

on:
  pull_request:
    branches: [main]
    paths:
      - "intelligence_engine/defensive_risk.py"
      - "intelligence_engine/defensive_risk_run.py"
      - "tests/test_defensive_risk.py"
      - "config/defensive_risk_portfolio.example.json"
      - "docs/DEFENSIVE_RISK_POLICY_JA.md"
      - ".github/workflows/defensive-risk.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: defensive-risk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: pytest -q tests/test_defensive_risk.py

  snapshot:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      V38_PRIVATE_DASHBOARD_PASSPHRASE: ${{ secrets.V38_PRIVATE_DASHBOARD_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - name: Restore encrypted signals
        shell: bash
        run: |
          set -euo pipefail
          test -n "${V38_PRIVATE_DASHBOARD_PASSPHRASE:-}"
          mkdir -p data/intelligence/research/signals
          for encrypted in private/research-signals-year-*.enc.json; do
            year="$(basename "$encrypted" .enc.json)"
            year="${year##*-}"
            node scripts/private_crypto.mjs decrypt "$encrypted" "data/intelligence/research/signals/year=${year}.jsonl.gz"
          done
      - name: Restore prices
        uses: actions/cache/restore@v4
        with:
          path: prices.pkl
          key: intelligence-prices-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            intelligence-prices-${{ runner.os }}-
      - name: Build latest defensive snapshot
        shell: bash
        run: |
          set -o pipefail
          test -s prices.pkl
          mkdir -p artifacts/defensive-risk
          python -m intelligence_engine.defensive_risk_run \
            --research-root data/intelligence/research \
            --prices prices.pkl \
            --output artifacts/defensive-risk \
            --account-equity-jpy 8000000 \
            2>&1 | tee artifacts/defensive-risk/run.log
      - name: Publish summary
        if: always()
        run: |
          if [[ -f artifacts/defensive-risk/REPORT_JA.md ]]; then
            cat artifacts/defensive-risk/REPORT_JA.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Defensive snapshot was not produced. See run.log artifact." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: defensive-risk-results
          path: artifacts/defensive-risk
          if-no-files-found: error
          retention-days: 30
