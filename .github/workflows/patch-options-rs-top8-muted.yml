name: Patch RS leaders rank-first muted Options

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-options-rs-top8-muted.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - name: Show actual RS Top8 and mute missing Options
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          js = Path('options-intelligence.js')
          s = js.read_text()

          old = ".filter(x => x.metricValue !== null && isUsable(x.o))\n    .sort((a, b) => b.metricValue - a.metricValue"
          new = ".filter(x => x.metricValue !== null)\n    .sort((a, b) => b.metricValue - a.metricValue"
          if old not in s:
              raise SystemExit('missing valid-only leader filter anchor')
          s = s.replace(old, new, 1)

          old = "  const u = universeMap[t] || {}, d = dirView(o?.direction), c = o?.current, verified = isUsable(o), periodMissing = o?.period_unavailable;"
          new = "  const u = universeMap[t] || {}, d = dirView(o?.direction), c = o?.current, verified = isUsable(o), periodMissing = o?.period_unavailable;\n  const muted = !!l && !verified && ['short', 'swing', 'medium'].includes(activePeriod);\n  const optionState = !o ? 'Optionsなし' : periodMissing ? '期間なし' : !verified ? '時点・品質NG' : '';"
          if old not in s:
              raise SystemExit('missing miniCard state anchor')
          s = s.replace(old, new, 1)

          old = "return `<article class=\"miniCard\" data-ticker=\"${esc(t)}\">"
          new = "return `<article class=\"miniCard${muted ? ' leaderMuted' : ''}\" data-ticker=\"${esc(t)}\">"
          if old not in s:
              raise SystemExit('missing miniCard class anchor')
          s = s.replace(old, new, 1)

          old = "${leaderBadge(l)}<span class=\"badge ${d.cls}\">${verified ? `${d.arrow} ${d.label}` : '? 未判定'}</span>${periodMissing ? '<span class=\"badge bLow\">期間データなし</span>' : o && !verified ? '<span class=\"badge bLow\">参考外</span>' : ''}"
          new = "${leaderBadge(l)}${verified ? `<span class=\"badge ${d.cls}\">${d.arrow} ${d.label}</span>` : `<span class=\"badge bLow\">${esc(optionState || 'Optionsなし')}</span>`}"
          if old not in s:
              raise SystemExit('missing miniCard badge anchor')
          s = s.replace(old, new, 1)

          old = "$('#leaders').innerHTML = a.length ? a.map(x => miniCard(x.t, x.o, x.l, x.metricValue.toFixed(1))).join('') : `<div class=\"empty\">この期間で有効Optionsを持つ${metric.label}リーダーなし。</div>`;"
          new = "$('#leaders').innerHTML = a.length ? a.map(x => miniCard(x.t, x.o, x.l, x.metricValue.toFixed(1))).join('') : `<div class=\"empty\">${metric.label} Leadershipデータなし。</div>`;"
          if old not in s:
              raise SystemExit('missing leader empty-state anchor')
          s = s.replace(old, new, 1)
          js.write_text(s)

          css = Path('options-intelligence.css')
          c = css.read_text()
          anchor = ".miniCard:hover{transform:translateY(-1px);border-color:#405774}"
          addition = anchor + ".miniCard.leaderMuted{opacity:.42;filter:saturate(.45)}.miniCard.leaderMuted:hover{opacity:.68;filter:saturate(.7)}"
          if anchor not in c:
              raise SystemExit('missing CSS miniCard anchor')
          c = c.replace(anchor, addition, 1)
          css.write_text(c)

          html = Path('options-intelligence.html')
          h = html.read_text()
          old = '<div class="sectionHead"><div><span class="eyebrow">TODAY\'S LEADERS</span><h2>見るべきリーダー</h2></div><p>期間別RS上位のうち、選択期間で有効Optionsがある銘柄だけ表示。</p></div>'
          new = '<div class="sectionHead"><div><span class="eyebrow">TODAY\'S LEADERS</span><h2>見るべきリーダー</h2></div><p>各期間のRS Top8を順位どおり表示。Optionsなし・期間なし・時点/品質NGは薄く表示。</p></div>'
          if old not in h:
              raise SystemExit('missing leaders copy anchor')
          h = h.replace(old, new, 1)
          if 'options-intelligence.js?v=20260906-rsperiod2' not in h:
              raise SystemExit('missing JS cache anchor')
          h = h.replace('options-intelligence.js?v=20260906-rsperiod2', 'options-intelligence.js?v=20260906-rsperiod3', 1)
          if 'options-intelligence.css?v=20260905-sync2' not in h:
              raise SystemExit('missing CSS cache anchor')
          h = h.replace('options-intelligence.css?v=20260905-sync2', 'options-intelligence.css?v=20260906-rsperiod3', 1)
          html.write_text(h)
          PY
          node --check options-intelligence.js
          git diff --check
      - name: Commit RS Top8 muted leader UI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- options-intelligence.js options-intelligence.css options-intelligence.html
          git diff --staged --stat
          git commit -m "Show actual RS Top8 and mute missing Options"
          git push origin HEAD:main
