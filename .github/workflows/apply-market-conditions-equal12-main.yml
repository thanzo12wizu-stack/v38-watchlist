name: Expand Market Conditions tap details on main

on:
  push:
    branches:
      - analysis-market-conditions-deterioration-20260825
    paths:
      - '.github/workflows/apply-market-conditions-equal12-main.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Apply reviewed Market Conditions detail patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin analysis-market-conditions-deterioration-20260825
          git show origin/analysis-market-conditions-deterioration-20260825:tools/patch_mc_detail_panel_main.py > /tmp/patch_mc_detail.py
          python /tmp/patch_mc_detail.py

      - name: Validate production preflight
        shell: bash
        run: |
          set -euo pipefail
          pip install --disable-pip-version-check -r requirements.txt pytest
          python -m py_compile build_dashboard.py
          pytest -q tests/test_dashboard_build_regressions.py tests/test_options_positioning_quality.py tests/test_eps_acceleration.py
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "build_dashboard.py"
          git diff -- build_dashboard.py

      - name: Commit to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build_dashboard.py
          if git diff --staged --quiet; then
            echo 'No change'
            exit 0
          fi
          git commit -m 'Expand Market Conditions tap details'
          git push origin HEAD:main
