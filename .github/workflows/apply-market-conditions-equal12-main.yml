name: Apply Market Conditions equal12 to main

on:
  push:
    branches:
      - analysis-market-conditions-deterioration-20260825
    paths:
      - '.github/workflows/apply-market-conditions-equal12-main.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Load reviewed patch helper
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin analysis-market-conditions-deterioration-20260825
          git show origin/analysis-market-conditions-deterioration-20260825:tools/apply_market_conditions_equal12_main.py > /tmp/apply_mc.py
          python /tmp/apply_mc.py

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt pytest

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile build_dashboard.py
          pytest -q tests/test_dashboard_build_regressions.py tests/test_options_positioning_quality.py tests/test_eps_acceleration.py
          python build_dashboard.py --selftest

      - name: Commit to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build_dashboard.py
          git diff --staged --check
          if git diff --staged --quiet; then
            echo 'No change'
            exit 0
          fi
          git commit -m 'Use symmetric 57-ETF equal-weight Market Conditions'
          git push origin HEAD:main
