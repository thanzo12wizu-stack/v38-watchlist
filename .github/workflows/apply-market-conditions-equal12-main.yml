name: Fix Market Conditions selftest on main

on:
  push:
    branches:
      - analysis-market-conditions-deterioration-20260825
    paths:
      - '.github/workflows/apply-market-conditions-equal12-main.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Patch stale Market Conditions selftest fingerprint only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('build_dashboard.py')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(
              r'_EXPECT\s*=\s*\(\("short",15,0\.0,100\.0,"market"\),\("medium",55,0\.0,100\.0,"market"\),\s*'
              r'\("long",20,0\.0,100\.0,"market"\),\("damage",10,0\.0,100\.0,"market"\)\)'
          )
          replacement = '''_EXPECT = (("short",33.333333333333336,0.0,100.0,"market"),
                   ("medium",33.333333333333336,0.0,100.0,"market"),
                   ("long",16.666666666666668,0.0,100.0,"market"),
                   ("damage",16.666666666666668,0.0,100.0,"market"))'''
          s2, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'expected exactly one stale MC fingerprint, got {n}')
          p.write_text(s2, encoding='utf-8')
          PY

      - name: Validate production preflight
        shell: bash
        run: |
          set -euo pipefail
          pip install --disable-pip-version-check -r requirements.txt pytest
          python -m py_compile build_dashboard.py
          pytest -q tests/test_dashboard_build_regressions.py tests/test_options_positioning_quality.py tests/test_eps_acceleration.py
          git diff --check
          git diff -- build_dashboard.py

      - name: Commit to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build_dashboard.py
          if git diff --staged --quiet; then
            echo 'No change'
            exit 0
          fi
          git commit -m 'Fix Market Conditions selftest fingerprint'
          git push origin HEAD:main
