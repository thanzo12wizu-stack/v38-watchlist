name: V38 clarity improvement once

on:
  push:
    branches: [fix/v38-clarity-20260902]
    paths:
      - '.github/workflows/v38-clarity-once-20260902.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Improve portfolio clarity only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('command-center-v38.html')
          s = path.read_text(encoding='utf-8')

          def replace_once(old, new):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'expected exactly one match, found {n}: {old[:120]!r}')
              s = s.replace(old, new, 1)

          replace_once(
              '.datareq{color:var(--warn)}',
              '.datareq{color:var(--warn)}.subline{display:block;margin-top:6px;font-size:11px;line-height:1.45;color:#9fb0c4;font-weight:500}.hero .mini b{font-size:20px}'
          )

          old_hero = '''<div class="card hero"><div class="eyebrow">TODAY'S ACTION</div><div class="hero-title" id="todayAction">判定中</div><div class="hero-reason" id="todayReason">—</div><div class="row"><div class="mini"><span>通常個別株</span><b id="normalDecision">—</b></div><div class="mini"><span>TQQQ（通常保有枠）</span><b id="tqqqDecision">—</b></div><div class="mini"><span>通常個別株の保有</span><b id="holdingDecision">—</b></div><div class="mini"><span>通常個別株の再開条件</span><b id="resumeCondition">—</b></div></div></div>'''
          new_hero = '''<div class="card hero"><div class="eyebrow">TODAY'S PORTFOLIO</div><div class="hero-title" id="todayAction">今日の保有指示を計算中</div><div class="hero-reason" id="todayReason">—</div><div class="row"><div class="mini"><span>TQQQ</span><b id="tqqqDecision">—</b><small class="subline" id="tqqqDecisionSub">—</small></div><div class="mini"><span>通常個別株</span><b id="normalDecision">—</b><small class="subline" id="normalDecisionSub">—</small></div><div class="mini"><span>RSI Reset</span><b id="resetDecision">—</b><small class="subline" id="resetDecisionSub">—</small></div><div class="mini"><span>空き資金</span><b id="cashDecision">—</b><small class="subline" id="cashDecisionSub">—</small></div></div><div class="note" id="portfolioNote">上の表示が今日の実行判断です。下のモデル配分は参考値です。</div></div>'''
          replace_once(old_hero, new_hero)

          replace_once(
              '<div class="card"><div class="hdr"><h2>TQQQ</h2><span class="badge">通常枠とPanic枠は別</span></div>',
              '<div class="card"><div class="hdr"><h2>TQQQ 判定の内訳</h2><span class="badge">通常枠とPanic枠は別</span></div>'
          )

          replace_once(
              '<div class="card"><div class="hdr"><h2>戦略モデルの目標配分（実保有とは別）</h2><span class="badge" id="allocationBadge">計算中</span></div><div class="explain" id="allocationPlain">通常株・RSI Reset・TQQQの希望額が100%を超える場合も、最終配分は100%以内に自動調整します。</div>',
              '<div class="card"><div class="hdr"><h2>参考：モデル内部の配分計算</h2><span class="badge" id="allocationBadge">計算中</span></div><div class="explain" id="allocationPlain">ここは売買指示ではありません。上の「今日の保有指示」が優先です。</div>'
          )

          old_today = '''function renderToday(){if(!STATE)return;let m=STATE.market,held=actualPositions().length,mt=modeText(m),tq=tqqqActionText(STATE.normal_tqqq||{});$('modeHuman').textContent=mt[0];$('modeHuman').className='v '+mt[2];$('modeHumanReason').textContent=mt[1];$('nqsarHuman').textContent=m.nqsar||'—';$('nqsarHuman').className='v '+(String(m.nqsar).toLowerCase()==='red'?'bad':String(m.nqsar).toLowerCase()==='yellow'?'warn':'good');$('breadthHuman').textContent=fmt(m.breadth50)+'%';$('todayReason').textContent=humanReason(m);$('mode').textContent=m.mode;$('breadth').textContent=`${fmt(m.breadth50)}% / ${(m.coverage*100).toFixed(1)}%`;$('capacity').textContent=m.new_entry_limit;$('looStatus').textContent=STATE.ranking?.attack_watch_status||STATE.ranking?.strict_loo_live_status||'—';if(m.mode==='DEFENSE'){$('todayAction').textContent=`通常株：全退避 ／ TQQQ：${tq}`;$('normalDecision').textContent='新規0・全退避';$('holdingDecision').textContent=held?'次回寄りで全退避':'保有なし'}else if(m.mode==='STOP'){$('todayAction').textContent=`通常株：新規停止 ／ TQQQ：${tq}`;$('normalDecision').textContent='新規0';$('holdingDecision').textContent=held?`${held}銘柄を個別Exitまで継続`:'保有なし'}else{let cap=Math.max(0,m.new_entry_limit-held);$('todayAction').textContent=cap>0?`通常株：最大${cap}銘柄追加 ／ TQQQ：${tq}`:`通常株：追加なし ／ TQQQ：${tq}`;$('normalDecision').textContent=`最大${m.new_entry_limit}枠`;$('holdingDecision').textContent=held?`${held}銘柄保有`:'保有なし'}$('resumeCondition').textContent=m.mode==='STOP'||m.mode==='DEFENSE'?'Blue/Green＋Breadth≥50%':'現在Entry資格あり';renderRanking()}'''
          new_today = '''function renderToday(){if(!STATE)return;let m=STATE.market,held=actualPositions().length,mt=modeText(m),n=STATE.normal_tqqq||{},p=STATE.panic_tqqq||{},g=STATE.gross100_allocation||{},r=STATE.panic_reset||{},tq=tqqqActionText(n),tqPct=n.status==='READY'&&n.underlying_target_pct!=null?pct(n.underlying_target_pct):'判定不可',allocReady=String(g.status||'').includes('LIVE ALLOCATION READY'),resetPct=allocReady?g.reset_allocated_pct:r.desired_pct,resetText=resetPct==null?'判定不可':pct(resetPct),resetCount=r.position_count??0,cap=Math.max(0,(m.new_entry_limit||0)-held);$('modeHuman').textContent=mt[0];$('modeHuman').className='v '+mt[2];$('modeHumanReason').textContent=mt[1];$('nqsarHuman').textContent=m.nqsar||'—';$('nqsarHuman').className='v '+(String(m.nqsar).toLowerCase()==='red'?'bad':String(m.nqsar).toLowerCase()==='yellow'?'warn':'good');$('breadthHuman').textContent=fmt(m.breadth50)+'%';$('mode').textContent=m.mode;$('breadth').textContent=`${fmt(m.breadth50)}% / ${(m.coverage*100).toFixed(1)}%`;$('capacity').textContent=m.new_entry_limit;$('looStatus').textContent=STATE.ranking?.attack_watch_status||STATE.ranking?.strict_loo_live_status||'—';$('tqqqDecision').textContent=tqPct;$('tqqqDecisionSub').textContent=p.active?'Panic F80稼働中':n.risk_lock?'risk lock中':`${tq} / Panic非発動`;$('resetDecision').textContent=resetText;$('resetDecisionSub').textContent=resetCount?`${resetCount}銘柄保有中`:'現在の正式保有なし';if(m.mode==='DEFENSE'){$('todayAction').textContent=`TQQQ ${tqPct} ／ 通常株は次回寄りで0へ ／ Reset ${resetText}`;$('todayReason').textContent='NQSAR Red。通常個別株は次回寄りで全退避します。TQQQとRSI Resetは別ルールで表示中の目標を使います。';$('normalDecision').textContent='0へ退避';$('normalDecisionSub').textContent=held?`${held}銘柄を次回寄りで全売却`:'通常株の保有なし';$('cashDecision').textContent='通常株分は現金';$('cashDecisionSub').textContent='新規通常株には使わない';$('portfolioNote').textContent='重要：DEFENSEでは通常株のモデル配分値よりRed退避が優先です。'}else if(m.mode==='STOP'){$('todayAction').textContent=`TQQQ ${tqPct} ／ 通常株は買い足さない ／ Reset ${resetText}`;$('todayReason').textContent=`${m.nqsar||'NQSAR'}のため通常株は新規0。既存通常株はRedでなければ個別Exitまで継続し、新しく空いた資金は通常株で埋めません。`;$('normalDecision').textContent='買い足し 0';$('normalDecisionSub').textContent=held?`${held}銘柄は個別Exitまで継続 / 再開はBlue/Green＋Breadth≥50%`:'保有なし / 再開はBlue/Green＋Breadth≥50%';$('cashDecision').textContent='残りは現金';$('cashDecisionSub').textContent='通常株70%上限まで埋めない';$('portfolioNote').textContent='重要：下のモデル配分で通常株70%と出ても、今から70%まで買う指示ではありません。STOP中は通常株の新規買付0です。'}else{$('todayAction').textContent=`TQQQ ${tqPct} ／ 通常株は最大${m.new_entry_limit}枠 ／ Reset ${resetText}`;$('todayReason').textContent=cap>0?`通常株は現在${held}銘柄。候補順位の上から最大${cap}銘柄だけ追加できます。上限まで無理に埋める必要はありません。`:`通常株は現在${held}銘柄で追加枠なし。個別Exitが出るまで新規追加しません。`;$('normalDecision').textContent=`最大${m.new_entry_limit}枠`;$('normalDecisionSub').textContent=`現在${held}銘柄 / 追加最大${cap}銘柄`;$('cashDecision').textContent='空き枠以外は現金';$('cashDecisionSub').textContent='候補がなければ無理に投入しない';$('portfolioNote').textContent='上段が今日の実行判断です。通常株はモデル配分率を一気に埋めるのではなく、Market Mode・空き枠・候補順位に従って追加します。'}renderRanking()}'''
          replace_once(old_today, new_today)

          old_alloc = '''function renderAllocation(){let g=STATE?.gross100_allocation||{},ready=String(g.status||'').includes('LIVE ALLOCATION READY');$('allocationBadge').textContent=ready?'READY':'DATA REQUIRED';if(!ready){$('allocationPlain').textContent='通常株・Reset・TQQQのどれかのlive入力が不足しているため、最終配分は出していません。欠損を0%扱いしません。';for(const id of['todayNormalAlloc','todayResetAlloc','todayTqqqAlloc','todayGrossAlloc'])$(id).textContent='DATA REQUIRED';return}$('todayNormalAlloc').textContent=pct(g.normal_stock_allocated_pct);$('todayResetAlloc').textContent=pct(g.reset_allocated_pct);$('todayTqqqAlloc').textContent=pct(g.tqqq_allocated_pct);$('todayGrossAlloc').textContent=pct(g.gross_allocated_pct);$('allocationPlain').textContent=`希望配分は 通常株 ${pct(g.normal_stock_desired_pct)} / Reset ${pct(g.reset_desired_pct)} / TQQQ ${pct(g.tqqq_desired_pct)}。競合を調整した最終配分を下に表示しています。`}'''
          new_alloc = '''function renderAllocation(){let g=STATE?.gross100_allocation||{},ready=String(g.status||'').includes('LIVE ALLOCATION READY');$('allocationBadge').textContent=ready?'参考値 READY':'DATA REQUIRED';if(!ready){$('allocationPlain').textContent='モデル内部の配分入力が不足しています。欠損を0%扱いしません。今日の売買判断は上段を見てください。';for(const id of['todayNormalAlloc','todayResetAlloc','todayTqqqAlloc','todayGrossAlloc'])$(id).textContent='DATA REQUIRED';return}$('todayNormalAlloc').textContent=pct(g.normal_stock_allocated_pct);$('todayResetAlloc').textContent=pct(g.reset_allocated_pct);$('todayTqqqAlloc').textContent=pct(g.tqqq_allocated_pct);$('todayGrossAlloc').textContent=pct(g.gross_allocated_pct);$('allocationPlain').textContent=`モデル内部では 通常株 ${pct(g.normal_stock_allocated_pct)} / Reset ${pct(g.reset_allocated_pct)} / TQQQ ${pct(g.tqqq_allocated_pct)} / 合計 ${pct(g.gross_allocated_pct)}。これは売買指示ではなく、今日の新規売買は上段のMarket Mode・空き枠・Exit判定が優先です。`}'''
          replace_once(old_alloc, new_alloc)

          path.write_text(s, encoding='utf-8')
          PY

      - name: Verify clarity patch and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('command-center-v38.html').read_text(encoding='utf-8')
          required = [
              "TODAY'S PORTFOLIO",
              'id="tqqqDecisionSub"',
              'id="normalDecisionSub"',
              'id="resetDecision"',
              'id="cashDecision"',
              'id="portfolioNote"',
              'TQQQ 判定の内訳',
              '参考：モデル内部の配分計算',
              'STOP中は通常株の新規買付0です。',
              "$('allocationBadge').textContent=ready?'参考値 READY':'DATA REQUIRED'",
          ]
          for marker in required:
              assert marker in s, marker
          assert 'id="holdingDecision"' not in s
          assert 'id="resumeCondition"' not in s
          assert "$('holdingDecision')" not in s
          assert "$('resumeCondition')" not in s
          m = re.search(r'<script>(.*)</script>', s, re.S)
          assert m
          Path('/tmp/v38-inline.js').write_text(m.group(1), encoding='utf-8')
          PY
          node --check /tmp/v38-inline.js
          git diff --check
          git diff -- command-center-v38.html

      - name: Commit only clarity changes and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/v38-clarity-once-20260902.yml
          git add command-center-v38.html
          git commit -m 'Clarify V38 daily portfolio instructions'
          git push origin HEAD:fix/v38-clarity-20260902
