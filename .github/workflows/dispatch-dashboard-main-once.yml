name: Dispatch production dashboard once

on:
  push:
    branches:
      - analysis-market-conditions-deterioration-20260825
    paths:
      - '.github/workflows/dispatch-dashboard-main-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch dashboard.yml on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/response.txt -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/dashboard.yml/dispatches" \
            -d '{"ref":"main"}')
          cat /tmp/response.txt
          test "$code" = "204"
          echo "Dashboard workflow dispatched on main."
