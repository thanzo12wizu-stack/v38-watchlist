name: Archived ten-year research final status

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Confirm final aggregate status
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          run_status = json.loads(Path('research-run-status.json').read_text(encoding='utf-8'))
          readiness = json.loads(Path('research-readiness.json').read_text(encoding='utf-8'))
          checks = [
              run_status.get('research_status') == 'PASS',
              run_status.get('backfill_status') == 'COMPLETE',
              readiness.get('ten_year_backfill_complete') is True,
              readiness.get('blockers') == [],
          ]
          if not all(checks):
              raise SystemExit('Archived final research status is not complete')
          print('Ten-year research is finalized. No aggregate files will be rewritten.')
          PY
