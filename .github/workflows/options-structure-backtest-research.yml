name: Options structure backtest research

on:
  push:
    branches:
      - research/options-intelligence-validation-20260905
    paths:
      - '.github/workflows/options-structure-backtest-research.yml'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/options-intelligence-validation-20260905
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check -r requirements.txt scipy
      - name: Syntax check
        run: python -m py_compile research/options-intelligence-20260905/backtest_options_structure.py
      - name: Run backtest
        run: python research/options-intelligence-20260905/backtest_options_structure.py
      - name: Commit research outputs only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/options-intelligence-20260905/REPORT.md \
                  research/options-intelligence-20260905/summary.json \
                  research/options-intelligence-20260905/event_features.csv \
                  research/options-intelligence-20260905/event_study.csv \
                  research/options-intelligence-20260905/wall_behavior.csv \
                  research/options-intelligence-20260905/expected_move_calibration.csv \
                  research/options-intelligence-20260905/direction_score_validation.csv
          git commit -m "Record Options structure backtest results"
          git push origin HEAD:research/options-intelligence-validation-20260905
