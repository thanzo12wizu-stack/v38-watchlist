name: V38 public browser smoke once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v38-public-smoke-once.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Selenium
        run: pip install --disable-pip-version-check selenium

      - name: Browser smoke against public V38 page
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By

          url = 'https://thanzo12wizu-stack.github.io/v38-watchlist/command-center-v38.html'
          options = Options()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--window-size=1440,2400')
          options.set_capability('goog:loggingPrefs', {'browser': 'ALL'})

          driver = webdriver.Chrome(options=options)
          try:
              driver.get(f'{url}?smoke={int(time.time())}')
              time.sleep(8)
              def text(id_):
                  try:
                      return driver.find_element(By.ID, id_).text.strip()
                  except Exception as e:
                      return f'<missing:{type(e).__name__}>'

              body = driver.find_element(By.TAG_NAME, 'body').text
              result = {
                  'url': driver.current_url,
                  'title': driver.title,
                  'readyState': driver.execute_script('return document.readyState'),
                  'asof': text('asof'),
                  'resetHoldingCount': text('resetHoldingCount'),
                  'resetActiveCount': text('resetActiveCount'),
                  'rotStrong': text('rotStrong'),
                  'rotWatch': text('rotWatch'),
                  'rotWeak': text('rotWeak'),
                  'vik_visible': 'VIK' in body,
                  'browser_logs': driver.get_log('browser'),
              }
              print(json.dumps(result, ensure_ascii=False, indent=2))

              assert result['asof'] not in ('', 'データ読込中'), result
              assert result['resetHoldingCount'] == '1銘柄', result
              assert result['resetActiveCount'] == '1', result
              assert result['vik_visible'], result
              assert all(x not in ('', '読込中', '判定中') for x in (result['rotStrong'], result['rotWatch'], result['rotWeak'])), result
              severe = [x for x in result['browser_logs'] if x.get('level') == 'SEVERE']
              assert not severe, severe
              print('PUBLIC_BROWSER_SMOKE=PASS')
          finally:
              driver.quit()
          PY
