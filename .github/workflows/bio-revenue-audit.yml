# Temporary Stage A PR applicator. Restored to normal audit immediately after merge.
name: Bio revenue audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bio-stageA-pr-apply
  cancel-in-progress: true

jobs:
  apply-stageA:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply and validate Stage A
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/finalize_stageA.py')
          s = p.read_text(encoding='utf-8')
          old = 'pat.subn(new, s, count=1)'
          if s.count(old) != 2:
              raise SystemExit(f'unexpected pat.subn count={s.count(old)}')
          p.write_text(s.replace(old, 'pat.subn(lambda _m: new, s, count=1)'), encoding='utf-8')
          PY
          python scripts/finalize_stageA.py
          python -m py_compile build_dashboard.py
          git diff --check
          grep -q 'for _typ in ("stock", "dr")' build_dashboard.py
          grep -q 'selection_excluded' build_dashboard.py
          grep -q 'V38_BIO_REVENUE_MAX' .github/workflows/dashboard.yml
      - name: Commit source-only patch to PR head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # GITHUB_TOKEN cannot update workflow files. Restore the helper's dashboard.yml edit;
          # the connector will add those env lines after this source commit lands.
          git checkout -- .github/workflows/dashboard.yml
          git add build_dashboard.py
          git rm -f scripts/finalize_stageA.py scripts/stage2c_patch.py 2>/dev/null || true
          git commit -m "Apply final Stage A universe and biotech eligibility"
          git push origin HEAD:${{ github.head_ref }}
