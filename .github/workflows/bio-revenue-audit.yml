name: Bio revenue audit

on:
  workflow_run:
    workflows:
      - Dashboard daily build
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - 'scripts/audit_bio_revenue.py'
      - '.github/workflows/bio-revenue-audit.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bio-revenue-audit-main
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply one-shot Stage A source patch
        shell: bash
        run: |
          set -euo pipefail
          python scripts/finalize_stageA.py
          python -m py_compile build_dashboard.py
          git diff --check
          grep -q 'for _typ in ("stock", "dr")' build_dashboard.py
          grep -q 'selection_excluded' build_dashboard.py
          grep -q 'V38_BIO_REVENUE_MAX' .github/workflows/dashboard.yml
      - name: Commit source and restore normal audit workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Restore this workflow to its pre-one-shot version before committing.
          git show HEAD^:.github/workflows/bio-revenue-audit.yml > .github/workflows/bio-revenue-audit.yml
          git add build_dashboard.py .github/workflows/dashboard.yml .github/workflows/bio-revenue-audit.yml
          git rm -f scripts/finalize_stageA.py .github/workflows/finalize-stageA.yml 2>/dev/null || true
          git rm -f scripts/stage2c_patch.py .github/workflows/stage2c-bio-preview-patch.yml 2>/dev/null || true
          git commit -m "Include US DRs and isolate clinical-stage names from selection"
          git push origin HEAD:main
