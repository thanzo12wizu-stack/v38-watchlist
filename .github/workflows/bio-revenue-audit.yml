name: Bio revenue audit

on:
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: final-dashboard-completion
  cancel-in-progress: false

jobs:
  complete:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Render and validate same-session stale-source guard
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_remaining_dashboard_fixes.py
          grep -F 'V38_BUILD_SOURCE_SHA=$(git rev-parse HEAD)' .github/workflows/dashboard.yml
          grep -F 'source drift after build; skip persistence/public publish for stale same-session run' .github/workflows/dashboard.yml
          grep -F "steps.persist.outputs.source_drift != 'true'" .github/workflows/dashboard.yml
          git diff --check
          cp .github/workflows/dashboard.yml patched_dashboard.yml.txt

      - name: Persist rendered workflow copy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add patched_dashboard.yml.txt
          git commit -m 'Render final stale-source dashboard workflow'
          git push origin HEAD:main
