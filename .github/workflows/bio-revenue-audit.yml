name: Bio revenue audit

on:
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: final-dashboard-completion
  cancel-in-progress: false

jobs:
  complete:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Render final dashboard workflow patch
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_remaining_dashboard_fixes.py
          python -m py_compile build_dashboard.py scripts/apply_remaining_dashboard_fixes.py
          git diff --check
          grep -F '_near_threshold = min(0.05, max(0.02, 0.5 * _adr20))' build_dashboard.py
          grep -F 'V38_BUILD_SOURCE_SHA=$(git rev-parse HEAD)' .github/workflows/dashboard.yml
          grep -F 'source drift after build; skip persistence/public publish' .github/workflows/dashboard.yml

      - name: Upload patched dashboard workflow
        uses: actions/upload-artifact@v4
        with:
          name: patched-dashboard-workflow
          path: .github/workflows/dashboard.yml
          if-no-files-found: error
          retention-days: 1
