name: Bio revenue audit

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bio-revenue-audit.yml'
      - 'scripts/apply_remaining_dashboard_fixes.py'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: final-dashboard-completion
  cancel-in-progress: false

jobs:
  complete:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply remaining fixes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_remaining_dashboard_fixes.py
          python -m py_compile build_dashboard.py scripts/apply_remaining_dashboard_fixes.py
          git diff --check
          grep -F '_near_threshold = min(0.05, max(0.02, 0.5 * _adr20))' build_dashboard.py

      - name: Persist VWAP source fix only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build_dashboard.py
          git commit -m "Make VWAP near adaptive to ADR20"
          git push origin HEAD:main
