name: Rotation Daily Observation Brief Research

# Persisted Theme/Stock context is consumed when available; Rotation never becomes a V38 Gate or stock score.
on:
  workflow_dispatch:
  push:
    branches:
      - research/rotation-exact-flow-internals-20260831
    paths:
      - leadership/research/rotation_daily_observation_brief.py
      - leadership/research/test_rotation_daily_observation_brief.py
      - leadership/research/rotation_v38_readonly_crosscheck.py
      - leadership/research/rotation_live/latest.json
      - leadership/research/rotation_live/latest_matrix.csv
      - leadership/research/rotation_live/history.csv
      - leadership/research/rotation_theme_stock_context/rotation_theme_stock_context.json
      - .github/workflows/rotation-daily-observation-brief-research.yml

permissions:
  contents: write

concurrency:
  group: rotation-daily-observation-brief-research
  cancel-in-progress: true

jobs:
  brief:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TZ: Asia/Tokyo
      PYTHONPATH: leadership/research:leadership
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/rotation-exact-flow-internals-20260831
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install isolated research dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check requests openpyxl lxml html5lib

      - name: Syntax and guardrail tests
        run: |
          python -m py_compile leadership/research/rotation_daily_observation_brief.py
          python -m py_compile leadership/research/rotation_v38_readonly_crosscheck.py
          python leadership/research/test_rotation_daily_observation_brief.py -v

      - name: Rebuild formal V38 read-only crosscheck
        run: |
          rm -rf leadership/research/rotation_v38_readonly_crosscheck
          python leadership/research/rotation_v38_readonly_crosscheck.py \
            --root . \
            --output leadership/research/rotation_v38_readonly_crosscheck \
            --period 15mo \
            --batch-size 80

      - name: Build deterministic Daily Observation Brief
        shell: bash
        run: |
          set -euo pipefail
          rm -rf leadership/research/rotation_daily_observation_brief
          args=(
            --rotation leadership/research/rotation_live/latest.json
            --history leadership/research/rotation_live/history.csv
            --v38 leadership/research/rotation_v38_readonly_crosscheck/rotation_v38_readonly_crosscheck.json
            --v38-csv leadership/research/rotation_v38_readonly_crosscheck/rotation_v38_readonly_crosscheck.csv
            --output leadership/research/rotation_daily_observation_brief
          )
          THEME_CONTEXT="leadership/research/rotation_theme_stock_context/rotation_theme_stock_context.json"
          if [[ -f "$THEME_CONTEXT" ]]; then
            args+=(--theme-context "$THEME_CONTEXT")
          fi
          python leadership/research/rotation_daily_observation_brief.py "${args[@]}"

      - name: Validate output boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('leadership/research/rotation_daily_observation_brief')
          data = json.loads((root / 'daily_observation_brief.json').read_text())
          if data.get('research_only') is not True:
              raise SystemExit('research_only guard missing')
          if data.get('deterministic_formatter') is not True:
              raise SystemExit('deterministic formatter guard missing')
          if (data.get('input_alignment') or {}).get('status') != 'OK':
              raise SystemExit(f"input asof mismatch: {data.get('input_alignment')}")
          action = data.get('v38_action') or {}
          if action.get('rotation_forced_exit') is not False:
              raise SystemExit('Rotation must never force exit')
          mode = str(action.get('market_mode') or '')
          if mode in {'STOP', 'DEFENSE'} and action.get('normal_entry_limit') != 0:
              raise SystemExit(f'{mode} must have normal_entry_limit=0')
          forbidden = {'rotation_rank', 'rotation_stock_score', 'rotation_entry', 'rotation_buy', 'buy_signal'}
          def walk(obj, path='root'):
              if isinstance(obj, dict):
                  for key, value in obj.items():
                      if str(key).lower() in forbidden:
                          raise SystemExit(f'forbidden action/rank key at {path}.{key}')
                      walk(value, f'{path}.{key}')
              elif isinstance(obj, list):
                  for i, value in enumerate(obj):
                      walk(value, f'{path}[{i}]')
          walk(data)
          print(json.dumps({
              'asof': data.get('asof'),
              'market_mode': mode,
              'normal_entry_limit': action.get('normal_entry_limit'),
              'rotation_forced_exit': action.get('rotation_forced_exit'),
              'theme_context': ((data.get('theme_stock') or {}).get('leadership_context') or {}).get('status'),
              'flow': (data.get('observations') or {}).get('flow'),
              'buckets': {k: [x.get('ticker') for x in v] for k, v in ((data.get('observations') or {}).get('rotation_buckets') or {}).items()},
          }, ensure_ascii=False, indent=2))
          PY

      - name: Upload research-only brief
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rotation-daily-observation-brief-research
          path: |
            leadership/research/rotation_daily_observation_brief/
            leadership/research/rotation_v38_readonly_crosscheck/
          if-no-files-found: error
          retention-days: 14

      - name: Persist deterministic brief for public viewer
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="research/rotation-exact-flow-internals-20260831"
          SRC="leadership/research/rotation_daily_observation_brief"
          TMP="$(mktemp -d)/rotation_daily_observation_brief"
          cp -a "$SRC" "$TMP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            rm -rf "$SRC"
            mkdir -p "$(dirname "$SRC")"
            cp -a "$TMP" "$SRC"
            git add "$SRC"
            if git diff --cached --quiet; then
              echo "Brief already current"
              exit 0
            fi
            git commit -m "research: record deterministic daily rotation brief"
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            echo "Push race on attempt ${attempt}; retrying"
          done
          echo "Failed to persist brief after 3 attempts" >&2
          exit 1
