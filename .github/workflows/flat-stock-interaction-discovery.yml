name: Flat Stock Interaction Discovery

on:
  push:
    branches:
      - research/sector-stock-leadership-20260826
    paths:
      - leadership/research/discover_stock_interactions.py
      - .github/workflows/flat-stock-interaction-discovery.yml
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy scikit-learn yfinance
      - name: Syntax check
        run: python -m py_compile leadership/research/discover_stock_interactions.py
      - name: Run frozen flat interaction discovery
        run: |
          python leadership/research/discover_stock_interactions.py \
            --root . \
            --output leadership/research/flat_stock_interactions \
            --max-tickers 6000 \
            --batch-size 75 \
            --min-members 3
      - name: Upload research outputs
        uses: actions/upload-artifact@v4
        with:
          name: flat-stock-interaction-discovery
          path: leadership/research/flat_stock_interactions/
          retention-days: 7
