name: FMP API one-time smoke test

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fmp-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
    steps:
      - name: Verify free FMP universe alternatives
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import urlopen

          key = os.environ.get("FMP_API_KEY", "").strip()
          if not key:
              print("::error::FMP_API_KEY is not configured or is empty")
              sys.exit(1)

          tests = [
              ("stock-list", {}),
              ("actively-trading-list", {}),
              ("etf-list", {}),
              ("financial-statement-symbol-list", {}),
              ("company-screener", {"exchange": "NASDAQ", "limit": "10000"}),
              ("search-symbol", {"query": "TQQQ"}),
              ("search-symbol", {"query": "SOXL"}),
          ]
          successes = 0
          for endpoint, params in tests:
              suffix = params.get("query") or params.get("exchange") or ""
              safe_name = endpoint + (":" + suffix if suffix else "")
              query = urlencode({**params, "apikey": key})
              url = "https://financialmodelingprep.com/stable/" + endpoint + "?" + query
              try:
                  with urlopen(url, timeout=45) as response:
                      payload = json.loads(response.read().decode("utf-8"))
              except HTTPError as exc:
                  print(f"FMP_DENIED {safe_name} HTTP={exc.code}")
                  continue
              except (URLError, TimeoutError, json.JSONDecodeError) as exc:
                  print(f"FMP_ERROR {safe_name} type={type(exc).__name__}")
                  continue

              rows = payload if isinstance(payload, list) else (
                  payload.get("data") or payload.get("results") if isinstance(payload, dict) else None
              )
              if not isinstance(rows, list) or not rows:
                  print(f"FMP_EMPTY {safe_name}")
                  continue

              matches = sorted({
                  str(row.get("symbol", "")).upper()
                  for row in rows if isinstance(row, dict)
                  and str(row.get("symbol", "")).upper() in {"TQQQ", "SOXL"}
              })
              print(f"FMP_OK {safe_name} rows={len(rows)} matches={','.join(matches) or '-'}")
              successes += 1

          if successes == 0:
              print("::error::No tested FMP endpoint returned usable data")
              sys.exit(1)
          print(f"FMP_UNIVERSE_SMOKE_OK endpoints={successes}/{len(tests)}")
          PY
