name: TQQQ backtest once

on:
  push:
    branches: [tqqq-backtest-once-20260826]
    paths:
      - '.github/workflows/tqqq-backtest-once.yml'
      - 'research/tqqq_backtest_once.py'

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: pip install -q -r requirements.txt
      - name: Run TQQQ backtest
        env:
          PYTHONUNBUFFERED: '1'
        run: python research/tqqq_backtest_once.py
