name: Dashboard daily build

on:
  schedule:
    # 朝一: JST 7時 = UTC 22時（米取引日の翌朝＝UTC火〜土）。起きてすぐ確認用。
    - cron: '0 22 * * 2-6'
    # 昼: JST 13時 = UTC 4時（同じくUTC火〜土）。夏時間の取りこぼし・朝のFRED障害を埋める確認用。
    - cron: '0 4 * * 2-6'
  push:
    paths:
      - 'sar_state.txt'
      - 'equity.csv'
      - '.github/workflows/dashboard.yml'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: dashboard-build-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Remove obsolete Actions history
        env:
          ACTIONS_CLEANUP_TOKEN: ${{ github.token }}
          ACTIONS_CLEANUP_REPOSITORY: ${{ github.repository }}
          ACTIONS_CLEANUP_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          api_root = "https://api.github.com"
          repository = os.environ["ACTIONS_CLEANUP_REPOSITORY"]
          token = os.environ["ACTIONS_CLEANUP_TOKEN"]
          current_run_id = int(os.environ["ACTIONS_CLEANUP_RUN_ID"])
          keep_paths = {
              ".github/workflows/dashboard.yml",
              ".github/workflows/intelligence-engine.yml",
              ".github/workflows/publish-public-site.yml",
          }

          def call(path, method="GET", tolerate=()):
              data = b"" if method in {"PUT", "POST", "PATCH"} else None
              request = urllib.request.Request(
                  api_root + path,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "v38-actions-history-cleanup",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      raw = response.read()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  if exc.code in tolerate:
                      return None
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"GitHub API {method} {path} failed: {exc.code} {detail}") from exc

          workflows = []
          page = 1
          while True:
              payload = call(f"/repos/{repository}/actions/workflows?per_page=100&page={page}")
              batch = payload.get("workflows", [])
              workflows.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          kept = []
          obsolete = []
          for workflow in workflows:
              path = str(workflow.get("path") or "")
              item = {
                  "id": workflow.get("id"),
                  "name": workflow.get("name"),
                  "path": path,
                  "state": workflow.get("state"),
              }
              if path in keep_paths or path.startswith("dynamic/pages/"):
                  kept.append(item)
                  print(f"KEEP {workflow.get('name')} [{path}]")
              else:
                  obsolete.append((workflow, item))

          total_deleted = 0
          cleaned = []
          for workflow, item in obsolete:
              workflow_id = workflow["id"]
              name = workflow.get("name") or str(workflow_id)
              path = workflow.get("path") or ""
              print(f"CLEAN {name} [{path}] id={workflow_id}")
              call(
                  f"/repos/{repository}/actions/workflows/{workflow_id}/disable",
                  method="PUT",
                  tolerate=(404, 409, 422),
              )

              workflow_deleted = 0
              for _ in range(200):
                  payload = call(
                      f"/repos/{repository}/actions/workflows/{workflow_id}/runs?per_page=100&page=1"
                  )
                  runs = payload.get("workflow_runs", [])
                  deletable = [
                      run for run in runs
                      if int(run.get("id") or 0) != current_run_id
                      and run.get("status") == "completed"
                  ]
                  if not deletable:
                      break
                  for run in deletable:
                      call(
                          f"/repos/{repository}/actions/runs/{run['id']}",
                          method="DELETE",
                          tolerate=(404,),
                      )
                      workflow_deleted += 1
                      total_deleted += 1
                      time.sleep(0.03)
              else:
                  raise RuntimeError(f"Cleanup safety limit reached for workflow {name}")

              item["deleted_runs"] = workflow_deleted
              cleaned.append(item)
              print(f"DELETED {workflow_deleted} runs from {name}")

          report = {
              "generated_at_utc": dt.datetime.now(dt.timezone.utc).isoformat(),
              "repository": repository,
              "kept_workflows": kept,
              "obsolete_workflows_found": len(obsolete),
              "obsolete_workflow_runs_deleted": total_deleted,
              "cleaned_workflows": cleaned,
          }
          Path("actions-cleanup-report.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, ensure_ascii=False))
          PY
      - name: Commit cleanup report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add actions-cleanup-report.json
          if ! git diff --staged --quiet; then
            git commit -m "Record Actions cleanup result"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                break
              fi
              git fetch origin main
              git rebase origin/main || { git rebase --abort || true; exit 1; }
              sleep $((attempt * 2))
            done
          fi
      - run: pip install pandas numpy yfinance
      - name: Build dashboard
        env:
          V38_UNIVERSE_CSV: universe.csv
          V38_SECTOR_JSON: sector_snapshot.json
          V38_OUT_HTML: command-center.html
          V38_MKTCAP_JSON: mktcap.json
          V38_TREND_JSON: trend_history.json
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          V38_FRED_CACHE: fred_cache.json
          V38_STATE_JSON: state.json
          V38_EQUITY_CSV: equity.csv
        run: python build_dashboard.py
      - name: Commit updated dashboard + caches
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add command-center.html
          git add mktcap.json trend_history.json fred_cache.json state.json || true

          if git diff --staged --quiet; then
            echo "No dashboard changes to commit"
            exit 0
          fi

          git commit -m "Daily dashboard rebuild + cache refresh"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push attempt ${attempt} failed; rebasing onto latest origin/main"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Rebase conflict detected; refusing to overwrite remote changes"
              exit 1
            fi
            sleep $((attempt * 2))
          done

          echo "Push failed after 3 attempts"
          exit 1
