name: Command Center daily build

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: command-center-build-main
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      TZ: Asia/Tokyo
      DASHBOARD_ARTIFACTS: >-
        command-center.html
        command-center_share.html
        state.json
        trend_history.json
        daily_log.csv
        mktcap.json
        fred_cache.json
        fmp_reference_cache.json
        earnings.json
        inception_vwap.json
        industry_map.json
        universe.csv
        options_targets.json
        commit_manifest.json

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Sync latest main before build
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          git reset --hard origin/main
          echo "DASHBOARD_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt pytest

      - name: Dashboard preflight tests
        run: |
          python -m py_compile build_dashboard.py
          pytest -q \
            tests/test_dashboard_build_regressions.py \
            tests/test_eps_acceleration.py

      - name: Build Command Center
        id: build
        env:
          V38_UNIVERSE_CSV: universe.csv
          V38_UNIVERSE_AUTO: '1'
          V38_UNIVERSE_MIN_MCAP: '200000000'
          V38_UNIVERSE_MIN_PRICE: '1'
          V38_SECTOR_JSON: sector_snapshot.json
          V38_OUT_HTML: command-center.html
          V38_MKTCAP_JSON: mktcap.json
          V38_TREND_JSON: trend_history.json
          V38_LOG_CSV: daily_log.csv
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          V38_FRED_CACHE: fred_cache.json
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          V38_FMP_REFERENCE_CACHE: fmp_reference_cache.json
          V38_FMP_REFERENCE_BUDGET: '40'
          V38_STATE_JSON: state.json
          V38_EQUITY_CSV: equity.csv
          V38_ER_JSON: earnings.json
          V38_EARNINGS_FETCH_BUDGET: '120'
          V38_EARNINGS_FETCH_SECONDS: '180'
          V38_EARNINGS_PRIORITY_RESERVE: '20'
          V38_INCEPT_VWAP_JSON: inception_vwap.json
          V38_INCEPT_VWAP_BUDGET: '1400'
          V38_INDUSTRY_JSON: industry_map.json
          V38_INDUSTRY_MAX_AGE_DAYS: '7'
          V38_OPT_JSON: options_positioning.json
          V38_OPT_SCAN_HISTORY: options_scan_history.csv
          V38_OPT_TARGETS: options_targets.json
        shell: bash
        run: |
          set -euo pipefail
          python build_dashboard.py 2>&1 | tee build-dashboard.log

          if grep -q "::warning::as-of regression:" build-dashboard.log; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "The existing newer Command Center remains the last-known-good version."
            exit 0
          fi

          candidate="$(python - <<'PY'
          import json
          print(str(json.load(open("state.json", encoding="utf-8")).get("date") or ""))
          PY
          )"
          echo "skipped=false" >> "$GITHUB_OUTPUT"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          echo "Command Center candidate session: $candidate"

      - name: Add TradingView ticker links
        if: steps.build.outputs.skipped != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("command-center.html")
          html = path.read_text(encoding="utf-8")
          tag = '<script src="command-center-tradingview-links.js?v=1"></script>'
          if tag not in html:
              if "</body>" not in html:
                  raise SystemExit("command-center.html has no </body> for TradingView link injection")
              html = html.replace("</body>", tag + "\n</body>", 1)
              path.write_text(html, encoding="utf-8")
          print("TRADINGVIEW_LINKS_INJECTED")
          PY

      - name: Validate Command Center generated files
        if: steps.build.outputs.skipped != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import json
          import re
          from pathlib import Path

          required = {
              "command-center.html": 200_000,
              "command-center_share.html": 2_500,
              "state.json": 100,
              "trend_history.json": 100,
              "daily_log.csv": 100,
              "options_targets.json": 2,
              "commit_manifest.json": 2,
          }
          for name, minimum in required.items():
              path = Path(name)
              if not path.is_file() or path.stat().st_size < minimum:
                  raise SystemExit(f"invalid Command Center artifact: {name}")

          state = json.loads(Path("state.json").read_text(encoding="utf-8"))
          state_date = str(state.get("date") or "")
          iso = re.compile(r"^\d{4}-\d{2}-\d{2}$")
          if not iso.fullmatch(state_date):
              raise SystemExit(f"invalid state date: {state_date!r}")

          log_dates = []
          with Path("daily_log.csv").open(encoding="utf-8", newline="") as fh:
              for row in csv.DictReader(fh):
                  date = str(row.get("date") or "")
                  if iso.fullmatch(date):
                      log_dates.append(date)
          if not log_dates or max(log_dates) != state_date:
              raise SystemExit(f"daily_log mismatch: state={state_date} log={max(log_dates) if log_dates else None}")

          trend = json.loads(Path("trend_history.json").read_text(encoding="utf-8"))
          trend_dates = []
          if isinstance(trend, list):
              for item in trend:
                  if isinstance(item, (list, tuple)) and item:
                      date = str(item[0] or "")
                  elif isinstance(item, dict):
                      date = str(item.get("date") or "")
                  else:
                      date = ""
                  if iso.fullmatch(date):
                      trend_dates.append(date)
          if not trend_dates or max(trend_dates) != state_date:
              raise SystemExit(f"trend mismatch: state={state_date} trend={max(trend_dates) if trend_dates else None}")

          prior_dates = sorted({date for date in log_dates + trend_dates if date < state_date})
          prevday = state.get("prevday") if isinstance(state.get("prevday"), dict) else {}
          prev_date = str(prevday.get("date") or "")
          if prior_dates and prev_date != prior_dates[-1]:
              raise SystemExit(f"comparison baseline mismatch: prevday={prev_date!r} expected={prior_dates[-1]}")
          if prev_date and (not iso.fullmatch(prev_date) or prev_date >= state_date):
              raise SystemExit(f"invalid comparison baseline: prevday={prev_date!r} state={state_date}")

          main = Path("command-center.html").read_text(encoding="utf-8")
          match = re.search(r"分析基準日\s+(\d{4}-\d{2}-\d{2})", main)
          if not match or match.group(1) != state_date:
              raise SystemExit(f"main HTML date mismatch: state={state_date} html={match.group(1) if match else None}")
          if "command-center-tradingview-links.js" not in main:
              raise SystemExit("TradingView ticker link script missing from Command Center HTML")
          if not Path("command-center-tradingview-links.js").is_file():
              raise SystemExit("TradingView ticker link script file missing")

          share = Path("command-center_share.html").read_text(encoding="utf-8")
          match = re.search(r"class=[\"']asof[\"'][^>]*>(\d{4}-\d{2}-\d{2})<", share)
          if not match or match.group(1) != state_date:
              raise SystemExit(f"share HTML date mismatch: state={state_date} share={match.group(1) if match else None}")

          manifest = json.loads(Path("commit_manifest.json").read_text(encoding="utf-8"))
          failed = [key for key in ("html", "share", "state", "trend", "log") if manifest.get(key) != "ok"]
          if failed:
              raise SystemExit(f"critical persistence did not complete: {failed}")

          print(f"COMMAND_CENTER_VALIDATE_PASS {state_date} comparison={prev_date or 'none'}")
          PY

      - name: Publish Command Center artifacts only to main
        if: steps.build.outputs.skipped != 'true'
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          staging="$(mktemp -d)"
          for file in $DASHBOARD_ARTIFACTS; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Missing Command Center artifact before publish: $file"
              exit 1
            fi
            cp -a "$file" "$staging/$file"
          done
          candidate_date="$(python -c 'import json; print(json.load(open("state.json", encoding="utf-8")).get("date", ""))')"

          for attempt in 1 2 3; do
            git fetch --depth=1 origin main

            if ! git diff --quiet "$DASHBOARD_SOURCE_SHA" origin/main -- \
              build_dashboard.py requirements.txt sar_state.txt equity.csv .github/workflows/dashboard.yml; then
              echo "::warning::Command Center source changed during this run; retain current main and let the newer workflow build it"
              echo "retained=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git reset --hard origin/main
            current_date="$(python - <<'PY'
          import json
          from pathlib import Path
          try:
              print(str(json.loads(Path("state.json").read_text(encoding="utf-8")).get("date") or ""))
          except Exception:
              print("")
          PY
            )"
            if [[ -n "$current_date" && "$candidate_date" < "$current_date" ]]; then
              echo "::warning::Candidate $candidate_date is older than current main $current_date; retaining last-known-good"
              echo "retained=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            for file in $DASHBOARD_ARTIFACTS; do
              cp -a "$staging/$file" "$file"
              git add -- "$file"
            done

            unexpected="$(git diff --cached --name-only | while IFS= read -r changed; do
              case " $DASHBOARD_ARTIFACTS " in
                *" $changed "*) ;;
                *) echo "$changed" ;;
              esac
            done)"
            if [[ -n "$unexpected" ]]; then
              echo "::error::Command Center publish attempted to stage files outside its ownership: $unexpected"
              exit 1
            fi

            if git diff --staged --quiet; then
              echo "Command Center already current on main"
              echo "retained=false" >> "$GITHUB_OUTPUT"
              echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git commit -m "Daily Command Center rebuild + cache refresh $candidate_date"
            published_sha="$(git rev-parse HEAD)"
            if git push origin HEAD:main; then
              echo "retained=false" >> "$GITHUB_OUTPUT"
              echo "published_sha=$published_sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 3))
          done

          echo "::error::Command Center publish failed after 3 attempts"
          exit 1

      - name: Report Command Center status
        if: always() && (steps.build.outcome == 'success')
        shell: bash
        run: |
          set -euo pipefail
          BUILD_SKIPPED="${{ steps.build.outputs.skipped || 'false' }}" \
          PUBLISH_RETAINED="${{ steps.publish.outputs.retained || 'false' }}" \
          PUBLISHED_SHA="${{ steps.publish.outputs.published_sha || '' }}" \
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          def load_json(name):
              try:
                  return json.loads(Path(name).read_text(encoding="utf-8"))
              except (OSError, ValueError):
                  return {}

          state = load_json("state.json")
          manifest = load_json("commit_manifest.json")
          prevday = state.get("prevday") if isinstance(state.get("prevday"), dict) else {}
          status = "retained last-known-good" if os.environ["BUILD_SKIPPED"] == "true" or os.environ["PUBLISH_RETAINED"] == "true" else "published"
          manifest_status = "READY" if all(manifest.get(key) == "ok" for key in ("html", "share", "state", "trend", "log")) else "DATA REQUIRED"
          lines = [
              "### Command Center build",
              f"- Status: {status}",
              f"- Data session: {state.get('date') or 'unknown'}",
              f"- Comparison baseline: {prevday.get('date') or 'none'}",
              f"- Gate: {state.get('gate') or 'unknown'}",
              f"- Main HTML: {Path('command-center.html').stat().st_size if Path('command-center.html').is_file() else 0} bytes",
              f"- Share HTML: {Path('command-center_share.html').stat().st_size if Path('command-center_share.html').is_file() else 0} bytes",
              f"- Persistence manifest: {manifest_status}",
              f"- Published commit: {os.environ['PUBLISHED_SHA'] or 'unchanged'}",
              "- Ownership: this workflow is the only writer of Command Center artifacts",
          ]
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY
