name: Command Center daily build

on:
  schedule:
    - cron: '17 22 * * 1-5'
    - cron: '17 4 * * 2-6'
  push:
    branches: [main]
    paths:
      - 'sar_state.txt'
      - 'equity.csv'
      - 'build_dashboard.py'
      - 'requirements.txt'
      - 'v38_rules.py'
      - 'build_v38_companion.py'
      - 'build_v38_strict_loo_live.py'
      - 'build_v38_tqqq_live.py'
      - 'build_v38_sleeve_live.py'
      - 'build_v38_sleeve_refresh.py'
      - 'v38-normal-sleeve-seed.json'
      - 'command-center-tradingview-links.js'
      - 'scripts/validate_atomic_publish.py'
      - 'tests/test_v38_rules.py'
      - 'tests/test_v38_companion.py'
      - 'tests/test_v38_strict_loo_live.py'
      - 'tests/test_v38_tqqq_live.py'
      - 'tests/test_v38_sleeve_live.py'
      - 'tests/test_v38_sleeve_refresh.py'
      - 'tests/test_atomic_publish_gate.py'
      - 'tests/test_atomic_pipeline_workflows.py'
      - '.github/workflows/dashboard.yml'
      - '.github/workflows/v38-live.yml'
      - '.github/workflows/v38-sleeve-refresh.yml'
      - '.github/workflows/rotation-live.yml'
      - '.github/workflows/publish-public-site.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: command-center-build-pipeline-v2
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TZ: Asia/Tokyo
      PIPELINE_BRANCH: pipeline-live
      CORE_ARTIFACTS: >-
        command-center.html
        command-center_share.html
        mktcap.json
        trend_history.json
        fred_cache.json
        fmp_reference_cache.json
        state.json
        daily_log.csv
        earnings.json
        inception_vwap.json
        industry_map.json
        universe.csv
        options_targets.json
        commit_manifest.json
        sector_snapshot.json

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Sync latest main before build
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          git reset --hard origin/main
          echo "BUILD_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt pytest

      - name: Command Center preflight tests
        run: |
          python -m py_compile build_dashboard.py scripts/validate_atomic_publish.py
          pytest -q \
            tests/test_dashboard_build_regressions.py \
            tests/test_options_positioning_quality.py \
            tests/test_eps_acceleration.py \
            tests/test_atomic_publish_gate.py \
            tests/test_atomic_pipeline_workflows.py

      - name: Build Command Center
        id: build
        env:
          V38_UNIVERSE_CSV: universe.csv
          V38_UNIVERSE_AUTO: '1'
          V38_UNIVERSE_MIN_MCAP: '200000000'
          V38_UNIVERSE_MIN_PRICE: '1'
          V38_SECTOR_JSON: sector_snapshot.json
          V38_OUT_HTML: command-center.html
          V38_MKTCAP_JSON: mktcap.json
          V38_TREND_JSON: trend_history.json
          V38_LOG_CSV: daily_log.csv
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          V38_FRED_CACHE: fred_cache.json
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          V38_FMP_REFERENCE_CACHE: fmp_reference_cache.json
          V38_FMP_REFERENCE_BUDGET: '40'
          V38_STATE_JSON: state.json
          V38_EQUITY_CSV: equity.csv
          V38_ER_JSON: earnings.json
          V38_EARNINGS_FETCH_BUDGET: '120'
          V38_EARNINGS_FETCH_SECONDS: '180'
          V38_EARNINGS_PRIORITY_RESERVE: '20'
          V38_INCEPT_VWAP_JSON: inception_vwap.json
          V38_INCEPT_VWAP_BUDGET: '1400'
          V38_INDUSTRY_JSON: industry_map.json
          V38_INDUSTRY_MAX_AGE_DAYS: '7'
          V38_OPT_JSON: options_positioning.json
          V38_OPT_SCAN_HISTORY: options_scan_history.csv
          V38_OPT_TARGETS: options_targets.json
        shell: bash
        run: |
          set -euo pipefail
          python build_dashboard.py 2>&1 | tee build-dashboard.log
          if grep -q "::warning::as-of regression:" build-dashboard.log; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Add TradingView ticker links
        if: steps.build.outputs.skipped != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('command-center.html')
          html = path.read_text(encoding='utf-8')
          tag = '<script src="command-center-tradingview-links.js?v=1"></script>'
          if tag not in html:
              if '</body>' not in html:
                  raise SystemExit('command-center.html has no </body> for TradingView link injection')
              html = html.replace('</body>', tag + '\n</body>', 1)
              path.write_text(html, encoding='utf-8')
          print('TRADINGVIEW_LINKS_INJECTED')
          PY

      - name: Validate Command Center generated files
        if: steps.build.outputs.skipped != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import json
          import re
          from pathlib import Path

          for name, minimum in {
              'command-center.html': 200_000,
              'command-center_share.html': 2_500,
              'state.json': 100,
              'trend_history.json': 100,
              'daily_log.csv': 100,
              'commit_manifest.json': 20,
              'sector_snapshot.json': 100,
          }.items():
              path = Path(name)
              if not path.is_file() or path.stat().st_size < minimum:
                  raise SystemExit(f'invalid generated file: {name}')

          state = json.loads(Path('state.json').read_text(encoding='utf-8'))
          state_date = str(state.get('date') or '')
          iso = re.compile(r'^\d{4}-\d{2}-\d{2}$')
          if not iso.fullmatch(state_date):
              raise SystemExit(f'invalid state date: {state_date!r}')

          main = Path('command-center.html').read_text(encoding='utf-8')
          share = Path('command-center_share.html').read_text(encoding='utf-8')
          if 'Command Center' not in main or f'分析基準日 {state_date}' not in main:
              raise SystemExit('Command Center HTML marker/date mismatch')
          if 'command-center-tradingview-links.js' not in main:
              raise SystemExit('TradingView ticker link script missing from Command Center HTML')
          if not Path('command-center-tradingview-links.js').is_file():
              raise SystemExit('TradingView ticker link script file missing')
          if state_date not in share:
              raise SystemExit('share HTML date mismatch')

          log_dates = []
          with Path('daily_log.csv').open(encoding='utf-8', newline='') as fh:
              for row in csv.DictReader(fh):
                  d = str(row.get('date') or '')
                  if iso.fullmatch(d):
                      log_dates.append(d)
          if not log_dates or max(log_dates) != state_date:
              raise SystemExit(f'daily log mismatch: {state_date}')

          trend = json.loads(Path('trend_history.json').read_text(encoding='utf-8'))
          trend_dates = []
          if isinstance(trend, list):
              for row in trend:
                  if isinstance(row, (list, tuple)) and row:
                      d = str(row[0] or '')
                  elif isinstance(row, dict):
                      d = str(row.get('date') or '')
                  else:
                      d = ''
                  if iso.fullmatch(d):
                      trend_dates.append(d)
          if not trend_dates or max(trend_dates) != state_date:
              raise SystemExit(f'trend history mismatch: {state_date}')

          manifest = json.loads(Path('commit_manifest.json').read_text(encoding='utf-8'))
          failed = [k for k in ('html', 'share', 'state', 'trend', 'log') if manifest.get(k) != 'ok']
          if failed:
              raise SystemExit(f'critical persistence incomplete: {failed}')
          print('COMMAND_CENTER_VALIDATE_PASS', state_date)
          PY

      - name: Report skipped stale run
        if: steps.build.outputs.skipped == 'true'
        run: echo "As-of regression guard kept the newer Command Center session intact"

      - name: Stage Command Center and caches off public main
        if: steps.build.outputs.skipped != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          generated="$(mktemp -d)"
          for file in $CORE_ARTIFACTS; do
            if [[ -f "$file" ]]; then
              mkdir -p "$generated/$(dirname "$file")"
              cp -a "$file" "$generated/$file"
            fi
          done

          git fetch --depth=1 origin main
          if [[ "$(git rev-parse origin/main)" != "$BUILD_SOURCE_SHA" ]]; then
            echo "::error::Public main advanced during Command Center build; reject stale staging snapshot"
            exit 1
          fi

          old_stage=""
          if git fetch --depth=1 origin "$PIPELINE_BRANCH"; then
            old_stage="$(git rev-parse "origin/$PIPELINE_BRANCH")"
          fi

          git reset --hard origin/main
          for file in $CORE_ARTIFACTS; do
            if [[ -f "$generated/$file" ]]; then
              mkdir -p "$(dirname "$file")"
              cp -a "$generated/$file" "$file"
              git add -- "$file"
            fi
          done

          if ! git diff --staged --quiet; then
            git commit -m "Stage Command Center live snapshot"
          fi

          if [[ -n "$old_stage" ]]; then
            git push \
              --force-with-lease="refs/heads/$PIPELINE_BRANCH:$old_stage" \
              origin "HEAD:refs/heads/$PIPELINE_BRANCH"
          else
            git push origin "HEAD:refs/heads/$PIPELINE_BRANCH"
          fi

      - name: Hand off staged Command Center snapshot
        if: steps.build.outputs.skipped != 'true'
        run: echo "Command Center staged atomically; V38 live build is the next pipeline stage"
