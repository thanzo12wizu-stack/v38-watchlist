name: Command Center daily build

on:
  schedule:
    # 朝一: JST 7時 = UTC 22時
    - cron: '17 22 * * 1-5'
    # 昼: JST 13時 = UTC 4時
    - cron: '17 4 * * 2-6'
  push:
    branches:
      - main
    paths:
      - 'sar_state.txt'
      - 'equity.csv'
      - 'build_dashboard.py'
      - 'requirements.txt'
      - '.github/workflows/dashboard.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: command-center-build-main
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TZ: Asia/Tokyo
      CORE_ARTIFACTS: >-
        command-center.html
        command-center_share.html
        mktcap.json
        trend_history.json
        fred_cache.json
        fmp_reference_cache.json
        state.json
        daily_log.csv
        earnings.json
        inception_vwap.json
        industry_map.json
        universe.csv
        options_targets.json
        commit_manifest.json

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Sync latest main before build
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          git reset --hard origin/main
          echo "BUILD_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt pytest

      - name: Command Center preflight tests
        run: |
          python -m py_compile build_dashboard.py
          pytest -q \
            tests/test_dashboard_build_regressions.py \
            tests/test_options_positioning_quality.py \
            tests/test_eps_acceleration.py

      - name: Build Command Center
        id: build
        env:
          V38_UNIVERSE_CSV: universe.csv
          V38_UNIVERSE_AUTO: '1'
          V38_UNIVERSE_MIN_MCAP: '200000000'
          V38_UNIVERSE_MIN_PRICE: '1'
          V38_SECTOR_JSON: sector_snapshot.json
          V38_OUT_HTML: command-center.html
          V38_MKTCAP_JSON: mktcap.json
          V38_TREND_JSON: trend_history.json
          V38_LOG_CSV: daily_log.csv
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          V38_FRED_CACHE: fred_cache.json
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          V38_FMP_REFERENCE_CACHE: fmp_reference_cache.json
          V38_FMP_REFERENCE_BUDGET: '40'
          V38_STATE_JSON: state.json
          V38_EQUITY_CSV: equity.csv
          V38_ER_JSON: earnings.json
          V38_EARNINGS_FETCH_BUDGET: '120'
          V38_EARNINGS_FETCH_SECONDS: '180'
          V38_EARNINGS_PRIORITY_RESERVE: '20'
          V38_INCEPT_VWAP_JSON: inception_vwap.json
          V38_INCEPT_VWAP_BUDGET: '1400'
          V38_INDUSTRY_JSON: industry_map.json
          V38_INDUSTRY_MAX_AGE_DAYS: '7'
          V38_OPT_JSON: options_positioning.json
          V38_OPT_SCAN_HISTORY: options_scan_history.csv
          V38_OPT_TARGETS: options_targets.json
        shell: bash
        run: |
          set -euo pipefail
          python build_dashboard.py 2>&1 | tee build-dashboard.log
          if grep -q "::warning::as-of regression:" build-dashboard.log; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report skipped stale run
        if: steps.build.outputs.skipped == 'true'
        shell: bash
        run: |
          {
            echo "### Command Center build"
            echo "- Status: skipped"
            echo "- Reason: as-of regression guard kept the newer persisted session intact"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate Command Center generated files
        if: steps.build.outputs.skipped != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import json
          import re
          from pathlib import Path

          required = {
              'command-center.html': 200_000,
              'command-center_share.html': 2_500,
              'state.json': 100,
              'trend_history.json': 100,
              'daily_log.csv': 100,
          }
          for name, minimum in required.items():
              path = Path(name)
              if not path.is_file():
                  raise SystemExit(f'missing generated file: {name}')
              if path.stat().st_size < minimum:
                  raise SystemExit(f'generated file too small: {name}')

          main = Path('command-center.html').read_text(encoding='utf-8')
          share = Path('command-center_share.html').read_text(encoding='utf-8')
          if 'Command Center' not in main:
              raise SystemExit('Command Center marker missing')

          state = json.loads(Path('state.json').read_text(encoding='utf-8'))
          state_date = str(state.get('date') or '')
          iso = re.compile(r'^\d{4}-\d{2}-\d{2}$')
          if not iso.fullmatch(state_date):
              raise SystemExit(f'invalid state date: {state_date!r}')

          log_dates = []
          with Path('daily_log.csv').open(encoding='utf-8', newline='') as fh:
              for row in csv.DictReader(fh):
                  d = str(row.get('date') or '')
                  if iso.fullmatch(d):
                      log_dates.append(d)
          trend = json.loads(Path('trend_history.json').read_text(encoding='utf-8'))
          trend_dates = []
          if isinstance(trend, list):
              for row in trend:
                  d = str(row[0] if isinstance(row, (list, tuple)) and row else row.get('date') if isinstance(row, dict) else '')
                  if iso.fullmatch(d):
                      trend_dates.append(d)
          if not log_dates or max(log_dates) != state_date:
              raise SystemExit(f'daily log date mismatch: state={state_date}')
          if not trend_dates or max(trend_dates) != state_date:
              raise SystemExit(f'trend date mismatch: state={state_date}')

          mm = re.search(r'分析基準日\s+(\d{4}-\d{2}-\d{2})', main)
          sm = re.search(r'class=[\"\']asof[\"\'][^>]*>(\d{4}-\d{2}-\d{2})<', share)
          if not mm or mm.group(1) != state_date:
              raise SystemExit('main HTML date mismatch')
          if not sm or sm.group(1) != state_date:
              raise SystemExit('share HTML date mismatch')

          manifest = json.loads(Path('commit_manifest.json').read_text(encoding='utf-8'))
          failed = [k for k in ('html', 'share', 'state', 'trend', 'log') if manifest.get(k) != 'ok']
          if failed:
              raise SystemExit(f'critical persistence did not complete: {failed}')
          print('COMMAND_CENTER_VALIDATE_PASS', state_date)
          PY

      - name: Commit Command Center and caches
        if: steps.build.outputs.skipped != 'true'
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "source_drift=false" >> "$GITHUB_OUTPUT"

          git fetch --depth=1 origin main
          if [[ -n "${BUILD_SOURCE_SHA:-}" ]] && ! git diff --quiet "$BUILD_SOURCE_SHA" origin/main -- \
            build_dashboard.py requirements.txt sar_state.txt equity.csv .github/workflows/dashboard.yml; then
            echo "::warning::Command Center source changed during build; skip stale persistence"
            echo "source_drift=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          staging="$(mktemp -d)"
          for file in $CORE_ARTIFACTS; do
            if [[ -f "$file" ]]; then
              mkdir -p "$staging/$(dirname "$file")"
              cp -a "$file" "$staging/$file"
            fi
          done

          pushed=false
          for attempt in 1 2 3; do
            git fetch --depth=1 origin main
            git reset --hard FETCH_HEAD
            for file in $CORE_ARTIFACTS; do
              if [[ -f "$staging/$file" ]]; then
                mkdir -p "$(dirname "$file")"
                cp -a "$staging/$file" "$file"
                git add -- "$file"
              fi
            done
            if git diff --staged --quiet; then
              pushed=true
              break
            fi
            git commit -m "Daily Command Center rebuild + cache refresh"
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            sleep $((attempt * 3))
          done
          if [[ "$pushed" != true ]]; then
            exit 1
          fi
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Audit public privacy boundary
        if: steps.build.outputs.skipped != 'true' && steps.persist.outputs.source_drift != 'true'
        run: |
          python scripts/privacy_audit.py --root . --output /tmp/privacy-audit-status.json
          cat /tmp/privacy-audit-status.json

      - name: Export public site
        if: steps.build.outputs.skipped != 'true' && steps.persist.outputs.source_drift != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/export_public_site.py \
            --root . \
            --output /tmp/v38-public-site \
            --source-commit "${{ steps.persist.outputs.source_sha }}"

      - name: Publish clean public mirror
        if: steps.build.outputs.skipped != 'true' && steps.persist.outputs.source_drift != 'true'
        continue-on-error: true
        shell: bash
        env:
          PUBLIC_REPOSITORY: ${{ vars.V38_PUBLIC_PAGES_REPOSITORY }}
          PUBLIC_TOKEN: ${{ secrets.V38_PUBLIC_PAGES_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${PUBLIC_REPOSITORY:-}" || -z "${PUBLIC_TOKEN:-}" ]]; then
            echo "Public mirror not configured; skip"
            exit 0
          fi
          target=/tmp/v38-pages-repository
          git clone --depth 1 "https://x-access-token:${PUBLIC_TOKEN}@github.com/${PUBLIC_REPOSITORY}.git" "$target"
          find "$target" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/v38-public-site/. "$target/"
          cd "$target"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "Publish Command Center ${{ steps.persist.outputs.source_sha }}"
          git push origin HEAD:main
