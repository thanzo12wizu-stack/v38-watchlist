name: Dashboard daily build

on:
  schedule:
    - cron: '17 22 * * 1-5'
    - cron: '17 4 * * 2-6'
  push:
    branches: [main]
    paths:
      - 'sar_state.txt'
      - 'equity.csv'
      - 'build_dashboard.py'
      - 'requirements.txt'
      - 'tests/test_dashboard_build_regressions.py'
      - 'tests/test_eps_acceleration.py'
      - '.github/workflows/dashboard.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dashboard-build-main
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      TZ: Asia/Tokyo
      LAST_KNOWN_GOOD: f9bf67d815b8203d6caebf6680a126bc50cf3c06
      DASHBOARD_ARTIFACTS: >-
        command-center.html
        command-center_share.html
        mktcap.json
        trend_history.json
        fred_cache.json
        fmp_reference_cache.json
        state.json
        daily_log.csv
        earnings.json
        inception_vwap.json
        industry_map.json
        universe.csv

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Sync latest main before build
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          git reset --hard origin/main
          echo "DASHBOARD_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Restore last known-good dashboard chronology when needed
        shell: bash
        run: |
          set -euo pipefail
          current_date="$(python - <<'PY'
          import json
          from pathlib import Path
          p=Path("state.json")
          try:
              print(str(json.loads(p.read_text(encoding="utf-8")).get("date") or ""))
          except Exception:
              print("")
          PY
          )"
          if [[ -z "$current_date" || "$current_date" == "2026-09-02" ]]; then
            git fetch --depth=1 origin "$LAST_KNOWN_GOOD"
            for file in state.json trend_history.json daily_log.csv; do
              git show "$LAST_KNOWN_GOOD:$file" > "$file"
            done
            echo "Restored known-good dashboard chronology from 2026-09-01"
          else
            echo "Using current dashboard chronology: $current_date"
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt pytest

      - name: Dashboard preflight tests
        run: |
          python -m py_compile build_dashboard.py
          pytest -q \
            tests/test_dashboard_build_regressions.py \
            tests/test_eps_acceleration.py

      - name: Determine latest completed QQQ session
        id: target
        shell: bash
        run: |
          set -euo pipefail
          target="$(python - <<'PY'
          import datetime as dt
          from zoneinfo import ZoneInfo
          import yfinance as yf

          now = dt.datetime.now(dt.timezone.utc).astimezone(ZoneInfo("America/New_York"))
          cutoff = now.date()
          if (now.hour, now.minute) < (16, 15):
              cutoff -= dt.timedelta(days=1)

          try:
              df = yf.download(
                  "QQQ",
                  period="10d",
                  interval="1d",
                  auto_adjust=False,
                  progress=False,
                  threads=False,
              )
              dates = []
              for x in df.index:
                  d = getattr(x, "date", lambda: x)()
                  if d <= cutoff:
                      dates.append(d)
              print(max(dates).isoformat() if dates else "")
          except Exception:
              print("")
          PY
          )"
          echo "session=$target" >> "$GITHUB_OUTPUT"
          echo "Latest completed QQQ session: ${target:-unknown}"

      - name: Build dashboard
        id: build
        env:
          V38_UNIVERSE_CSV: universe.csv
          V38_UNIVERSE_AUTO: '1'
          V38_UNIVERSE_MIN_MCAP: '200000000'
          V38_UNIVERSE_MIN_PRICE: '1'
          V38_SECTOR_JSON: sector_snapshot.json
          V38_OUT_HTML: command-center.html
          V38_MKTCAP_JSON: mktcap.json
          V38_TREND_JSON: trend_history.json
          V38_LOG_CSV: daily_log.csv
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          V38_FRED_CACHE: fred_cache.json
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          V38_FMP_REFERENCE_CACHE: fmp_reference_cache.json
          V38_FMP_REFERENCE_BUDGET: '40'
          V38_STATE_JSON: state.json
          V38_EQUITY_CSV: equity.csv
          V38_ER_JSON: earnings.json
          V38_EARNINGS_FETCH_BUDGET: '120'
          V38_EARNINGS_FETCH_SECONDS: '180'
          V38_EARNINGS_PRIORITY_RESERVE: '20'
          V38_INCEPT_VWAP_JSON: inception_vwap.json
          V38_INCEPT_VWAP_BUDGET: '1400'
          V38_INDUSTRY_JSON: industry_map.json
          V38_INDUSTRY_MAX_AGE_DAYS: '7'
          V38_OPT_JSON: options_positioning.json
          V38_OPT_SCAN_HISTORY: options_scan_history.csv
          V38_OPT_TARGETS: options_targets.json
        shell: bash
        run: |
          set -euo pipefail
          target="${{ steps.target.outputs.session }}"
          final_log=build-dashboard.log

          for attempt in 1 2; do
            echo "Dashboard build attempt $attempt"
            python build_dashboard.py 2>&1 | tee "$final_log"

            if grep -q "::warning::as-of regression:" "$final_log"; then
              echo "skipped=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            candidate="$(python - <<'PY'
          import json
          print(str(json.load(open("state.json", encoding="utf-8")).get("date") or ""))
          PY
            )"
            echo "Dashboard candidate session: $candidate"

            if [[ -z "$target" || "$candidate" == "$target" ]]; then
              echo "skipped=false" >> "$GITHUB_OUTPUT"
              echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [[ "$candidate" > "$target" ]]; then
              echo "::error::Dashboard candidate is ahead of QQQ completed session: candidate=$candidate target=$target"
              exit 1
            fi

            if [[ "$attempt" -lt 2 ]]; then
              echo "::warning::Dashboard lagged QQQ session ($candidate < $target); retry once"
              sleep 20
              final_log=build-dashboard-retry.log
            fi
          done

          echo "::error::Dashboard could not reach latest completed QQQ session after retry"
          exit 1

      - name: Report skipped stale run
        if: steps.build.outputs.skipped == 'true'
        run: echo "As-of regression guard kept the newer public Dashboard intact"

      - name: Validate dashboard generated files
        if: steps.build.outputs.skipped != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import json
          import re
          from pathlib import Path

          required = {
              "command-center.html": 200_000,
              "command-center_share.html": 2_500,
              "state.json": 100,
              "trend_history.json": 100,
              "daily_log.csv": 100,
          }
          for name, minimum in required.items():
              p = Path(name)
              if not p.is_file() or p.stat().st_size < minimum:
                  raise SystemExit(f"invalid dashboard artifact: {name}")

          state = json.loads(Path("state.json").read_text(encoding="utf-8"))
          state_date = str(state.get("date") or "")
          if not re.fullmatch(r"\d{4}-\d{2}-\d{2}", state_date):
              raise SystemExit(f"invalid state date: {state_date!r}")

          log_dates = []
          with Path("daily_log.csv").open(encoding="utf-8", newline="") as fh:
              for row in csv.DictReader(fh):
                  d = str(row.get("date") or "")
                  if re.fullmatch(r"\d{4}-\d{2}-\d{2}", d):
                      log_dates.append(d)
          if not log_dates or max(log_dates) != state_date:
              raise SystemExit(f"daily_log mismatch: state={state_date} log={max(log_dates) if log_dates else None}")

          trend = json.loads(Path("trend_history.json").read_text(encoding="utf-8"))
          trend_dates = []
          if isinstance(trend, list):
              for item in trend:
                  if isinstance(item, (list, tuple)) and item:
                      d = str(item[0] or "")
                  elif isinstance(item, dict):
                      d = str(item.get("date") or "")
                  else:
                      d = ""
                  if re.fullmatch(r"\d{4}-\d{2}-\d{2}", d):
                      trend_dates.append(d)
          if not trend_dates or max(trend_dates) != state_date:
              raise SystemExit(f"trend mismatch: state={state_date} trend={max(trend_dates) if trend_dates else None}")

          main = Path("command-center.html").read_text(encoding="utf-8")
          m = re.search(r"分析基準日\s+(\d{4}-\d{2}-\d{2})", main)
          if not m or m.group(1) != state_date:
              raise SystemExit(f"main HTML date mismatch: state={state_date} html={m.group(1) if m else None}")

          share = Path("command-center_share.html").read_text(encoding="utf-8")
          m = re.search(r"class=[\"']asof[\"'][^>]*>(\d{4}-\d{2}-\d{2})<", share)
          if not m or m.group(1) != state_date:
              raise SystemExit(f"share HTML date mismatch: state={state_date} share={m.group(1) if m else None}")

          prev = state.get("prevday") if isinstance(state.get("prevday"), dict) else {}
          prev_date = str(prev.get("date") or "")
          if prev_date and prev_date >= state_date:
              raise SystemExit(f"invalid comparison baseline: prevday={prev_date} state={state_date}")

          print(f"DASHBOARD_VALIDATE_PASS {state_date} comparison={prev_date or 'none'}")
          PY

      - name: Publish dashboard only to main
        if: steps.build.outputs.skipped != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          staging="$(mktemp -d)"
          for file in $DASHBOARD_ARTIFACTS; do
            if [[ -f "$file" ]]; then
              mkdir -p "$staging/$(dirname "$file")"
              cp -a "$file" "$staging/$file"
            fi
          done

          for attempt in 1 2 3; do
            git fetch --depth=1 origin main
            git reset --hard origin/main

            for file in $DASHBOARD_ARTIFACTS; do
              if [[ -f "$staging/$file" ]]; then
                mkdir -p "$(dirname "$file")"
                cp -a "$staging/$file" "$file"
                git add -- "$file"
              fi
            done

            if git diff --staged --quiet; then
              echo "Dashboard already current"
              exit 0
            fi

            asof="$(python -c 'import json; print(json.load(open("state.json", encoding="utf-8")).get("date",""))')"
            git commit -m "Daily dashboard rebuild + cache refresh $asof"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 3))
          done

          echo "::error::Dashboard publish failed after 3 attempts"
          exit 1
