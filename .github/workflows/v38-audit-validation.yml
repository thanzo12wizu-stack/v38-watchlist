name: V38 audited companion validation

on:
  pull_request:
    paths:
      - 'build_v38_companion.py'
      - 'command-center-v38.html'
      - 'rotation-intelligence.html'
      - 'rotation_intelligence.py'
      - 'v38_rules.py'
      - 'scripts/export_public_site.py'
      - 'scripts/privacy_audit.py'
      - 'tests/test_v38_*.py'
      - 'tests/test_rotation_*.py'
      - 'tests/test_public_site_export.py'
      - 'tests/test_privacy_audit.py'
      - '.github/workflows/v38-audit-validation.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Python compile
        run: python -m py_compile build_v38_companion.py rotation_intelligence.py v38_rules.py scripts/export_public_site.py scripts/privacy_audit.py
      - name: Audited V38 tests
        run: |
          pytest -q \
            tests/test_v38_rules.py \
            tests/test_v38_companion.py \
            tests/test_rotation_intelligence.py \
            tests/test_rotation_history.py \
            tests/test_public_site_export.py \
            tests/test_privacy_audit.py
      - name: Build current audited state
        run: python build_v38_companion.py --legacy command-center.html --out v38-live-state.json
      - name: Validate state contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('v38-live-state.json').read_text(encoding='utf-8'))
          assert s['schema']=='v38-live-state-1'
          assert s['ranking']['candidate_exclusion_required_for_all_components'] is True
          if s['market']['mode']=='ATTACK':
              assert s['ranking']['candidate_list_semantics']=='RS189_PREVIEW_ONLY_UNTIL_LOO_LIVE'
              assert all(x['final_rank'] is None for x in s['candidates'])
          assert s['panic_tqqq']['allocation_priority']=='NOT REPRODUCED'
          print(s['asof'], s['market']['mode'], len(s['candidates']))
          PY
      - name: Export public site and privacy audit
        run: |
          rm -rf /tmp/v38-public
          python scripts/export_public_site.py --root . --output /tmp/v38-public --source-commit "$GITHUB_SHA"
          python scripts/privacy_audit.py --root . --output /tmp/privacy-audit.json
      - name: Inline JavaScript syntax
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          for(const f of ['command-center-v38.html','rotation-intelligence.html']){
            const s=fs.readFileSync(f,'utf8');
            const scripts=[...s.matchAll(/<script[^>]*>([\s\S]*?)<\/script>/gi)].map(x=>x[1]);
            for(const code of scripts) new vm.Script(code,{filename:f});
          }
          NODE
