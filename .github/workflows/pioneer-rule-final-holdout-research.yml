name: Pioneer rule final holdout research

on:
  push:
    branches:
      - research/sector-stock-leadership-20260826
    paths:
      - .github/workflows/pioneer-rule-final-holdout-research.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy yfinance
      - name: Syntax check
        run: python -m py_compile leadership/research/validate_pioneer_rule_replication.py
      - name: Run third disjoint universe holdout
        run: |
          python leadership/research/validate_pioneer_rule_replication.py \
            --root . \
            --output leadership/research/pioneer_rule_final_holdout_output \
            --analysis-start 2016-01-04 \
            --analysis-end 2026-06-20 \
            --primary-max-tickers 3000 \
            --replication-max-tickers 1500 \
            --batch-size 75 \
            --min-members 3
      - name: Upload research outputs
        uses: actions/upload-artifact@v4
        with:
          name: pioneer-rule-final-holdout
          path: leadership/research/pioneer_rule_final_holdout_output/
          retention-days: 7
