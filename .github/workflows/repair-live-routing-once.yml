name: Repair live data routing once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-live-routing-once.yml'

permissions:
  contents: write

concurrency:
  group: repair-live-data-routing-once
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Apply display-routing-only patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          idx=Path('rotation/index.html')
          s=idx.read_text(encoding='utf-8')
          old='<script src="app-v2.js"></script>'
          new='<script src="app-live.js"></script>'
          if new not in s:
              if old not in s: raise SystemExit('Rotation engine script marker missing')
              s=s.replace(old,new,1)
              idx.write_text(s,encoding='utf-8')

          v=Path('command-center-v38.html')
          s=v.read_text(encoding='utf-8')
          marker='<script src="v38-freshness.js"></script>'
          if marker not in s:
              if '</body>' not in s: raise SystemExit('V38 body close marker missing')
              s=s.replace('</body>',marker+'</body>',1)
              v.write_text(s,encoding='utf-8')

          exp=Path('scripts/export_public_site.py')
          s=exp.read_text(encoding='utf-8')
          if '    "v38-freshness.js",\n' not in s:
              s=s.replace('    "command-center-v38.html",\n','    "command-center-v38.html",\n    "v38-freshness.js",\n',1)
          if '    "rotation/app-live.js",\n' not in s:
              s=s.replace('    "rotation/app-v2.js",\n','    "rotation/app-v2.js",\n    "rotation/app-live.js",\n',1)
          exp.write_text(s,encoding='utf-8')

          pub=Path('.github/workflows/publish-public-site.yml')
          s=pub.read_text(encoding='utf-8')
          additions=[
              ("      - 'command-center-v38.html'\n", "      - 'command-center-v38.html'\n      - 'v38-freshness.js'\n"),
              ("      - 'rotation/app-v2.js'\n", "      - 'rotation/index.html'\n      - 'rotation/app-v2.js'\n      - 'rotation/app-live.js'\n"),
          ]
          if "      - 'v38-freshness.js'\n" not in s:
              s=s.replace(*additions[0],1)
          if "      - 'rotation/app-live.js'\n" not in s:
              s=s.replace(*additions[1],1)
          pub.write_text(s,encoding='utf-8')
          PY
      - name: Validate routing and public boundary
        run: |
          node --check rotation/app-live.js
          node --check v38-freshness.js
          grep -F '<script src="app-live.js"></script>' rotation/index.html
          grep -F '<script src="v38-freshness.js"></script>' command-center-v38.html
          grep -F '"rotation/app-live.js"' scripts/export_public_site.py
          grep -F '"v38-freshness.js"' scripts/export_public_site.py
          python -m pip install --disable-pip-version-check pytest
          pytest -q tests/test_public_site_export.py tests/test_privacy_audit.py
      - name: Persist routing patch and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-live-routing-once.yml
          git add rotation/index.html command-center-v38.html scripts/export_public_site.py .github/workflows/publish-public-site.yml
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'Route V38 and Rotation pages through fresh production data'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1
