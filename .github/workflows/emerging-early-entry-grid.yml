# Research-only audit. Does not modify main, production data, or dashboard outputs.
name: Emerging Early Entry Grid

on:
  push:
    branches:
      - research/leader-entry-delay-audit-20260904
    paths:
      - leadership/research/audit_emerging_early_entry_grid.py
      - leadership/research/run_emerging_early_entry_grid_fast.py
      - .github/workflows/emerging-early-entry-grid.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy yfinance
      - name: Syntax check
        run: |
          python -m py_compile leadership/research/audit_emerging_early_entry_grid.py
          python -m py_compile leadership/research/run_emerging_early_entry_grid_fast.py
      - name: Run emerging early-entry grid
        env:
          PYTHONPATH: .:leadership/research
        run: |
          python leadership/research/run_emerging_early_entry_grid_fast.py \
            --root . \
            --output leadership/research/emerging_early_entry_grid_output \
            --analysis-start 2016-01-04 \
            --analysis-end 2026-09-02 \
            --max-tickers 6000 \
            --batch-size 75
      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emerging-early-entry-grid
          path: leadership/research/emerging_early_entry_grid_output/
          retention-days: 14
