name: V38 production downstream chain

on:
  workflow_run:
    workflows: ["Command Center daily build"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}
  # Workflow edits trigger one self-check run so pipeline repairs can be
  # validated immediately. Ordinary data commits do not match this path.
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-downstream-chain.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: v38-production-downstream-chain
  cancel-in-progress: false

jobs:
  chain:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      DASHBOARD_OWNED: >-
        command-center.html
        command-center_share.html
        state.json
        trend_history.json
        daily_log.csv
        mktcap.json
        fred_cache.json
        fmp_reference_cache.json
        earnings.json
        inception_vwap.json
        industry_map.json
        universe.csv
        options_targets.json
        commit_manifest.json

    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Record upstream Command Center snapshot
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          git reset --hard origin/main
          git rev-parse HEAD | tee /tmp/command-center-main-sha.txt
          : > /tmp/dashboard-owned-before.txt
          for file in $DASHBOARD_OWNED; do
            git rev-parse "HEAD:$file" >> /tmp/dashboard-owned-before.txt
          done
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('state.json').read_text(encoding='utf-8'))
          asof=str(state.get('date') or '')
          if not asof:
              raise SystemExit('Command Center state has no as-of')
          print('COMMAND_CENTER_CHAIN_INPUT', asof)
          PY

      - name: Run market/leadership/rotation downstream stages serially
        shell: bash
        run: |
          set -euo pipefail

          run_stage() {
            workflow="$1"
            label="$2"
            before="$(gh run list --repo "$REPO" --workflow "$workflow" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            gh workflow run "$workflow" --repo "$REPO" --ref main
            run_id=""
            for attempt in $(seq 1 30); do
              candidate="$(gh run list --repo "$REPO" --workflow "$workflow" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
              if [[ "$candidate" != "0" && "$candidate" != "$before" ]]; then
                run_id="$candidate"
                break
              fi
              sleep 2
            done
            if [[ -z "$run_id" ]]; then
              echo "::error::Could not resolve dispatched run for $label"
              exit 1
            fi
            echo "$label run_id=$run_id"
            gh run watch "$run_id" --repo "$REPO" --exit-status --interval 10
            echo "$label SUCCESS run_id=$run_id"
          }

          run_stage v38-live.yml "V38/TQQQ/CURRENT30"
          run_stage v38-sleeve-refresh.yml "Sleeve/RSI Reset"
          run_stage leadership-command.yml "Leadership"
          run_stage rotation-live.yml "Rotation"
          run_stage rotation-stock-context-live.yml "Rotation strong stocks"

      - name: Refresh Options Intelligence from final upstream snapshot
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          git reset --hard origin/main

          # Fail closed: the Options overlay may read upstream artifacts only
          # after state / Rotation / Leadership context share one session date.
          python - <<'PY'
          import json
          from pathlib import Path

          state=json.loads(Path('state.json').read_text(encoding='utf-8'))
          status=json.loads(Path('rotation/data/status.json').read_text(encoding='utf-8'))
          context=json.loads(Path('rotation/data/rotation-theme56-stock-context.json').read_text(encoding='utf-8'))
          target=str(state.get('date') or '')
          dates={
              'state': target,
              'rotation_status': str(status.get('asof') or ''),
              'leadership_market': str((context.get('leadership_market') or {}).get('asof') or ''),
              'leadership_coverage': str((context.get('leadership_coverage') or {}).get('market_asof') or ''),
          }
          if not target or any(v != target for v in dates.values()):
              raise SystemExit(f'Options upstream snapshot mismatch: {dates}')
          print('OPTIONS_UPSTREAM_SNAPSHOT_OK', dates)
          PY

          python -m py_compile tools/build_options_intelligence.py
          node --check options-intelligence.js
          python tools/build_options_intelligence.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- options_intelligence.json options_intelligence_history.csv
          if git diff --staged --quiet; then
            echo "Options Intelligence already current"
            exit 0
          fi
          git commit -m "Refresh Options Intelligence from downstream snapshot"
          pushed=false
          for a in 1 2 3; do
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            sleep $((a*2))
          done
          [[ "$pushed" == true ]] || exit 1

      - name: Publish public mirror after final snapshot
        shell: bash
        run: |
          set -euo pipefail
          before="$(gh run list --repo "$REPO" --workflow publish-public-site.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run publish-public-site.yml --repo "$REPO" --ref main
          run_id=""
          for attempt in $(seq 1 30); do
            candidate="$(gh run list --repo "$REPO" --workflow publish-public-site.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [[ "$candidate" != "0" && "$candidate" != "$before" ]]; then
              run_id="$candidate"
              break
            fi
            sleep 2
          done
          if [[ -z "$run_id" ]]; then
            echo "::error::Could not resolve dispatched public mirror run"
            exit 1
          fi
          gh run watch "$run_id" --repo "$REPO" --exit-status --interval 10
          echo "Public mirror SUCCESS run_id=$run_id"

      - name: Prove no downstream reverse write into Command Center
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          git reset --hard origin/main
          : > /tmp/dashboard-owned-after.txt
          for file in $DASHBOARD_OWNED; do
            git rev-parse "HEAD:$file" >> /tmp/dashboard-owned-after.txt
          done
          if ! cmp -s /tmp/dashboard-owned-before.txt /tmp/dashboard-owned-after.txt; then
            echo "::error::A downstream stage modified Command Center-owned artifacts"
            diff -u /tmp/dashboard-owned-before.txt /tmp/dashboard-owned-after.txt || true
            exit 1
          fi
          echo "DOWNSTREAM_REVERSE_WRITE_CHECK_PASS"

      - name: Validate final atomic production snapshot
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_atomic_publish.py --root . --output /tmp/atomic-publish-status.json
          cat /tmp/atomic-publish-status.json

      - name: Report production chain
        if: always()
        shell: bash
        run: |
          echo '### V38 production downstream chain' >> "$GITHUB_STEP_SUMMARY"
          echo '- Upstream: Command Center daily build (main)' >> "$GITHUB_STEP_SUMMARY"
          echo '- Order: V38/TQQQ/CURRENT30 → Sleeve/RSI Reset → Leadership → Rotation → Rotation strong stocks → Options Intelligence read-only merge → Public mirror' >> "$GITHUB_STEP_SUMMARY"
          echo '- Command Center ownership: read-only for every downstream stage' >> "$GITHUB_STEP_SUMMARY"
          echo '- Options Intelligence: may read state/universe/Leadership/Rotation, never writes back to them' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f /tmp/atomic-publish-status.json ]]; then
            echo '- Atomic publish validation: completed' >> "$GITHUB_STEP_SUMMARY"
          fi
