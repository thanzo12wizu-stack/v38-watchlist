name: Inverse Final Simplification V12

on:
  workflow_dispatch:
  push:
    branches: [research/inverse-etf-regime-scan-20260902]
    paths:
      - leadership/research/audit_inverse_final_simplification_v12.py
      - .github/workflows/inverse-final-simplification-v12.yml

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --disable-pip-version-check pandas numpy yfinance
      - name: Download audited inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p inputs/v9 inputs/v2 inputs/g100 inputs/tqqq
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/9870035332/zip > /tmp/v9.zip
          unzip -q /tmp/v9.zip -d inputs/v9
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/9851768614/zip > /tmp/v2.zip
          unzip -q /tmp/v2.zip -d inputs/v2
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/9763251012/zip > /tmp/g100.zip
          unzip -q /tmp/g100.zip -d inputs/g100
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/9649902954/zip > /tmp/tqqq.zip
          unzip -q /tmp/tqqq.zip -d inputs/tqqq
      - name: Patch sensitivity alignment guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('leadership/research/audit_inverse_final_simplification_v12.py')
          s=p.read_text()
          old="dates=pd.to_datetime(d.date).dt.normalize();eligible=set(dates[baseev].tolist());nonzero={pd.Timestamp(k):float(v) for k,v in size_map.items() if float(v)>0 and pd.Timestamp(k)<=pd.Timestamp('2026-03-20')};bad=set(nonzero)-eligible\n if bad:raise RuntimeError('nonzero adaptive size on non-V4 event dates: '+','.join(str(x.date()) for x in sorted(bad)))"
          new="dates=pd.to_datetime(d.date).dt.normalize();eligible=set(dates[baseev].tolist());all_nonzero={pd.Timestamp(k):float(v) for k,v in size_map.items() if float(v)>0 and pd.Timestamp(k)>=dates.min() and pd.Timestamp(k)<=pd.Timestamp('2026-03-20')};bad=set(all_nonzero)-eligible;nonzero={k:v for k,v in all_nonzero.items() if k in eligible}"
          if old not in s:
              raise SystemExit('overlay patch target not found')
          s=s.replace(old,new)
          old2="w,s3,s5=event_sizes(ev,3,5,.15,False);wm,_,_=event_sizes(ev,3,5,.15,True);ev['adaptive_only_size']=w;ev['macro_adaptive_size']=wm;ev.to_csv(out/'final_event_ledger.csv',index=False)"
          new2="w,s3,s5=event_sizes(ev,3,5,.15,False);wm,_,_=event_sizes(ev,3,5,.15,True);primary_nonzero={pd.Timestamp(dt):float(sz) for dt,sz in zip(ev.signal_date,w) if float(sz)>0 and pd.Timestamp(dt)>=pd.Timestamp('2016-01-01') and pd.Timestamp(dt)<=pd.Timestamp('2026-03-20')};primary_bad=sorted(set(primary_nonzero)-v4dates);\n if primary_bad:raise RuntimeError('PRIMARY S3/L5 nonzero on non-V4 dates: '+','.join(str(x.date()) for x in primary_bad))\n ev['adaptive_only_size']=w;ev['macro_adaptive_size']=wm;ev.to_csv(out/'final_event_ledger.csv',index=False)"
          if old2 not in s:
              raise SystemExit('primary assert patch target not found')
          s=s.replace(old2,new2)
          s=s.replace("'note':'Any nonzero adaptive size outside official V4 events aborts the run.'","'note':'Sensitivity configs are intersected with official V4 events; primary S3/L5 still aborts if nonzero on any non-V4 date.'")
          p.write_text(s)
          PY
          python -m py_compile leadership/research/audit_inverse_final_simplification_v12.py
      - name: Run final simplification stress
        run: |
          PYTHONPATH=.:leadership/research python leadership/research/audit_inverse_final_simplification_v12.py \
            --events inputs/v9/adaptive_event_ledger.csv \
            --v9-summary inputs/v9/summary_v9.json \
            --v2-features inputs/v2/feature_state_v2.csv.gz \
            --gross100 inputs/g100 \
            --tqqq inputs/tqqq/tqqq_stage56_daily.csv.gz \
            --output leadership/research/out/inverse_final_v12
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inverse-final-v12
          path: leadership/research/out/inverse_final_v12/
          retention-days: 30
          if-no-files-found: warn
