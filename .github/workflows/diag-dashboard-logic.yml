name: Diagnose dashboard logic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-dashboard-logic.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Persist source slices
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          lines=Path('build_dashboard.py').read_text(encoding='utf-8').splitlines()
          ranges=[(1,180),(2860,3285),(7945,8195),(12990,13135)]
          out=[]
          for a,b in ranges:
            out.append(f'===== SOURCE {a}-{b} =====')
            out.extend(f'{i+1:06d}: {lines[i]}' for i in range(a-1,min(b,len(lines))))
          Path('dashboard_source_slices.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard_source_slices.txt
          git commit -m "Persist dashboard source slices" || true
          git push origin HEAD:main
