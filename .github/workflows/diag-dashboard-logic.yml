name: Diagnose dashboard logic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-dashboard-logic.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Persist focused source contexts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          lines = Path('build_dashboard.py').read_text(encoding='utf-8').splitlines()
          groups = {
            'split': ['split_suspect','maxabs1d','Stock Splits','actions=True','stock splits','分割疑','併合'],
            'confluence': ['confluence','コンフルエンス'],
            'inception': ['inception_vwap','上場来VWAP','_near_threshold'],
          }
          out=[]
          for name, needles in groups.items():
            out.append(f'===== {name.upper()} =====')
            hits=[]
            for i,line in enumerate(lines):
              if any(n.lower() in line.lower() for n in needles): hits.append(i)
            # merge overlapping ±8-line windows
            spans=[]
            for i in hits:
              a=max(0,i-8); b=min(len(lines),i+9)
              if spans and a <= spans[-1][1]+1: spans[-1]=(spans[-1][0],max(spans[-1][1],b))
              else: spans.append((a,b))
            out.append('HITS=' + ','.join(str(i+1) for i in hits))
            for a,b in spans:
              out.append(f'--- SOURCE {a+1}-{b} ---')
              out.extend(f'{j+1:06d}: {lines[j]}' for j in range(a,b))
          Path('dashboard_logic_focused.txt').write_text('\n'.join(out)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard_logic_focused.txt
          git commit -m "Persist focused dashboard diagnostic" || true
          git push origin HEAD:main
