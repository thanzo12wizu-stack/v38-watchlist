# Research-only. Does not modify main, live data, or dashboard outputs.
name: Staged Leader Liquidity Return Audit

on:
  push:
    branches:
      - research/leader-entry-delay-audit-20260904
    paths:
      - leadership/research/audit_staged_leader_liquidity_return.py
      - .github/workflows/staged-leader-liquidity-return-audit.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy yfinance
      - name: Syntax check
        run: |
          python -m py_compile leadership/research/audit_staged_leader_liquidity_return.py
          python -m py_compile leadership/research/audit_major_leader_entry_delay.py
          python -m py_compile leadership/research/audit_early_leader_entry_candidates.py
          python -m py_compile leadership/research/audit_radar_cohort_discriminator.py
      - name: Run staged leader liquidity return audit
        env:
          PYTHONPATH: .:leadership/research
        run: |
          python leadership/research/audit_staged_leader_liquidity_return.py \
            --root . \
            --output leadership/research/staged_leader_liquidity_return_output \
            --analysis-start 2016-01-04 \
            --analysis-end 2026-09-02 \
            --max-tickers 6000 \
            --batch-size 75
      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staged-leader-liquidity-return-audit
          path: leadership/research/staged_leader_liquidity_return_output/
          retention-days: 14
