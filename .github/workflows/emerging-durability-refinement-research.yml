# Research-only audit. Does not modify main or dashboard outputs.
name: Emerging Durability Refinement Research

on:
  push:
    branches:
      - research/sector-stock-leadership-20260826
    paths:
      - leadership/research/audit_emerging_durability_refinement.py
      - .github/workflows/emerging-durability-refinement-research.yml
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy yfinance
      - name: Syntax check
        run: |
          python -m py_compile leadership/research/audit_emerging_durability_refinement.py
          python -m py_compile leadership/research/audit_core_emerging_leader_mix.py
          python -m py_compile leadership/research/audit_five_year_leader_capture.py
      - name: Run Emerging durability refinement
        env:
          PYTHONPATH: .:leadership/research
        run: |
          python leadership/research/audit_emerging_durability_refinement.py \
            --root . \
            --output leadership/research/emerging_durability_refinement \
            --analysis-start 2020-01-02 \
            --analysis-end 2026-09-02 \
            --leader-start 2021-01-04 \
            --max-tickers 6000 \
            --batch-size 75
      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emerging-durability-refinement
          path: leadership/research/emerging_durability_refinement/
          retention-days: 14
