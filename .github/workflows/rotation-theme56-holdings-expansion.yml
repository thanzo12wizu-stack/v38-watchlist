name: Rotation Theme56 Holdings Expansion

on:
  workflow_dispatch:
  push:
    branches:
      - research/rotation-exact-flow-internals-20260831
    paths:
      - leadership/research/rotation_theme56_holdings_expansion.py
      - .github/workflows/rotation-theme56-holdings-expansion.yml

permissions:
  contents: write

concurrency:
  group: rotation-theme56-holdings-expansion
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: research/rotation-exact-flow-internals-20260831
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas requests openpyxl lxml html5lib beautifulsoup4
      - name: Syntax check
        run: python -m py_compile leadership/research/rotation_theme56_holdings_expansion.py
      - name: Run holdings expansion QA
        run: python leadership/research/rotation_theme56_holdings_expansion.py --output leadership/research/rotation_theme56_holdings_expansion
      - name: Persist outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          OUT_TMP="$(mktemp -d)/rotation_theme56_holdings_expansion"
          cp -a leadership/research/rotation_theme56_holdings_expansion "$OUT_TMP"
          for attempt in 1 2 3; do
            git fetch origin research/rotation-exact-flow-internals-20260831
            git reset --hard origin/research/rotation-exact-flow-internals-20260831
            rm -rf leadership/research/rotation_theme56_holdings_expansion
            mkdir -p leadership/research
            cp -a "$OUT_TMP" leadership/research/rotation_theme56_holdings_expansion
            git add leadership/research/rotation_theme56_holdings_expansion/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "research: record theme56 holdings expansion"
            if git push origin HEAD:research/rotation-exact-flow-internals-20260831; then exit 0; fi
          done
          exit 1
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rotation-theme56-holdings-expansion
          path: leadership/research/rotation_theme56_holdings_expansion/
          if-no-files-found: warn
          retention-days: 14
