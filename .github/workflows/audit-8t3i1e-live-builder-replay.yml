name: Audit 8T3I1E Live Builder Replay

on:
  workflow_dispatch:
  push:
    branches:
      - research/stock-nqsar-transition-early-20260907
    paths:
      - 'build_v38_8t3i1e_live.py'
      - 'research/audit_8t3i1e_live_builder_replay.py'
      - '.github/workflows/audit-8t3i1e-live-builder-replay.yml'

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install --disable-pip-version-check -r requirements.txt
      - name: Compile dedicated live builder and replay audit
        run: python -m py_compile build_v38_8t3i1e_live.py research/audit_8t3i1e_live_builder_replay.py
      - name: Run exact daily replay audit
        run: python -u -m research.audit_8t3i1e_live_builder_replay --root . --output research_outputs/audit_8t3i1e_live_builder_replay --batch-size 100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-8t3i1e-live-builder-replay-20260908
          path: research_outputs/audit_8t3i1e_live_builder_replay
          if-no-files-found: warn
