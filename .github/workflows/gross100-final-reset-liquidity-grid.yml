name: Gross100 final Reset liquidity grid

on:
  workflow_dispatch:
  push:
    branches: [research/leader-entry-delay-audit-20260904]
    paths:
      - 'leadership/research/audit_gross100_liquidity_grid_final_reset.py'
      - 'leadership/research/audit_gross100_component_series.py'
      - 'leadership/research/audit_gross100_allocation.py'
      - '.github/workflows/gross100-final-reset-liquidity-grid.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: gross100-final-reset-liquidity-grid-research
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy scipy yfinance

      - name: Download final reproducible RSI Reset signals
        uses: actions/download-artifact@v4
        with:
          name: rsi-strong-stock-threshold-interaction-audit
          path: leadership/research/gross100_liquidity_input/reset
          github-token: ${{ github.token }}
          run-id: 33130536827

      - name: Download frozen TQQQ Stage56 daily series
        uses: actions/download-artifact@v4
        with:
          name: tqqq-stage56-mandate-fx-tax
          path: leadership/research/gross100_liquidity_input/tqqq
          github-token: ${{ github.token }}
          run-id: 33080590798

      - name: Syntax and strict inputs
        run: |
          PYTHONPATH=.:leadership/research python -m py_compile \
            leadership/research/audit_gross100_liquidity_grid_final_reset.py \
            leadership/research/audit_gross100_component_series.py \
            leadership/research/audit_gross100_allocation.py
          test -s leadership/research/gross100_liquidity_input/reset/threshold_trade_rows.csv.gz
          test -s leadership/research/gross100_liquidity_input/tqqq/tqqq_stage56_daily.csv.gz

      - name: Rebuild ordinary DDV10 20 50 100 with identical final Reset
        run: |
          PYTHONPATH=.:leadership/research python leadership/research/audit_gross100_liquidity_grid_final_reset.py \
            --root . \
            --reset-trades leadership/research/gross100_liquidity_input/reset/threshold_trade_rows.csv.gz \
            --output leadership/research/gross100_liquidity_components \
            --analysis-start 2016-01-04 \
            --analysis-end 2026-03-20

      - name: Gross100 integrated comparison
        run: |
          python leadership/research/audit_gross100_allocation.py \
            --components-dir leadership/research/gross100_liquidity_components \
            --tqqq-daily leadership/research/gross100_liquidity_input/tqqq/tqqq_stage56_daily.csv.gz \
            --output leadership/research/gross100_liquidity_allocation \
            --tqqq-target target_M30_TOUCH30_F80_D10 \
            --bootstrap-sims 5000

      - name: Upload integrated liquidity audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gross100-final-reset-liquidity-grid
          path: |
            leadership/research/gross100_liquidity_components/component_liquidity_grid_summary.json
            leadership/research/gross100_liquidity_components/ordinary_PEAK30_PART25_R3_DDV10M_daily.csv.gz
            leadership/research/gross100_liquidity_components/ordinary_PEAK30_PART25_R3_DDV20M_daily.csv.gz
            leadership/research/gross100_liquidity_components/ordinary_PEAK30_PART25_R3_DDV50M_daily.csv.gz
            leadership/research/gross100_liquidity_components/ordinary_PEAK30_PART25_R3_DDV100M_daily.csv.gz
            leadership/research/gross100_liquidity_components/rsi_RESET_RISE30_S029_P4_H20_daily.csv.gz
            leadership/research/gross100_liquidity_allocation/gross100_summary.json
            leadership/research/gross100_liquidity_allocation/gross100_variants.csv
            leadership/research/gross100_liquidity_allocation/gross100_subperiods.csv
            leadership/research/gross100_liquidity_allocation/gross100_rolling252.csv
            leadership/research/gross100_liquidity_allocation/gross100_raw_overlap.csv
            leadership/research/gross100_liquidity_allocation/gross100_pairwise_bootstrap.csv
            leadership/research/gross100_liquidity_allocation/gross100_selected_daily.csv.gz
          retention-days: 30
          if-no-files-found: warn
