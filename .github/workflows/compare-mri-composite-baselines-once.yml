name: One-off compare composite MRI baselines

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compare-mri-composite-baselines-once.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check pandas numpy yfinance
      - name: Composite baseline comparison
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import numpy as np, pandas as pd, yfinance as yf
          broad=["SPY","QQQ","DIA","IWM","MDY","RSP","VTI","QQQE"]
          sectors=["XLK","XLY","VOX","XLF","XLI","XLE","XLB","XLV","XLP","XLU","XLRE"]
          industry=["SOXX","SMH","XSD","IGV","SKYY","CIBR","HACK","FDN","XBI","IBB","PPH","IHI","IHF","KRE","KBE","XRT","ITB","XHB","IYT","JETS","ITA","XAR","ROBO","XME","COPX","PICK","GDX","SIL","LIT","XOP","OIH","URA","TAN","ICLN","VNQ","MOO","PHO","PAVE"]
          tickers=list(dict.fromkeys(broad+sectors+industry)); assert len(tickers)==57
          d=yf.download(tickers,start='2005-01-01',end='2026-08-25',auto_adjust=True,progress=False,threads=True)
          c=d['Close'].copy(); c.index=pd.to_datetime(c.index).tz_localize(None); c=c.reindex(columns=tickers)
          def part(mask): return mask.mean(axis=1,skipna=True)*100
          ma10=c.rolling(10).mean(); ma20=c.rolling(20).mean(); ma50=c.rolling(50).mean(); ma200=c.rolling(200).mean()
          p={}
          for n,h in [('ret5',5),('ret21',21),('ret63',63),('ret252',252)]: p[n]=part((c/c.shift(h)-1>0).where(c.shift(h).notna()&c.notna()))
          p['above10']=part((c>ma10).where(ma10.notna()&c.notna())); p['above20']=part((c>ma20).where(ma20.notna()&c.notna())); p['above50']=part((c>ma50).where(ma50.notna()&c.notna())); p['above200']=part((c>ma200).where(ma200.notna()&c.notna()))
          p['ma20_gt_50']=part((ma20>ma50).where(ma20.notna()&ma50.notna())); p['ma50_gt_200']=part((ma50>ma200).where(ma50.notna()&ma200.notna()))
          hi=c.rolling(252,min_periods=200).max(); dd=c/hi-1
          p['dd_score']=((dd+0.30)/0.25*100).clip(0,100).mean(axis=1,skipna=True); p['within10']=part((dd>=-.10).where(dd.notna()))
          keys=('ret5','ret21','ret63','ret252','above10','above20','above50','above200','ma20_gt_50','ma50_gt_200','dd_score','within10')
          raw=pd.concat({k:p[k] for k in keys},axis=1).mean(axis=1,skipna=True).ewm(span=2,adjust=False).mean()
          cov=c.notna().sum(axis=1)/57*100
          def temp(z,scale=20): return (50+scale*z).clip(0,100)
          def rz(window,minp,scale=20):
              b=raw.shift(1); mu=b.rolling(window,min_periods=minp).mean(); sd=b.rolling(window,min_periods=minp).std(ddof=0); return temp((raw-mu)/sd.replace(0,np.nan),scale)
          def robust(window,minp,scale=20):
              b=raw.shift(1); r=b.rolling(window,min_periods=minp); med=r.median(); sig=(r.quantile(.75)-r.quantile(.25))/1.349; return temp((raw-med)/sig.replace(0,np.nan),scale)
          def pct(window,minp): return raw.rolling(window,min_periods=minp).rank(pct=True)*100
          def expand(scale=20):
              b=raw.shift(1); mu=b.expanding(min_periods=1260).mean(); sd=b.expanding(min_periods=1260).std(ddof=0); return temp((raw-mu)/sd.replace(0,np.nan),scale)
          def ew(half,scale=20):
              b=raw.shift(1); e=b.ewm(halflife=half,min_periods=1260,adjust=False); return temp((raw-e.mean())/e.std(bias=True).replace(0,np.nan),scale)
          m=pd.DataFrame({
            'raw':raw,
            'z10':rz(2520,1260),
            'z15':rz(3780,1764),
            'robust15':robust(3780,1764),
            'pct10':pct(2520,1260),
            'pct15':pct(3780,1764),
            'expand_z':expand(),
            'ewma5y':ew(1260),
            'ewma10y':ew(2520),
            'z15_wide':rz(3780,1764,25),
            'ewma10y_wide':ew(2520,25),
          })
          valid=(cov>=70)
          print('=== LATEST ==='); d0=pd.Timestamp('2026-08-24'); print(m.loc[d0].round(2).to_string())
          print('=== DISTRIBUTION_2018_2026 ===')
          mask=valid&(m.index>='2018-01-01')
          rows=[]
          for k in m:
              s=m.loc[mask,k].dropna(); rows.append([k,s.mean(),s.median(),s.quantile(.1),s.quantile(.25),s.quantile(.75),s.quantile(.9),(s>=70).mean()*100,(s>=80).mean()*100,(s<=30).mean()*100])
          print(pd.DataFrame(rows,columns=['method','mean','median','p10','p25','p75','p90','ge70','ge80','le30']).set_index('method').round(2).to_string())
          print('=== ANNUAL ===')
          ann={k:m.loc[valid,k].groupby(m.index.year).mean() for k in m}; print(pd.DataFrame(ann).loc[lambda x:x.index>=2018].round(2).to_string())
          print('=== DATES ===')
          dates=['2018-09-20','2018-12-24','2020-02-19','2020-03-23','2020-06-08','2022-01-03','2022-06-16','2022-10-12','2023-07-31','2024-07-10','2025-04-08','2025-08-21','2026-08-21','2026-08-24']
          print(m.reindex(pd.to_datetime(dates)).round(2).to_string())
          q=c['QQQ']; q50=q.rolling(50).mean(); q200=q.rolling(200).mean(); qhi=q.rolling(252,min_periods=200).max(); qdd=q/qhi-1
          state=pd.Series('mixed',index=q.index,dtype=object); state[(q>q50)&(q>q200)&(q50>q200)&(qdd>-.10)]='healthy'; state[(q<q200)|(qdd<=-.15)]='stress'
          print('=== QQQ_STATE ===')
          for k in m:
              x=pd.DataFrame({'s':m[k],'state':state}).loc['2018-01-01':].dropna(); g=x.groupby('state').s.agg(['mean','median']); print(k); print(g.round(2).to_string())
          print('=== BASELINE_DRIFT ===')
          # Show the actual adaptive center to assess whether it drifts too much.
          b=raw.shift(1)
          centers=pd.DataFrame({'mean10':b.rolling(2520,min_periods=1260).mean(),'mean15':b.rolling(3780,min_periods=1764).mean(),'median15':b.rolling(3780,min_periods=1764).median(),'expand_mean':b.expanding(min_periods=1260).mean(),'ewma10_mean':b.ewm(halflife=2520,min_periods=1260,adjust=False).mean()})
          for ds in ['2018-01-02','2020-01-02','2022-01-03','2024-01-02','2026-08-24']:
              t=pd.Timestamp(ds); ix=centers.index[centers.index<=t];
              if len(ix): print(ds,centers.loc[ix[-1]].round(2).to_dict())
          PY
