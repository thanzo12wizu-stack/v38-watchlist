name: Volume sequence research

on:
  push:
    branches:
      - research/sector-stock-leadership-20260826
    paths:
      - leadership/research/validate_volume_sequence.py
      - .github/workflows/volume-sequence-research.yml

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - tranche: t1
            exclude_first: 0
          - tranche: t2
            exclude_first: 1500
          - tranche: t3
            exclude_first: 3000
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy scipy yfinance
      - name: Syntax check
        run: python -m py_compile leadership/research/validate_volume_sequence.py
      - name: Run fixed volume sequence research
        run: |
          python leadership/research/validate_volume_sequence.py \
            --root . \
            --output leadership/research/volume_sequence_${{ matrix.tranche }} \
            --analysis-start 2016-01-04 \
            --analysis-end 2026-06-20 \
            --exclude-first ${{ matrix.exclude_first }} \
            --max-tickers 1500 \
            --batch-size 75 \
            --min-members 3
      - name: Upload research outputs
        uses: actions/upload-artifact@v4
        with:
          name: volume-sequence-${{ matrix.tranche }}
          path: leadership/research/volume_sequence_${{ matrix.tranche }}/
          retention-days: 7
