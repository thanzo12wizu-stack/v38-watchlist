name: Inverse Historical Extension V6

on:
  workflow_dispatch:
  push:
    branches: [research/inverse-etf-regime-scan-20260902]
    paths:
      - leadership/research/audit_inverse_historical_extension_v6.py
      - .github/workflows/inverse-historical-extension-v6.yml

permissions:
  contents: read
  actions: read

jobs:
  historical:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: tqqq-backtest-once-20260826
          path: legacy
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r legacy/requirements.txt
      - name: Download frozen inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p inputs/v2 inputs/tqqq
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/9851768614/zip > /tmp/v2.zip
          unzip -q /tmp/v2.zip -d inputs/v2
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/9649902954/zip > /tmp/tqqq.zip
          unzip -q /tmp/tqqq.zip -d inputs/tqqq
      - name: Syntax check
        run: python -m py_compile leadership/research/audit_inverse_historical_extension_v6.py
      - name: Run historical extension
        run: |
          set -euo pipefail
          python leadership/research/audit_inverse_historical_extension_v6.py \
            --legacy-dir legacy \
            --v2-features inputs/v2/feature_state_v2.csv.gz \
            --tqqq inputs/tqqq/tqqq_stage56_daily.csv.gz \
            --output leadership/research/out/inverse_historical_v6
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inverse-historical-v6
          path: leadership/research/out/inverse_historical_v6/
          retention-days: 30
          if-no-files-found: warn
